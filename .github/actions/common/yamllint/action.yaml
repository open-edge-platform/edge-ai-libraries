name: Run Yamllint
description: Lint YAML files using yamllint

inputs:
  path:
    description: Path to YAML files or folder
    required: true
  output-file:
    description: Path to store the yamllint output
    required: true
  name:
    description: Name of the artifact
    required: true
  enable-reviewdog:
    description: Enable ReviewDog PR comments
    required: false
    default: "false"
  github_token:
    description: GitHub token for ReviewDog
    required: false

runs:
  using: "composite"
  steps:
    - name: Install Yamllint
      run: sudo apt-get install -y yamllint
      shell: bash

    - name: Run Yamllint
      env:
        path: ${{ inputs.path }}
        output-file: ${{ inputs.output-file }}
      run: |
        yamllint ${path} 2>&1 | tee ${output-file} || true
        if [ ! -f "${output-file}" ]; then
          echo "No YAML files found or yamllint produced no output" > ${output-file}
        fi
      shell: bash

    - name: Analyze Yamllint results
      if: always()
      env:
        output-file: ${{ inputs.output-file }}
        name: ${{ inputs.name }}
      run: |
        if [ -f "${output-file}" ]; then
          # Count issues by severity (yamllint uses [error] and [warning]) - ensure we get single clean numbers
          error_count=$(grep "\[error\]" "${output-file}" 2>/dev/null | wc -l | tr -d '[:space:]')
          warning_count=$(grep "\[warning\]" "${output-file}" 2>/dev/null | wc -l | tr -d '[:space:]')
          # Ensure counts are valid integers, default to 0 if empty
          error_count=${error_count:-0}
          warning_count=${warning_count:-0}
          # Additional safety check - ensure numeric
          [[ ! "$error_count" =~ ^[0-9]+$ ]] && error_count=0
          [[ ! "$warning_count" =~ ^[0-9]+$ ]] && warning_count=0
          total=$((error_count + warning_count))

          echo "### Yamllint Results for ${name}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Total Issues**: $total" >> $GITHUB_STEP_SUMMARY

          if [ "$error_count" -gt 0 ]; then
            echo "- ❌ **Errors**: $error_count" >> $GITHUB_STEP_SUMMARY
          fi
          if [ "$warning_count" -gt 0 ]; then
            echo "- ⚠️ **Warnings**: $warning_count" >> $GITHUB_STEP_SUMMARY
          fi

          if [ "$total" -gt 0 ]; then
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "⚠️ **Please review the Yamllint report artifact and consider fixing the issues.**" >> $GITHUB_STEP_SUMMARY
          else
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "✅ **No issues found!**" >> $GITHUB_STEP_SUMMARY
          fi
        fi
      shell: bash

    - name: Upload Yamllint report
      if: always()
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
      with:
        name: yamllint-report-${{ inputs.name }}
        path: ${{ inputs.output-file }}

    - name: Run ReviewDog (Yamllint)
      if: ${{ inputs.enable-reviewdog == 'true' }}
      uses: reviewdog/action-yamllint@f01d8a48fd8d89f89895499fca2cff09f9e9e8c0 # 1.21.0
      with:
        github_token: ${{ inputs.github_token }}
        reporter: github-pr-review
        level: warning
