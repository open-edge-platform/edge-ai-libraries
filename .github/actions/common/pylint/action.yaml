name: Run Pylint
description: Lint Python files using pylint

inputs:
  path:
    description: Path to Python files or folder
    required: true
  output-file:
    description: Path to store the pylint output
    required: true
  name:
    description: Name of the artifact
    required: true
  enable-reviewdog:
    description: Enable ReviewDog PR comments
    required: false
    default: "false"
  github_token:
    description: GitHub token for ReviewDog
    required: false

runs:
  using: "composite"
  steps:
    - name: Set up Python
      uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 #v5.6.0
      with:
        python-version: '3.11'

    - name: Install Pylint
      run: |
        python -m pip install --upgrade pip
        pip install pylint
      shell: bash

    - name: Run pylint
      env:
        path: ${{ inputs.path }}
        output-file: ${{ inputs.output-file }}
      run: |
        find ${path} -name "*.py" -not -path "*/venv/*" \
          -exec pylint {} \; 2>&1 | tee ${output-file} || true
        if [ ! -f "${output-file}" ]; then
          echo "No Python files found or pylint produced no output" > ${output-file}
        fi
      shell: bash

    - name: Analyze Pylint results
      if: always()
      env:
        output-file: ${{ inputs.output-file }}
        name: ${{ inputs.name }}
      run: |
        if [ -f "${output-file}" ]; then
          # Count issues by severity (pylint uses C/R/W/E/F prefixes)
          convention_count=$(grep -cE "^[^:]+:[0-9]+:[0-9]+: C[0-9]+:" "${output-file}" 2>/dev/null || echo "0")
          refactor_count=$(grep -cE "^[^:]+:[0-9]+:[0-9]+: R[0-9]+:" "${output-file}" 2>/dev/null || echo "0")
          warning_count=$(grep -cE "^[^:]+:[0-9]+:[0-9]+: W[0-9]+:" "${output-file}" 2>/dev/null || echo "0")
          error_count=$(grep -cE "^[^:]+:[0-9]+:[0-9]+: E[0-9]+:" "${output-file}" 2>/dev/null || echo "0")
          fatal_count=$(grep -cE "^[^:]+:[0-9]+:[0-9]+: F[0-9]+:" "${output-file}" 2>/dev/null || echo "0")
          total=$((convention_count + refactor_count + warning_count + error_count + fatal_count))

          # Try to extract the score
          score=$(grep "Your code has been rated at" "${output-file}" 2>/dev/null | tail -1 | grep -oE "[0-9]+\.[0-9]+/10" || echo "")

          echo "### Pylint Results for ${name}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Total Issues**: $total" >> $GITHUB_STEP_SUMMARY

          if [ "$fatal_count" -gt 0 ]; then
            echo "- 🔴 **Fatal**: $fatal_count" >> $GITHUB_STEP_SUMMARY
          fi
          if [ "$error_count" -gt 0 ]; then
            echo "- ❌ **Errors**: $error_count" >> $GITHUB_STEP_SUMMARY
          fi
          if [ "$warning_count" -gt 0 ]; then
            echo "- ⚠️ **Warnings**: $warning_count" >> $GITHUB_STEP_SUMMARY
          fi
          if [ "$refactor_count" -gt 0 ]; then
            echo "- 🔧 **Refactor**: $refactor_count" >> $GITHUB_STEP_SUMMARY
          fi
          if [ "$convention_count" -gt 0 ]; then
            echo "- 📋 **Convention**: $convention_count" >> $GITHUB_STEP_SUMMARY
          fi

          if [ -n "$score" ]; then
            echo "- 📊 **Score**: $score" >> $GITHUB_STEP_SUMMARY
          fi

          if [ "$total" -gt 0 ]; then
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "⚠️ **Please review the Pylint report artifact and consider fixing the issues.**" >> $GITHUB_STEP_SUMMARY
          else
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "✅ **No issues found!**" >> $GITHUB_STEP_SUMMARY
          fi
        fi
      shell: bash

    - name: Upload Pylint report
      if: always()
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
      with:
        name: pylint-report-${{ inputs.name }}
        path: ${{ inputs.output-file }}

    - name: Run ReviewDog (Pylint)
      if: ${{ inputs.enable-reviewdog == 'true' }}
      uses: dciborow/action-pylint@cf6c9bcd79e4aa70e2fbeaf6332d741eb1e0bff8 #0.1.1
      with:
        github_token: ${{ inputs.github_token }}
        reporter: github-pr-review
        level: warning
        workdir: ${{ inputs.path }}

