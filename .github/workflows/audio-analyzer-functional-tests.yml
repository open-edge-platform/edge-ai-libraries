name: Audio Analyzer — Functional Tests

on:
  push:
    paths:
      - "microservices/audio-analyzer/**"
      - ".github/workflows/audio-analyzer-functional-tests.yml"
  pull_request:
    paths:
      - "microservices/audio-analyzer/**"
      - ".github/workflows/audio-analyzer-functional-tests.yml"

defaults:
  run:
    working-directory: microservices/audio-analyzer

jobs:
  # ──────────────────────────────────────────────────────────────────────────
  # TIER 1 — Always runs: config, build-structure, startup, API, inference
  #           logic, and documentation validation.
  #           No model weights, no secrets, no GPU.
  # ──────────────────────────────────────────────────────────────────────────
  tier1-functional-tests:
    name: "Tier 1 — CI-safe functional tests"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: microservices/audio-analyzer/requirements.txt

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg libsndfile1

      - name: Install Python dependencies (core only — no heavy ML)
        run: |
          python -m pip install --upgrade pip
          # Install only what Tier-1 tests need at import time.
          # Heavy ML libs (torch, pyannote, openvino) are NOT needed for
          # configuration, build, startup, API-mock, and docs tests.
          pip install \
            fastapi \
            httpx \
            pyyaml \
            pydantic \
            python-multipart \
            pytest \
            pytest-timeout \
            uvicorn

      - name: Run Tier 1 functional tests
        env:
          # Tier 1 never touches real models, so HF_TOKEN is intentionally absent.
          PYTHONPATH: .
        run: |
          python -m pytest tests/functional/ \
            -m "tier1" \
            --tb=short \
            --strict-markers \
            -v \
            --junitxml=test-results/tier1-results.xml \
            --timeout=120

      - name: Upload Tier 1 test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tier1-test-results
          path: microservices/audio-analyzer/test-results/
          retention-days: 30

  # ──────────────────────────────────────────────────────────────────────────
  # TIER 2 — Credential-dependent: model download validation.
  #           Runs only when HF_TOKEN secret is available.
  #           Skipped on forks (secrets not available) without failing.
  # ──────────────────────────────────────────────────────────────────────────
  tier2-credential-tests:
    name: "Tier 2 — Credential-dependent tests (model download)"
    runs-on: ubuntu-latest
    # Only run on the main repo (not forks) and only when the secret exists.
    if: >
      github.repository == github.event.repository.full_name &&
      vars.ENABLE_TIER2_TESTS == 'true'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: microservices/audio-analyzer/requirements.txt

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg libsndfile1

      - name: Install full Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-timeout

      - name: Run Tier 2 functional tests
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          PYTHONPATH: .
        run: |
          python -m pytest tests/functional/ \
            -m "tier2" \
            --tb=short \
            --strict-markers \
            -v \
            --junitxml=test-results/tier2-results.xml \
            --timeout=600

      - name: Upload Tier 2 test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tier2-test-results
          path: microservices/audio-analyzer/test-results/
          retention-days: 30

  # ──────────────────────────────────────────────────────────────────────────
  # TIER 3 — Full inference (manual / nightly dispatch only)
  # ──────────────────────────────────────────────────────────────────────────
  tier3-inference-tests:
    name: "Tier 3 — Full inference tests (manual/nightly)"
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: microservices/audio-analyzer/requirements.txt

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg libsndfile1

      - name: Install full Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-timeout

      - name: Run Tier 3 inference tests
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          ENABLE_INFERENCE_TESTS: "1"
          PYTHONPATH: .
        run: |
          python -m pytest tests/functional/ \
            -m "tier3" \
            --tb=long \
            --strict-markers \
            -v \
            --junitxml=test-results/tier3-results.xml \
            --timeout=1800

      - name: Upload Tier 3 test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tier3-test-results
          path: microservices/audio-analyzer/test-results/
          retention-days: 7
