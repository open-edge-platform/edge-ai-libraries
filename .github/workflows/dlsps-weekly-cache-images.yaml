name: "[DLSPS] [U22/U24/U26] Build weekly cache imgs"
run-name: "[DLSPS] [U22/U24/U26] Build weekly cache imgs"
on:
  schedule:
    - cron: '0 5 * * *' # every day at 5:00 UTC
  workflow_dispatch:
    inputs:
      image-tag:
        description: 'Image tag'
        required: false
        type: string
      dls-branch:
        description: DL Streamer branch or ref to build
        required: false
        type: string
        default: main
permissions: {}
env:
  dlstreamer-version: "2026.3.0"
  DLS_REL_PATH: "./edge-ai-libraries-repo/libraries/dlstreamer"

jobs:
  build-dls-pipeline-server-image:
    name: Build DL Streamer cache ${{ matrix.ubuntu_version }} img
    runs-on: ubuntu-24.04-16core-64GB
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - path_dockerfile: ./edge-ai-libraries-repo/libraries/dlstreamer/docker/ubuntu/ubuntu22.Dockerfile
            ubuntu_version: ubuntu22
          - path_dockerfile: ./edge-ai-libraries-repo/libraries/dlstreamer/docker/ubuntu/ubuntu24.Dockerfile
            ubuntu_version: ubuntu24
          - path_dockerfile: ./edge-ai-libraries-repo/libraries/dlstreamer/docker/ubuntu/ubuntu26.Dockerfile
            ubuntu_version: ubuntu26
    steps:
    - name: Check out edge-ai-libraries repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
        path: edge-ai-libraries-repo

    - name: Check out DL Streamer repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        repository: open-edge-platform/dlstreamer
        ref: ${{ inputs.dls-branch || 'main' }}
        submodules: recursive
        persist-credentials: false
        path: edge-ai-libraries-repo/libraries/dlstreamer

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 #4.4.1

    - name: Log in to GitHub Container Registry
      uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 #4.7.0
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Build DL Streamer cache ${{ matrix.ubuntu_version }} img
      env:
        deb_final_img_cached: ghcr.io/${{ github.repository }}/deb-final-img-${{ matrix.ubuntu_version }}:buildcache
      run: |
        docker buildx build \
        --target dlstreamer \
        --cache-from=type=registry,ref=${deb_final_img_cached} \
        --cache-to=type=registry,ref=${deb_final_img_cached},mode=max \
        --output=type=cacheonly \
        --build-arg DLSTREAMER_VERSION=${{ env.dlstreamer-version }} \
        --build-arg DLSTREAMER_BUILD_NUMBER=deb-pkg-${{ matrix.ubuntu_version }} \
        -f "${{ matrix.path_dockerfile }}" \
        "${DLS_REL_PATH}"
