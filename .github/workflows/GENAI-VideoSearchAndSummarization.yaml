---
# SPDX-FileCopyrightText: (C) 2026 Intel Corporation
# SPDX-License-Identifier: Apache-2.0

name: "[GEN-AI] Video-search-summarization-CI"
run-name: "[GEN-AI-Video-search-summarization-CI] PR  workflow (by @${{ github.actor }} via ${{ github.event_name }})"


# Only run at most 1 workflow concurrently per PR, unlimited for branches
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

on:
  pull_request:
    branches:
      - main
    paths:
      - 'sample-applications/video-search-and-summarization/**'
      - 'microservices/visual-data-preparation-for-retrieval/**'
      - 'microservices/multimodal-embedding-serving/**'

jobs:
  # Deploy VSS in dual mode using make deploy-dual
  deploy-dual:
    runs-on: ubuntu-22.04-32core-128GB
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.12'
      
      - name: Install Poetry
        run: |
          pip install poetry

      - name: Generate runtime secrets
        run: |
          {
            echo "MINIO_ROOT_USER=minioadmin"
            echo "MINIO_ROOT_PASSWORD=$(openssl rand -base64 24)"
            echo "POSTGRES_USER=postgres"
            echo "POSTGRES_PASSWORD=$(openssl rand -base64 24)"
            echo "RABBITMQ_USER=rabbitmq"
            echo "RABBITMQ_PASSWORD=$(openssl rand -base64 24)"
          } >> "$GITHUB_ENV"

      - name: Set Hugging Face token
        run: echo "HUGGINGFACE_TOKEN=${{ secrets.GENAI_HUGGINGFACE_TOKEN }}" >> "$GITHUB_ENV"

      - name: Deploy VSS in dual mode
        run: |
          cd sample-applications/video-search-and-summarization/
          make deploy-dual

      - name: Functional test
        run: |
          cd sample-applications/video-search-and-summarization/tests/
          mkdir -p reports
          poetry install --no-root
          poetry run pytest

      - name: Upload test reports
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f
        if: always()
        with:
          name: vss-functional-test-reports
          path: sample-applications/video-search-and-summarization/tests/reports/
          retention-days: 30

      - name: Stop VSS stack
        if: always()
        run: |
          cd sample-applications/video-search-and-summarization/
          bash -c 'source setup.sh --stop'
  

  trivy-scan:
    runs-on: ubuntu-22.04-32core-128GB
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.12'

      - name: Install Poetry
        run: pip install poetry

      - name: Install Trivy
        env:
          TRIVY_VERSION: "0.72.0"
        run: |
          if ! command -v trivy >/dev/null 2>&1; then
            curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh \
              | sh -s -- -b /usr/local/bin "v${TRIVY_VERSION}"
          fi
          trivy --version

      - name: Run Trivy filesystem scan
        run: |
          cd sample-applications/video-search-and-summarization/
          make trivy-scan-fs

      - name: Run Trivy config scan
        run: |
          cd sample-applications/video-search-and-summarization/
          make trivy-scan-config

      - name: Build Docker images
        run: |
          cd sample-applications/video-search-and-summarization/
          make build

      - name: Run Trivy image scan
        run: |
          cd sample-applications/video-search-and-summarization/
          make trivy-scan-image

      - name: Upload Trivy scan results
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f
        if: always()
        with:
          name: vss-trivy-scan-results
          path: sample-applications/video-search-and-summarization/security-results/trivy-*
          retention-days: 30

  bandit-scan:
    runs-on: ubuntu-22.04-32core-128GB
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.12'

      - name: Run Bandit security scan
        run: |
          cd sample-applications/video-search-and-summarization/
          make bandit-scan

      - name: Upload Bandit scan results
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f
        if: always()
        with:
          name: vss-bandit-scan-results
          path: sample-applications/video-search-and-summarization/security-results/bandit-*
          retention-days: 30

  clamav-scan:
    runs-on: ubuntu-22.04-32core-128GB
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Install ClamAV
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y clamav clamav-daemon

      - name: Update ClamAV virus database
        run: |
          sudo systemctl stop clamav-freshclam || true
          sudo freshclam
          clamscan --version

      - name: Run ClamAV scan
        run: |
          cd sample-applications/video-search-and-summarization/
          make clamav-scan

      - name: Upload ClamAV results
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f
        if: always()
        with:
          name: vss-clamav-scan-results
          path: sample-applications/video-search-and-summarization/security-results/clamav-*
          retention-days: 30

  gitleaks-scan:
    runs-on: ubuntu-22.04-32core-128GB
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false

      - name: Install Gitleaks
        env:
          GITLEAKS_VERSION: "8.21.2"
        run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            -o /tmp/gitleaks.tar.gz
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          sudo mv /tmp/gitleaks /usr/local/bin/gitleaks
          rm /tmp/gitleaks.tar.gz
          gitleaks version

      - name: Run Gitleaks secrets scan
        run: |
          cd sample-applications/video-search-and-summarization/
          make gitleaks-scan

      - name: Upload Gitleaks results
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f
        if: always()
        with:
          name: vss-gitleaks-scan-results
          path: sample-applications/video-search-and-summarization/security-results/gitleaks-*
          retention-days: 30

  shellcheck-scan:
    runs-on: ubuntu-22.04-32core-128GB
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Install ShellCheck
        run: |
          if ! command -v shellcheck >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y shellcheck
          fi
          shellcheck --version

      - name: Run ShellCheck lint
        run: |
          cd sample-applications/video-search-and-summarization/
          make shellcheck

      - name: Upload ShellCheck results
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f
        if: always()
        with:
          name: vss-shellcheck-results
          path: sample-applications/video-search-and-summarization/security-results/shellcheck-*
          retention-days: 30

  pylint-scan:
    runs-on: ubuntu-22.04-32core-128GB
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.12'

      - name: Install Poetry
        run: pip install poetry

      - name: Run Pylint
        run: |
          cd sample-applications/video-search-and-summarization/
          make pylint

      - name: Upload Pylint results
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f
        if: always()
        with:
          name: vss-pylint-results
          path: sample-applications/video-search-and-summarization/security-results/pylint-*
          retention-days: 30

  eslint-scan:
    runs-on: ubuntu-22.04-32core-128GB
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: '24'

      - name: Run ESLint
        run: |
          cd sample-applications/video-search-and-summarization/
          make eslint

      - name: Upload ESLint results
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f
        if: always()
        with:
          name: vss-eslint-results
          path: sample-applications/video-search-and-summarization/security-results/eslint-*
          retention-days: 30
