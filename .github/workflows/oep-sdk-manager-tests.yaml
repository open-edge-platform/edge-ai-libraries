name: OEP SDK Manager Tests

on: # yamllint disable-line rule:truthy
  pull_request:
    paths:
      - 'tools/oep-sdk-manager/**'
      - '.github/workflows/oep-sdk-manager-tests.yaml'
  push:
    branches:
      - main
    paths:
      - 'tools/oep-sdk-manager/**'
      - '.github/workflows/oep-sdk-manager-tests.yaml'
  workflow_dispatch:

permissions: {}

jobs:
  offline-tests:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify ShellCheck availability
        run: shellcheck --version
      - name: Validate scripts and tutorials
        run: bash tools/oep-sdk-manager/tests/run_tests.sh --offline
      - name: Validate selector JavaScript syntax
        run: |
          node --check tools/oep-sdk-manager/docs/oep-sdk-manager-files/config.js
          node --check tools/oep-sdk-manager/docs/oep-sdk-manager-files/iframe-resizer.js
