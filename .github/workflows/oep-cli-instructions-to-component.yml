name: "[OEP CLI] Generate component from spec"

on:
  push:
    branches: [main]
    paths: ['frameworks/oep-installer-cli/specification/**']
  workflow_dispatch:
    inputs:
      spec_file:
        description: >-
          Path to spec file relative to frameworks/oep-installer-cli
          (e.g. specification/my_component.md)
        required: false
      mode:
        description: >-
          Spec status override: 'auto' (default) infers from whether
          module/<name>/ already exists; 'new' maps to status A and
          'modified' maps to status M. Dispatch defaults from status only
          (A auto-assign, M label-gated).
        required: false
        default: 'auto'
        type: choice
        options: [auto, new, modified]
      force:
        description: >-
          Set to true to bypass the "module already exists" and "issue already
          open" guards and regenerate even for existing components.
        required: false
        default: 'false'
        type: boolean
      max_tasks:
        description: >-
          Maximum number of new component issues to create in a single run
          (Guard 4 cap). Raise this for an intentional batch.
        required: false
        default: '3'
        type: number

permissions:
  contents: read
  issues: write

jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    #
    # This workflow now authenticates with a PAT (OEP_CLI_COPILOT_TASK_TOKEN) because
    # installation tokens cannot assign the Copilot coding agent. Unlike
    # GITHUB_TOKEN, pushes made with a PAT DO trigger workflows -- so a commit
    # under specification/** authored by our own automation would re-enter this
    # workflow and create duplicate agent tasks.
    #
    # Only applied to `push`; workflow_dispatch must always run, otherwise the
    # token owner could not manually re-run the workflow themselves.
    if: >-
      github.event_name != 'push' ||
      (github.actor != 'github-actions[bot]' &&
       github.actor != 'copilot-swe-agent[bot]' &&
       github.actor != 'Copilot' &&
       github.actor != vars.AUTOMATION_ACTOR)
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: Find changed spec files
        id: specs
        working-directory: frameworks/oep-installer-cli
        env:
          # Pass untrusted workflow_dispatch inputs via env to avoid template
          # injection into the run script (zizmor: template-injection).
          SPEC_FILE: ${{ github.event.inputs.spec_file }}
          MODE: ${{ github.event.inputs.mode }}
          BEFORE: ${{ github.event.before }}
          SHA: ${{ github.sha }}
        run: |
          SPECS_FILE="$(mktemp)"

          if [ -n "$SPEC_FILE" ]; then
            # workflow_dispatch with an explicit spec_file is always intentional.
            # Infer spec status from whether module/<name>/ already exists
            # unless the caller explicitly set the mode input.
            SPEC="$SPEC_FILE"
            OVERRIDE_MODE="$MODE"
            if [[ "$OVERRIDE_MODE" == "auto" || -z "$OVERRIDE_MODE" ]]; then
              raw_name="$(basename "$SPEC" .md)"
              name="${raw_name,,}"
              name="${name//-/_}"
              if [[ -d "module/${name}/" ]]; then
                STATUS="M"
              else
                STATUS="A"
              fi
            elif [[ "$OVERRIDE_MODE" == "modified" ]]; then
              STATUS="M"
            else
              STATUS="A"
            fi
            printf '%s\t%s\n' "$STATUS" "$SPEC" > "$SPECS_FILE"
          else
            # Pick up both Added (A) and Modified (M) spec files so that
            # edits to existing specs also create issues (label-gated dispatch).
            if [[ "$BEFORE" == "0000000000000000000000000000000000000000" ]] || \
               ! git cat-file -e "$BEFORE" 2>/dev/null; then
              # Fall back: files introduced by the head commit, all treated as Added.
              git diff-tree --no-commit-id -r --name-status --diff-filter=AM \
                --relative "$SHA" -- 'specification/*.md' > "$SPECS_FILE"
            else
              git diff --name-status --diff-filter=AM --relative "${BEFORE}..${SHA}" \
                -- 'specification/*.md' > "$SPECS_FILE"
            fi
          fi

          # Skip _template.md and README.md (match on the path column, field 2)
          awk -F'\t' '{ if ($2 !~ /(^|\/)(_[^\/]*\.md|README\.md)$/) print }' \
            "$SPECS_FILE" > "${SPECS_FILE}.filtered" || true
          mv "${SPECS_FILE}.filtered" "$SPECS_FILE"

          if [ ! -s "$SPECS_FILE" ]; then
            echo "No spec files changed – nothing to do."
            echo "has_specs=false" >> "$GITHUB_OUTPUT"
          else
            echo "has_specs=true" >> "$GITHUB_OUTPUT"
            echo "specs_file=$SPECS_FILE" >> "$GITHUB_OUTPUT"
          fi

      - name: Create a Copilot task issue for each spec
        if: steps.specs.outputs.has_specs == 'true'
        working-directory: frameworks/oep-installer-cli
        env:
          GH_TOKEN: ${{ secrets.OEP_CLI_COPILOT_TASK_TOKEN }}
          FORCE_REGENERATE: ${{ github.event.inputs.force == 'true' && 'true' || 'false' }}
          MAX_TASKS_PER_RUN: ${{ github.event.inputs.max_tasks || '3' }}
          SPECS_FILE: ${{ steps.specs.outputs.specs_file }}
        run: |
          chmod +x "$GITHUB_WORKSPACE/frameworks/oep-installer-cli/.github/scripts/create-component-issue.sh"
          "$GITHUB_WORKSPACE/frameworks/oep-installer-cli/.github/scripts/create-component-issue.sh" "$SPECS_FILE"

