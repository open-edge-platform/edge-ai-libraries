name: "[Sensor Manager] PR workflow"
run-name: "[Sensor Manager] PR workflow (by @${{ github.actor }} via ${{ github.event_name }})"

on:
  pull_request:
    branches:
      - main
      - release-*
    paths:
      - 'microservices/sensor-manager/**'
      - '.github/workflows/sensor-manager-pr-workflow.yaml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  pre-merge-pipeline:
    permissions:
      contents: read
    strategy:
      fail-fast: false
    uses: open-edge-platform/orch-ci/.github/workflows/pre-merge.yml@5bf1c402a05b6492b724643e2be4bcc7de1dd67c
    with:
      runs_on: ubuntu-24.04-16core-64GB
      security_scans_advisory: true
      run_version_check: false
      run_build: false
      run_lint: true
      run_test: true
      run_docker_build: true
      run_reuse_check: false
      project_folder: 'microservices/sensor-manager'
  final-check:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    if: ${{ always() }}
    needs: [pre-merge-pipeline]
    steps:
      - name: Final Status Check
        env:
          pre_merge_pipeline_result: ${{ needs.pre-merge-pipeline.result }}
        run: |
          echo "Pre-merge pipeline result: $pre_merge_pipeline_result"

          if [ "$pre_merge_pipeline_result" == "success" ] || [ "$pre_merge_pipeline_result" == "skipped" ]; then
            echo "Pre-merge checks passed successfully."
          else
            echo "Pre-merge checks failed. PR can't be merged."
            exit 1
          fi
