name: Skill Scanner

on:
  pull_request:
    paths:
      - ".github/skills/**"
      - "**/.github/skills/**"
      - ".github/workflows/skill-scan.yaml"
  push:
    branches: ["main", "release-*"]
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:
    inputs:
      severity:
        description: "SkillSpector severity level (CRITICAL, HIGH, MEDIUM, LOW)"
        required: false
        default: "LOW"
        type: choice
        options:
          - CRITICAL
          - HIGH
          - MEDIUM
          - LOW

permissions: {}

jobs:
  discover-skills:
    name: Discover skill paths
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      matrix: ${{ steps.find-paths.outputs.matrix }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Find skill paths
        id: find-paths
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            # Only skill directories touched in this PR; sed -nE avoids exit 1 on no match
            paths=$(git diff --name-only "origin/$BASE_REF...HEAD" \
              | sed -nE '/\.github\/skills\//p' \
              | sed -E 's|(.*\.github/skills)/.*|\1|' \
              | sort -u \
              | jq -R -s -c 'split("\n") | map(select(length > 0))')
          else
            paths=$(find . -path '*/.github/skills' -type d \
              | sed 's|^\./||' \
              | jq -R -s -c 'split("\n") | map(select(length > 0))')
          fi
          echo "matrix=$paths" >> "$GITHUB_OUTPUT"

  scan:
    name: Scan (${{ matrix.skills-path }})
    needs: discover-skills
    if: needs.discover-skills.outputs.matrix != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        skills-path: ${{ fromJson(needs.discover-skills.outputs.matrix) }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Run SkillSpector scan
        uses: open-edge-platform/geti-ci/actions/skill-scan@d4d1e54759aac44307b38001996e486a6b7c0569 # skill-scan/v0.2.0
        with:
          skills-path: ${{ matrix.skills-path }}
          severity-level: ${{ github.event_name == 'pull_request' && 'HIGH' || github.event.inputs.severity || 'LOW' }}
          fail-on-findings: ${{ github.event_name == 'pull_request' && 'true' || 'false' }}
          version: v2.9.6

      - name: Run skill-validator
        uses: open-edge-platform/geti-ci/actions/skill-validator@15b643856434077bc0a052613aa0e90dcf42bacb # skill-validator/v0.2.3
        with:
          skills-path: ${{ matrix.skills-path }}
          strict: ${{ github.event_name == 'pull_request' && 'true' || 'false' }}
          fail-on-findings: ${{ github.event_name == 'pull_request' && 'true' || 'false' }}
          allow-dirs: "evals,example-prompts,benchmark"
