[build-system]
build-backend = "poetry.core.masonry.api"
requires = ["poetry-core"]

[tool.codespell]
check-filenames = true
check-hidden = true
skip = "*.csv,*.html,*.json,*.jsonl,*.pdf,*.txt,*.ipynb"

[tool.llamahub]
contains_example = false
import_path = "app.simple_summary_pack.llama_index.packs.simple_summary"

[tool.llamahub.class_authors]
SimpleSummaryPack = "llama-index"

[tool.mypy]
disallow_untyped_defs = true
exclude = ["_static", "build", "examples", "notebooks", "venv"]
ignore_missing_imports = true
python_version = "3.11"

[tool.poetry]
name = "document-summarization"
version = "0.1.0"
authors = []
packages = [{ include = "*" }]
description = "Document Summarization using llama index"
exclude = ["app/simple_summary_pack/llama_index/packs/simple_summary/BUILD"]
license = "MIT"
readme = "README.md"

[tool.poetry.dependencies]
python = ">=3.11,<4.0"
llama-index-core = ">=0.13.0"
llama-index = ">0.13.0"
fastapi = ">=0.115.2,<1.0"
poetry = "^2.3.2"
uvicorn = "^0.34.2"
python-multipart = "^0.0.32"
llama-index-llms-openai-like = ">0.5.0"
llama-index-readers-file = ">=0.4.0"
# TODO: revert to a regular version constraint once gradio 6.32.0 is released.
# Prebuilt wheel from gradio-app/gradio#14034 (commit 1028366) which relaxes the
# pillow pin to <14.0, allowing the patched pillow 13 release. Installing gradio
# from git source is not supported (frontend assets are only in built wheels).
gradio = { url = "https://huggingface.co/buckets/gradio/pypi-previews/resolve/ee16f32721f50d5a64b987bcb76f0df9d05d4068/gradio-6.31.0-py3-none-any.whl" }
pillow = "^13.0"
nest-asyncio = "^1.6.0"
docx2txt = "^0.9"
pyyaml = "^6.0.2"
pydantic-settings = "^2.9.1"
opentelemetry-sdk = "1.45.2"
opentelemetry-instrumentation-fastapi = "0.66b2"
openlit = "1.45.0"
httpx = "0.27.2"
nltk = "^3.9.1"


[tool.poetry.group.dev.dependencies]
ipython = "8.10.0"
jupyter = "^1.0.0"
mypy = "0.991"
pre-commit = "3.2.0"
pylint = "2.15.10"
pytest = "7.2.1"
pytest-mock = "3.11.1"
tree-sitter-languages = "^1.8.0"
types-Deprecated = ">=0.1.0"
types-PyYAML = "^6.0.12.12"
types-protobuf = "^4.24.0.4"
types-redis = "4.5.5.0"
types-requests = "2.28.11.8"
types-setuptools = "67.1.0.0"

[tool.poetry.group.dev.dependencies.black]
extras = ["jupyter"]
version = ">=26.3.1"

[tool.poetry.group.dev.dependencies.codespell]
extras = ["toml"]
version = ">=v2.2.6"
