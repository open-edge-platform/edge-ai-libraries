[build-system]
build-backend = "poetry.core.masonry.api"
requires = ["poetry-core"]

[tool.codespell]
check-filenames = true
check-hidden = true
skip = "*.csv,*.html,*.json,*.jsonl,*.pdf,*.txt,*.ipynb"

[tool.llamahub]
contains_example = false
import_path = "app.simple_summary_pack.llama_index.packs.simple_summary"

[tool.llamahub.class_authors]
SimpleSummaryPack = "llama-index"

[tool.mypy]
disallow_untyped_defs = true
exclude = ["_static", "build", "examples", "notebooks", "venv"]
ignore_missing_imports = true
python_version = "3.10"

[tool.poetry]
name = "document-summarization"
version = "0.1.0"
authors = []
packages = [{ include = "*" }]
description = "Document Summarization using llama index"
exclude = ["app/simple_summary_pack/llama_index/packs/simple_summary/BUILD"]
license = "MIT"
readme = "README.md"

[tool.poetry.dependencies]
python = ">=3.10,<4.0"
llama-index-core = ">=0.13.0"
llama-index = ">0.13.0"
fastapi = ">=0.115.2,<1.0"
poetry = "^2.3.2"
uvicorn = ">=0.34.2,<0.52.0"
python-multipart = ">=0.0.27,<0.0.33"
llama-index-llms-openai-like = ">0.5.0"
llama-index-readers-file = ">=0.4.0"
gradio = "^6.6.0"
nest-asyncio = "^1.6.0"
docx2txt = "^0.9"
pyyaml = "^6.0.2"
pydantic-settings = "^2.9.1"
opentelemetry-sdk = "1.39.1"
opentelemetry-instrumentation-fastapi = "0.60b1"
openlit = "1.44.0"
httpx = "0.28.1"
nltk = "^3.9.1"


[tool.poetry.group.dev.dependencies]
ipython = "8.39.0"
jupyter = "^1.0.0"
mypy = "2.3.0"
pre-commit = "4.6.0"
pylint = "4.0.6"
pytest = "9.1.1"
pytest-mock = "3.15.1"
tree-sitter-languages = "^1.8.0"
types-Deprecated = ">=0.1.0"
types-PyYAML = "^6.0.12.12"
types-protobuf = ">=4.24.0.4,<8.0.0.0"
types-redis = "4.6.0.20241004"
types-requests = "2.33.0.20260712"
types-setuptools = "83.0.0.20260706"

[tool.poetry.group.dev.dependencies.black]
extras = ["jupyter"]
version = ">=26.3.1"

[tool.poetry.group.dev.dependencies.codespell]
extras = ["toml"]
version = ">=v2.2.6"
