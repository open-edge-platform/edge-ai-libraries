# LLM service: vlm-openvino-serving (reused microservice).
# Provides an OpenAI API-compatible endpoint for agent reasoning.

services:
  apm-vlm:
    image: ${REGISTRY:-intel/}vlm-openvino-serving:${VLM_TAG:-latest}
    container_name: apm-vlm
    hostname: apm-vlm
    environment:
      http_proxy: ${http_proxy:-}
      https_proxy: ${https_proxy:-}
      no_proxy: ${no_proxy:-},localhost
      VLM_MODEL_NAME: ${LLM_MODEL_NAME}
      VLM_COMPRESSION_WEIGHT_FORMAT: ${LLM_WEIGHT_FORMAT:-int4}
      VLM_DEVICE: ${LLM_DEVICE:-GPU}
      VLM_SEED: ${LLM_SEED:-42}
      WORKERS: ${LLM_WORKERS:-1}
      VLM_MAX_COMPLETION_TOKENS: ${LLM_MAX_COMPLETION_TOKENS:-2048}
      HUGGINGFACE_TOKEN: ${HUGGINGFACEHUB_API_TOKEN:-}
      OV_CONFIG: ${LLM_OV_CONFIG:-}
      VLM_LOG_LEVEL: ${LOG_LEVEL:-info}
      OPENVINO_LOG_LEVEL: 1
      VLM_ACCESS_LOG_FILE: /dev/null
    restart: unless-stopped
    devices:
      - /dev/dri:/dev/dri
    group_add:
      - ${USER_GROUP_ID:-1000}
      - ${VIDEO_GROUP_ID:-44}
      - ${RENDER_GROUP_ID:-1002}
    volumes:
      - apm_model_cache:/app/ov-model
    ports:
      - "${LLM_PORT:-8010}:8000"
    networks:
      - apm_network
    security_opt:
      - no-new-privileges
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 40
      start_period: 30s
