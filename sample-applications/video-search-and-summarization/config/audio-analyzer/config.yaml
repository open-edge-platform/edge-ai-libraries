app:
  name: Audio Analyzer
  cleanup_on_exit: true
  clear_storage_on_startup: true  # wipe storage/ sessions at startup
  use_ov_genai: True # openvino only

models:
  asr:
    provider: openvino  # openai | openvino | whispercpp | funasr
    name: whisper-base  # whisper-{tiny,base,small,medium,large}; funasr: paraformer-{zh,en,online}
    device: CPU # CPU|GPU|NPU (openvino); CPU only (others)
    weight_format: null # openvino: int8|fp16|null; whispercpp: q5*/q8*/int5/int8/null
    temperature: 0.0
    diarization: False  # openvino only
    hf_token: None  # only if diarization=true
    models_base_path: "models"
    # Whisper is multilingual (pass `language` per request). CJK: use funasr
    # paraformer-zh/-en (needs requirements-cjk.txt).
    model_hub: modelscope  # modelscope | huggingface (funasr only)

    # Hallucination filtering (openai/whispercpp only; skipped for openvino genai).
    # Tuned for noisy mic input. Stricter = lower no_speech / higher logprob.
    no_speech_threshold: 0.3
    logprob_threshold: -0.3
    min_duration_sec: 0.5
    min_words: 2

    # openai-whisper: skip silence longer than N sec. null = disabled.
    hallucination_silence_threshold: 1.0

    # Drop segments whose text matches these phrases (all backends incl. openvino genai).
    hallucination_phrase_filter: true
    hallucination_phrases:
      - "thank you"
      - "thank you very much"
      - "thanks for watching"
      - "thank you for watching"
      - "please subscribe"
      - "subscribe"
      - "you"
      - "bye"

    # Repeated-phrase removal (all providers). 1.0 = disabled, >1.0 enables.
    repetition_penalty: 1.8

    # Decoder: beam_size/best_of (openai, whispercpp); word_timestamps/threads (whispercpp).
    beam_size: 1
    best_of: 1
    word_timestamps: false
    threads: 0

  diarization: # only when models.asr.diarization: True
    provider: "huggingface"
    name: "pyannote/speaker-diarization-community-1"
    device: CPU  # CPU | GPU | NPU
    models_base_path: "models"
    min_speakers: 1
    max_speakers: 2

    # Cross-chunk primary-speaker identity resolution.
    identity:
      enabled: true
      similarity_threshold: 0.75   # cosine sim to match stored primary
      lock_min_duration_sec: 0.75  # min turn duration to lock as primary
      session_ttl_seconds: 1800    # evict idle session after 30 min

audio_preprocessing:
  chunk_duration_sec: 15
  silence_threshold: -35  # dB
  silence_duration: 0.3   # min silence length (sec)
  search_window_sec: 1    # silence search window near chunk boundary
  chunk_output_path: chunks/
  denoise: false          # true for noisy audio (ffmpeg arnndn RNNoise)
  denoise_model: ""       # .rnnn path; empty = ffmpeg built-in

audio_util:
  max_size_mb: 200
  allowed_extensions:  # video containers: audio track auto-extracted via ffmpeg
    - .wav
    - .mp3
    - .m4a
    - .mp4
    - .mkv
    - .mov
    - .avi
  chunk_size: 52428800   # 50MB

# MinIO — used only by POST /transcriptions. Override via AUDIO_ANALYZER__MINIO__<KEY>.
minio:
  endpoint: ""       # e.g. "minio-server:9000"; empty disables MinIO
  access_key: ""
  secret_key: ""
  secure: false

pipeline:
  delete_chunks_after_use: true

sentiment:
  enabled: false                  # true = parallel voice sentiment analysis
  model: speechbrain/emotion-recognition-wav2vec2-IEMOCAP
  device: CPU                     # CPU | GPU (openvino only)
  provider: openvino              # openvino | pytorch
  weight_format: int8             # openvino export precision: int8 | fp16
  models_base_path: "models"
  recency_weight: 0.7             # 0.0 = equal weight, 1.0 = last chunk only
  peak_label: angry               # label for peak/escalation detection
