apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "pipelinemanager.fullname" . }}-geo-intersections
  labels:
    app: {{ .Values.pipelinemanager.name }}
data:
  # Locations for Geo Map View, used when the locations API is not set or unreachable.
  geo-intersections.json: |
    {{- $geo := dict "version" 1 "intersections" (.Values.pipelinemanager.geo.intersections | default dict) }}
    {{- toPrettyJson $geo | nindent 4 }}
