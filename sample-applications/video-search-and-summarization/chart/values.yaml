global:
  # Single source of override for image registry and tag across VSS service images
  # (pipeline-manager, video-ingestion, video-search, vss-ui, multimodal-dataprep,
  # multimodal-embedding-serving). Leave empty to keep each subchart's own defaults.
  #   registry: when set, images are pulled from this registry using their bare image name.
  #   tag: when set, overrides the image tag for the VSS service images above.
  registry: ""
  tag: ""
  # pullPolicy overrides the imagePullPolicy for the VSS service images above.
  # Leave empty to keep each subchart's own default (IfNotPresent).
  # Set to "Always" to force a fresh pull on every pod start (e.g. when reusing a mutable tag).
  pullPolicy: ""

  # accelGroupIds are the host group ids that own the accelerator device nodes
  # (/dev/dri for GPU, /dev/accel for NPU). When a service is configured to use a
  # GPU or NPU, these gids are added to the pod's supplementalGroups so the non-root
  # container user can open the device. This mirrors the compose `group_add`
  # (render + video groups). The gids are host-specific, so override these to match
  # the target node (check with `ls -ln /dev/accel` and `ls -ln /dev/dri`).
  accelGroupIds:
    - 992

  # Set this value to hostPath where we want to mount a volume (Used in single node cluster or standalone sub-chart installation).
  volumeHostPath: "/mnt/vss-data"

  # usePvc should be set to true to use a new PVC for storage required by any of the subchart.
  usePvc: false

  # keepPvc should be set to true to retain the PVC after uninstalling the chart.
  keepPvc: false

  metricsManager:
    enabled: false

  # huggingfaceToken should be set during installation if gated models need to be accessed.
  huggingfaceToken: ""

  # vdmsIndexName is the DB Index or DB Collection name used by VDMS Vector DB.
  vdmsIndexName: ""
  # Active vector database backend for search path.
  # Supported: vdms (default), milvus.
  vectordbBackend: "vdms"

  # vlmName is the OVMS or vLLM Vision-Language Model used for captioning.
  vlmName: ""
  # llmName is optional when OVMS serves a separate summarization model.
  # Leave empty to reuse the VLM model as the shared single OVMS model.
  llmName: ""

  # Embedding model used by Multimodal Embedding MS, DataPrep, and Video Search.
  embeddingModelName: ""

  # model-download microservice image used (in ephemeral / one-shot mode) by the
  # OVMS and Video Ingestion init containers to download & convert models. The
  # image is pulled from the configured registry; no host Python/venv is needed.
  modelDownload:
    image:
      repository: intel/model-download
      tag: "2026.2.0-rc1"
      pullPolicy: IfNotPresent
    # OVMS release tag whose export_model.py the openvino plugin uses.
    ovmsReleaseTag: "v2026.1"

  # Per-service device configuration
  # Each service independently configures its accelerator needs
  devices:
    # Multimodal Embedding Microservice
    multimodalEmbedding:
      device: CPU # CPU | GPU | NPU
      key: "" # K8s resource key (e.g., 'gpu.intel.com/xe', 'npu.intel.com/accel')

    # Multimodal Dataprep
    multimodalDataprep:
      embedding:
        device: CPU # CPU | GPU | NPU
        key: "" # K8s resource key when using GPU/NPU
      detection:
        device: CPU # CPU | GPU | NPU
        key: "" # K8s resource key when using GPU/NPU

    # OVMS - per-model device selection (supports split-device configs)
    ovms:
      vlm:
        device: CPU # CPU | GPU | NPU | HETERO:GPU,CPU
        key: "" # K8s resource key for GPU/NPU
      llm:
        device: CPU # CPU | GPU | NPU | HETERO:GPU,CPU
        key: ""

  proxy:
    no_proxy: "localhost,127.0.0.1,192.168.0.0/16,172.16.0.0/12,127.0.0.0/8,10.0.0.0/8,.svc.cluster.local"
    http_proxy: ""
    https_proxy: ""
  env:
    POSTGRES_DB: video_summary_db
    POSTGRES_USER: ""
    POSTGRES_PASSWORD: ""
    MINIO_ROOT_USER: ""
    MINIO_ROOT_PASSWORD: ""
    RABBITMQ_DEFAULT_USER: ""
    RABBITMQ_DEFAULT_PASS: ""
    OTLP_ENDPOINT: ""
    OTLP_ENDPOINT_TRACE: ""
    DEFAULT_BUCKET_NAME: "video-summary"
    MULTIMODAL_EMBEDDING_ENDPOINT: "http://multimodal-embedding-ms:8000/embeddings"
    SDK_USE_OPENVINO: true
    OV_MODELS_DIR: "/app/ov_models"
    OV_PERFORMANCE_MODE: "THROUGHPUT"
    MM_DATAPREP_LOG_LEVEL: "INFO"
    MM_DATAPREP_ALLOW_DUPLICATE_UPLOADS: true
    keeppvc: false # Set to true to keep PVCs after uninstalling the chart

rabbitmq:
  enabled: false
  name: rabbitmq
  fullname: rabbitmq
  service:
    name: rabbitmq
    type: ClusterIP
    amqpPort: 5672
    managementPort: 15672
    mqttPort: 1883

minioserver:
  claimSize: "5Gi"
  service:
    apiPort: 9000

pipelinemanager:
  name: pipelinemanager
  aliasServiceName: pipeline-manager
  securityContext:
    privileged: true
    runAsUser: 0
    runAsGroup: 0
  image:
    repository: intel/pipeline-manager
    tag: "2026.2.0-rc1"
    pullPolicy: IfNotPresent
  containerPortName: videosumm-port # Optional name to refer containerPort
  # Readiness gating mirrors the Compose healthcheck for pipeline-manager
  # (curl -f http://localhost:3000/health, 10s timeout, 3 retries). GET /health
  # also pings PostgreSQL, so the pod only reports Ready once NestJS is
  # listening and its database is reachable.
  #
  # startupProbe absorbs the initial NestJS bootstrap and migration window
  # without the tighter readiness thresholds failing during it.
  #
  # No livenessProbe is defined on purpose: /health depends on PostgreSQL, so a
  # liveness probe against it would restart a perfectly healthy pipeline-manager
  # whenever the database blipped.
  startupProbe:
    httpGet:
      path: /health
      port: videosumm-port
    periodSeconds: 10
    timeoutSeconds: 10
    failureThreshold: 30
  readinessProbe:
    httpGet:
      path: /health
      port: videosumm-port
    initialDelaySeconds: 5
    periodSeconds: 10
    timeoutSeconds: 10
    failureThreshold: 3
  service:
    type: ClusterIP
    port: 80 # Port on which service listens for incoming connection, if exposed externally
  minioProtocol: "http:"
  minioBucket: "video-search-summary"
  env:
    LLM_SUMMARIZATION_KEY: ""
    LLM_SUMMARIZATION_API: ""
    LLM_SUMMARIZATION_DEVICE: "CPU"
    VLM_CAPTIONING_KEY: ""
    VLM_CAPTIONING_API: ""
    VLM_CAPTIONING_DEVICE: "CPU"
    LLM_CONCURRENT: "2"
    VLM_CONCURRENT: "4"
    TICK_INTERVAL_MS: "5000" # EVAM uses TICK
    FAST_TICK_INTERVAL_MS: "2000" # VLM/LLM uses FAST_TICK
    SUMMARIZATION_MAX_COMPLETION_TOKENS: "4000"
    CAPTIONING_MAX_COMPLETION_TOKENS: "1024"
    MAX_CONTEXT_LENGTH: "90000"
    LLM_MODEL_API: "v1/config"
    VLM_MODEL_API: "v1/config"
    MULTI_FRAME_COUNT: "12"
    AUDIO_DEVICE: "cpu"
    AUDIO_USE_FULL_TRANSCRIPT_SUMMARY: "true"
    PRODUCE_FINAL_SUMMARY: "true"
    OTLP_TRACE_URL: ""
    USE_VLLM: "CONFIG_OFF"
    SUMMARY_FEATURE: "FEATURE_OFF"
    SEARCH_FEATURE: "FEATURE_OFF"
    SEARCH_DATAPREP_TIMEOUT_MS: "600000"
    SEARCH_DATAPREP_POLL_MAX_RETRIES: "3"
    SEARCH_DATAPREP_POLL_TIMEOUT_MS: "10000"
    SEARCH_DATAPREP_POLL_RETRY_DELAY_MS: "500"
  nodeSelector: {}
  affinity: {}
  tolerations: []

audioanalyzer:
  enabled: false
  name: audioanalyzer
  claimSize: "3Gi"
  service:
    port: 8000
    targetPort: 8000
    type: ClusterIP

videoingestion:
  enabled: false
  name: videoingestion
  fullnameOverride: videoingestion
  fullname: videoingestion
  claimSize: "2Gi"
  # odModelName defines the name of Object Detection Model (ultralytics hub id)
  odModelName: "yolov8l"
  service:
    type: ClusterIP
    port: 8080

ovms:
  name: ovms
  enabled: false
  claimSize: "6Gi"
  service:
    port: 8300
  env:
    LLM_TARGET_DEVICE: ""
    VLM_TARGET_DEVICE: ""

vllm:
  enabled: false
  service:
    name: cpu-vllm-service
    type: ClusterIP
    port: 80

# Add nginx configuration
nginx:
  name: video-summary-nginx
  containerPortName: nginx-port
  service:
    type: NodePort
    port: 80
  affinity:
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
          - matchExpressions:
              - key: kubernetes.io/ready
                operator: In
                values:
                  - "true"

postgresql:
  name: postgresql
  fullname: postgresql
  claimSize: "5Gi"
  service:
    type: ClusterIP
    port: 5432

# Placeholder for multimodal-embedding-ms subchart
multimodalembeddingms:
  enabled: false
  name: multimodal-embedding-ms
  service:
    type: ClusterIP
    port: 8000
  modelPvc:
    enabled: true
