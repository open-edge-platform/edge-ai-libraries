  service:
    type: ClusterIP
    port: 19530
    metricsPort: 9091

# Placeholder for vdms-vectordb subchart
vdmsvectordb:
  enabled: false
  name: vdms-vectordb
  claimSize: "8Gi"
  service:
    type: ClusterIP
    port: 55555

# Placeholder for videosearch subchart
videosearch:
  enabled: false
  name: videosearch
  service:
    type: ClusterIP
    port: 8000

metricsmanager:
