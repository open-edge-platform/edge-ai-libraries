nameOverride: ""
fullnameOverride: ""

deployment:
  replicaCount: 1

# Backend the vLLM server runs on.
#   CPU - vllm-openai-cpu image, no accelerator required.
#   XPU - vllm-openai-xpu image on an Intel GPU (Arc / Arc Pro). Requires
#         gpu.key below and the Intel GPU device plugin on the node.
device: CPU

gpu:
  # K8s device plugin resource key requested when device is XPU,
  # e.g. "gpu.intel.com/i915" or "gpu.intel.com/xe". Rendering fails without it.
  key: ""
  # Host path to the render device nodes, mounted when device is XPU.
  devicePath: /dev/dri

image:
  repository: vllm/vllm-openai-cpu
  tag: v0.31.0
  # Used instead of repository/tag when device is XPU.
  xpu:
    repository: vllm/vllm-openai-xpu
    tag: v0.31.0
  pullPolicy: IfNotPresent

serviceAccountName: default

podSecurityContext:
  fsGroup: 0

containerSecurityContext:
  runAsNonRoot: false
  privileged: false

service:
  name: cpu-vllm-service
  type: ClusterIP
  port: 80
  targetPort: 8000

pvc:
  enabled: true
  name: vllm-model-cache
  accessModes:
    - ReadWriteOnce
  size: 80Gi

resources: {}

env:
  huggingfaceToken: ""
  hfHome: /cache
  # CPU backend only; ignored when device is XPU.
  vllmCpuKvCacheSpace: "48"
  vllmLoggingLevel: ""

model:
  name: ""
  dtype: bfloat16
  distributedExecutorBackend: mp
  trustRemoteCode: true
  blockSize: 128
  enableChunkedPrefill: true
  maxNumBatchedTokens: 2048
  maxNumSeqs: 256
  maxModelLen: 32000
  enableLogRequests: true
  tensorParallelSize: 1

  # --- XPU only (ignored when device is CPU) ---
  # Skip CUDA/XPU graph capture. Required on the XPU backend.
  enforceEager: true
  # Fraction of total GPU memory vLLM may reserve for weights, activations and
  # KV cache. Raise towards 0.95 on cards with less than 16 GB.
  gpuMemoryUtilization: "0.8"
  # Maximum pixels per frame, passed as --mm-processor-kwargs max_pixels.
  # Caps the resolution of each frame, not how many frames are sent. Lower it
  # (e.g. 401408) to cut vision-encoder memory on cards with less than 16 GB.
  mmMaxPixels: 16777216

probes:
  startup:
    path: /health
    port: 8000
    initialDelaySeconds: 30
    periodSeconds: 30
    timeoutSeconds: 10
    failureThreshold: 40
  liveness:
    path: /health
    port: 8000
    initialDelaySeconds: 10
    periodSeconds: 60
    timeoutSeconds: 30
    failureThreshold: 3
  readiness:
    path: /health
    port: 8000
    initialDelaySeconds: 10
    periodSeconds: 30
    timeoutSeconds: 10
    failureThreshold: 3

volumes:
  shm:
    sizeLimit: 32Gi
  cache:
    mountPath: /cache

containerPort: 8000
