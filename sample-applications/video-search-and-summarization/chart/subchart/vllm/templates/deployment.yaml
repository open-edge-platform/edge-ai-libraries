{{- $global := default (dict) .Values.global -}}
{{- /* Backend selection. XPU runs the Intel GPU image and needs a device plugin
       resource key, the /dev/dri host device, and XPU-only engine flags. */ -}}
{{- $isXpu := eq (upper (default "CPU" .Values.device)) "XPU" -}}
{{- $gpuKey := .Values.gpu.key -}}
{{- if and $isXpu (not $gpuKey) -}}
{{- fail "vllm.gpu.key is required when vllm.device is XPU (e.g. gpu.intel.com/i915)" -}}
{{- end -}}
{{- $imageRepo := ternary .Values.image.xpu.repository .Values.image.repository $isXpu -}}
{{- $imageTag := ternary .Values.image.xpu.tag .Values.image.tag $isXpu -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "vllm.fullname" . }}
  labels:
    app: {{ include "vllm.fullname" . }}
    {{- include "vllm.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.deployment.replicaCount }}
  selector:
    matchLabels:
      app: {{ include "vllm.fullname" . }}
  template:
    metadata:
      labels:
        app: {{ include "vllm.fullname" . }}
        {{- include "vllm.labels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ .Values.serviceAccountName }}
      securityContext:
        fsGroup: {{ .Values.podSecurityContext.fsGroup }}
        {{- if and $isXpu $global.accelGroupIds }}
        # Host gids owning /dev/dri, so the container user can open the device.
        supplementalGroups:
          {{- range $global.accelGroupIds }}
          - {{ . }}
          {{- end }}
        {{- end }}
      containers:
        - name: vllm
          image: "{{ $imageRepo }}:{{ $imageTag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: {{ .Values.containerPort }}
              name: http
              protocol: TCP
          securityContext:
            runAsNonRoot: {{ .Values.containerSecurityContext.runAsNonRoot }}
            privileged: {{ .Values.containerSecurityContext.privileged }}
          env:
            {{- if $global.huggingfaceToken }}
            - name: HUGGING_FACE_HUB_TOKEN
              value: "{{ $global.huggingfaceToken }}"
            {{- else if .Values.env.huggingfaceToken }}
            - name: HUGGING_FACE_HUB_TOKEN
              value: "{{ .Values.env.huggingfaceToken }}"
            {{- end }}
            - name: HF_HOME
              value: "{{ .Values.env.hfHome }}"
            {{- if not $isXpu }}
            - name: VLLM_CPU_KVCACHE_SPACE
              value: "{{ .Values.env.vllmCpuKvCacheSpace }}"
            {{- end }}
            {{- if .Values.env.vllmLoggingLevel }}
            - name: VLLM_LOGGING_LEVEL
              value: "{{ .Values.env.vllmLoggingLevel }}"
            {{- end }}
            - name: http_proxy
              value: {{ $global.proxy.http_proxy | default "" | quote }}
            - name: https_proxy
              value: {{ $global.proxy.https_proxy | default "" | quote }}
            - name: no_proxy
              value: "{{ $global.proxy.no_proxy }},minio-server,localhost,127.0.0.1,{{ include "vllm.fullname" . }},.svc.cluster.local"
          args:
            - "--dtype"
            - "{{ .Values.model.dtype }}"
            - "--distributed-executor-backend"
            - "{{ .Values.model.distributedExecutorBackend }}"
            {{- if .Values.model.trustRemoteCode }}
            - "--trust-remote-code"
            {{- end }}
            - "--block-size"
            - "{{ .Values.model.blockSize }}"
            {{- if .Values.model.enableChunkedPrefill }}
            - "--enable-chunked-prefill"
            {{- end }}
            {{- if and $isXpu .Values.model.enforceEager }}
            - "--enforce-eager"
            {{- end }}
            - "--max-num-batched-tokens"
            - "{{ .Values.model.maxNumBatchedTokens }}"
            - "--max-num-seqs"
            - "{{ .Values.model.maxNumSeqs }}"
            - "--max_model_len"
            - "{{ .Values.model.maxModelLen }}"
            {{- if .Values.model.enableLogRequests }}
            - "--enable-log-requests"
            {{- end }}
            - "--model"
            - "{{ default .Values.model.name $global.vlmName }}"
            - "--tensor-parallel-size"
            - "{{ .Values.model.tensorParallelSize }}"
            {{- if $isXpu }}
            - "--gpu-memory-utilization"
            - "{{ .Values.model.gpuMemoryUtilization }}"
            - "--mm-processor-kwargs"
            - {{ printf "{\"max_pixels\": %d}" (int64 .Values.model.mmMaxPixels) | quote }}
            {{- end }}
          {{- if $isXpu }}
          # Intel GPU device plugin resource key; also gates scheduling onto a GPU node.
          resources:
            requests:
              {{ $gpuKey }}: 1
              {{- with .Values.resources.requests }}
              {{- toYaml . | nindent 14 }}
              {{- end }}
            limits:
              {{ $gpuKey }}: 1
              {{- with .Values.resources.limits }}
              {{- toYaml . | nindent 14 }}
              {{- end }}
          {{- else }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          {{- end }}
          startupProbe:
            httpGet:
              path: {{ .Values.probes.startup.path }}
              port: {{ .Values.probes.startup.port }}
            initialDelaySeconds: {{ .Values.probes.startup.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.startup.periodSeconds }}
            timeoutSeconds: {{ .Values.probes.startup.timeoutSeconds }}
            failureThreshold: {{ .Values.probes.startup.failureThreshold }}
          livenessProbe:
            httpGet:
              path: {{ .Values.probes.liveness.path }}
              port: {{ .Values.probes.liveness.port }}
            initialDelaySeconds: {{ .Values.probes.liveness.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.liveness.periodSeconds }}
            timeoutSeconds: {{ .Values.probes.liveness.timeoutSeconds }}
            failureThreshold: {{ .Values.probes.liveness.failureThreshold }}
          readinessProbe:
            httpGet:
              path: {{ .Values.probes.readiness.path }}
              port: {{ .Values.probes.readiness.port }}
            initialDelaySeconds: {{ .Values.probes.readiness.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.readiness.periodSeconds }}
            timeoutSeconds: {{ .Values.probes.readiness.timeoutSeconds }}
            failureThreshold: {{ .Values.probes.readiness.failureThreshold }}
          volumeMounts:
            - name: shm
              mountPath: /dev/shm
            - name: cache
              mountPath: {{ .Values.volumes.cache.mountPath }}
            {{- if $isXpu }}
            - name: dri-device
              mountPath: {{ .Values.gpu.devicePath }}
            {{- end }}
      volumes:
        - name: shm
          emptyDir:
            medium: Memory
            sizeLimit: {{ .Values.volumes.shm.sizeLimit }}
        - name: cache
          persistentVolumeClaim:
            claimName: {{ .Values.pvc.name }}
        {{- if $isXpu }}
        - name: dri-device
          hostPath:
            path: {{ .Values.gpu.devicePath }}
            type: Directory
        {{- end }}
