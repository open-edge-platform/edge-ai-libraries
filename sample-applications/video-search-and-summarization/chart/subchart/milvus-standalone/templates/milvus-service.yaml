apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.milvus.service.name }}
spec:
  selector:
    app: {{ .Values.milvus.service.name }}
  ports:
    - name: grpc
      port: {{ .Values.milvus.service.port }}
      targetPort: 19530
    - name: metrics
      port: {{ .Values.milvus.service.metricsPort }}
      targetPort: 9091
