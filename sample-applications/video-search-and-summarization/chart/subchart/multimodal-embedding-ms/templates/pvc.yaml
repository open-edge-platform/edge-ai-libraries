{{- $mmDevice := default "CPU" .Values.global.devices.multimodalEmbedding.device -}}
{{- $mmUsesGpu := eq $mmDevice "GPU" -}}
{{- if and (.Values.global.usePvc) $mmUsesGpu }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "multimodal-embedding-ms.fullname" . }}-gpu-pvc
  {{- if .Values.global.keepPvc }}
  annotations:
    helm.sh/resource-policy: keep   # Prevent Helm from deleting PVC on uninstall
  {{- end }}
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: {{ .Values.modelPvc.size | default "10Gi" }}
  {{- if .Values.modelPvc.storageClassName }}
  storageClassName: {{ .Values.modelPvc.storageClassName }}
  {{- end }}
{{- end }}
{{- if and .Values.global.usePvc (not .Values.modelPvc.enabled) }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "multimodal-embedding-ms.fullname" . }}-data-pvc
  {{- if .Values.global.keepPvc }}
  annotations:
    helm.sh/resource-policy: keep
  {{- end }}
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: {{ .Values.modelPvc.size | default "10Gi" }}
  {{- if .Values.modelPvc.storageClassName }}
  storageClassName: {{ .Values.modelPvc.storageClassName }}
  {{- end }}
{{- end }}
