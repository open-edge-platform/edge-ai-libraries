apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "metrics-manager.deploymentFullname" . }}
  labels:
    {{- include "metrics-manager.labels" . | nindent 4 }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "metrics-manager.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "metrics-manager.selectorLabels" . | nindent 8 }}
      annotations:
        container.apparmor.security.beta.kubernetes.io/metrics-manager: unconfined
    spec:
      hostPID: true
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: metrics-manager
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            privileged: true
            seccompProfile:
              type: Unconfined
          ports:
            - name: metrics
              containerPort: {{ .Values.service.metricsPort }}
            - name: telegraf
              containerPort: {{ .Values.service.telegrafPort }}
          env:
            - name: METRICS_PORT
              value: {{ .Values.service.metricsPort | quote }}
            - name: LOG_LEVEL
              value: {{ .Values.config.logLevel | quote }}
            - name: CORS_ORIGINS
              value: {{ .Values.config.corsOrigins | quote }}
            - name: PROMETHEUS_POLLER_INTERVAL_MS
              value: {{ .Values.config.prometheusPollIntervalMs | quote }}
            - name: http_proxy
              value: {{ .Values.global.proxy.http_proxy | quote }}
            - name: https_proxy
              value: {{ .Values.global.proxy.https_proxy | quote }}
            - name: no_proxy
              value: {{ printf "localhost,127.0.0.1,metrics-manager,%s" .Values.global.proxy.no_proxy | quote }}
          livenessProbe:
            httpGet:
              path: /health
              port: metrics
            initialDelaySeconds: 30
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /health
              port: metrics
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: dev
              mountPath: /dev
            - name: sys
              mountPath: /sys
              readOnly: true
            - name: run
              mountPath: /run
              readOnly: true
      volumes:
        - name: dev
          hostPath:
            path: /dev
            type: Directory
        - name: sys
          hostPath:
            path: /sys
            type: Directory
        - name: run
          hostPath:
            path: /run
            type: Directory
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if .Values.coLocateWithDataPrep }}
      affinity:
        podAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  app.kubernetes.io/name: multimodaldataprep
                  app.kubernetes.io/instance: {{ .Release.Name }}
              topologyKey: kubernetes.io/hostname
      {{- else }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
