apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "audioanalyzer.fullname" . }}
  labels:
    app: {{ include "audioanalyzer.name" . }}
spec:
  replicas: {{ .Values.audioanalyzer.replicaCount | default 1 }}
  selector:
    matchLabels:
      app: {{ .Values.audioanalyzer.name }}
  template:
    metadata:
      labels:
        app: {{ .Values.audioanalyzer.name }}
    spec:
      {{- with .Values.nodeAffinity }}
      affinity:
        nodeAffinity:
          {{- toYaml . | nindent 10 }}
      {{- end }}
      {{- with .Values.securityContext }}
      securityContext:
        {{- toYaml . | nindent 10 }}
      {{- end }}
      containers:
        - name: {{ .Chart.Name }}
          image: "{{ .Values.audioanalyzer.image.repository }}:{{ .Values.audioanalyzer.image.tag }}"
          imagePullPolicy: {{ .Values.audioanalyzer.image.pullPolicy }}
          {{- with .Values.containerSecurityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          ports:
            - containerPort: {{ .Values.audioanalyzer.containerPort }}
              name: {{ .Values.audioanalyzer.containerPortName }}
          livenessProbe:
            {{- toYaml .Values.livenessProbe | nindent 12 }}
          readinessProbe:
            {{- toYaml .Values.readinessProbe | nindent 12 }}
          startupProbe:
            {{- toYaml .Values.startupProbe | nindent 12 }}
          {{- with .Values.audioanalyzer.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          env:
            - name: DEBUG
              value: {{ .Values.audioanalyzer.env.DEBUG | quote }}
            - name: DEFAULT_DEVICE
              value: {{ .Values.audioanalyzer.env.DEFAULT_DEVICE | quote }}
            - name: MAX_FILE_SIZE
              value: {{ .Values.audioanalyzer.env.MAX_FILE_SIZE | quote }}
            - name: AUDIO_ANALYZER__MINIO__ENDPOINT
              value: "{{ .Values.minioServer.name }}:{{ .Values.minioServer.service.port }}"
            - name: AUDIO_ANALYZER__MINIO__ACCESS_KEY
              value: {{ .Values.global.env.MINIO_ROOT_USER | quote }}
            - name: AUDIO_ANALYZER__MINIO__SECRET_KEY
              value: {{ .Values.global.env.MINIO_ROOT_PASSWORD | quote }}
            - name: AUDIO_ANALYZER__MINIO__SECURE
              value: "false"
            # Common ASR knobs — env vars take top priority over the image's baked config.yaml.
            - name: AUDIO_ANALYZER__MODELS__ASR__NAME
              value: {{ .Values.audioanalyzer.env.ASR_MODEL | quote }}
            - name: AUDIO_ANALYZER__MODELS__ASR__DEVICE
              value: {{ .Values.audioanalyzer.env.ASR_DEVICE | quote }}
            - name: AUDIO_ANALYZER__MODELS__ASR__WEIGHT_FORMAT
              value: {{ .Values.audioanalyzer.env.ASR_WEIGHT_FORMAT | quote }}
            - name: AUDIO_ANALYZER__MODELS__ASR__DIARIZATION
              value: {{ .Values.audioanalyzer.env.ASR_DIARIZATION | quote }}
            - name: AUDIO_ANALYZER__SENTIMENT__ENABLED
              value: {{ .Values.audioanalyzer.env.SENTIMENT_ENABLED | quote }}
            - name: HF_TOKEN
              value: {{ .Values.audioanalyzer.env.ASR_HF_TOKEN | default "" | quote }}
            - name: STORAGE_BACKEND
              value: {{ .Values.audioanalyzer.env.STORAGE_BACKEND | quote }}
            - name: USE_FP16
              value: {{ .Values.audioanalyzer.env.USE_FP16 | quote }}
            - name: http_proxy
              value: {{ .Values.global.proxy.http_proxy | quote }}
            - name: https_proxy
              value: {{ .Values.global.proxy.https_proxy | quote }}
            - name: no_proxy
              value: "{{ .Values.global.proxy.no_proxy }},localhost,127.0.0.1,audioanalyzer,pipelinemanager,videoingestion,minio-server,postgresql,video-summary-nginx,rabbitmq,multimodal-embedding-ms,multimodal-dataprep,vdms-vectordb,vector-retriever,videosearch,.svc.cluster.local"
          volumeMounts:
            - name: audio-volume
              mountPath: /data
      volumes:
        - name: audio-volume
          {{- if .Values.global.usePvc }}
          persistentVolumeClaim:
            claimName: {{ include "audioanalyzer.fullname" . }}-pvc
          {{- else if .Values.global.volumeHostPath }}
          hostPath:
            path: {{ .Values.global.volumeHostPath }}
            type: DirectoryOrCreate
          {{- else }}
          emptyDir: {}
          {{- end }}