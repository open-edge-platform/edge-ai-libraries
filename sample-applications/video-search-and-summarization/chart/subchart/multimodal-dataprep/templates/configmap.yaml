{{- $embeddingDevice := .Values.embedding.embeddingDevice | default .Values.global.devices.multimodalDataprep.embedding.device | default .Values.embedding.vdmsDataprepDevice | default .Values.embedding.device | default "CPU" -}}
{{- $detectionDevice := .Values.frameProcessing.dataprepDetectionDevice | default .Values.global.devices.multimodalDataprep.detection.device | default .Values.embedding.vdmsDataprepDevice | default .Values.embedding.device | default "CPU" -}}
{{- $embeddingUsesGpu := eq $embeddingDevice "GPU" -}}
{{- $embeddingUsesNpu := eq $embeddingDevice "NPU" -}}
{{- $embeddingUsesAccelerator := or $embeddingUsesGpu $embeddingUsesNpu -}}
{{- $detectionUsesGpu := eq $detectionDevice "GPU" -}}
{{- $detectionUsesNpu := eq $detectionDevice "NPU" -}}
{{- $detectionUsesAccelerator := or $detectionUsesGpu $detectionUsesNpu -}}
{{- $dpUsesAccelerator := or $embeddingUsesAccelerator $detectionUsesAccelerator -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "vdms-dataprep.fullname" . }}-config
  labels:
    {{- include "vdms-dataprep.labels" . | nindent 4 }}
data:
  MM_DATAPREP_APP_HOST: "multimodal-dataprep"
  MM_DATAPREP_VECTORDB_BACKEND: {{ .Values.global.vectordbBackend | default .Values.vectorDbBackend | quote }}
  MM_DATAPREP_STORAGE_BACKEND: "minio"
  {{- if .Values.vdmsVectorDbHost }}
  MM_DATAPREP_VDMS_VDB_HOST: {{ .Values.vdmsVectorDbHost | quote }}
  {{- else }}
  MM_DATAPREP_VDMS_VDB_HOST: "vdms-vectordb"
  {{- end }}
  MM_DATAPREP_VDMS_VDB_PORT: {{ .Values.vdmsVectorDbPort | quote }}
  MM_DATAPREP_MILVUS_URI: {{ .Values.milvusUri | quote }}
  MM_DATAPREP_VDB_METRIC_TYPE: {{ .Values.vdbMetricType | quote }}
  MM_DATAPREP_VDB_INDEX_TYPE: {{ .Values.vdbIndexType | quote }}
  MM_DATAPREP_DB_COLLECTION: {{ .Values.global.vdmsIndexName | quote }}
  http_proxy: {{ .Values.global.proxy.http_proxy | quote }}
  https_proxy: {{ .Values.global.proxy.https_proxy | quote }}
  no_proxy: "localhost,127.0.0.1,audioanalyzer,pipelinemanager,videoingestion,minio-server,postgresql,video-summary-nginx,rabbitmq,multimodal-embedding-ms,multimodal-dataprep,vdms-vectordb,vector-retriever,videosearch,.svc.cluster.local"
  MM_DATAPREP_MINIO_ACCESS_KEY: {{ .Values.global.env.MINIO_ROOT_USER | quote }}
  MM_DATAPREP_MINIO_SECRET_KEY: {{ .Values.global.env.MINIO_ROOT_PASSWORD | quote }}
  MM_DATAPREP_MINIO_ENDPOINT: {{ .Values.minioServer.name }}:{{ .Values.minioServer.service.port }}
  MM_DATAPREP_MINIO_SECURE: "false"
  MM_DATAPREP_DEFAULT_BUCKET_NAME: {{ .Values.defaultBucketName | default .Values.global.env.DEFAULT_BUCKET_NAME | default "video-summary" | quote }}
  MM_DATAPREP_EMBEDDING_MODEL_NAME: {{ required "global.embeddingModelName is required" .Values.global.embeddingModelName | quote }}
  {{- if $dpUsesAccelerator }}
  MM_DATAPREP_USE_OPENVINO: "true"
  {{- else }}
  {{- if hasKey .Values.embedding "sdkUseOpenVino" }}
  MM_DATAPREP_USE_OPENVINO: {{ printf "%v" .Values.embedding.sdkUseOpenVino | quote }}
  {{- else if hasKey .Values.global.env "SDK_USE_OPENVINO" }}
  MM_DATAPREP_USE_OPENVINO: {{ printf "%v" .Values.global.env.SDK_USE_OPENVINO | quote }}
  {{- else }}
  MM_DATAPREP_USE_OPENVINO: "true"
  {{- end }}
  {{- end }}
  MM_DATAPREP_EMBEDDING_DEVICE: {{ $embeddingDevice | quote }}
  MM_DATAPREP_DETECTION_DEVICE: {{ $detectionDevice | quote }}
  MM_DATAPREP_OV_MODELS_DIR: {{ .Values.embedding.ovModelsDir | default .Values.global.env.OV_MODELS_DIR | default "/app/ov_models" | quote }}
  MM_DATAPREP_OV_PERFORMANCE_MODE: {{ .Values.embedding.ovPerformanceMode | default .Values.global.env.OV_PERFORMANCE_MODE | default "THROUGHPUT" | quote }}
  MM_DATAPREP_FRAME_INTERVAL: {{ .Values.frameProcessing.frameInterval | default 15 | quote }}
  {{- if hasKey .Values.frameProcessing "enableObjectDetection" }}
  MM_DATAPREP_ENABLE_OBJECT_DETECTION: {{ printf "%v" .Values.frameProcessing.enableObjectDetection | quote }}
  {{- else }}
  MM_DATAPREP_ENABLE_OBJECT_DETECTION: "true"
  {{- end }}
  MM_DATAPREP_DETECTION_CONFIDENCE: {{ .Values.frameProcessing.detectionConfidence | default 0.85 | quote }}
  MM_DATAPREP_DETECTION_MODEL_DIR: {{ .Values.frameProcessing.detectionModelDir | default "/app/models/yolox" | quote }}
  MM_DATAPREP_FRAMES_TEMP_DIR: {{ .Values.frameProcessing.framesTempDir | default "/tmp/dataprep" | quote }}
  MM_DATAPREP_EMBEDDING_BATCH_SIZE: {{ .Values.sdkPipeline.embeddingBatchSize | default .Values.global.env.EMBEDDING_BATCH_SIZE | default 32 | quote }}
  MM_DATAPREP_MAX_PARALLEL_WORKERS: {{ .Values.sdkPipeline.maxParallelWorkers | default .Values.global.env.MAX_PARALLEL_WORKERS | quote }}
  MM_DATAPREP_VIDEO_SHM_MAX_BLOCKS: {{ .Values.sdkPipeline.videoShmMaxBlocks | default .Values.global.env.SDK_VIDEO_SHM_MAX_BLOCKS | default 512 | quote }}
  MM_DATAPREP_VIDEO_SHM_BLOCK_SIZE: {{ .Values.sdkPipeline.videoShmBlockSize | default .Values.global.env.SDK_VIDEO_SHM_BLOCK_SIZE | default 6220800 | int | quote }}
  MM_DATAPREP_VIDEO_EXTRACTION_BATCH_SIZE: {{ .Values.sdkPipeline.videoExtractionBatchSize | default .Values.global.env.SDK_VIDEO_EXTRACTION_BATCH_SIZE | default 256 | quote }}
  MM_DATAPREP_PIPELINE_QUEUE_MAXSIZE: {{ .Values.sdkPipeline.pipelineQueueMaxsize | default .Values.global.env.SDK_PIPELINE_QUEUE_MAXSIZE | default 16 | quote }}
  MM_DATAPREP_PIPELINE_COMPLETION_QUEUE_MAXSIZE: {{ .Values.sdkPipeline.pipelineCompletionQueueMaxsize | default .Values.global.env.SDK_PIPELINE_COMPLETION_QUEUE_MAXSIZE | default 1 | quote }}
  MM_DATAPREP_DETECTION_WORKER_THREADS: {{ .Values.sdkPipeline.detectionWorkerThreads | default .Values.global.env.SDK_DETECTION_WORKER_THREADS | default 2 | quote }}
  MM_DATAPREP_EMBED_WORKER_THREADS: {{ .Values.sdkPipeline.embedWorkerThreads | default .Values.global.env.SDK_EMBED_WORKER_THREADS | default 2 | quote }}
  MM_DATAPREP_PIPELINE_QUEUE_GET_TIMEOUT_S: {{ .Values.sdkPipeline.pipelineQueueGetTimeoutS | default .Values.global.env.SDK_PIPELINE_QUEUE_GET_TIMEOUT_S | default 1.0 | quote }}
  MM_DATAPREP_SAVE_RUNTIME_PIPELINE_STATS: {{ .Values.sdkPipeline.saveRuntimePipelineStats | default .Values.global.env.SAVE_RUNTIME_PIPELINE_STATS | default false | quote }}
  MM_DATAPREP_ENABLE_TRACING: {{ .Values.sdkPipeline.enableTracing | default .Values.global.env.SDK_ENABLE_TRACING | default false | quote }}
  MM_DATAPREP_VIDEO_FRAME_DECODER_WORKERS: {{ .Values.sdkPipeline.videoFrameDecoderWorkers | default .Values.global.env.VIDEO_FRAME_DECODER_WORKERS | default 2 | quote }}
  MM_DATAPREP_VIDEO_FRAME_LOG_LEVEL: {{ .Values.sdkPipeline.videoFrameLogLevel | default .Values.global.env.VIDEO_FRAME_LOG_LEVEL | default "INFO" | quote }}
  HF_HOME: "/home/appuser/.cache/huggingface"
  TRANSFORMERS_CACHE: "/home/appuser/.cache/huggingface"
  HUGGINGFACE_HUB_CACHE: "/home/appuser/.cache/huggingface"
  XDG_CACHE_HOME: "/home/appuser/.cache"
  # Persist the OpenVINO compiled-model cache on the (writable, persistent) ov_models
  # volume so GPU/NPU graph compilation runs once instead of on every pod start.
  OV_CACHE_DIR: {{ .Values.ovCacheDir | default "/app/ov_models/ov_cache" | quote }}
  MM_DATAPREP_LOG_LEVEL: {{ .Values.logLevel | default .Values.global.env.VDMS_DATAPREP_LOG_LEVEL | default "INFO" | quote }}
  MM_DATAPREP_ALLOW_ORIGINS: {{ .Values.cors.allowOrigins | default "*" | quote }}
  MM_DATAPREP_ALLOW_METHODS: {{ .Values.cors.allowMethods | default "*" | quote }}
  MM_DATAPREP_ALLOW_HEADERS: {{ .Values.cors.allowHeaders | default "*" | quote }}
  FASTAPI_ENV: development
