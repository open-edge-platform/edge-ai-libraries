global:
  proxy:
    no_proxy: ""
    http_proxy: ""
    https_proxy: ""


name: vssui
image:
  repository: intel/vss-ui
  tag: "latest"
  pullPolicy: IfNotPresent
  resources: {}

containerPortName: vssui-port  # Optional name to refer containerPort
service:
  type: ClusterIP
  port: 80  # Port on which service listens for incoming connection

pipelineManagerEndpoint: "/manager"
assetsEndpoint: "/minio"

feature:
  summary: ""
  search: ""
  mux: ""
  # Live (RTSP) stream management UI. FEATURE_ON for search/dual modes where
  # live video frames are embedded; FEATURE_OFF otherwise.
  liveStreams: "FEATURE_OFF"
  map: "FEATURE_OFF"

# Map View tile server; intersection locations come from pipeline-manager (pipelinemanager.geo).
mapTileUrl: "https://tile.openstreetmap.org/{z}/{x}/{y}.png"
