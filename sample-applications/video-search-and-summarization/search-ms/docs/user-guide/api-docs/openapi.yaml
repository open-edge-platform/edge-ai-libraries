openapi: 3.1.0
info:
  title: FastAPI
  version: 0.1.0
paths:
  /query:
    post:
      summary: Query Endpoint
      operationId: query_endpoint_query_post
      requestBody:
        content:
          application/json:
            schema:
              items:
                $ref: '#/components/schemas/QueryRequest'
              type: array
              title: Request
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /watcher-last-updated:
    get:
      summary: Watcher Last Updated
      operationId: watcher_last_updated_watcher_last_updated_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
  /health:
    get:
      summary: Health Check
      description: Simple health check endpoint to verify the service is running.
      operationId: health_check_health_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
  /initial-upload-status:
    get:
      summary: Initial Upload Status
      operationId: initial_upload_status_initial_upload_status_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
components:
  schemas:
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    QueryRequest:
      properties:
        query_id:
          type: string
          title: Query Id
        query:
          type: string
          title: Query
        tags:
          anyOf:
          - items:
              type: string
            type: array
          - type: string
          - type: 'null'
          title: Tags
        time_filter:
          anyOf:
          - $ref: '#/components/schemas/TimeRange'
          - type: 'null'
      type: object
      required:
      - query_id
      - query
      title: QueryRequest
    TimeRange:
      properties:
        start:
          type: string
          title: Start
        end:
          type: string
          title: End
      type: object
      required:
      - start
      - end
      title: TimeRange
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
        input:
          title: Input
        ctx:
          type: object
          title: Context
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
