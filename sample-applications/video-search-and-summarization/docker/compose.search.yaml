# Backend services required for Video Search Application.
services:
    pipeline-manager:
        depends_on:
            vdms-vector-db:
                condition: service_started
            vdms-dataprep:
                condition: service_healthy
            multimodal-embedding-serving:
                condition: service_healthy
            video-search:
                condition: service_started
        environment:
            SEARCH_ENDPOINT: http://${VS_HOST:-video-search}:8000
            SEARCH_DATAPREP_ENDPOINT: http://${VDMS_DATAPREP_HOST:-vdms-dataprep}:8000
            SEARCH_FEATURE: "FEATURE_ON"

    video-search:
        image: ${REGISTRY:-}video-search:${TAG:-latest}
        build:
            context: ../search-ms
            dockerfile: docker/Dockerfile
        depends_on:
            vdms-vector-db:
                condition: service_started
            minio-service:
                condition: service_healthy
            vdms-dataprep:
                condition: service_started
            multimodal-embedding-serving:
                condition: service_healthy
        ipc: host
        ports:
            - '${VS_HOST_PORT:-7890}:8000'
        environment:
            no_proxy: ${no_proxy},multimodal-embedding-serving,vdms-dataprep,minio-service,vdms-vector-db,pipeline-manager,localhost
            no_proxy_env: ${no_proxy},multimodal-embedding-serving,vdms-dataprep,minio-service,vdms-vector-db,pipeline-manager,localhost
            http_proxy: ${http_proxy}
            https_proxy: ${https_proxy}
            VDMS_VDB_HOST: ${VDMS_VDB_HOST:-vdms-vector-db}
            VDMS_VDB_PORT: ${VDMS_VDB_HOST_PORT:-55555}
            EMBEDDINGS_ENDPOINT: http://${MULTIMODAL_EMBEDDING_HOST:-multimodal-embedding-serving}:8000/embeddings
            EMBEDDINGS_MODEL_NAME: ${EMBEDDING_MODEL_NAME}
            INDEX_NAME: ${VS_INDEX_NAME}
            WATCH_DIRECTORY: ${VS_WATCHER_DIR}
            DEBOUNCE_TIME: ${VS_DEBOUNCE_TIME:-10}
            DELETE_PROCESSED_FILES: ${VS_DELETE_PROCESSED_FILES:-false}
            VS_INITIAL_DUMP: ${VS_INITIAL_DUMP:-false}
            VIDEO_UPLOAD_ENDPOINT: http://pipeline-manager:3000
            WATCH_DIRECTORY_RECURSIVE: ${VS_WATCH_DIRECTORY_RECURSIVE:-false}
            # Frame-to-Video Aggregation Settings
            AGGREGATION_ENABLED: ${AGGREGATION_ENABLED:-true}
            AGGREGATION_SEGMENT_DURATION: ${AGGREGATION_SEGMENT_DURATION:-8}
            AGGREGATION_MIN_GAP: ${AGGREGATION_MIN_GAP:-0}
            AGGREGATION_MAX_RESULTS: ${AGGREGATION_MAX_RESULTS:-20}
            AGGREGATION_INITIAL_K: ${AGGREGATION_INITIAL_K:-1000}
            AGGREGATION_CONTEXT_SEEK_OFFSET_SECONDS: ${AGGREGATION_CONTEXT_SEEK_OFFSET_SECONDS:-0}
        restart: unless-stopped
        volumes:
            - '${VS_WATCHER_DIR:-/dev/null}:/tmp/watcher-dir'
        networks:
            - vs_network

    vdms-vector-db:
        image: intellabs/vdms:v2.12.0
        ipc: host
        environment:
            - OVERRIDE_db_root_path=/db
            - OVERRIDE_images_path=/db/images
            - OVERRIDE_descriptors_path=/db/descriptors
            - OVERRIDE_blobs_path=/db/blobs
            - OVERRIDE_pmgd_path=/db/graph
        ports:
            - '${VDMS_VDB_HOST_PORT:-55555}:55555'
        volumes:
            - vdms-db:/db
        networks:
            - vs_network

    vdms-dataprep:
        image: ${REGISTRY:-}vdms-dataprep:${TAG:-latest}
        hostname: vdms-dataprep
        environment:
            no_proxy: ${no_proxy},vdms-vector-db,multimodal-embedding-serving,minio-service,localhost
            http_proxy: ${http_proxy}
            https_proxy: ${https_proxy}
            # Basic app settings
            APP_HOST: ${VDMS_DATAPREP_HOST:-vdms-dataprep}

            # VDMS Vector Database settings
            VDMS_VDB_HOST: ${VDMS_VDB_HOST:-vdms-vector-db}
            VDMS_VDB_PORT: ${VDMS_VDB_HOST_PORT:-55555}

            # MinIO settings
            MINIO_ENDPOINT: ${MINIO_HOST:-minio-service}:${MINIO_PORT:-80}
            MINIO_ACCESS_KEY: ${MINIO_ROOT_USER}
            MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
            MINIO_SECURE: false
            DEFAULT_BUCKET_NAME: ${DEFAULT_BUCKET_NAME:-vdms-bucket}

            # Database settings
            DB_COLLECTION: ${VS_INDEX_NAME}

            # Embedding service settings
            MULTIMODAL_EMBEDDING_ENDPOINT: http://${MULTIMODAL_EMBEDDING_HOST:-multimodal-embedding-serving}:8000/embeddings
            MULTIMODAL_EMBEDDING_MODEL_NAME: ${EMBEDDING_MODEL_NAME} # Used for both SDK and API modes

            # Embedding processing mode settings (SDK vs API)
            EMBEDDING_PROCESSING_MODE: ${EMBEDDING_PROCESSING_MODE:-sdk}
            SDK_USE_OPENVINO: ${SDK_USE_OPENVINO:-true}
            EMBEDDING_DEVICE: ${DATAPREP_EMBEDDING_DEVICE:-CPU}
            OV_MODELS_DIR: ${OV_MODELS_DIR:-/app/ov_models}
            EMBEDDING_BATCH_SIZE: ${EMBEDDING_BATCH_SIZE:-32}
            MAX_PARALLEL_WORKERS: ${MAX_PARALLEL_WORKERS:-}
            OV_PERFORMANCE_MODE: ${OV_PERFORMANCE_MODE:-THROUGHPUT}
            SDK_VIDEO_SHM_MAX_BLOCKS: ${SDK_VIDEO_SHM_MAX_BLOCKS:-512}
            SDK_VIDEO_SHM_BLOCK_SIZE: ${SDK_VIDEO_SHM_BLOCK_SIZE:-6220800}
            SDK_VIDEO_EXTRACTION_BATCH_SIZE: ${SDK_VIDEO_EXTRACTION_BATCH_SIZE:-256}
            SDK_PIPELINE_QUEUE_MAXSIZE: ${SDK_PIPELINE_QUEUE_MAXSIZE:-16}
            SDK_PIPELINE_COMPLETION_QUEUE_MAXSIZE: ${SDK_PIPELINE_COMPLETION_QUEUE_MAXSIZE:-1}
            SDK_DETECTION_WORKER_THREADS: ${SDK_DETECTION_WORKER_THREADS:-2}
            SDK_EMBED_WORKER_THREADS: ${SDK_EMBED_WORKER_THREADS:-2}
            SDK_PIPELINE_QUEUE_GET_TIMEOUT_S: ${SDK_PIPELINE_QUEUE_GET_TIMEOUT_S:-1.0}
            SAVE_RUNTIME_PIPELINE_STATS: ${SAVE_RUNTIME_PIPELINE_STATS:-false}
            SDK_ENABLE_TRACING: ${SDK_ENABLE_TRACING:-false}
            VIDEO_FRAME_DECODER_WORKERS: ${VIDEO_FRAME_DECODER_WORKERS:-2}
            VIDEO_FRAME_LOG_LEVEL: ${VIDEO_FRAME_LOG_LEVEL:-INFO}

            # Frame processing settings
            FRAME_INTERVAL: ${FRAME_INTERVAL:-15}
            ENABLE_OBJECT_DETECTION: ${ENABLE_OBJECT_DETECTION:-true}
            DETECTION_CONFIDENCE: ${DETECTION_CONFIDENCE:-0.85}
            FRAMES_TEMP_DIR: ${FRAMES_TEMP_DIR:-/tmp/dataprep}

            # YOLOX model volume configuration for object detection
            DETECTION_MODEL_DIR: ${YOLOX_MODELS_MOUNT_PATH:-/app/models/yolox}
            DETECTION_DEVICE: ${DATAPREP_DETECTION_DEVICE:-CPU}

            # ROI consolidation settings
            # ROI_CONSOLIDATION_IOU_THRESHOLD: IoU threshold used to cluster ROIs (higher = stricter merging)
            # ROI_CONSOLIDATION_CLASS_AWARE: only merge ROIs with matching class labels when true
            # ROI_CONSOLIDATION_CONTEXT_SCALE: expands merged ROI by a fraction of its size
            ROI_CONSOLIDATION_ENABLED: ${ROI_CONSOLIDATION_ENABLED:-false}
            ROI_CONSOLIDATION_IOU_THRESHOLD: ${ROI_CONSOLIDATION_IOU_THRESHOLD:-0.2}
            ROI_CONSOLIDATION_CLASS_AWARE: ${ROI_CONSOLIDATION_CLASS_AWARE:-false}
            ROI_CONSOLIDATION_CONTEXT_SCALE: ${ROI_CONSOLIDATION_CONTEXT_SCALE:-0.2}
            
            # Application configuration
            LOG_LEVEL: ${VDMS_DATAPREP_LOG_LEVEL:-INFO}

            # CORS settings
            ALLOW_ORIGINS: ${ALLOW_ORIGINS:-*}
            ALLOW_METHODS: ${ALLOW_METHODS:-*}
            ALLOW_HEADERS: ${ALLOW_HEADERS:-*}
        ulimits:
            nofile:
                soft: 32768
                hard: 65535
        ipc: host
        ports:
            - '${VDMS_DATAPREP_HOST_PORT:-6016}:8000'
        depends_on:
            vdms-vector-db:
                condition: service_started
            multimodal-embedding-serving:
                condition: service_healthy
            minio-service:
                condition: service_healthy
        healthcheck:
            test:
                [
                    'CMD',
                    'python',
                    '-c',
                    "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/v1/dataprep/health').getcode()==200 else 1)",
                ]
            interval: 10s
            timeout: 10s
            retries: 40
            start_period: 5s
        volumes:
            - '${YOLOX_MODELS_VOLUME_NAME:-vdms-yolox-models}:${YOLOX_MODELS_MOUNT_PATH:-/app/models/yolox}'
            - data-prep:/tmp/dataprep
            - ov-models:/home/appuser/.cache/huggingface # Share embedding models for SDK mode
            - ov-models:${OV_MODELS_DIR:-/app/ov_models} # OpenVINO models directory for SDK mode
        devices:
            - ${DRI_MOUNT_PATH:-/dev/null}:/dev/dri
            - ${ACCEL_MOUNT_PATH:-/dev/null}:/dev/accel/accel0
        group_add:
            - ${USER_GROUP_ID:-1000}
            - ${VIDEO_GROUP_ID:-44}
            - ${RENDER_GROUP_ID:-1002}
        networks:
            - vs_network

    multimodal-embedding-serving:
        image: ${REGISTRY:-}multimodal-embedding-serving:${TAG:-latest}
        container_name: multimodal-embedding-serving
        ports:
            - '${EMBEDDING_SERVER_PORT:-9777}:8000'
        ipc: host
        environment:
            no_proxy: ${no_proxy},minio-service,vdms-dataprep,localhost
            no_proxy_env: ${no_proxy},minio-service,vdms-dataprep,localhost
            http_proxy: ${http_proxy}
            https_proxy: ${https_proxy}
            EMBEDDING_MODEL_NAME: ${EMBEDDING_MODEL_NAME}
            EMBEDDING_DEVICE: ${MME_EMBEDDING_DEVICE:-CPU}
            EMBEDDING_USE_OV: ${EMBEDDING_USE_OV}
            EMBEDDING_OV_MODELS_DIR: ${EMBEDDING_OV_MODELS_DIR:-/app/ov_models}
            DEFAULT_START_OFFSET_SEC: ${DEFAULT_START_OFFSET_SEC:-0}
            DEFAULT_CLIP_DURATION: ${DEFAULT_CLIP_DURATION:--1}
            DEFAULT_NUM_FRAMES: ${DEFAULT_NUM_FRAMES:-64}
            OV_PERFORMANCE_MODE: ${OV_PERFORMANCE_MODE:-THROUGHPUT}
            INFER_BATCH_SIZE: ${INFER_BATCH_SIZE:-32}
            PREPROCESS_WORKERS: ${PREPROCESS_WORKERS:-8}
            VIDEO_FRAME_BATCH_SIZE: ${VIDEO_FRAME_BATCH_SIZE:-64}
            VIDEO_FRAME_DECODER_WORKERS: ${VIDEO_FRAME_DECODER_WORKERS:-2}
            VIDEO_FRAME_QUEUE_SIZE: ${VIDEO_FRAME_QUEUE_SIZE:-32}
            VIDEO_FRAME_SHM_POOL_BLOCK_SIZE: ${VIDEO_FRAME_SHM_POOL_BLOCK_SIZE:-6220800}
            VIDEO_FRAME_SHM_POOL_BLOCKS_MULTIPLIER: ${VIDEO_FRAME_SHM_POOL_BLOCKS_MULTIPLIER:-2}
            VIDEO_FRAME_LOG_LEVEL: ${VIDEO_FRAME_LOG_LEVEL:-INFO}
        devices:
            - ${DRI_MOUNT_PATH:-/dev/null}:/dev/dri
            - ${ACCEL_MOUNT_PATH:-/dev/null}:/dev/accel/accel0
        group_add:
            - ${USER_GROUP_ID:-1000}
            - ${VIDEO_GROUP_ID:-44}
            - ${RENDER_GROUP_ID:-1002}
        restart: unless-stopped
        healthcheck:
            test:
                [
                    'CMD',
                    'python',
                    '-c',
                    "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health').getcode()==200 else 1)",
                ]
            interval: 10s
            timeout: 10s
            retries: 40
            start_period: 5s
        networks:
            - vs_network
        volumes:
            - ov-models:/home/appuser/.cache/huggingface
            - data-prep:/tmp/dataprep
            - ov-models:${EMBEDDING_OV_MODELS_DIR:-/app/ov_models}

volumes:
    vdms-db:
        driver: local
    ov-models:
        driver: local
    data-prep:
        driver: local
    vdms-yolox-models:
        driver: local
