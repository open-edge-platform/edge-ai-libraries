services:
  mcp-server:
    build:
      context: ../mcp
      dockerfile: Dockerfile
    image: ${REGISTRY:-}vss-mcp-server:${TAG:-latest}
    container_name: vss-mcp-server
    profiles:
      - mcp
    expose:
      - "8000"
    environment:
      - HOST_IP=${HOST_IP:-}
      - VSS_IP=${VSS_IP:-}
      - APP_HOST_PORT=${APP_HOST_PORT:-12345}
      - MCP_HOST=0.0.0.0
      # Fixed to match the nginx upstream (mcp-server:8000) and route (/mcp).
      - MCP_PORT=8000
      - MCP_PATH=/mcp
      - LOG_LEVEL=${MCP_LOG_LEVEL:-INFO}
      # Optional tuning; passed through only when set. See mcp/README.md.
      - MCP_STATELESS_HTTP
      - REQUEST_TIMEOUT
      - POLL_INTERVAL
      - DEFAULT_WAIT_SECONDS
      - VSS_INDEX_STRATEGY
      - http_proxy=${http_proxy:-}
      - https_proxy=${https_proxy:-}
      - no_proxy=${no_proxy:-},${HOST_IP:-},${VSS_IP}
      - HTTP_PROXY=${http_proxy:-}
      - HTTPS_PROXY=${https_proxy:-}
      - NO_PROXY=${no_proxy:-},${HOST_IP:-},${VSS_IP}
    # The server probes /manager/app/features through the nginx gateway once at
    # startup and exits if VSS is unreachable, so start it only once Pipeline
    # Manager is healthy.
    depends_on:
      pipeline-manager:
        condition: service_healthy
      nginx:
        condition: service_started
    networks:
      - vs_network
    restart: unless-stopped
