[project]
name = "mcp-app"
version = "0.3.0"
description = "MCP tool surface for Video Search and Summarization"
readme = "README.md"
authors = []
requires-python = ">=3.10,<3.14"
dependencies = [
    "fastmcp>=4.1.6,<5.0.0",
    "httpx>=0.28.1,<1.0.0",
    "pydantic>=2.14.2,<3.0.0",
]

[project.scripts]
mcp-app = "src.main:main"

[dependency-groups]
dev = [
    "pytest>=9.2.0,<10.0.0",
]

[tool.poetry]
packages = [{include = "src"}]

[build-system]
requires = ["poetry-core>=2.5.0"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
