[project]
name = "vss-mcp-server"
version = "0.1.0"
description = "MCP server for the Video Search and Summarization backend"
readme = "README.md"
requires-python = ">=3.10,<3.14"
dependencies = [
    "httpx==0.28.1",
    "mcp[cli]<2.0",
]

[project.scripts]
vss-mcp = "vss_mcp.main:main"

[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vss_mcp"]
