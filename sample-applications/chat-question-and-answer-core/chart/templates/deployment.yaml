{{- include "chatqna-core.validateGpuSettings" . }}

apiVersion: apps/v1
kind: Deployment
metadata:
  name: chatqna-core
spec:
  replicas: 1
  selector:
    matchLabels:
      app: chatqna-core
  template:
    metadata:
      labels:
        app: chatqna-core
    spec:
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        {{- with .Values.chatqna.supplementalGroups }}
        supplementalGroups:
{{ toYaml . | indent 10 }}
        {{- end }}
      containers:
        - name: chatqna-core
          {{- if eq (.Values.global.MODEL_RUNTIME | lower) "ollama" }}
          image: "{{ .Values.image.registry }}chatqna:{{ .Values.image.tags.ollama }}"
          {{- else }}
          image: "{{ .Values.image.registry }}chatqna:{{ .Values.image.tags.openvino }}"
          {{- end }}
          imagePullPolicy: "{{ .Values.image.pullPolicy }}"
          securityContext:
            privileged: false
          readinessProbe:
            httpGet:
              path: {{ .Values.chatqna.readinessProbe.httpGet.path }}
              port: {{ .Values.chatqna.readinessProbe.httpGet.port }}
            initialDelaySeconds: {{ .Values.chatqna.readinessProbe.initialDelaySeconds }}
            periodSeconds: {{ .Values.chatqna.readinessProbe.periodSeconds }}
          env:
            - name: http_proxy
              value: "{{ .Values.global.http_proxy }}"
            - name: https_proxy
              value: "{{ .Values.global.https_proxy }}"
            - name: no_proxy
              value: "{{ .Values.global.no_proxy }},127.0.0.1"
            {{- if eq (.Values.global.MODEL_RUNTIME | lower) "openvino" }}
            - name: HF_ACCESS_TOKEN
              value: "{{ .Values.global.huggingface.apiToken }}"
            {{- end }}
          {{- if or .Values.gpu.enabled .Values.npu.enabled }}
          resources:
            requests:
              {{- if .Values.gpu.enabled }}
              {{ .Values.gpu.key }}: 1
              {{- end }}
              {{- if .Values.npu.enabled }}
              {{ .Values.npu.key }}: 1
              {{- end }}
            limits:
              {{- if .Values.gpu.enabled }}
              {{ .Values.gpu.key }}: 1
              {{- end }}
              {{- if .Values.npu.enabled }}
              {{ .Values.npu.key }}: 1
              {{- end }}
          {{- end }}
          ports:
            - containerPort: 8888
          volumeMounts:
            - name: model-cache
              mountPath: "{{ .Values.global.model_cache_path }}"
            {{- if .Values.configmap.enabled }}
            - name: model-config
              mountPath: /tmp/model_config/config.yaml
              subPath: config.yaml
            {{- end }}
            {{- if .Values.gpu.enabled }}
            - name: dri-device
              mountPath: /dev/dri
            {{- end }}
            {{- if .Values.npu.enabled }}
            - name: accel-device
              mountPath: /dev/accel
            {{- end }}
      volumes:
        - name: model-cache
          persistentVolumeClaim:
            claimName: chatqna-pvc
        {{- if .Values.configmap.enabled }}
        - name: model-config
          configMap:
            name: model-config
        {{- end}}
      {{- if .Values.gpu.enabled }}
        - name: dri-device
          hostPath:
            path: /dev/dri
            type: Directory
      {{- end }}
      {{- if .Values.npu.enabled }}
        - name: accel-device
          hostPath:
            path: /dev/accel
            type: Directory
      {{- end }}