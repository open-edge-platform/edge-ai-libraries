x-nginx-common: &nginx-common
  image: nginxinc/nginx-unprivileged:1.29.8
  container_name: chatqna-core-nginx
  ports:
    - "${HOST_IP:-127.0.0.1}:8102:8102"
  volumes:
    - ../nginx_config/nginx.conf:/etc/nginx/nginx.conf:ro

x-chatqna-core-common: &chatqna-core-common
  image: ${REGISTRY:-}chatqna:${BACKEND_TAG:-latest}
  build:
    context: ../
    dockerfile: docker/Dockerfile
  environment:
    http_proxy: ${http_proxy}
    https_proxy: ${https_proxy}
    no_proxy: ${no_proxy}
    HF_ACCESS_TOKEN: ${HF_ACCESS_TOKEN}
  expose:
    - "8888"
  # The API starts listening only after the models are downloaded, converted and loaded,
  # which can take several minutes on the first run. nginx waits for this check to pass
  # (see depends_on below), so clients never get 502 Bad Gateway from a half-started backend.
  healthcheck:
    test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8888/health"]
    interval: 10s
    timeout: 5s
    retries: 5
    # Failures during start_period do not count; allow a slow first-run download/conversion.
    start_period: 30m
  volumes:
    - "${MODEL_CACHE_PATH}:/tmp/model_cache"
    - "${MODEL_CONFIG_PATH:-/dev/null}:/tmp/model_config/config.yaml"
  group_add:
    - ${USER_GROUP_ID-1000}
    # render group ID for ubuntu 20.04 host OS
    - "109"
    # render group ID for ubuntu 22.04 host OS
    - "110"
    # render group ID for ubuntu 24.04 host OS
    - "992"
    # render group ID for ubuntu 26.04 host OS
    - "990"

services:
  nginx-openvino:
    <<: *nginx-common
    profiles:
      - OPENVINO
    depends_on:
      chatqna-core-openvino:
        condition: service_healthy
      chatqna-core-ui:
        condition: service_started

  nginx-ollama:
    <<: *nginx-common
    profiles:
      - OLLAMA
    depends_on:
      chatqna-core-ollama:
        condition: service_healthy
      chatqna-core-ui:
        condition: service_started

  chatqna-core-openvino:
    <<: *chatqna-core-common
    profiles:
      - OPENVINO
    container_name: chatqna-core-openvino
    build:
      context: ../
      dockerfile: docker/Dockerfile
    devices:
      - /dev/dri:/dev/dri
      - "${NPU_DEVICE_PATH:-/dev/null}:${NPU_DEVICE_PATH:-/dev/null}"

  chatqna-core-ollama:
    <<: *chatqna-core-common
    profiles:
      - OLLAMA
    container_name: chatqna-core-ollama
    build:
      context: ../
      dockerfile: docker/Dockerfile.ollama
    environment:
      http_proxy: ${http_proxy}
      https_proxy: ${https_proxy}
      no_proxy: ${no_proxy},127.0.0.1

  chatqna-core-ui:
    image: ${REGISTRY:-}chatqna-ui:${UI_TAG:-latest}
    container_name: chatqna-core-ui
    build:
      context: ../ui/
      dockerfile: Dockerfile
    environment:
      http_proxy: ${http_proxy}
      https_proxy: ${https_proxy}
      no_proxy: ${no_proxy}
      APP_BACKEND_URL: ${APP_BACKEND_URL}
    expose:
      - "8102"

networks:
  default:
    driver: bridge
