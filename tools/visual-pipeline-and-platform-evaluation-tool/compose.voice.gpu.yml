services:
  audio-analyzer:
    devices:
      - "/dev/dri:/dev/dri"
    group_add:
      - "${RENDER_GROUP_ID:?Set RENDER_GROUP_ID to the host render group ID}"
    environment:
      AUDIO_ANALYZER__MODELS__ASR__DEVICE: ${VOICE_ASR_DEVICE:-GPU}

  text-to-speech:
    devices:
      - "/dev/dri:/dev/dri"
    group_add:
      - "${RENDER_GROUP_ID:?Set RENDER_GROUP_ID to the host render group ID}"
    environment:
      TEXT_TO_SPEECH__MODELS__TTS__DEVICE: ${VOICE_TTS_DEVICE:-GPU}
      TEXT_TO_SPEECH__MODELS__TTS__DTYPE: ${VOICE_TTS_DTYPE:-fp16}
