# SPDX-License-Identifier: Apache-2.0
name: yolov8n
display_name: YOLO v8n 640x640
description: "YOLOv8 nano real-time object detector that localizes and classifies objects across the 80 COCO categories (people, vehicles, animals, and common everyday items)."
source: public
hub: ultralytics
type: object_detection
precisions:
  - precision: INT8
    model_path: ultralytics/public/yolov8n/INT8/yolov8n.xml
    model_proc: ""
  - precision: FP16
    model_path: ultralytics/public/yolov8n/FP16/yolov8n.xml
    model_proc: ""
  - precision: FP32
    model_path: ultralytics/public/yolov8n/FP32/yolov8n.xml
    model_proc: ""
extra_model_procs: []
unsupported_devices: ""
download_request:
  hub: ultralytics
  name: yolov8n
  config:
    quantize: coco128
