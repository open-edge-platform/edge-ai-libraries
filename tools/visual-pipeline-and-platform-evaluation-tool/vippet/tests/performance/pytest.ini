[pytest]
addopts = -r fEsxX
pythonpath = ../functional
markers =
    perf: All performance benchmark tests
    perf_quick: Quick subset (CPU+GPU, 1 and 3 streams)
    perf_full: Full coverage (all variants, 1/3/5/10 streams)
log_level = INFO
log_format = %(asctime)s %(levelname)s %(name)s: %(message)s
log_date_format = %Y-%m-%d %H:%M:%S
