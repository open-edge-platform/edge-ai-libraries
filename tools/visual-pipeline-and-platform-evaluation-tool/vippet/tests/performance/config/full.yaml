# VIPPET Benchmark Suite - Full Configuration
# Comprehensive benchmark with maximum coverage

vippet:
  base_url: "http://localhost/api/v1"
  timeout: 600
  readiness_timeout_seconds: 60
  poll_interval: 2
  max_job_duration: 600

benchmark:
  # Test all available pipelines
  pipelines: "*"

  # Test all device variants
  variants:
    - cpu
    - gpu
    - npu

  # Test multiple stream counts for scalability analysis
  stream_counts:
    - 1
    - 3
    - 5
    - 10

  execution:
    max_retries: 2
    retry_delay_seconds: 5
    output_mode: "disabled"

  filters:
    skip_pipelines: []
    skip_variants: []
    skip_missing_models: true
    on_unknown_id: "fail"

# Hardware metrics collection
metrics:
  metrics_url: "http://localhost/metrics/stream"
  sample_interval_seconds: 2.0

  # Fraction of time-ordered HW samples trimmed from each end before
  # averaging, to discard warm-up/wind-down outliers (same as VIPPET's
  # built-in benchmark). 0.1 = trim 10% off each end.
  trim_fraction: 0.1

results:
  output_dir: "./results"
  formats:
    - json
    - csv
  create_latest_link: true
