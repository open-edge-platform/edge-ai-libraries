# VIPPET Benchmark Suite - Quick Configuration
# Faster benchmark with reduced coverage for quick validation

vippet:
  base_url: "http://localhost/api/v1"
  timeout: 300
  readiness_timeout_seconds: 60
  poll_interval: 2
  max_job_duration: 300

benchmark:
  pipelines: "*"

  variants:
    - cpu
    - gpu

  # Single stream only for quick validation
  stream_counts:
    - 1

  execution:
    max_retries: 1
    retry_delay_seconds: 3
    output_mode: "disabled"
    max_runtime: 10

  filters:
    skip_pipelines: []
    skip_variants: []
    skip_missing_models: true
    on_unknown_id: "fail"

# Hardware metrics collection
metrics:
  # Metrics endpoint via nginx proxy; defaults to the same host/port as
  # vippet.base_url. Override with VIPPET_METRICS_URL env var, or uncomment
  # and set this explicitly for non-standard topologies.
  # metrics_url: "http://localhost/metrics/stream"
  sample_interval_seconds: 2.0

  # Fraction of time-ordered HW samples trimmed from each end before
  # averaging, to discard warm-up/wind-down outliers (same as VIPPET's
  # built-in benchmark). 0.1 = trim 10% off each end.
  trim_fraction: 0.1

results:
  formats:
    - json
  create_latest_link: true
