# VIPPET Benchmark Suite - Quick Configuration
# Faster benchmark with reduced coverage for quick validation

vippet:
  base_url: "http://localhost:7860/api/v1"
  timeout: 300
  poll_interval: 2
  max_job_duration: 300

benchmark:
  pipelines: "*"

  variants:
    - cpu
    - gpu

  # Only test 1 and 3 streams (skip 5, 10)
  stream_counts:
    - 1
    - 3

  execution:
    max_retries: 1
    retry_delay_seconds: 3
    output_mode: "disabled"

  filters:
    skip_pipelines: []
    skip_variants: []
    require_models: true

results:
  output_dir: "./results"
  formats:
    - json
  create_latest_link: true
