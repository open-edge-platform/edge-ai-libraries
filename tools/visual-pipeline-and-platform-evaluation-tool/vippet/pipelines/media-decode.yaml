name: Media Decode
definition: >
  Media-only decode workload with no inference. The CPU variant decodes with
  software avdec_h264, the GPU variant decodes on the GPU media engine (VDBox)
  through decodebin3. Run both together in a staged density test to find the
  maximum VDBox streams first and then the CPU streams that still fit, with
  CPU streams pinned to selected cores.
tags:
  - Media
thumbnail: images/simple-nvr.png
type: vision
variants:
  - name: CPU
    pipeline_description: >-
      filesrc location=/videos/input/people.mp4 !
      parsebin !
      avdec_h264 !
      queue !
      gvafpscounter starting-frame=100 !
      fakesink name=default_output_sink sync=false async=false
  - name: GPU
    pipeline_description: >-
      filesrc location=/videos/input/people.mp4 !
      decodebin3 !
      video/x-raw(memory:VAMemory) !
      queue !
      gvafpscounter starting-frame=100 !
      fakesink name=default_output_sink sync=false async=false
