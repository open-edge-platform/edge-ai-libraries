name: Retail - YOLO 11n Full [CPU]
version: 1
definition: >
  The Retail Pipeline using YOLO 11n for object detection is designed for retail analytics applications.
  It detects various retail-related objects, making it suitable for inventory management, customer behavior analysis, and other retail use cases.
pipeline_description: "filesrc location=/videos/input/obj_classification-1920-15-bench.mp4 ! qtdemux ! h264parse  ! decodebin3 ! queue ! gvafpscounter starting-frame=100 ! gvadetect model-instance-id=odmodel-cpu  model=/models/output/public/yolo11n/FP16/yolo11n.xml threshold=.5 device=CPU ! queue ! gvatrack tracking-type=zero-term-imageless ! gvaclassify model-instance-id=clasifier-cpu labels=/home/dlstreamer/dlstreamer/samples/labels/imagenet_2012.txt model=pipeline-zoo-models/efficientnet-b0_INT8/FP16-INT8/efficientnet-b0.xml model-proc=pipeline-zoo-models/efficientnet-b0_INT8/efficientnet-b0.json reclassify-interval=1 device=CPU inference-region=roi-list ! queue ! gvapython class=ObjectFilter module=/scripts/tracked_object_filter.py  ! queue ! gvadetect model-instance-id=ocr-cpu threshold=.40 model=pipeline-zoo-models/horizontal-text-detection-0002/FP16-INT8/horizontal-text-detection-0002.xml model-proc=pipeline-zoo-models/horizontal-text-detection-0002/horizontal-text-detection-0002.json device=CPU inference-region=roi-list ! queue ! gvainference model-instance-id=ocr2-cpu device=CPU model=pipeline-zoo-models/text-recognition-0012-mod/FP16-INT8/text-recognition-0012-mod.xml model-proc=pipeline-zoo-models/text-recognition-0012-mod/text-recognition-0012-mod.json inference-region=roi-list object-class=text ! queue ! gvapython class=OCR module=/scripts/OCR_post_processing_0012.py ! queue ! gvapython class=BarcodeDetection module=/scripts/barcode_nv12_to_gray.py ! gvametaconvert add-empty-results=true ! queue ! gvametapublish file-format=2 file-path=/dev/null ! fpsdisplaysink video-sink=fakesink sync=true"


