services:
  vippet:
    environment:
      AUDIO_ANALYZER_URL: http://audio-analyzer:8010
      TEXT_TO_SPEECH_URL: http://text-to-speech:8011

  audio-analyzer:
    image: ${AUDIO_ANALYZER_IMAGE:-docker.io/intel/audio-analyzer:${AUDIO_ANALYZER_TAG:-2026.1.0}}
    container_name: audio-analyzer
    ports:
      - "8010:8010"
    build:
      context: ../../microservices/audio-analyzer
      args:
        http_proxy:
        https_proxy:
        no_proxy:
    user: "1000:1000"
    init: true
    restart: unless-stopped
    cap_drop: [ ALL ]
    security_opt: [ "no-new-privileges:true" ]
    environment:
      AUDIO_ANALYZER_SERVER_PORT: "8010"
      AUDIO_ANALYZER__MODELS__ASR__PROVIDER: openvino
      AUDIO_ANALYZER__MODELS__ASR__NAME: whisper-base
      AUDIO_ANALYZER__MODELS__ASR__DEVICE: ${VOICE_ASR_DEVICE:-CPU}
      AUDIO_ANALYZER__MODELS__ASR__DIARIZATION: "false"
      AUDIO_ANALYZER__MODELS__ASR__HALLUCINATION_PHRASE_FILTER: "false"
      AUDIO_ANALYZER__SENTIMENT__ENABLED: "false"
      AUDIO_ANALYZER__AUDIO_UTIL__MAX_SIZE_MB: "10"
      AUDIO_ANALYZER__AUDIO_UTIL__ALLOWED_EXTENSIONS: '[".wav"]'
      AUDIO_ANALYZER__AUDIO_UTIL__CHUNK_SIZE: "1048576"
      AUDIO_ANALYZER__APP__CLEAR_STORAGE_ON_STARTUP: "true"
      HF_HOME: /app/audio_analyzer/.cache/huggingface
      http_proxy: ${http_proxy:-}
      https_proxy: ${https_proxy:-}
      no_proxy: "${no_proxy:+${no_proxy},}localhost,127.0.0.1,vippet,audio-analyzer,text-to-speech"
    volumes:
      - voice_asr_models:/app/audio_analyzer/models
      - voice_asr_cache:/app/audio_analyzer/.cache
      - voice_asr_chunks:/app/audio_analyzer/chunks
      - voice_asr_storage:/app/audio_analyzer/storage
    healthcheck:
      test: [ "CMD", "python3", "-c", "import urllib.request; urllib.request.build_opener(urllib.request.ProxyHandler({})).open('http://127.0.0.1:8010/health', timeout=5).read()" ]
      interval: 15s
      timeout: 10s
      start_period: 15m
      retries: 5

  text-to-speech:
    image: ${TEXT_TO_SPEECH_IMAGE:-docker.io/intel/text-to-speech:${TEXT_TO_SPEECH_TAG:-2026.1.0}}
    container_name: text-to-speech
    ports:
      - "8011:8011"
    build:
      context: ../../microservices/text-to-speech
      args:
        http_proxy:
        https_proxy:
        no_proxy:
    user: "1000:1000"
    init: true
    restart: unless-stopped
    cap_drop: [ ALL ]
    security_opt: [ "no-new-privileges:true" ]
    environment:
      TEXT_TO_SPEECH__MODELS__TTS__NAME: microsoft/speecht5_tts
      TEXT_TO_SPEECH__MODELS__TTS__RUNTIME: openvino
      TEXT_TO_SPEECH__MODELS__TTS__DEVICE: CPU
      TEXT_TO_SPEECH__MODELS__TTS__DTYPE: int8
      TEXT_TO_SPEECH__MODELS__TTS__MODEL_VARIANT: default
      TEXT_TO_SPEECH__MODELS__TTS__DEFAULT_SPEAKER: Ryan
      TEXT_TO_SPEECH__MODELS__TTS__DEFAULT_LANGUAGE: English
      TEXT_TO_SPEECH__PIPELINE__PERSIST_OUTPUTS: "false"
      HF_HOME: /app/text-to-speech/.cache/huggingface
      http_proxy: ${http_proxy:-}
      https_proxy: ${https_proxy:-}
      no_proxy: "${no_proxy:+${no_proxy},}localhost,127.0.0.1,vippet,audio-analyzer,text-to-speech"
    volumes:
      - voice_tts_models:/app/text-to-speech/models
      - voice_tts_cache:/app/text-to-speech/.cache
      - voice_tts_storage:/app/text-to-speech/storage
    healthcheck:
      test: [ "CMD", "python3", "-c", "import urllib.request; urllib.request.build_opener(urllib.request.ProxyHandler({})).open('http://127.0.0.1:8011/health', timeout=5).read()" ]
      interval: 15s
      timeout: 10s
      start_period: 15m
      retries: 5

volumes:
  voice_asr_models:
  voice_asr_cache:
  voice_asr_chunks:
  voice_asr_storage:
  voice_tts_models:
  voice_tts_cache:
  voice_tts_storage:
