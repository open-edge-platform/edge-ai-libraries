# SPDX-License-Identifier: Apache-2.0
#
# Mosquitto configuration for the optional MQTT overlay (compose.mqtt.yml).
#
# This broker exists so pipelines using `gvametapublish method=mqtt` have a
# destination during local evaluation. It accepts unauthenticated clients, so
# compose.mqtt.yml publishes it on the loopback interface only. Do not expose
# it to an untrusted network or reuse this configuration in production.

listener 1883
allow_anonymous true

# Metadata is a live stream; nothing needs to survive a broker restart.
persistence false

log_dest stdout
log_type error
log_type warning
log_type notice
