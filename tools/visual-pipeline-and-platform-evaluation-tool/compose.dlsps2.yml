# Optional overlay: runs a DLSPS 2.0 (dlstreamer-pipeline-server) instance
# alongside VIPPET and points VIPPET's pipeline execution at it instead of the
# local gst_runner.py subprocess: validation, performance and density tests
# (one DLSPS 2.0 instance per stream), the TS conversion of videos and the
# lookup of GStreamer elements. Tests with latency metrics still use the local
# runner unless DLSPS2_LATENCY=true (see below). See vippet/dlsps2_runner.py for
# what is and is not supported.
#
# Usage: make build run DLSPS2=1
#   (or: docker compose -f compose.yml -f compose.$COMPOSE_PROFILES.yml -f compose.dlsps2.yml up -d)
#
# By default the server image is built from source (dlsps2/ in this repository).
# To use a published image instead, set DLSPS2_IMAGE, e.g.
#   DLSPS2_IMAGE=intel/dlstreamer-pipeline-server:2026.3.0-20261027-weekly-ubuntu24-2.0
# `make build` then skips the server and `make run` pulls the image.
#
# ./shared/videos and ./shared/models are mounted at the SAME container
# paths as the vippet service (see compose.yml's AUTO_VIDEO_DIR/
# UPLOADED_VIDEO_DIR/MODELS_PATH env vars), so pipeline strings built by
# VIPPET — which embed absolute paths like /videos/input/... and
# /models/output/... — resolve to the same files inside the
# dlstreamer-pipeline-server container.
services:
  # One-shot: copies the custom GStreamer elements shipped in the vippet image
  # (vippet/gst_plugins/) into ./shared/gst-plugins, which the server loads. The
  # copy always matches the vippet image in use, also for published images, and
  # replaces the folder's contents so removed elements do not linger. It uses
  # the image vippet builds or `make run-prebuilt` pulls, so it is never pulled.
  vippet-plugins:
    image: docker.io/intel/vippet-app:${DOCKER_TAG}
    pull_policy: never
    container_name: vippet-plugins
    restart: "no"
    network_mode: none
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        find /plugins -mindepth 1 -delete &&
        cp -R /home/dlstreamer/vippet/gst_plugins/. /plugins/ &&
        find /plugins -name __pycache__ -type d -prune -exec rm -rf {} +
    volumes:
      - ./shared/gst-plugins/:/plugins

  dlstreamer-pipeline-server:
    # Same devices/groups/profile as vippet for the active device profile.
    extends:
      file: compose.${COMPOSE_PROFILES}.yml
      service: vippet
    image: ${DLSPS2_IMAGE:-dlstreamer-pipeline-server:2.0-local}
    hostname: dlstreamer-pipeline-server
    container_name: dlstreamer-pipeline-server
    build:
      context: ../../microservices/dlstreamer-pipeline-server/dlsps2
      dockerfile: docker/Dockerfile
      pull: true
      args:
        # Keep in sync with vippet/Dockerfile so both backends run the same DLStreamer.
        BASE_IMAGE: ${DLSPS2_BASE_IMAGE:-${DLSTREAMER_IMAGE:-intel/dlstreamer:latest}}
        UID: ${DLSPS2_UID:-1000}
        USER: ${DLSPS2_USER:-pipeline-server}
        http_proxy:
        https_proxy:
        no_proxy:
    restart: on-failure:5
    user: "1000:1000"
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/pipelines/status', timeout=5)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    ports:
      - "${DLSPS2_REST_SERVER_PORT:-8081}:8080"
    environment:
      REST_SERVER_PORT: 8080
      APP_LOG_LEVEL: ${APP_LOG_LEVEL:-INFO}
      WEB_SERVER_LOG_LEVEL: ${WEB_SERVER_LOG_LEVEL:-WARNING}
      GST_DEBUG: "1"
      # Custom Python elements shipped with VIPPET (vippet/gst_plugins/python/),
      # copied by vippet-plugins; the server's run.sh appends this to GST_PLUGIN_PATH.
      ADDITIONAL_GST_PLUGIN_PATH: /opt/vippet/gst_plugins
      # The server's own per-instance metrics (OTLP/JSON into metrics-manager), off by
      # default. VIPPET reads the latency and VLM series of its own instances from
      # metrics-manager; its live "fps" metric is still pushed by vippet.
      ENABLE_OPEN_TELEMETRY: ${DLSPS2_OTEL:-false}
      # Tracers are process-wide, so latency is measured for every pipeline once set.
      # Latency metrics need DLSPS2_OTEL=true, DLSPS2_LATENCY=true and
      # DLSPS2_GST_TRACERS=latency_tracer(flags=pipeline,interval=1000,post-metrics=true)
      GST_TRACERS: ${DLSPS2_GST_TRACERS:-}
      OTEL_COLLECTOR_HOST: metrics-manager
      OTEL_COLLECTOR_PORT: "9090"
      OTEL_COLLECTOR_PATH: /api/v1/metrics/otlp
      OTEL_EXPORTER_OTLP_PROTOCOL: http/json
      OTEL_EXPORT_INTERVAL_MILLIS: ${DLSPS2_OTEL_INTERVAL_MS:-10000}
      http_proxy: ${http_proxy}
      https_proxy: ${https_proxy}
      no_proxy: "${no_proxy:+${no_proxy},}localhost,127.0.0.1,vippet,mediamtx,metrics-manager"
      HTTP_PROXY: ${http_proxy}
      HTTPS_PROXY: ${https_proxy}
      NO_PROXY: "${no_proxy:+${no_proxy},}localhost,127.0.0.1,vippet,mediamtx,metrics-manager"
    tmpfs:
      - /tmp
      - /var/tmp
    volumes:
      - ./shared/videos/:/videos
      - ./shared/models/:/models
      - ./shared/images/:/images
      - ./shared/metadata/:/metadata
      - ./shared/gst-plugins/:/opt/vippet/gst_plugins:ro
    depends_on:
      vippet-plugins:
        condition: service_completed_successfully

  # Point VIPPET's pipeline execution at the dlstreamer-pipeline-server
  # service above instead of local gst_runner.py.
  vippet:
    depends_on:
      dlstreamer-pipeline-server:
        condition: service_healthy
    environment:
      VIPPET_EXECUTION_BACKEND: dlsps2
      DLSPS2_BASE_URL: http://dlstreamer-pipeline-server:8080
      DLSPS2_VERIFY_TLS: "false"
      # Run tests with latency metrics on the server too. Off by default, so they
      # keep the local runner; vippet also checks DLSPS2_OTEL and DLSPS2_GST_TRACERS.
      DLSPS2_LATENCY: ${DLSPS2_LATENCY:-false}
      DLSPS2_OTEL: ${DLSPS2_OTEL:-false}
      DLSPS2_GST_TRACERS: ${DLSPS2_GST_TRACERS:-}
      # How long vippet waits for the server's final export after a run.
      DLSPS2_OTEL_INTERVAL_MS: ${DLSPS2_OTEL_INTERVAL_MS:-10000}
      no_proxy: "${no_proxy:+${no_proxy},}mediamtx,metrics-manager,model-download,dlstreamer-pipeline-server"
