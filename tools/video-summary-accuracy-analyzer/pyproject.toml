[tool.poetry]
name = "video-accuracy-evaluation"
version = "0.1"
description = "A sample evaluation tool designed to measure the accuracy of video summary outputs generated by multimodal LLM-based video summarization applications. It provides metrics and insights to assess the quality and relevance of generated summaries against reference content."
authors = []
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.12"
beautifulsoup4 = "4.15.0"
bert-score = "^0.3.13"
fastapi = { version = ">=0.138,<1", extras = ["standard"] }
markdown = "3.10.2"
python-multipart = ">=0.0.32"
pydantic-settings = "2.15.0"
rouge-score = "^0.1.2"
sentence-transformers = "6.1.0"
uvicorn = "0.54.0"
spicy = "0.16.0"
#optax = "^0.1.6"

[tool.poetry.group.dev.dependencies]
pytest = "^9.1.1"
pytest-mock = "^3.16.0"
coverage = "^7.16.2"
pytest-asyncio = "^1.4.0"
httpx = "^0.28.1"

[tool.poetry.group.cpu.dependencies]
torch = { version = "^2.14.0", source = "pytorch-cpu" }

[[tool.poetry.source]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
priority = "explicit"

[tool.pytest.ini_options]
asyncio_default_fixture_loop_scope = "module"

[build-system]
requires = ["poetry-core>=1.8.3"]
build-backend = "poetry.core.masonry.api"
