name: video-accuracy-evaluation
services:
  nginx:
    image: nginxinc/nginx-unprivileged:1.29.5
    ports:
      - "8101:8080"
    volumes:
      - ../nginx.conf:/etc/nginx/nginx.conf:ro
    healthcheck:
      # Probes the backend through the gateway, so it also verifies nginx routing.
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "--max-time", "4", "http://127.0.0.1:8080/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    depends_on:
      video-summary-accuracy-analyzer:
        condition: service_healthy
      video-summary-accuracy-analyzer-ui:
        condition: service_healthy

  video-summary-accuracy-analyzer:
    image: ${REGISTRY:-intel/}video-accuracy-eval:${TAG:-latest}
    container_name: video-summary-accuracy-analyzer
    build:
      context: ../
      dockerfile: docker/Dockerfile
    environment:
      http_proxy: ${http_proxy}
      https_proxy: ${https_proxy}
      no_proxy: localhost,127.0.0.1,${no_proxy}
      HF_TOKEN: ${HUGGINGFACEHUB_API_TOKEN}
      SBERT_MODEL_ID: ${SBERT_MODEL_ID}
      MAX_UPLOAD_SIZE_BYTES: ${MAX_UPLOAD_SIZE_BYTES:-10485760}
      NLTK_ALLOW_PROXIED_URLOPEN: 1
    group_add:
      - ${USER_GROUP_ID-1000}
    ports:
      - "127.0.0.1:9000:9000"
    volumes:
      - "${MODEL_CACHE_PATH}:/tmp/model_cache"
    healthcheck:
      # Models are downloaded and loaded before the API binds, so allow a long start period on first run.
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:9000/v1/eval/health', timeout=4).status==200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 600s

  video-summary-accuracy-analyzer-ui:
    image: ${REGISTRY:-intel/}video-accuracy-eval-ui:${TAG:-latest}
    container_name: video-summary-accuracy-analyzer-ui
    build:
      context: ../ui/
      dockerfile: docker/Dockerfile
    environment:
      http_proxy: ${http_proxy}
      https_proxy: ${https_proxy}
      no_proxy: localhost,127.0.0.1,${no_proxy}, video-summary-accuracy-analyzer, video-summary-accuracy-analyzer-ui
      APP_BACKEND_URL: ${APP_BACKEND_URL}
    ports:
      - "127.0.0.1:5174:7860"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:7860/', timeout=4).status==200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
    depends_on:
      video-summary-accuracy-analyzer:
        condition: service_healthy

networks:
  default:
    driver: bridge
