---
name: "edge-device-virtualization"
arch: "${ARCH}"
platform: "linux"
version: "${VERSION}"
section: "utils"
priority: "optional"
maintainer: "Intel Corporation"
vendor: "Intel Corporation"
homepage: "https://github.com/open-edge-platform/edge-ai-libraries"
license: "Apache-2.0"
description: |
  Edge device virtualization scripts for CDI generation and SR-IOV
  provisioning on edge devices.

contents:
  - src: ./cdi/*.sh
    dst: /opt/intel/edge/device-virtualization/
    file_info:
      mode: 0755
      owner: root
      group: root

  - src: ./provision-sriov/*.sh
    dst: /opt/intel/edge/device-virtualization/
    file_info:
      mode: 0755
      owner: root
      group: root
