name: Validate modules

on:
  pull_request:
    paths:
      - 'module/**'
      - 'profile/**'

concurrency:
  group: validate-modules-${{ github.event.pull_request.head.repo.full_name }}-${{ github.event.pull_request.head.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  shellcheck:
    name: Shellcheck
    runs-on: [self-hosted, linux, oep-lab]
    timeout-minutes: 20
    steps:
      - name: Verify required tooling
        run: |
          set -euo pipefail
          if ! command -v shellcheck >/dev/null 2>&1; then
            echo "::error::Missing required tool: shellcheck. Install shellcheck on the self-hosted runner and retry."
            exit 1
          fi

      - name: Clean workspace
        run: |
          set -euo pipefail
          find "$GITHUB_WORKSPACE" -mindepth 1 -maxdepth 1 -exec rm -rf {} +

      - uses: actions/checkout@v4
        with:
          clean: true

      # Module and profile files are sourced fragments (no shebang).
      # SC2148 (missing shebang) is disabled accordingly.
      # All other error-severity findings are treated as failures.
      - name: Run shellcheck
        run: |
          set -euo pipefail

          mapfile -d '' files < <(
            find module profile -type f ! -name 'README.md' -print0
          )

          if [ "${#files[@]}" -eq 0 ]; then
            echo "No module/profile files found to lint."
            exit 0
          fi

          if ! output="$(shellcheck \
            --shell=bash \
            --exclude=SC2148 \
            --severity=error \
            --check-sourced \
            --format=gcc \
            "${files[@]}" 2>&1)"; then
            while IFS= read -r line; do
              [ -z "$line" ] && continue
              if [[ "$line" =~ ^([^:]+):([0-9]+):([0-9]+):\ (error|warning|info|style):\ (.*)$ ]]; then
                echo "::error file=${BASH_REMATCH[1]},line=${BASH_REMATCH[2]},col=${BASH_REMATCH[3]}::${BASH_REMATCH[5]}"
              else
                echo "::error::${line}"
              fi
            done <<< "$output"
            exit 1
          fi

          echo "Shellcheck passed."

  naming-convention:
    name: Function naming convention
    runs-on: [self-hosted, linux, oep-lab]
    timeout-minutes: 20
    steps:
      - name: Verify required tooling
        run: |
          set -euo pipefail
          if ! command -v git >/dev/null 2>&1; then
            echo "::error::Missing required tool: git. Install git on the self-hosted runner and retry."
            exit 1
          fi

      - name: Clean workspace
        run: |
          set -euo pipefail
          find "$GITHUB_WORKSPACE" -mindepth 1 -maxdepth 1 -exec rm -rf {} +

      - uses: actions/checkout@v4
        with:
          clean: true

      - name: Check function name uniqueness across all installer scripts
        run: |
          set -euo pipefail
          # openedge-cli's subcommand_bootstrap concatenates every selected module/profile
          # fragment plus common/ and license/ into one rendered script.  If two files
          # define the same function name the last one cat-ed silently wins.  Collisions
          # must be detected here, before the rendered script is produced.
          failed=0
          tmpfile="$(mktemp)"
          trap 'rm -f "$tmpfile"' EXIT

          # Collect all top-level function definitions across the whole tree.
          # Pattern is tolerant of zero or more spaces before (): funcname() or funcname ()
          # Each output line: funcname:file:lineno
          find module profile common license -type f ! -name '*.md' | sort | \
          while IFS= read -r f; do
            grep -nE '^[a-zA-Z_][a-zA-Z0-9_]* *\(\)' "$f" 2>/dev/null | \
            while IFS=: read -r lineno decl; do
              func="$(printf '%s' "$decl" | grep -oE '^[a-zA-Z_][a-zA-Z0-9_]+')"
              [[ -n "$func" ]] && printf '%s:%s:%s\n' "$func" "$f" "$lineno"
            done
          done > "$tmpfile"

          # Report any function name defined in more than one file.
          while IFS= read -r func; do
            mapfile -t defs < <(grep "^${func}:" "$tmpfile")
            for def in "${defs[@]}"; do
              f="${def#*:}"; f="${f%:*}"
              ln="${def##*:}"
              others="$(printf '%s\n' "${defs[@]}" | grep -Fv "${func}:${f}:" \
                | sed "s|^${func}:||;s|:[0-9]*$||" | tr '\n' ' ' | sed 's/[[:space:]]*$//')"
              echo "::error file=${f},line=${ln}::Duplicate function '${func}'; also defined in: ${others}"
              failed=1
            done
          done < <(cut -d: -f1 "$tmpfile" | sort | uniq -d)

          # Interface functions must carry a suffix matching their component directory name,
          # since act_find_deps dispatches by that suffix.
          # e.g. debian_90_install_smart_parking must be inside module/smart_parking/
          for dir in module/*/ profile/*/; do
            name="$(basename "$dir")"
            for file in "${dir}"*; do
              [ -f "$file" ] || continue
              [[ "$(basename "$file")" == *.md ]] && continue
              while IFS=: read -r lineno decl; do
                func="$(printf '%s' "$decl" | grep -oE '^[a-zA-Z_][a-zA-Z0-9_]+')"
                [[ -z "$func" ]] && continue
                if [[ "$func" =~ ^[a-z]+_[0-9]{2}_(profile|license|install|remove|start|stop)_ ]] && \
                   [[ "$func" != *_${name} ]]; then
                  echo "::error file=${file},line=${lineno}::Interface function '${func}' suffix does not match component name '${name}'"
                  failed=1
                fi
              done < <(grep -nE '^[a-zA-Z_][a-zA-Z0-9_]* *\(\)' "$file" || true)
            done
          done

          if [ "$failed" -ne 0 ]; then
            echo ""
            echo "One or more function name violations were found."
            echo "See the annotations above for details."
            exit 1
          fi

          echo "All function names are globally unique and interface functions are correctly named."

  highlight-guidance:
    name: '@@HIGHLIGHT guidance (non-blocking)'
    runs-on: [self-hosted, linux, oep-lab]
    timeout-minutes: 20
    steps:
      - name: Verify required tooling
        run: |
          set -euo pipefail
          if ! command -v git >/dev/null 2>&1; then
            echo "::error::Missing required tool: git. Install git on the self-hosted runner and retry."
            exit 1
          fi

      - name: Clean workspace
        run: |
          set -euo pipefail
          find "$GITHUB_WORKSPACE" -mindepth 1 -maxdepth 1 -exec rm -rf {} +

      - uses: actions/checkout@v4
        with:
          clean: true

      - name: Warn when high-order components omit @@HIGHLIGHT
        # This check is advisory only — it never fails the workflow.
        # @@HIGHLIGHT is expected for complex applications in the 60-98 order
        # range.  Simple utilities (order < 60) legitimately omit it.
        run: |
          set -euo pipefail
          for dir in module/*/; do
            name="$(basename "$dir")"
            for file in "$dir"*; do
              [ -f "$file" ] || continue
              [[ "$(basename "$file")" == "README.md" ]] && continue

              # Determine the highest order number used in this file
              max_order=$(grep -oE '^[a-z]+_([0-9]{2})_(install|start)_'"${name}" "$file" \
                | grep -oE '[0-9]{2}' | sort -rn | head -1 || true)

              [ -z "$max_order" ] && continue

              # Only warn for components with order >= 60
              if [ "$max_order" -ge 60 ] 2>/dev/null; then
                if ! grep -q '@@HIGHLIGHT' "$file"; then
                  echo "::warning file=${file}::Component '${name}' (order ${max_order}) has no @@HIGHLIGHT lines. Consider adding one to the start or install function."
                fi
              fi
            done
          done
          echo "@@HIGHLIGHT check complete (warnings only, non-blocking)."
