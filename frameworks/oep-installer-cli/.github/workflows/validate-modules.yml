name: Validate modules

on:
  pull_request:
    paths:
      - 'module/**'
      - 'profile/**'

concurrency:
  group: validate-modules-${{ github.event.pull_request.head.repo.full_name }}-${{ github.event.pull_request.head.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  shellcheck:
    name: Shellcheck
    runs-on: [self-hosted, linux, oep-lab]
    timeout-minutes: 20
    steps:
      - name: Verify required tooling
        run: |
          set -euo pipefail
          if ! command -v shellcheck >/dev/null 2>&1; then
            echo "::error::Missing required tool: shellcheck. Install shellcheck on the self-hosted runner and retry."
            exit 1
          fi

      - name: Clean workspace
        run: |
          set -euo pipefail
          find "$GITHUB_WORKSPACE" -mindepth 1 -maxdepth 1 -exec rm -rf {} +

      - uses: actions/checkout@v4
        with:
          clean: true

      # Module and profile files are sourced fragments (no shebang).
      # SC2148 (missing shebang) is disabled accordingly.
      # All other error-severity findings are treated as failures.
      - name: Run shellcheck
        run: |
          set -euo pipefail

          mapfile -d '' files < <(
            find module profile -type f ! -name 'README.md' -print0
          )

          if [ "${#files[@]}" -eq 0 ]; then
            echo "No module/profile files found to lint."
            exit 0
          fi

          if ! output="$(shellcheck \
            --shell=bash \
            --exclude=SC2148 \
            --severity=error \
            --format=gcc \
            "${files[@]}" 2>&1)"; then
            while IFS= read -r line; do
              [ -z "$line" ] && continue
              if [[ "$line" =~ ^([^:]+):([0-9]+):([0-9]+):\ (error|warning|info|style):\ (.*)$ ]]; then
                echo "::error file=${BASH_REMATCH[1]},line=${BASH_REMATCH[2]},col=${BASH_REMATCH[3]}::${BASH_REMATCH[5]}"
              else
                echo "::error::${line}"
              fi
            done <<< "$output"
            exit 1
          fi

          echo "Shellcheck passed."

  naming-convention:
    name: Function naming convention
    runs-on: [self-hosted, linux, oep-lab]
    timeout-minutes: 20
    steps:
      - name: Verify required tooling
        run: |
          set -euo pipefail
          if ! command -v git >/dev/null 2>&1; then
            echo "::error::Missing required tool: git. Install git on the self-hosted runner and retry."
            exit 1
          fi

      - name: Clean workspace
        run: |
          set -euo pipefail
          find "$GITHUB_WORKSPACE" -mindepth 1 -maxdepth 1 -exec rm -rf {} +

      - uses: actions/checkout@v4
        with:
          clean: true

      - name: Check function names in module and profile files
        run: |
          set -euo pipefail
          failed=0

          check_file() {
            local file="$1"
            local name="$2"   # parent directory name (component name)
            local os="$3"     # filename (OS_LIKE, e.g. debian)

            # Extract top-level function definitions: lines of the form
            #   funcname () {
            # (the shell function declaration format used across this repo)
            while IFS= read -r line; do
              func="${line%% *}"  # strip everything after the first space
              # Allowed patterns:
              #   configure_<name>
              #   verify_<name>
              #   <os>_<NN>_(profile|license|install|remove|start|stop)_<name>
              if [[ "$func" == "configure_${name}" ]] || \
                 [[ "$func" == "verify_${name}" ]] || \
                 [[ "$func" =~ ^[a-z]+_[0-9]{2}_(profile|license|install|remove|start|stop)_${name}$ ]]; then
                : # valid
              else
                echo "::error file=${file}::Non-conforming function name: ${func} (component=${name}, os=${os})"
                failed=1
              fi
            done < <(grep -E '^[a-zA-Z_][a-zA-Z0-9_]* \(\)' "$file" || true)
          }

          # Check every file under module/<name>/<os>  (skip README.md)
          for dir in module/*/; do
            name="$(basename "$dir")"
            for file in "$dir"*; do
              [ -f "$file" ] || continue
              [[ "$(basename "$file")" == "README.md" ]] && continue
              os="$(basename "$file")"
              check_file "$file" "$name" "$os"
            done
          done

          # Check every file under profile/<name>/<os>  (skip README.md)
          for dir in profile/*/; do
            name="$(basename "$dir")"
            for file in "$dir"*; do
              [ -f "$file" ] || continue
              [[ "$(basename "$file")" == "README.md" ]] && continue
              os="$(basename "$file")"
              check_file "$file" "$name" "$os"
            done
          done

          if [ "$failed" -ne 0 ]; then
            echo ""
            echo "One or more function name violations were found."
            echo "See the annotations above for details."
            exit 1
          fi

          echo "All function names conform to the naming convention."

  highlight-guidance:
    name: '@@HIGHLIGHT guidance (non-blocking)'
    runs-on: [self-hosted, linux, oep-lab]
    timeout-minutes: 20
    steps:
      - name: Verify required tooling
        run: |
          set -euo pipefail
          if ! command -v git >/dev/null 2>&1; then
            echo "::error::Missing required tool: git. Install git on the self-hosted runner and retry."
            exit 1
          fi

      - name: Clean workspace
        run: |
          set -euo pipefail
          find "$GITHUB_WORKSPACE" -mindepth 1 -maxdepth 1 -exec rm -rf {} +

      - uses: actions/checkout@v4
        with:
          clean: true

      - name: Warn when high-order components omit @@HIGHLIGHT
        # This check is advisory only — it never fails the workflow.
        # @@HIGHLIGHT is expected for complex applications in the 60-98 order
        # range.  Simple utilities (order < 60) legitimately omit it.
        run: |
          set -euo pipefail
          for dir in module/*/; do
            name="$(basename "$dir")"
            for file in "$dir"*; do
              [ -f "$file" ] || continue
              [[ "$(basename "$file")" == "README.md" ]] && continue

              # Determine the highest order number used in this file
              max_order=$(grep -oE '^[a-z]+_([0-9]{2})_(install|start)_'"${name}" "$file" \
                | grep -oE '[0-9]{2}' | sort -rn | head -1 || true)

              [ -z "$max_order" ] && continue

              # Only warn for components with order >= 60
              if [ "$max_order" -ge 60 ] 2>/dev/null; then
                if ! grep -q '@@HIGHLIGHT' "$file"; then
                  echo "::warning file=${file}::Component '${name}' (order ${max_order}) has no @@HIGHLIGHT lines. Consider adding one to the start or install function."
                fi
              fi
            done
          done
          echo "@@HIGHLIGHT check complete (warnings only, non-blocking)."
