name: Generate component from spec

on:
  push:
    branches: [main]
    paths: ['specification/**']
  workflow_dispatch:
    inputs:
      spec_file:
        description: >-
          Path to spec file relative to repo root
          (e.g. specification/my_component.md)
        required: false

permissions:
  contents: read
  issues: write

jobs:
  dispatch:
    runs-on: [self-hosted, linux, oep-lab]
    timeout-minutes: 20
    #
    # This workflow now authenticates with a PAT (COPILOT_TASK_TOKEN) because
    # installation tokens cannot assign the Copilot coding agent. Unlike
    # GITHUB_TOKEN, pushes made with a PAT DO trigger workflows -- so a commit
    # under specification/** authored by our own automation would re-enter this
    # workflow and create duplicate agent tasks.
    #
    # Only applied to `push`; workflow_dispatch must always run, otherwise the
    # token owner could not manually re-run the workflow themselves.
    if: >-
      github.event_name != 'push' ||
      (github.actor != 'github-actions[bot]' &&
       github.actor != 'copilot-swe-agent[bot]' &&
       github.actor != 'Copilot' &&
       github.actor != vars.AUTOMATION_ACTOR)
    steps:
      - name: Verify required tooling
        run: |
          set -euo pipefail
          for tool in gh git; do
            if ! command -v "$tool" >/dev/null 2>&1; then
              echo "::error::Missing required tool: ${tool}. Install ${tool} on the self-hosted runner and retry."
              exit 1
            fi
          done

      - name: Clean workspace
        run: |
          set -euo pipefail
          find "$GITHUB_WORKSPACE" -mindepth 1 -maxdepth 1 -exec rm -rf {} +

      - uses: actions/checkout@v4
        with:
          clean: true
          fetch-depth: 2

      - name: Find changed spec files
        id: specs
        run: |
          SPECS_FILE="$(mktemp)"

          if [ -n "${{ github.event.inputs.spec_file }}" ]; then
            echo "${{ github.event.inputs.spec_file }}" > "$SPECS_FILE"
          else
            BEFORE="${{ github.event.before }}"
            SHA="${{ github.sha }}"
            # Handle zero SHA (branch created) or unreachable before-commit
            if [[ "$BEFORE" == "0000000000000000000000000000000000000000" ]] || \
               ! git cat-file -e "$BEFORE" 2>/dev/null; then
              # Fall back: files introduced by the head commit
              git diff-tree --no-commit-id -r --name-only --diff-filter=AM \
                "$SHA" -- 'specification/*.md' > "$SPECS_FILE"
            else
              git diff --name-only --diff-filter=AM "${BEFORE}..${SHA}" \
                -- 'specification/*.md' > "$SPECS_FILE"
            fi
          fi

          # Skip _template.md and README.md
          grep -v -E '(^|/)(_[^/]*\.md|README\.md)$' "$SPECS_FILE" \
            > "${SPECS_FILE}.filtered" || true
          mv "${SPECS_FILE}.filtered" "$SPECS_FILE"

          if [ ! -s "$SPECS_FILE" ]; then
            echo "No spec files changed – nothing to do."
            echo "has_specs=false" >> "$GITHUB_OUTPUT"
          else
            echo "has_specs=true" >> "$GITHUB_OUTPUT"
            echo "specs_file=$SPECS_FILE" >> "$GITHUB_OUTPUT"
          fi

      - name: Create a Copilot task issue for each spec
        if: steps.specs.outputs.has_specs == 'true'
        env:
          GH_TOKEN: ${{ secrets.COPILOT_TASK_TOKEN }}
        run: |
          chmod +x .github/scripts/create-component-issue.sh
          .github/scripts/create-component-issue.sh \
            "${{ steps.specs.outputs.specs_file }}"
