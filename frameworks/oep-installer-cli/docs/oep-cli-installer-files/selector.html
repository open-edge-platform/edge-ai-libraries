<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="utf-8" />
    <title>OEP CLI Installer</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="style.css" />
    <style>
      /* Transparent background so the embedding docs page shows through and the
         widget reads as part of the page rather than a separate boxed section. */
      html, body {
        background: transparent;
      }

      /* The spark responsive container paints a light-gray card background;
         override it so the widget blends fully into the docs page. */
      .app-wrap.st-responsive-container {
        background: transparent;
      }

      /* Responsive layout that works well in iframes */
      .app-wrap { 
        max-width: 100%; 
        width: 100%;
        margin: 0 auto; 
        padding: 0 1rem; 
        box-sizing: border-box;
      }
      
      /* Ensure content doesn't overflow horizontally */
      * {
        box-sizing: border-box;
      }
      
      .pill-active {
        color: white;
        border-color: #007acc;
        background-color: #007acc;
      }
      .section-title { font-weight: 600; }
      .code-box {
        border: 1px solid var(--spark-color-theme-light-gray400);
        border-radius: .75rem;
        background: var(--spark-color-theme-light-gray200);
        padding: .75rem;
        padding-right: 4.5rem; /* Reserve space for copy button */
        position: relative;
        overflow-x: auto;
        word-wrap: break-word;
        white-space: pre-line;
        width: 100%;
        box-sizing: border-box;
      }
      .code-copy { 
        position: absolute; 
        top: .5rem; 
        right: .5rem;
        z-index: 1; /* Ensure button stays on top */
      }
      .subtitle { opacity:.8; }
      .source-badge {
        display: inline-flex;
        align-items: center;
        gap: .4rem;
        margin-top: .5rem;
        padding: .25rem .65rem;
        border: 1px solid var(--spark-color-theme-light-gray400);
        border-radius: 999px;
        background: var(--spark-color-theme-light-gray200);
        color: inherit;
        font-size: .8rem;
        text-decoration: none;
      }
      .source-badge:hover,
      .source-badge:focus-visible {
        border-color: #007acc;
        color: #007acc;
      }
      #installText {
        font-family: monospace, monospace;
        font-size: 0.875rem;
        line-height: 1.4;
        margin: 0;
        padding: 0;
        white-space: pre-line;
        word-wrap: break-word;
        overflow-wrap: break-word;
        max-width: 100%;
        width: 100%;
      }
      
      /* Responsive adjustments for smaller screens/iframes */
      @media (max-width: 768px) {
        .app-wrap {
          margin: 0.5rem auto;
          padding: 0 0.5rem;
        }
        .code-box {
          padding: 0.5rem;
          padding-right: 4rem; /* Maintain space for copy button on small screens */
        }
        #installText {
          font-size: 0.8rem;
        }
      }
    </style>
  </head>
  <body>
    <main class="app-wrap st-responsive-container idz-page">
      <h1 id="app-title" class="section-title"></h1>

      <div id="categories"></div>

      <section id="optionsSection" class="st-section st-section-accent" style="margin-top:1.25rem; display:none;">
        <div id="optionsTitle" class="st-section-title">Options</div>
        <div class="st-section-content">
          <div class="st-section-content-row">
            <div id="optionsHost" class="spark-button-group option-button-group"></div>
          </div>
        </div>
      </section>

      <section class="st-section st-section-accent" style="margin-top:1.25rem;">
        <div class="st-section-title">Install</div>
        <div class="st-section-content">
          <div class="st-section-content-row">
            <div class="code-box st-code-snippet-multi-line" style="min-width: 300px; width:100%;">
              <button id="copyCmd" class="spark-button spark-button-size-s spark-button-primary code-copy">Copy</button>
              <pre class="st-code-snippet-content" id="installText">Select options to see a command…</pre>
            </div>
          </div>
          <div class="st-section-content-row">
            <a class="source-badge"
               href="https://github.com/open-edge-platform/edge-ai-libraries/tree/main/frameworks/oep-installer-cli"
               target="_blank" rel="noopener noreferrer"
               title="OEP CLI Installer on GitHub">
              <svg aria-hidden="true" viewBox="0 0 16 16" width="16" height="16" fill="currentColor">
                <path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0016 8c0-4.42-3.58-8-8-8z"/>
              </svg>
              <span>Open source: review the installer on GitHub</span>
            </a>
          </div>
        </div>
      </section>

      <section id="nextStepsSection" class="st-section st-section-accent" style="margin-top:1.25rem;">
        <div class="st-section-title">Next Steps</div>
        <div class="st-section-content">
          <div class="st-section-content-row">
            <div style="min-width: 300px; width:100%;">
              <div id="nextStepsText">
              </div>
            </div>
          </div>
        </div>
      </section>

      <section class="st-section st-section-accent" style="margin-top:1.25rem;">
        <div class="st-section-title">Get Started</div>
        <div class="st-section-content">
          <div class="st-section-content-row">
            <div style="min-width: 300px; width:100%;">
              <div id="getStartedText">
              </div>
            </div>
          </div>
        </div>
      </section>

      <section class="st-section st-section-accent" style="margin-top:1.25rem;">
        <div class="st-section-title">Resources</div>
        <div class="st-section-content">
          <div class="st-section-content-row">
            <div style="min-width: 300px; width:100%;">
              <div id="resourcesText">
              </div>
            </div>
          </div>
        </div>
      </section>
    </main>

    <script src="selector.js"></script>
  </body>
</html>
