# Build / metadata for the `adaptive-token-compressor` package.
#
# v0.1 layout: a thin core (`core/`) plus two independent subpackages
# (`harness/`, `tool/`) and an optional `model_servers/` tree
# for the upstream FastAPI / vLLM services.
#
# Notes for installers:
#   - The default install pulls the SDK client deps plus `claw-compactor`,
#     which HarnessCompressor uses for content-type-aware compression.
#     `claw-compactor` resolves from PyPI like any other dep.
#   - The `lingua-server-xpu` extra requires Intel XPU wheels; pip needs explicit
#     `--extra-index-url` flags (pyproject cannot encode index URLs).
[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "adaptive-token-compressor"
version = "0.1.0"
description = "Adaptive token compression library: harness / tool compressors with shared metrics + manager."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
dependencies = [
    "requests>=2.31",
    "tiktoken>=0.7",
    "cachetools>=5.3",
    "claw-compactor>=7,<8",
]

[project.optional-dependencies]
# Lingua server extras — three variants:
#   * lingua-server-xpu  -> PyTorch backend on Intel XPU (IPEX)
#   * lingua-server-cpu  -> PyTorch backend on CPU
#   * lingua-server-ov   -> OpenVINO backend (xpu or cpu)
#
# lingua-server-xpu needs two --extra-index-url flags (pyproject can't encode
# index URLs); torch/torchvision/torchaudio versions must move together (IPEX ABI):
#   pip install --extra-index-url https://download.pytorch.org/whl/xpu \
#               --extra-index-url https://pytorch-extension.intel.com/release-whl/stable/xpu/us/ \
#               "adaptive-token-compressor[lingua-server-xpu]"
#
# PyTorch backend, XPU (torch + IPEX + oneccl). Also runs on CPU (`--device cpu`,
# IPEX unused), but CPU-only users should prefer the lighter `lingua-server-cpu`.
# For `--backend ov` use `lingua-server-ov` (combinable: `[lingua-server-xpu,lingua-server-ov]`).
lingua-server-xpu = [
    "torch==2.8.0",
    "torchvision==0.23.0",
    "torchaudio==2.8.0",
    "intel-extension-for-pytorch==2.8.10+xpu",
    "oneccl_bind_pt==2.8.0+xpu",
    "llmlingua>=0.2",
    "transformers>=5.5.0",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "huggingface-hub>=0.20",
]
# CPU-only fallback for the PyTorch backend (no IPEX, no XPU wheels needed).
# Pass `--backend pytorch --device cpu` on launch. Install from the CPU wheel
# index to get the lean CPU-only torch build and avoid the heavy accelerator
# runtime packages the default PyPI wheel pulls in on Linux (pyproject can't
# encode index URLs):
#   pip install --index-url https://download.pytorch.org/whl/cpu \
#               "adaptive-token-compressor[lingua-server-cpu]"
lingua-server-cpu = [
    "torch>=2.0",
    "llmlingua>=0.2",
    "transformers>=5.5.0",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "huggingface-hub>=0.20",
]
# OpenVINO backend (`--backend ov`, device xpu or cpu). OV drives the Intel GPU
# via its own runtime (not torch), so plain CPU torch is enough — no IPEX/XPU
# wheels. Install from the CPU wheel index to get the lean CPU-only torch build
# and avoid the heavy accelerator runtime packages the default PyPI wheel pulls
# in on Linux (pyproject can't encode index URLs):
#   pip install --index-url https://download.pytorch.org/whl/cpu \
#               "adaptive-token-compressor[lingua-server-ov]"
lingua-server-ov = [
    "torch==2.8.0",
    "llmlingua>=0.2",
    "transformers>=5.5.0",
    "openvino>=2024.0",
    "optimum[openvino]>=1.24.0",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "huggingface-hub>=0.20",
]
dev = ["pytest>=8", "responses>=0.25", "httpx>=0.27", "ruff", "mypy"]

# Ship LICENSE + third_party_program.txt in the wheel's .dist-info so
# `pip install` users receive the license and the third-party dependency
# notices. (MANIFEST.in covers the sdist.)
[tool.setuptools]
license-files = ["LICENSE", "third_party_program.txt"]

[tool.setuptools.packages.find]
where = ["src"]

# Bundle the lingua server's docs + LLMLingua-2 source patches into the wheel.
# The patch file is the single source of truth shared by the bare-metal path
# (`python -m ...lingua.apply_patch`) and the Docker build (which COPYs the
# same file from `src/.../patches/`).
#
# Docker / vLLM deployment artifacts (Dockerfile, docker-compose.yaml,
# qwen35-4b.yaml) live in the repo-root `deployment/` directory and are
# intentionally NOT bundled in the wheel — they are reference recipes
# consumed via `git clone`, not import.
[tool.setuptools.package-data]
"adaptive_token_compressor.model_servers.lingua" = ["README.md", "patches/*.patch"]
