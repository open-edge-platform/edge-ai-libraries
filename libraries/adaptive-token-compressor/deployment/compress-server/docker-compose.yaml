# Compress Server — official docker compose recipe.
#
# Usage (from this directory):
#   docker compose up -d --build
#
# Override via env (no .env file required; all vars have :-default fallbacks):
#   COMPRESS_SERVER_DEVICE=cpu docker compose up -d --build        # pytorch: cpu/cuda/xpu
#   COMPRESS_SERVER_DEVICE=cpu docker compose --profile ov up      # ov: cpu/gpu (default gpu)
#   COMPRESS_SERVER_PORT=9000  docker compose up -d --build
#
# Devices are lowercase & case-insensitive. COMPRESS_SERVER_DEVICE is shared by both
# services: pytorch accepts cpu/cuda/xpu, ov accepts cpu/gpu (default gpu).
# So don't set a pytorch-only value (xpu) when running the ov profile; gpu needs
# /dev/dri passthrough.
#
# Security — publish bind address (COMPRESS_SERVER_BIND_HOST, default 127.0.0.1):
#   The port is published to the host loopback ONLY by default, so the server
#   is reachable from this machine but not from any external network interface.
#   The container itself must bind 0.0.0.0 (otherwise Docker's port forwarding
#   can't reach it) — exposure is controlled here, at the publish layer.
#   Only widen this if you genuinely need cross-host access, and put real
#   auth/network controls in front of it:
#     COMPRESS_SERVER_BIND_HOST=0.0.0.0 docker compose up -d --build   # exposes on all NICs
#
# Transport security (TLS):
#   The server speaks plain HTTP by design and MUST NOT be exposed off-host in
#   the clear. For any cross-host access, terminate TLS in a reverse proxy
#   (nginx / caddy / traefik) that fronts this service, keep the container
#   published to loopback (default COMPRESS_SERVER_BIND_HOST=127.0.0.1), and point the
#   proxy upstream at 127.0.0.1:${COMPRESS_SERVER_PORT}. The proxy also carries auth,
#   rate limiting, and request-size limits. Do not publish plain HTTP on a
#   routable interface.
#
# Container build context is the repo root (../..), so the Dockerfile's
# `COPY src/adaptive_token_compressor/model_servers/compress_server/app.py` resolves.

services:
  compress-server-pytorch:
    image: adaptive-compress-server-pytorch:latest
    container_name: adaptive-compress-server-pytorch
    build:
      context: ../..
      dockerfile: deployment/compress-server/Dockerfile.pytorch
      args:
        - http_proxy=${http_proxy:-}
        - https_proxy=${https_proxy:-}
        - no_proxy=${no_proxy:-}
    ports:
      - "${COMPRESS_SERVER_BIND_HOST:-127.0.0.1}:${COMPRESS_SERVER_PORT:-8001}:8001"
    environment:
      - COMPRESS_SERVER_PORT=8001
      - COMPRESS_SERVER_RUNTIME=pytorch
      # pytorch devices (lowercase): cpu / cuda / xpu. Default xpu.
      - COMPRESS_SERVER_DEVICE=${COMPRESS_SERVER_DEVICE:-xpu}
      - COMPRESS_SERVER_DEVICE_INDEX=${COMPRESS_SERVER_DEVICE_INDEX:-0}
      - COMPRESS_SERVER_MODE=${COMPRESS_SERVER_MODE:-llmlingua2}
      - COMPRESS_SERVER_MODEL_NAME_ID=${COMPRESS_SERVER_MODEL_NAME_ID:-}
      - HF_HUB_OFFLINE=${HF_HUB_OFFLINE:-0}
      - HF_ENDPOINT=${HF_ENDPOINT:-https://hf-mirror.com}
      - http_proxy=${http_proxy:-}
      - https_proxy=${https_proxy:-}
      - no_proxy=${no_proxy:-}
    volumes:
      - compress-server-models:/home/user/.cache/huggingface
    devices:
      # Intel GPU passthrough. Harmless on CPU hosts (COMPRESS_SERVER_DEVICE=cpu skips
      # IPEX/XPU code paths). Comment out only if your docker daemon refuses
      # /dev/dri because the device file does not exist.
      - /dev/dri:/dev/dri
    group_add:
      # Auto-detect on host:
      #   VIDEO_GID=$(getent group video | cut -d: -f3)
      #   RENDER_GID=$(getent group render | cut -d: -f3)
      - "${VIDEO_GID:-44}"
      - "${RENDER_GID:-992}"
    profiles:
      - pytorch
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8001/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      # First start may need to download ~1-2GB model from HF Hub.
      start_period: 180s

  compress-server-ov:
    image: adaptive-compress-server-ov:latest
    container_name: adaptive-compress-server-ov
    build:
      context: ../..
      dockerfile: deployment/compress-server/Dockerfile.ov
      args:
        - http_proxy=${http_proxy:-}
        - https_proxy=${https_proxy:-}
        - no_proxy=${no_proxy:-}
    ports:
      - "${COMPRESS_SERVER_BIND_HOST:-127.0.0.1}:${COMPRESS_SERVER_OV_PORT:-8002}:8001"
    environment:
      - COMPRESS_SERVER_PORT=8001
      - COMPRESS_SERVER_RUNTIME=ov
      # ov devices (lowercase): cpu / gpu. Default gpu when COMPRESS_SERVER_DEVICE is
      # unset. NOTE: COMPRESS_SERVER_DEVICE is shared with the pytorch service — ov does NOT
      # accept pytorch's "xpu", so a global COMPRESS_SERVER_DEVICE=xpu is rejected here.
      # Run the ov profile with an ov-valid value, e.g. COMPRESS_SERVER_DEVICE=cpu.
      - COMPRESS_SERVER_DEVICE=${COMPRESS_SERVER_DEVICE:-gpu}
      - COMPRESS_SERVER_DEVICE_INDEX=${COMPRESS_SERVER_DEVICE_INDEX:-0}
      - COMPRESS_SERVER_MODE=${COMPRESS_SERVER_MODE:-llmlingua2}
      - COMPRESS_SERVER_MODEL_NAME_ID=${COMPRESS_SERVER_MODEL_NAME_ID:-}
      - HF_HUB_OFFLINE=${HF_HUB_OFFLINE:-0}
      - HF_ENDPOINT=${HF_ENDPOINT:-https://hf-mirror.com}
      - http_proxy=${http_proxy:-}
      - https_proxy=${https_proxy:-}
      - no_proxy=${no_proxy:-}
    volumes:
      - compress-server-models:/home/user/.cache/huggingface
    devices:
      # Intel GPU passthrough. Harmless on CPU hosts (COMPRESS_SERVER_DEVICE=cpu skips
      # OpenVINO GPU code paths). Comment out only if your docker daemon refuses
      # /dev/dri because the device file does not exist.
      - /dev/dri:/dev/dri
    group_add:
      # Auto-detect on host:
      #   VIDEO_GID=$(getent group video | cut -d: -f3)
      #   RENDER_GID=$(getent group render | cut -d: -f3)
      - "${VIDEO_GID:-44}"
      - "${RENDER_GID:-992}"
    profiles:
      - ov
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8001/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      # First start may need to download ~1-2GB model from HF Hub.
      start_period: 180s

volumes:
  compress-server-models:
    name: adaptive-compress-server-models
