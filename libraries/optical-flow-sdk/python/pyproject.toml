[build-system]
requires = ["setuptools>=68", "wheel", "pybind11>=2.11"]
build-backend = "setuptools.build_meta"

[project]
name = "optical-flow-sdk"
version = "0.1.0"
description = "Intel Optical Flow SDK Python bindings"
readme = "README.python.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
authors = [{ name = "Intel Corporation" }]

[tool.setuptools.packages.find]
include = ["optical_flow_sdk*"]
