# Prefer the SDK-root pyproject.toml for wheels: `pip install ..` / `scripts/build_wheel.sh`.
[build-system]
requires = ["scikit-build-core>=0.10", "pybind11>=2.11", "numpy"]
build-backend = "scikit_build_core.build"

[project]
name = "optical-flow-sdk"
version = "0.1.0"
description = "Intel Optical Flow SDK Python bindings (use repository-root pyproject.toml)"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }

[tool.scikit-build]
cmake.source-dir = ".."
wheel.packages = []
cmake.args = [
  "-DOPTICALFLOW_ENABLE_CPU=ON",
  "-DOPTICALFLOW_BUILD_PYTHON=ON",
  "-DOPTICALFLOW_BUILD_SHARED=OFF",
  "-DOPTICALFLOW_BUILD_SAMPLES=OFF",
  "-DOPTICALFLOW_BUILD_TESTS=OFF",
  "-DOPTICALFLOW_BUILD_BENCHMARKS=OFF",
]
