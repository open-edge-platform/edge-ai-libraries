[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "semantic-comp"
version = "0.1.0"
description = "Semantic image codec"
requires-python = ">=3.9"

dependencies = [
    "numpy",
    "opencv-python",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: end-to-end or smoke tests that require external services or models",
]

