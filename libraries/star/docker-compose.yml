# Compose stack for star-image: encoder, decoder, and (optionally) the DL
# Streamer Pipeline Server for object detection, sharing one Docker network,
# build/image, and volumes via the `x-*` anchors below.

x-app-image: &app-image
  build:
    context: .
    dockerfile: Dockerfile
  image: image-pipeline
  environment:
    MPLCONFIGDIR: /app/output/

x-app-volumes: &app-volumes
  volumes:
    - "./data:/app/data"
    - "./output:/app/output"
    - "./log:/app/output/log"

x-gpu-npu-device: &gpu-npu-device
  profiles: ["npu"]
  devices:
    - "/dev/dri:/dev/dri"
    - "/dev/accel/accel0:/dev/accel/accel0"
  group_add:
    - "${NPU_RENDER_GID}"

x-dlstreamer-pipeline-server: &dlstreamer-pipeline-server
  image: ${DLSTREAMER_PIPELINE_SERVER_IMAGE:-intel/dlstreamer-pipeline-server:2026.2.0-ubuntu24}
  restart: unless-stopped
  ports:
    - "8080:8080" # REST API
    - "8554:8554" # RTSP output
  environment:
    - ENABLE_RTSP=true
    - RTSP_PORT=8554
    - REST_SERVER_PORT=8080
    - LOG_LEVEL=${DLSTREAMER_LOG_LEVEL:-INFO}
    - ADD_UTCTIME_TO_METADATA=true
  volumes:
    - "./configs/dlstreamer/config.json:/home/pipeline-server/config.json:ro"
    - "./data:/app/data:ro"
    - "./output:/app/output"
    - "./models/obj_det_models/yolov8m_int8_openvino_model:/home/pipeline-server/models/star_image:ro"
    - vol_pipeline_root:/var/cache/pipeline_root:uid=1999,gid=1999

services:
  dlstreamer-pipeline-server:
    <<: *dlstreamer-pipeline-server
    container_name: dlstreamer-pipeline-server
    hostname: dlstreamer-pipeline-server

  dlstreamer-pipeline-server-gpu-npu:
    <<: [*dlstreamer-pipeline-server, *gpu-npu-device]
    container_name: dlstreamer-pipeline-server-gpu-npu
    hostname: dlstreamer-pipeline-server-gpu-npu
    networks:
      default:
        aliases:
          - dlstreamer-pipeline-server

  # Runs both the legacy TCP decoder (port 5000, internal-only) and the REST
  # decoder service (port 8000, published as 8002) concurrently -- see
  # main.py's `--role decoder`.
  decoder:
    <<: [*app-image, *app-volumes]
    container_name: decoder
    hostname: decoder
    command:
      - "--role"
      - "decoder"
      - "--host"
      - "0.0.0.0"
      - "--port"
      - "5000"
      - "--service-host"
      - "0.0.0.0"
      - "--service-port"
      - "8000"
      - "--stream-buffer-size"
      - "200"
      - "--output"
      - "/app/output"
    ports:
      - "8002:8000"

  # Runs both the legacy TCP encoder (connects to `decoder:5000`) and the REST
  # encoder service (port 8000, published as 8001) concurrently -- see
  # main.py's `--role encoder`. The REST side forwards encoded payloads to
  # `decoder`'s REST service at `--decoder-url`.
  encoder:
    <<: [*app-image, *app-volumes]
    container_name: encoder
    hostname: encoder
    command:
      - "--role"
      - "encoder"
      - "--host"
      - "decoder"
      - "--port"
      - "5000"
      - "--fps"
      - "1"
      - "--decoder-url"
      - "http://decoder:8000"
      - "--service-host"
      - "0.0.0.0"
      - "--service-port"
      - "8000"
    ports:
      - "8001:8000"
      - "5000:5000"

  encoder-npu:
    <<: [*app-image, *app-volumes, *gpu-npu-device]
    container_name: encoder-gpu-npu
    hostname: encoder-gpu-npu
    command:
      - "--role"
      - "encoder"
      - "--host"
      - "decoder"
      - "--port"
      - "5000"
      - "--fps"
      - "1"
      - "--decoder-url"
      - "http://decoder:8000"
      - "--service-host"
      - "0.0.0.0"
      - "--service-port"
      - "8000"
    ports:
      - "8001:8000"
      - "5000:5000"

volumes:
  vol_pipeline_root:
    driver: local
    driver_opts:
      type: tmpfs
      device: tmpfs
