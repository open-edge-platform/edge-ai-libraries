name: Validation

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - master

jobs:
  unit-test:
    name: Run Build and Unit Test
    runs-on: [self-hosted, az-ch]
    container: ubuntu:jammy
    steps:
    - name: Clone Repo
      uses: actions/checkout@v3
    - name: Build Stage
      run: |
        chmod u+x .github/build/build.sh
        .github/build/build.sh
    - name: Unit Test Stage
      run: |
        chmod u+x .github/ut/ut.sh
        .github/ut/ut.sh
    - name: Generate Coverage Report
      run: |
        chmod u+x .github/ut/gen_report.sh
        .github/ut/gen_report.sh
    - name: Integration Test Stage
      run: |
        chmod u+x .github/integration/integration.sh
        .github/integration/integration.sh
    - name: Benchmark Test Stage
      run: |
        chmod u+x .github/benchmark/benchmark.sh
        .github/benchmark/benchmark.sh

