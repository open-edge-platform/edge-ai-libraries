name: BDBA Scan
on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - master

env:
  RTMOTION_VERSION: 0.3.0
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true

jobs:
  bdba:
    name: BDBA
    runs-on: [self-hosted, az-ch]
    container: ubuntu:jammy
    steps:
      - uses: actions/checkout@v3
      - name: Build Stage
        run: |
          chmod u+x .github/build/build.sh
          .github/build/build.sh
      - name: Collect binary
        run: |
          mkdir bin
          mv ./build/library/algo/common/librtm_algo_com.so.$RTMOTION_VERSION ./build/library/algo/public/librtm_algo_pub.so.$RTMOTION_VERSION ./build/library/algo/private/librtm_algo_pri.so.$RTMOTION_VERSION ./build/library/fb/common/librtm_fb_com.so.$RTMOTION_VERSION ./build/library/fb/public/librtm_fb_pub.so.$RTMOTION_VERSION ./build/library/fb/private/librtm_fb_pri.so.$RTMOTION_VERSION ./build/demo/multi-axis ./build/demo/multi-axis-monitor ./ruckig/build/libruckig.so bin
      # TBD: skip for now
