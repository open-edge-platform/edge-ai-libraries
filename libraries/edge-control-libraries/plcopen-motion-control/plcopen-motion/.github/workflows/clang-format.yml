name: Format

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - master

jobs:
  pre-commit:
    name: clang-format
    runs-on: [self-hosted, az-ch]
    container: ubuntu:jammy
    steps:
    - uses: actions/checkout@v3
    - uses: actions/setup-python@v4
    - name: Install clang-format-11
      run: |
        apt update
        apt-get install clang-format-11 git -y
    - name: Init temporary git locally
      run: |
        git config --global user.email "test@test.com"
        git config --global user.name "test"
        git config --global --add safe.directory '*'
        git init
        git add .
        git commit -m "init"
    - name: Run clang-format
      run: find . -name '*.h' -or -name '*.hpp' -or -name '*.cpp' | xargs clang-format-11 -i -style=file
    - name: Display changes
      run: git diff --exit-code
