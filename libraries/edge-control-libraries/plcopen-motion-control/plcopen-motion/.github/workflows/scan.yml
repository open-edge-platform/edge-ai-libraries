name: Scan

on:
  # Triggers the workflow on push or pull request events but only for the master branch
  push:
    branches: [ master ]
  pull_request:
    branches: [ master, maintenance* ]
  workflow_dispatch:

env:
  http_proxy: http://proxy-dmz.intel.com:912
  https_proxy: http://proxy-dmz.intel.com:912
  no_proxy: localhost,127.0.0.1/8,ch.intel.com,ka.intel.com,devtools.intel.com
  
jobs:
  coverity:
    name: Coverity
    runs-on: [self-hosted, az-ch]
    environment: conjur
    permissions:
      id-token: write # Required for requesting the job's OIDC token
      contents: read # Required for actions/checkout
    steps:
      - uses: actions/checkout@v4
      - uses: intel-innersource/frameworks.actions.certs@latest
      - name: Fetch secrets from Conjur
        # Was using v1 tag prior to it being force updated - now just use commit ID
        uses: intel-innersource/frameworks.actions.conjur-fetch@f20293973b9bbb9169785b04f3a0912c77f42c48
        with:
          host_id: host/github-apps-oidc/43019-components_plcopenmotion
          secrets: >
            FMSPAMVLT101/LOBUSER_prapp/AAM-PR-43019-EDGECONTROLS/Operating System-UnmanagedAccounts-Linux-coverity-auth-base64/password|COVERITY_AUTH_KEY_BASE64;
      - name: Prepare Environment
        run: |
          COVERITY_AUTH_KEY=$(echo ${{ env.COVERITY_AUTH_KEY_BASE64 }} | base64 --decode)
          echo "::add-mask::$COVERITY_AUTH_KEY"
          echo "COVERITY_AUTH_KEY=$COVERITY_AUTH_KEY" >> $GITHUB_ENV
      - name: Scan
        uses: intel-innersource/frameworks.industrial.edge-controls.actions.coverity@main
        with:
          image: amr-registry.caas.intel.com/edge-controls/eci-coverity:latest
          server: https://coverity.devtools.intel.com/prod7
          auth_key: "${{ env.COVERITY_AUTH_KEY }}"
          project: Edge_Controls_Indu
          stream: components.plcopen-motion
          compiler: c++
          compiler_type: gcc
          prebuild: apt-get update && apt-get install -y cmake pkg-config plcopen-ruckig-dev python3-dev libgtest-dev libtcc-dev ittapi && cmake -DTEST=ON -DINSTALL_BINDIR=/opt/plcopen .
          build: make
          fail_threshold: none

  fuzzing:
    name: Fuzz Testing
    runs-on: [self-hosted, az-ch]
    steps:
      - uses: actions/checkout@v3
      - name: Fuzz
        uses: intel-innersource/frameworks.industrial.edge-controls.actions.fuzzer@cc74f8b3ef14f2b8ae1d51dcfe8d8616f4be6a46
        with:
          fuzz_tool: fuzztest
          image: amr-registry.caas.intel.com/edge-controls/eci-fuzzer:latest
          prebuild: >-
            apt-get update &&
            apt-get install -y cmake pkg-config git build-essential python3-dev libgtest-dev libtcc-dev protobuf-compiler &&
            git clone --depth 1 --branch v0.9.2 https://github.com/pantor/ruckig.git /tmp/ruckig &&
            cmake -S /tmp/ruckig -B /tmp/ruckig/build -DCMAKE_BUILD_TYPE=Release -DBUILD_EXAMPLES=OFF -DBUILD_TESTS=OFF &&
            cmake --build /tmp/ruckig/build -j$(nproc) &&
            cmake --install /tmp/ruckig/build &&
            cd test && ln -sr /fuzztest fuzztest && cd .. && mkdir -p build
          build: cd build && CC=clang CXX=clang++ cmake -DCMAKE_BUILD_TYPE=RelWithDebug -DFUZZ=on .. && cd test && cmake --build . -j$(nproc)
          test: ./fuzz_algorithm && ./fuzz_axis && ./fuzz_fbs && ./fuzz_servo
