# Simple workflow for deploying static content to GitHub Pages
name: Document

on:
  # Runs on pushes targeting the default branch. Use add-ci-doc branch for testing.
  pull_request:
  push:
    branches: ["master", "add-ci-doc"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write
  actions: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Single deploy job since we're just deploying
  doc:
    runs-on: [self-hosted, az-ch]
    container: ubuntu:jammy
    steps:
      - name: Checkout
        uses: actions/checkout@v3
      - name: Setup Pages
        uses: actions/configure-pages@v3
      - name: Delete Old Artifacts
        continue-on-error: true    
        uses: actions/github-script@v6
        id: artifact    
        with:      
            script: |
              const res = await github.rest.actions.listArtifactsForRepo({
                owner: context.repo.owner,
                repo: context.repo.repo,
              })        
              res.data.artifacts          
                .forEach(({ id }) => {
                  github.rest.actions.deleteArtifact({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    artifact_id: id,
                  })
              })
      - name: Build Pages
        run: |
          apt update
          apt-get install git python3-pip doxygen graphviz hunspell parallel -y
          pip3 install linkchecker
          doxygen ./Doxyfile
      - name: Spelling check
        run: |
          echo "Checking spelling..."
          .github/check-spelling.sh
          echo "Spelling check complete."
      - name: Link check
        continue-on-error: true
        run: |
          echo "Checking link..."
          .github/check-link.sh
          echo "Link check complete."
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Upload entire repository
          path: './doc/html'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
