[project]
name = "alert-agent-service"
version = "0.1.0"
description = "Alert Agent Service — Generic multimodal alert action dispatcher with ADK, MCP, and tool support"
requires-python = ">=3.12"
dependencies = [
    # Core framework
    "fastapi==0.141.1",
    "uvicorn==0.49.0",
    "sse-starlette==2.3.6",

    # Schemas & validation
    "pydantic==2.13.4",

    # Agentic framework
    "google-adk>=2.6.0",
    "litellm>=1.94.1",
    "orjson>=3.11.9",

    # Action tools
    "aiohttp>=3.14.3",
    "paho-mqtt>=2.1.0",

    # YAML config
    "pyyaml>=6.0.3",

    # MCP
    "fastmcp==3.4.5",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.25",
    "httpx>=0.28",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
