[tool.poetry]
name = "multimodal-embedding-serving"
version = "2.0.0"
description = "The MultiModal Embedding serving is designed to generate embeddings for text, image URLs, base64 encoded images, video URLs, and base64 encoded videos. It leverages the CLIP (Contrastive Language-Image Pretraining) model to create these embeddings."
authors = []
readme = "README.md"
packages = [{include = "src", to = "multimodal_embedding_serving"},{include = "__init__.py", to = "multimodal_embedding_serving"}]

[tool.poetry.dependencies]
python = ">=3.11,<3.14"
fastapi = ">=0.121.3,<1.0.0"   # for 0.x.y, all minor versions > x are considered breaking change, hence ^ never updates minor version here.    
uvicorn = ">=0.38.0,<1.0.0"
gunicorn = "^23.0.0"
pydantic-settings = "^2.10.1"
opencv-python-headless = "^4.11.0.86"
einops = ">=0.8.1,<1.0.0"
av = "^17.0.0"
openvino = "^2026.0.0"
optimum-intel = "^1.26.0"
httpx = ">=0.27.2,<1.0.0"
cn-clip = "^1.6.0"
open-clip-torch = "^3.1.0"
nncf = "^3.0.0"
torch = { version = "^2.8.0", source = "pytorch-cpu" }
torchvision = { version = ">=0.23.0,<1.0.0", source = "pytorch-cpu" }

[[tool.poetry.source]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
priority = "explicit"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"