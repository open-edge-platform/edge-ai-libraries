[tool.poetry]
name = "dataprep-pgvector"
version = "0.1.0"
description = "A tool for loading, parsing, and generating embeddings for PDF, DOCX, and TXT files, storing these embeddings in PGVector (Vector Store)"
authors = []
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.10"
av = "17.1.0"
beautifulsoup4 = "4.15.0"
boto3 = "1.43.49"
docarray = {extras = ["full"], version = "0.41.0"}
docx2txt = "0.9"
fastapi = "0.139.0"
gunicorn = ">=23,<27"
huggingface_hub = "0.36.2"
html2text = "2025.4.15"
langchain-core = "1.4.9"
langchain-community = ">=0.3.9,<0.5.0"
langchain-text-splitters = "1.1.2"
langchain_postgres = ">=0.0.16,<0.0.18"
langchain_openai = "^1.2.0"
markdown = "3.10.2"
psycopg = {extras = ["pool", "binary"], version = "3.3.4"}
pymupdf = "1.28.0"
python-docx = "1.2.0"
python-multipart = "0.0.32"
pydantic = "^2.9.2"
pydantic-settings = "^2.6.1"
shortuuid = "1.0.13"
structlog = "26.1.0"
pdfplumber = "0.11.10"
transformers = "4.57.6"
uvicorn = ">=0.21.0,<0.52.0"

[tool.poetry.group.dev.dependencies]
pytest = "^9.0.3"
pytest-mock = "^3.15.0"
coverage = "^7.13.0"
pytest-asyncio = "^1.3.0"
httpx = ">=0.27.2,<0.29.0"

[tool.pytest.ini_options]
asyncio_default_fixture_loop_scope = "module"

[build-system]
requires = ["poetry-core>=1.8.3"]
build-backend = "poetry.core.masonry.api"
