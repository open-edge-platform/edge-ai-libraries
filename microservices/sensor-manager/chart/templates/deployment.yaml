apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-sensor-manager
  labels:
    app.kubernetes.io/name: sensor-manager
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  replicas: 1
  # hostNetwork pods cannot overlap on the same node port during a rolling update.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: sensor-manager
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: sensor-manager
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      hostNetwork: {{ .Values.hostNetwork }}
      {{- if .Values.hostNetwork }}
      dnsPolicy: ClusterFirstWithHostNet
      {{- end }}
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        {{- if .Values.usb.enabled }}
        supplementalGroups:
          - {{ .Values.usb.videoGroupId }}
        {{- end }}
        seccompProfile:
          type: RuntimeDefault
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: sensor-manager
          image: "{{ .Values.image.registry }}{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.port }}
          env:
            - name: SENSOR_MANAGER_PORT
              value: {{ .Values.port | quote }}
            {{- range $name, $value := .Values.env }}
            - name: {{ $name }}
              value: {{ $value | quote }}
            {{- end }}
            - name: http_proxy
              value: {{ .Values.global.proxy.http_proxy | quote }}
            - name: https_proxy
              value: {{ .Values.global.proxy.https_proxy | quote }}
            - name: no_proxy
              value: {{ .Values.global.proxy.no_proxy | quote }}
          readinessProbe:
            httpGet:
              path: /api/v1/health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/v1/health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
          securityContext:
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
            {{- if .Values.usb.enabled }}
            privileged: true
            {{- else }}
            allowPrivilegeEscalation: false
            privileged: false
            {{- end }}
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            {{- if .Values.usb.enabled }}
            - name: dev
              mountPath: /dev
              readOnly: true
            {{- end }}
      volumes:
        - name: tmp
          emptyDir: {}
        {{- if .Values.usb.enabled }}
        - name: dev
          hostPath:
            path: /dev
            type: Directory
        {{- end }}
