# ============================================================================
# GPU THROTTLE execd READER  (Intel Xe DRM sysfs throttle state)
# ============================================================================
# Fills the gap qmassa leaves: qmassa reports requested (cur_freq) and
# per-engine busy %, but NOT the achieved act_freq or the throttle reasons.
# A cur>act gap with a non-zero throttle flag is the direct signal for the
# T (thermal) envelope.
# Reads xe DRM sysfs directly; idles quietly on non-Intel-GPU hosts.
# Gate with ENABLE_GPU_THROTTLE=true.
# ============================================================================

# --- GPU xe frequency + throttle state --------------------------------------
# gpu_throttle,host=..,card=cardN,gt=gtM act_freq_mhz=..,driver_freq_mhz=..,
#   throttled=..i,throttle_thermal=..i,throttle_pl1=..i,throttle_pl2=..i,
#   throttle_prochot=..i
[[inputs.execd]]
  command = ["python3", "/app/scripts/gpu_throttle_reader.py"]
  signal = "none"
  restart_delay = "10s"
  data_format = "influx"
