# ============================================================================
# DRAM BANDWIDTH  ->  dram_bw,host=..  read_gbps / write_gbps / total_gbps
# ============================================================================
# Fills TCMI's dram_read_gbps / dram_write_gbps gap WITHOUT the external Intel
# PCM binary. Reads the Intel IMC uncore free-running counters via `perf stat`
# in a small execd wrapper (scripts/dram_bw_reader.py).
#
# WHY execd + perf (and NOT the native inputs.intel_pmu plugin):
#   inputs.intel_pmu needs per-model perfmon event JSON files (not shipped in the
#   image) and cannot be used on CPUs whose model is not in those tables. Its
#   UNC_M_CAS_COUNT_RD/WR events do work (Telegraf 1.39.3, Meteor Lake: ~11.0 /
#   5.5 GB/s vs 10.6 / 5.6 GB/s from perf stat under load) but return raw,
#   multiplexed per-IMC cache-line counts, not GB/s, and the *_CAS_COUNT_FREERUN
#   events read 0. `perf stat` on the IMC free-running events (the data_read /
#   data_write aliases the kernel PMU publishes in sysfs; event=0xff,umask=0x20 /
#   0x30 on uncore_imc_free_running) gives GB/s directly and needs no per-model
#   tables.
#
# GRACEFUL DEGRADATION: the reader idles quietly (no data, no restart storm) if
#   perf is missing, perf_event_paranoid blocks it, or the IMC free-running PMU
#   is absent — the same contract as npu_reader.py / qmassa_reader.py. On a SKU
#   without these counters (e.g. Skylake-SP exposes uncore_imc_0..N, not the
#   free-running PMU) it simply produces no series.
#
# Opt-in: ENABLE_DRAM_BW=auto|true, and `perf` must be in the image (build with
#   INSTALL_PERF=true; `auto` skips the drop-in when perf is missing).
#
# Requires: perf on PATH, perf_event_paranoid <= 0, IMC free-running PMU exposed.
#   The container already runs --privileged with -v /sys and --pid host.
# ============================================================================

[[inputs.execd]]
  command = ["python3", "/app/scripts/dram_bw_reader.py"]
  signal = "none"
  restart_delay = "10s"
  data_format = "influx"
