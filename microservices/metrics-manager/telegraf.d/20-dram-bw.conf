# ============================================================================
# DRAM BANDWIDTH  ->  dram_bw,host=..  read_gbps / write_gbps / total_gbps
# ============================================================================
# Fills TCMI's dram_read_gbps / dram_write_gbps gap WITHOUT the external Intel
# PCM binary. Reads the Intel IMC uncore free-running counters via `perf stat`
# in a small execd wrapper (scripts/dram_bw_reader.py).
#
# WHY execd + perf (and NOT the native inputs.intel_pmu plugin):
#   The PTL validation target reports a MASKED CPU model ("Genuine Intel(R)
#   0000", ES/QS silicon). intel_pmu resolves named events (UNC_M_CAS_COUNT.*)
#   through a model-keyed perfmon JSON, so named-event lookup FAILS there.
#   `perf stat` on RAW free-running event codes (event=0xff,umask=0x20 read /
#   0x30 write, type uncore_imc_free_running) is model-independent and was
#   verified counting on the target. See §5 of docs/TCMI-INTEGRATION-PROPOSAL.md
#   and 20-dram-bw.conf.example (which keeps the native intel_pmu / intel_rdt
#   options documented for SKUs whose CPU model is NOT masked).
#
# GRACEFUL DEGRADATION: the reader idles quietly (no data, no restart storm) if
#   perf is missing, perf_event_paranoid blocks it, or the IMC free-running PMU
#   is absent — the same contract as npu_reader.py / qmassa_reader.py. Safe to
#   ship active: on a SKU without these counters it simply produces no series.
#
# Requires: perf on PATH, perf_event_paranoid <= 0 (PTL is -1), IMC PMU exposed.
#   The container already runs --privileged with -v /sys and --pid host.
# ============================================================================

[[inputs.execd]]
  command = ["python3", "/app/scripts/dram_bw_reader.py"]
  signal = "none"
  restart_delay = "10s"
  data_format = "influx"
