# ============================================================================
# TCMI RESIDUAL-GAP execd READERS  (metrics no native Telegraf plugin covers)
# ============================================================================
# These are the small Python readers that fill gaps left by the native plugins
# in 10-power.conf / 30-disk.conf / 40-net.conf / 50-interrupts.conf. Each
# follows the npu_reader.py contract: long-running, emits InfluxDB line
# protocol on stdout, and idles quietly (no restart storm) when its hardware or
# privilege is absent — so this file is safe to ship ACTIVE on any SKU.
#
# See docs/TCMI-INTEGRATION-PROPOSAL.md §3 (gap analysis) and §8-P2.
# ============================================================================

# --- Platform (psys) + package RAPL power -----------------------------------
# rapl_power,host=..,domain=<package-0|psys|dram|..> power_w=..
# Fills the psys gap: intel_powerstat (10-power.conf) exposes the package and
# DRAM RAPL domains but NOT the platform (intel-rapl:1 / psys) zone — the only
# Linux proxy for total board power (CPU + iGPU + NPU + memory) on Intel client
# SoCs. Reader reads every top-level RAPL zone, so package power is emitted too
# (redundant with powerstat but harmless; distinguished by the `domain` tag).
[[inputs.execd]]
  command = ["python3", "/app/scripts/rapl_reader.py"]
  signal = "none"
  restart_delay = "10s"
  data_format = "influx"

