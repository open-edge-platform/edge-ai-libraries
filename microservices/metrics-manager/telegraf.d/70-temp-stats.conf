# ============================================================================
# HIGH-FREQUENCY TEMPERATURE STATS. Disabled by default (ENABLE_TEMP_STATS=false).
# ============================================================================
# Collects CPU package temperature at 100ms and emits per-second min/max/mean.
# Kept out of the base telegraf.conf so existing deployments keep the default
# 1s temp sampling cadence and original cardinality unless they opt in.
# ============================================================================

[[inputs.temp]]
  interval = "100ms"
  name_override = "temp_highres"

[[processors.starlark]]
  namepass = ["temp_highres"]
  source = '''
def apply(metric):
    sensor = metric.tags.get("sensor", "")
    keep = sensor.startswith("coretemp_package_id_")
    return metric if keep else None
'''

[[aggregators.basicstats]]
  namepass = ["temp_highres"]
  period = "1s"
  drop_original = false
  stats = ["min", "max", "mean"]
