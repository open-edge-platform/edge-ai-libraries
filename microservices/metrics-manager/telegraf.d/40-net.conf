# Network I/O — per-interface RX/TX bytes/packets/errors/drops from
# /proc/net/dev. Native replacement for TCMI's /proc/net/dev delta collector.
#
# TCMI mapping:
#   net_rx_mbs / net_tx_mbs  <- rate(net_bytes_recv) / rate(net_bytes_sent)
# Derive the rate in Grafana/Prometheus (net reports monotonic counters).

[[inputs.net]]
  ## Physical NICs only. Mirrors monitor_io.py, which skips lo/docker0/br-*/veth*.
  interfaces = ["eth*", "en*", "wl*"]
  ## Skip the protocol-level (netstat) counters — we only want per-interface bytes.
  ignore_protocol_stats = true

# ethtool — per-NIC driver statistics (ring errors, drops, link speed). Richer
# than TCMI collects today; valuable for the I/O-concurrency (I) envelope where
# fieldbus/vision NICs drop frames under load. Available detail depends on the
# NIC driver; interfaces without ethtool support are simply skipped.
[[inputs.ethtool]]
  interface_include = ["eth*", "en*"]
  ## Some drivers expose hundreds of fields; keep the ones that matter for I/O
  ## determinism. Remove this to collect everything the driver exposes.
  # fieldpass = ["rx_packets", "tx_packets", "rx_errors", "tx_errors", "rx_dropped", "tx_dropped"]
