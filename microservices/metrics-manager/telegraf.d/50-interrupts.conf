#
# Interrupts — per-IRQ hardware interrupt counts from /proc/interrupts.
# Native replacement for TCMI's io_irq_per_sec collector. Interrupt storms on
# disk/NIC/USB IRQs are a leading cause of real-time (determinism) regressions
# in robotics — this is the core signal for the I/O-concurrency (I) envelope.
#
# TCMI mapping:
#   io_irq_per_sec{category}  <- rate(interrupts{irq=<device irq>})
# The plugin emits a counter per IRQ line; derive per-second rates in
# Grafana/Prometheus and group by the `device`/`type` tag into
# disk / usb / network categories (monitor_io.py regexes:
#   disk = nvme|sata|ahci|scsi|sd[a-z], usb = xhci|ehci|ohci, net = enp|enx|eth|ens).

[[inputs.interrupts]]
  ## Emit one metric per IRQ with irq/type/device tags (not summed per CPU line),
  ## so device IRQs can be filtered and categorised downstream.
  ##
  ## Keep ONLY numeric IRQ lines. On x86 /proc/interrupts, device IRQs are
  ## numbered (14, 120, 145, ... -> nvme0q1, enp0s31f6, xe, xhci_hcd) while the
  ## kernel's internal per-CPU housekeeping counters are SYMBOLIC and carry no
  ## device (LOC/NMI/IPI/TLB/RES/CAL and arch-specific ones such as
  ## DFR/IWI/MCE/MIS/NPI/PIN/PIW/RTR/PMI/THR/SPU/ERR/MCP/TRM). Those are
  ## scheduler/CPU noise, not device I/O, so — as TCMI's monitor_io.py does — we
  ## drop them. A denylist of symbols is whack-a-mole across SoCs (this PTL SoC
  ## alone leaks 8 arch symbols beyond the classic set); the numeric-only
  ## tagpass "[0-9]*" glob keeps exactly the device IRQs on any x86 platform,
  ## with no per-SKU maintenance. Verified on PTL: 45 numeric device IRQs kept,
  ## 8 symbolic housekeeping counters dropped, zero device IRQs lost.
  [inputs.interrupts.tagpass]
    irq = ["[0-9]*"]

  ## TCMI mapping / downstream categorisation (Grafana / Prometheus):
  ##   io_irq_per_sec{category} <- rate(interrupts{irq=<device irq>}), grouped by
  ##   the `device` tag (monitor_io.py regexes):
  ##     disk = nvme|sata|ahci|scsi|sd[a-z]   usb = xhci|ehci|ohci
  ##     net  = enp|enx|eth|ens
