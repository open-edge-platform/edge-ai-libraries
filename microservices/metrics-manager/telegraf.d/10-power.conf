#
# Intel PowerStat — CPU package / DRAM RAPL power, per-core frequency,
# C-state residency, uncore frequency and CPU temperature.
#
# Fills the Metrics Manager gap for CPU package power (TCMI cpu_power_w) and,
# where the platform exposes it, DRAM/uncore power. Reads intel-rapl, msr,
# cpufreq and intel-uncore-frequency via sysfs/devfs — no external binary.
#
# Requirements (already met by the default privileged deployment):
#   - --privileged (or CAP for /dev/cpu/*/msr), -v /sys, --pid host
#   - kernel modules: intel_rapl_common, msr, cpufreq, intel-uncore-frequency
# On a host missing these the plugin logs a warning and emits nothing; the rest
# of Telegraf is unaffected.
#
# Emitted measurements (Prometheus names via outputs.prometheus_client):
#   powerstat_package_current_power_consumption_watts   <- TCMI cpu_power_w
#   powerstat_package_current_dram_power_consumption_watts
#   powerstat_package_thermal_design_power_watts
#   powerstat_package_uncore_frequency_mhz_cur
#   powerstat_core_cpu_frequency_mhz                     <- TCMI cpu_freq_avg_mhz
#   powerstat_core_cpu_temperature_celsius
#   powerstat_core_cpu_c*_state_residency_percent
#
# NOTE on psys (TCMI psys_power_w): intel_powerstat exposes the package and DRAM
# RAPL domains, not the platform (intel-rapl:1 / psys) domain. Platform power is
# covered by the RAPL psys execd reader in 90-tcmi-execd.conf.

[[inputs.intel_powerstat]]
  ## Package-level RAPL power + thermal design power + uncore frequency.
  package_metrics = [
    "current_power_consumption",
    "current_dram_power_consumption",
    "thermal_design_power",
    "max_turbo_frequency",
    "uncore_frequency",
  ]

  ## Per-core metrics: frequency (TCMI cpu_freq_avg_mhz equivalent, per-core),
  ## temperature (adds per-core detail MM's package-only temp lacks), and
  ## C-state residency (real-time determinism signal — deep C-states raise
  ## wake-up latency).
  ## NOTE: metric names must match the Telegraf intel_powerstat plugin's
  ## supported set (validated against Telegraf 1.38). "cpu_busy_cycles" is NOT a
  ## valid option and makes the whole config fail to load — C0 residency below
  ## already captures "how busy" per core, so it is intentionally omitted.
  cpu_metrics = [
    "cpu_frequency",
    "cpu_temperature",
    "cpu_c0_state_residency",
    "cpu_c1_state_residency",
    "cpu_c6_state_residency",
  ]
