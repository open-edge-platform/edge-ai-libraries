#
# Disk I/O — read/write bytes, read/write time, and io_time (busy time).
# Native replacement for TCMI's `iostat -d -x -y 1 1` collector, without the
# ~1s blocking window iostat imposes per sample.
#
# TCMI mapping:
#   disk_r_mbs / disk_w_mbs  <- rate(diskio_read_bytes) / rate(diskio_write_bytes)
#   disk_util_pct            <- rate(diskio_io_time) / 1000 * 100   (io_time is ms busy)
# Derive the rates/util in Grafana/Prometheus (diskio reports monotonic counters).

[[inputs.diskio]]
  ## Physical devices only — skip loop/ram/dm virtual devices. Matches TCMI's
  ## monitor_io.py which drops loopN. Adjust for your storage (e.g. "sd[a-z]").
  device_tags = ["ID_MODEL", "ID_SERIAL_SHORT"]
  ## Uncomment to restrict to specific devices:
  # devices = ["nvme0n1", "sda"]
