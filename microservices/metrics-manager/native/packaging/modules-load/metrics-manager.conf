# Model-specific register interface, used by qmassa to read GPU power and
# package temperature.
#
# Without this module /dev/cpu/*/msr does not exist and qmassa reports empty
# power and temperature arrays without logging a reason, so the loss is easy to
# mistake for unsupported hardware.
msr
