# Runtime directory shared by the Metrics Manager services.
#
# The directory is owned by the unprivileged service user because Telegraf has
# to create its ingest socket in it. Neither entry is world-writable: anything
# able to write here can fabricate telemetry, and on a host with other users
# that is a real distinction rather than a theoretical one.
d /run/metrics-manager 0750 metrics-manager metrics-manager -

# FIFO carrying qmassa's JSON stream to mm-plugin-gpu.
#
# Created here rather than by the service so that ownership is fixed before
# either end opens it: root writes, the service user reads, and nobody else can
# do either.
p /run/metrics-manager/qmassa.fifo 0640 root metrics-manager -
