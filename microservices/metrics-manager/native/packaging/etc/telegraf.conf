# =============================================================================
# Telegraf configuration for the bare-metal Metrics Manager package
# =============================================================================
#
# This file collects the same measurements as the container configuration and
# exposes them on the same Prometheus endpoint, so mm-tui and any existing
# dashboard see an identical set of metrics either way.
#
# It differs from the container in two respects, both consequences of the fact
# that a package installs onto a machine that has other users and other
# services on it.
#
# Privilege boundary
#   In the container every process runs as root. Here Telegraf runs as the
#   unprivileged metrics-manager user, because it is the only component with an
#   attack surface: it listens on a socket, parses input from it, and executes
#   the operator's custom-metrics scripts.
#
#   Collectors that genuinely need root therefore cannot run as execd children,
#   since an execd child inherits Telegraf's privileges. They run as their own
#   systemd services and deliver their samples through the socket_listener
#   input below. See the "Privileged collectors" section for how to add one.
#
# Reachability
#   Both listeners are bound to the loopback interface. The container published
#   ports deliberately; a host service that exposed unauthenticated telemetry
#   and an unauthenticated metric ingest endpoint to the network would be a
#   defect. Put a reverse proxy in front if remote scraping is required.
#
# Local changes belong in /etc/metrics-manager/telegraf.d/*.conf, which is read
# after this file and is not overwritten on upgrade.
# =============================================================================

# -----------------------------------------------------------------------------
# Global agent configuration
# -----------------------------------------------------------------------------
[agent]
  ## Default data collection interval for all inputs
  interval = "1s"

  ## Override the `host` tag on every metric. The packaged unit always defines
  ## this variable, empty by default, which Telegraf reads as "use the kernel
  ## hostname". Setting it in /etc/metrics-manager/metrics-manager.env keeps a
  ## stable `host=` label across reboots and reaches the native plugins too,
  ## which honour the same variable.
  hostname = "${METRICS_MANAGER_HOSTNAME}"

  ## Rounds collection interval to 'interval'
  round_interval = true

  ## Telegraf will send metrics to outputs in batches
  metric_batch_size = 2000

  ## Maximum number of unwritten metrics per output
  metric_buffer_limit = 20000

  ## Collection jitter
  collection_jitter = "0s"

  ## Default flushing interval for all outputs
  flush_interval = "1s"

  ## Jitter the flush interval
  flush_jitter = "0s"

  ## Precision for timestamps
  precision = "1s"

  ## Log at debug level
  debug = false

  ## Log only error level messages. Everything goes to the journal, so use
  ## `journalctl -u metrics-manager-telegraf` to read it.
  quiet = true

# -----------------------------------------------------------------------------
# Unprivileged inputs
#
# Everything in this section reads world-readable files under /proc and /sys,
# so it runs inside Telegraf itself.
# -----------------------------------------------------------------------------

# CPU usage metrics
[[inputs.cpu]]
  percpu = false
  totalcpu = true
  collect_cpu_time = false
  report_active = false
  core_tags = false
  fieldinclude = ["usage_user", "usage_system", "usage_idle"]

# Memory usage metrics
[[inputs.mem]]
  fieldinclude = ["used_percent", "available_percent", "total", "used"]

# CPU frequency, split by core class (P / E / low-power E).
# Reads sysfs topology and cpufreq only; no privileges are required.
[[inputs.execd]]
  command = ["/usr/libexec/metrics-manager/mm-plugin-cpu"]
  data_format = "influx"

# GPU metrics, parsed from the JSON stream that the qmassa service writes.
# The plugin only reads the FIFO, so it stays unprivileged; qmassa is the part
# that needs root, and it runs as metrics-manager-qmassa.service.
[[inputs.execd]]
  command = [
    "/usr/libexec/metrics-manager/mm-plugin-gpu",
    "-fifo", "/run/metrics-manager/qmassa.fifo",
    ## Which processes are using the GPU, capped at the ten busiest per device.
    ## The cap matters: these points are tagged with a process id, so reporting
    ## every process would add a time series for each one that ever touches the
    ## GPU. Raise it, or pass 0 for no cap, if you would rather have the full
    ## picture than a bounded endpoint.
    "-clients",
    "-clients-limit", "10",
  ]
  data_format = "influx"

# Temperature sensors. coretemp exposes hwmon entries as world-readable.
[[inputs.temp]]
  ## Collects all temperature sensors

# -----------------------------------------------------------------------------
# Privileged collectors
#
# This input is the far side of the privilege boundary. Any collector that
# needs more than Telegraf has connects to this socket and writes InfluxDB Line
# Protocol into it, exactly as it would write to stdout under execd.
#
# To add one:
#   1. Give the collector `-out unix:///run/metrics-manager/collect.sock`.
#      Plugins built from this repository take that flag; anything else only
#      has to connect and write lines.
#   2. Install a systemd unit for it modelled on metrics-manager-npu.service,
#      which documents the hardening that applies to a root collector.
#   3. Leave this file alone. The socket multiplexes, so no configuration
#      change is needed for each new collector.
#
# The socket is created by Telegraf and owned by the metrics-manager user, so
# only that user and root can write to it. That matters: anything able to write
# here can fabricate arbitrary metrics.
# -----------------------------------------------------------------------------
[[inputs.socket_listener]]
  service_address = "unix:///run/metrics-manager/collect.sock"
  socket_mode = "0660"
  data_format = "influx"

# -----------------------------------------------------------------------------
# Operator-supplied metrics
# -----------------------------------------------------------------------------

# Executable scripts dropped into /etc/metrics-manager/custom-metrics.d/, in the
# style of /etc/cron.daily. Each script writes InfluxDB Line Protocol on stdout.
#
# The directory is root-owned and not writable by the metrics-manager user, so
# a compromise of Telegraf cannot plant a script here. The scripts run with
# Telegraf's own privileges, which is to say almost none; a script that needs
# more belongs behind the privilege boundary above, not here.
[[inputs.exec]]
  commands = ["/bin/sh -c 'for f in /etc/metrics-manager/custom-metrics.d/*; do [ -f \"$f\" ] && [ -x \"$f\" ] && \"$f\"; done 2>/dev/null; true'"]
  timeout = "5s"
  data_format = "influx"
  interval = "10s"

# Accept InfluxDB Line Protocol over HTTP, for programs that already speak it.
#
# Bound to loopback: the endpoint is unauthenticated, so anything that can
# reach it can inject metrics.
[[inputs.http_listener_v2]]
  service_address = "127.0.0.1:8186"
  paths = ["/write"]
  methods = ["POST"]
  data_format = "influx"
  read_timeout = "10s"
  write_timeout = "10s"

# -----------------------------------------------------------------------------
# Filters
# -----------------------------------------------------------------------------

# Keep only the CPU package temperature, discarding the per-core sensors.
[[processors.starlark]]
  namepass = ["temp"]
  source = '''
def apply(metric):
    return metric if metric.tags.get("sensor", "").startswith("coretemp_package_id_") else None
'''

# -----------------------------------------------------------------------------
# Output
# -----------------------------------------------------------------------------

# Prometheus endpoint, scraped by mm-tui and by any local Prometheus.
[[outputs.prometheus_client]]
  listen = "127.0.0.1:9273"
  metric_version = 1
  path = "/metrics"
  collectors_exclude = ["gocollector", "process"]
  string_as_label = true
  export_timestamp = true
