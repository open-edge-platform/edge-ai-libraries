#
# Platform power and idle-state telemetry.
#
# This is a second Telegraf instance, not a second copy of the first. It exists
# because these readings come from model-specific registers and from RAPL
# counters that are root-readable only, and the Telegraf that serves the
# endpoint deliberately holds no privileges at all. Rather than granting
# capabilities to the process that runs operator-supplied scripts, the
# privileged collection happens here and arrives over the same unix socket that
# every other privileged collector uses.
#
# Nothing is exposed from this instance: it has one output, and it is a socket.

[agent]
  interval = "1s"
  flush_interval = "1s"
  round_interval = true
  precision = "1s"
  omit_hostname = false
  hostname = "${METRICS_MANAGER_HOSTNAME}"
  quiet = true

[[inputs.intel_powerstat]]
  ## Package-level readings.
  ##
  ## "current_dram_power_consumption" is deliberately absent. Where the DRAM
  ## RAPL domain is not exposed, which is the case on many mobile parts, asking
  ## for it logs an error on every single interval rather than being skipped
  ## the way an unsupported C-state is. Add it only after confirming that
  ## /sys/class/powercap contains a dram subzone.
  package_metrics = [
    "current_power_consumption",
    "thermal_design_power",
    "cpu_base_frequency",
    "max_turbo_frequency",
    "uncore_frequency",
  ]

  ## Idle-state residency, per logical CPU.
  ##
  ## Unsupported states are detected and skipped with a single warning, so this
  ## list is safe to carry across platforms; on a machine that lacks C3 the
  ## plugin says so once and moves on.
  ##
  ## This is the one setting that grows the endpoint noticeably: four states on
  ## every logical CPU. Narrow it with included_cpus if that matters more than
  ## seeing every core.
  cpu_metrics = [
    "cpu_c0_state_residency",
    "cpu_c1_state_residency",
    "cpu_c6_state_residency",
    "cpu_c7_state_residency",
  ]

  ## Reading an MSR can block on a heavily loaded machine. Failing the interval
  ## is better than letting the agent pile up gather routines.
  msr_read_timeout = "100ms"

[[outputs.socket_writer]]
  address = "unix:///run/metrics-manager/collect.sock"
  data_format = "influx"
