# Apply with ./configure-metrics.sh (requires an installed Metrics Manager package).
# true: enable; false: disable; auto: leave the current configuration unchanged.
# Missing options also mean auto. Enable values are lowercase, without quotes.

# Package/platform power from the separate RAPL service.
ENABLE_RAPL=true
# Per-CPU frequency and temperature in the privileged powerstat collector.
ENABLE_POWERSTAT_EXTRA=true
# Requires TURBOSTAT_BIN (default /usr/bin/turbostat) matching the running kernel.
ENABLE_TURBOSTAT=true
# High-resolution temperature samples and min/max/mean aggregates.
ENABLE_TEMPERATURE=true
# Per-device IRQ counters.
ENABLE_INTERRUPTS=true
# Network traffic and NIC driver counters; review interface selection.
ENABLE_NETWORK=true
# Host-side veth*/lxc* traffic and NIC driver counters; independent of ENABLE_NETWORK.
# Does not enter container network namespaces. Keep interface selections disjoint.
ENABLE_NETWORK_VIRTUAL=true
# Filesystem usage and disk I/O; review mount point and device selection.
ENABLE_STORAGE=true

# Optional startup settings, persisted in /etc/metrics-manager/metrics-manager.env.
# Uncomment to change; omitted settings retain their installed values.
# Values are unquoted literals (no shell expansion).
# Positive integer seconds between Turbostat samples (default 5).
#TURBOSTAT_INTERVAL=5
# Absolute path on this host, not a container bind mount. The default wrapper
# /usr/bin/turbostat selects the kernel tools on supported distributions.
#TURBOSTAT_BIN=/usr/bin/turbostat
# Stable host tag for every collector. Empty resets to the kernel hostname.
#METRICS_MANAGER_HOSTNAME=lab-node-42
