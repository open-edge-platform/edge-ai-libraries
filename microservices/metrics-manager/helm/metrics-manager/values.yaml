#
# Default values for metrics-manager.
# Override any of these with `--set foo.bar=...` or `-f my-values.yaml`.
# To print the rendered defaults from the published OCI artifact, run:
#   helm show values oci://registry-1.docker.io/intel/metrics-manager \
#     --version <X.Y.Z>-helm
# See docs/user-guide/get-started/deploy-with-helm.md.

# -----------------------------------------------------------------------------
# Container image
# -----------------------------------------------------------------------------
image:
  repository: docker.io/intel/metrics-manager
  # Defaults to .Chart.AppVersion. For RC validation use 2026.3.0-rc1
  # or 2026.3.0-extended-rc1; the tag, not a chart flag, selects OpenVINO.
  tag: ""
  pullPolicy: IfNotPresent

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

# -----------------------------------------------------------------------------
# Workload kind
# -----------------------------------------------------------------------------
# `Deployment` (default): single instance, suitable for collecting metrics
#   from a fixed node via nodeSelector or for service-level metrics.
# `DaemonSet`: one pod per node, suitable for cluster-wide hardware telemetry.
controller:
  kind: Deployment
  replicaCount: 1
  # Scheduling constraints. Applied to the pod template, so they take
  # effect for both Deployment and DaemonSet workloads.
  nodeSelector: {}
  tolerations: []
  affinity: {}

# -----------------------------------------------------------------------------
# Pod-level configuration
# -----------------------------------------------------------------------------
pod:
  # Host process visibility for native process/GPU client collectors.
  # The explicit hardware profile enables this, equivalent to pid: host.
  hostPID: false
  fsGroup: 10001
  supplementalGroups: []
  # CPU/RAM/temperature/GPU/NPU readers all read sysfs from the host and do not
  # need hostNetwork. Enable it only to opt in to host-NIC telemetry: it makes
  # net/ethtool read the host's physical NICs instead of the pod's virtual
  # interface, mirroring the opt-in `metrics-manager-host-nic` Compose profile.
  # This changes the pod's networking model (service discovery, port access)
  # for existing consumers, so it is never enabled implicitly by
  # hardware.telemetry.enabled - set it explicitly after reviewing the impact.
  hostNetwork: false
  # Leave dnsPolicy empty to let the chart pick a sensible default:
  #   * ClusterFirstWithHostNet when hostNetwork=true (required by the
  #     Kubernetes API server)
  #   * ClusterFirst otherwise
  # Set explicitly to override (e.g. "Default", "None").
  dnsPolicy: ""
  restartPolicy: Always
  # Default ServiceAccount can be overridden if your cluster has admission
  # controllers that require a specific identity.
  serviceAccount:
    create: true
    name: ""
    annotations: {}
  podAnnotations: {}
  podLabels: {}
  priorityClassName: ""

# -----------------------------------------------------------------------------
# Container security context
# -----------------------------------------------------------------------------
# Secure defaults run the container as non-root without host namespaces or
# privileged access. Enable hardware.telemetry for full host telemetry.
securityContext:
  privileged: false
  allowPrivilegeEscalation: false
  runAsNonRoot: true
  runAsUser: 10001
  runAsGroup: 10001
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL
  # Secure defaults use RuntimeDefault profiles. The hardware telemetry
  # profile switches to Unconfined to match the Compose hardware mode.
  #
  # `appArmorProfile` is a native container security-context field added in
  # Kubernetes 1.30. The chart auto-detects the API version and renders
  # either the native field (>= 1.30) or the legacy
  # `container.apparmor.security.beta.kubernetes.io/<name>` pod annotation
  # (< 1.30). Set `appArmorProfileForce: true` to force the native field
  # even when KubeVersion reports an older minor (useful for `helm template`
  # when targeting a specific cluster).
  appArmorProfile:
    type: RuntimeDefault
  appArmorProfileForce: false
  seccompProfile:
    type: RuntimeDefault

# -----------------------------------------------------------------------------
# Hardware access
# -----------------------------------------------------------------------------
hardware:
  # Set to true to enable host-level GPU/NPU and system telemetry. This
  # requires privileged access, hostPID and hostPath mounts.
  telemetry:
    enabled: false
  gpuRenderGroup: 992
  # Mount /dev/dri so qmassa can enumerate Intel(R) GPU render nodes when
  # hardware telemetry is enabled.
  gpu:
    enabled: true
  # NPU inference in the extended image needs /dev/accel. PMT telemetry
  # uses /sys and does not need this optional inference device mount.
  npu:
    enabled: false
  # Explicit opt-in: host /dev/cpu must exist (load msr on the host first).
  msr:
    enabled: false
  # Optional host-installed executable compatible with the container.
  # Requires telemetry + msr and config.enableTurbostat=true.
  turbostat:
    hostPath: ""

# -----------------------------------------------------------------------------
# Container ports + Service
# -----------------------------------------------------------------------------
service:
  type: ClusterIP
  # Port the FastAPI REST + SSE endpoint listens on.
  metricsPort: 9090
  # Telegraf's [[outputs.prometheus_client]] (scraped by Prometheus,
  # Grafana, the SSE poller etc.).
  telegrafPort: 9273
  # Telegraf's [[inputs.http_listener_v2]] (Influx Line Protocol POSTs).
  telegrafHttpPort: 8186
  annotations: {}
  # Set to NodePort or LoadBalancer for external access.
  nodePorts:
    metrics: ""
    telegraf: ""
    telegrafHttp: ""

# -----------------------------------------------------------------------------
# Application configuration (every value below maps 1:1 to an environment
# variable. See docs/user-guide/get-started/environment-variables.md.)
# -----------------------------------------------------------------------------
config:
  logLevel: INFO
  logFormat: json
  corsOrigins: "*"
  metricsRetentionSeconds: 300
  maxMetricsBatchSize: 1000
  # Empty -> spec.nodeName for hardware telemetry; pod hostname otherwise.
  # Avoid a shared override for DaemonSets: each node needs a distinct label.
  hostnameOverride: ""

  # Native 2026.3.0 optional additions. Base hardware telemetry already
  # includes process, memory-bandwidth and package power/C-state collectors.
  # Boolean values and exact strings "true"/"false" are accepted.
  enableRapl: "false"
  enablePowerstatExtra: "false"
  enableTemperature: "false"
  enableInterrupts: "false"
  enableNetwork: "false"
  enableNetworkVirtual: "false"
  enableStorage: "false"
  enableTurbostat: "false"
  turbostatInterval: "5"

  # Free-form extra environment variables. Use this for any setting not
  # surfaced as a typed value above (e.g. RATE_LIMIT_*, TRUST_FORWARDED_*).
  # Each item must be a {name, value} pair.
  extraEnv: []
  #  - name: RATE_LIMIT_REQUESTS_PER_MINUTE
  #    value: "300"

# -----------------------------------------------------------------------------
# Telegraf configuration
# -----------------------------------------------------------------------------
# Set telegraf.config to a string to ship a custom telegraf.conf via a
# generated ConfigMap, mounted read-only. When empty, the restricted profile
# uses the chart's CPU/memory/process/API configuration, while the hardware
# profile uses the image's native telegraf.conf.
telegraf:
  config: ""
  # Additional *.conf files, snapshotted by the existing image entrypoint.
  # Files are configuration, not Helm templates; never put secrets here.
  extraConfigs: {}

# -----------------------------------------------------------------------------
# Custom metrics directory (/app/custom-metrics)
# -----------------------------------------------------------------------------
# `emptyDir` (default): scripts dropped at runtime live for the pod's
#   lifetime. Best for testing.
# `pvc`: bind a PersistentVolumeClaim (existing or generated). Best when
#   you ship scripts via a sidecar / init job and want them to survive
#   pod restarts.
# `none`: skip the volume. With a read-only root filesystem, file uploads
# cannot persist; HTTP metric ingestion is unaffected.
customMetrics:
  enabled: true
  storage: emptyDir          # emptyDir | pvc | none
  existingClaim: ""          # used when storage=pvc and you already have one
  # When storage=pvc and existingClaim is empty, a PVC is generated:
  size: 100Mi
  storageClassName: ""
  accessModes:
    - ReadWriteOnce

# -----------------------------------------------------------------------------
# Resource requests / limits
# -----------------------------------------------------------------------------
resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: 1000m
    memory: 512Mi

# -----------------------------------------------------------------------------
# Probes
# -----------------------------------------------------------------------------
livenessProbe:
  httpGet:
    path: /health
    port: metrics
  initialDelaySeconds: 30
  periodSeconds: 30
  timeoutSeconds: 10
  failureThreshold: 3

readinessProbe:
  httpGet:
    path: /health
    port: metrics
  initialDelaySeconds: 10
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 3

# -----------------------------------------------------------------------------
# ServiceMonitor (Prometheus Operator)
# -----------------------------------------------------------------------------
# When enabled, generate a ServiceMonitor that scrapes the Telegraf
# Prometheus port. Requires `monitoring.coreos.com/v1` CRDs in the
# cluster (Prometheus Operator).
serviceMonitor:
  enabled: false
  interval: 30s
  scrapeTimeout: 10s
  namespace: ""
  labels: {}
  annotations: {}
