{{- if .Values.telegraf.extraConfigs -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "metrics-manager.fullname" . }}-dropins
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "metrics-manager.labels" . | nindent 4 }}
data:
  {{- range $name, $config := .Values.telegraf.extraConfigs }}
  {{ $name }}: |-
{{ $config | indent 4 }}
  {{- end }}
{{- end }}
