{{- if or .Values.telegraf.config (not .Values.hardware.telemetry.enabled) -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "metrics-manager.fullname" . }}-telegraf
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "metrics-manager.labels" . | nindent 4 }}
data:
  telegraf.conf: |-
{{- if .Values.telegraf.config }}
{{ .Values.telegraf.config | indent 4 }}
{{- else }}
{{ .Files.Get "files/telegraf-restricted.conf" | indent 4 }}
{{- end }}
{{- end }}
