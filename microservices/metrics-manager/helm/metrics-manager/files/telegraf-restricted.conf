# No host devices, PMT, perf, MSR or qmassa are required by this profile.
# CPU/sysfs and memory can describe the node; process visibility is pod-local.
[agent]
  interval = "1s"
  flush_interval = "1s"
  hostname = "${METRICS_MANAGER_HOSTNAME}"
  metric_batch_size = 2000
  metric_buffer_limit = 20000
  quiet = true

[[inputs.cpu]]
  percpu = false
  totalcpu = true
  collect_cpu_time = false
  report_active = false
  core_tags = false
  fieldinclude = ["usage_user", "usage_system", "usage_idle"]

[[inputs.mem]]
  fieldinclude = ["used_percent", "available_percent", "total", "used"]

[[inputs.execd]]
  command = ["/usr/libexec/metrics-manager/mm-plugin-cpu"]
  data_format = "influx"

[[inputs.execd]]
  command = ["/usr/libexec/metrics-manager/mm-plugin-proc", "-limit", "10"]
  data_format = "influx"

[[inputs.exec]]
  commands = ["/bin/sh -c 'for f in /app/custom-metrics/*.sh /app/custom-metrics/*.py; do [ -f \"$f\" ] && [ -x \"$f\" ] && \"$f\"; done 2>/dev/null; true'"]
  timeout = "5s"
  interval = "10s"
  data_format = "influx"

[[outputs.prometheus_client]]
  listen = ":${TELEGRAF_PORT}"
  metric_version = 1
  path = "/metrics"
  collectors_exclude = ["gocollector", "process"]
  string_as_label = true
  export_timestamp = true

[[inputs.http_listener_v2]]
  service_address = ":${TELEGRAF_HTTP_PORT}"
  paths = ["/write"]
  methods = ["POST"]
  data_format = "influx"
  read_timeout = "10s"
  write_timeout = "10s"
