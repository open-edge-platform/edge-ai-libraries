# =============================================================================
# Telegraf Configuration for Metrics Manager
# =============================================================================
#
# This configuration collects system metrics and exposes them via:
# 1. Prometheus endpoint (scraped by the Metrics Manager for SSE streaming)
#
# To use a custom configuration, mount your own config file to:
#   /etc/telegraf/telegraf.conf
#
# Or mount additional configs to /etc/telegraf/telegraf.d/
#
# =============================================================================

# -----------------------------------------------------------------------------
# Global Agent Configuration
# -----------------------------------------------------------------------------
[agent]
  ## Default data collection interval for all inputs
  interval = "1s"

  ## Override the `host` tag on every metric. When METRICS_MANAGER_HOSTNAME is
  ## unset this expands to an empty string, which Telegraf treats as "use the
  ## kernel hostname" (its default behaviour). When set, every metric -
  ## including those emitted by qmassa_reader.py and npu_reader.py, which
  ## honour the same env var - carries the override value, so Grafana
  ## dashboards keep a stable `host=` label across reboots.
  hostname = "${METRICS_MANAGER_HOSTNAME}"

  ## Rounds collection interval to 'interval'
  round_interval = true

  ## Telegraf will send metrics to outputs in batches
  metric_batch_size = 2000

  ## Maximum number of unwritten metrics per output
  metric_buffer_limit = 20000

  ## Collection jitter
  collection_jitter = "0s"

  ## Default flushing interval for all outputs
  flush_interval = "1s"

  ## Jitter the flush interval
  flush_jitter = "0s"

  ## Precision for timestamps
  precision = "1s"

  ## Log at debug level
  debug = false

  ## Log only error level messages
  quiet = true

# -----------------------------------------------------------------------------
# Input Plugins - System Metrics
# -----------------------------------------------------------------------------

# CPU usage metrics
[[inputs.cpu]]
  percpu = false
  totalcpu = true
  collect_cpu_time = false
  report_active = false
  core_tags = false
  fieldinclude = ["usage_user", "usage_system", "usage_idle"]

# Memory usage metrics
[[inputs.mem]]
  fieldinclude = ["used_percent", "available_percent", "total", "used"]

# CPU frequency (via script)
[[inputs.exec]]
  commands = ["/app/scripts/read_cpu_freq.sh"]
  data_format = "influx"
  interval = "1s"

# GPU metrics via qmassa (Intel GPUs)
[[inputs.execd]]
  command = ["python3", "/app/scripts/qmassa_reader.py"]
  data_format = "influx"

# NPU metrics via custom reader (Intel NPU / VPU)
[[inputs.execd]]
  command = ["python3", "/app/scripts/npu_reader.py"]
  data_format = "influx"

# Temperature sensors
[[inputs.temp]]
  ## Collects all temperature sensors.
  ##
  ## Sampled at 100ms rather than the 1s [agent] default because a thermal
  ## sensor is an *instantaneous* reading: a spike shorter than the sampling
  ## period is simply never observed, so a 1s-sampled Max under-reports real
  ## peaks. Measured on an idle system, sysfs at 1s caught transients that a
  ## 2s-resolution view missed entirely. The aggregator below turns these fast
  ## samples into a trustworthy per-second min/max/mean.
  ##
  ## Cost is a handful of small sysfs reads per tick; the sensor set is already
  ## bounded to 9 series by the starlark processor below.
  interval = "100ms"

# Filter temperature sensors to the CPU package sensor only to keep cardinality
# bounded for all existing deployments. The coretemp_core_*, nvme_composite, and
# acpitz additions were reverted: they add per-core series multiplied by core
# count with no toggle to disable, which constitutes an unannounced breaking
# cardinality increase. Extend this filter in your custom telegraf.conf if you
# need the wider set.
[[processors.starlark]]
  namepass = ["temp"]
  source = '''
def apply(metric):
    sensor = metric.tags.get("sensor", "")
    keep = sensor.startswith("coretemp_package_id_")   # CPU package temp only
    return metric if keep else None
'''

# Per-second min/max/mean over the 100ms temperature samples above.
#
# Why this exists: peak fidelity must be established where the sampling happens,
# not downstream. Any consumer computing max_over_time() in Grafana can only see
# what survived the scrape, so its "Max" is really a property of the scrape
# cadence. Aggregating here captures the true peak at collection time and it
# then survives any scrape interval -- a 10s scrape still reports real 100ms
# peaks.
#
# Emits temp_temp_min / temp_temp_max / temp_temp_mean alongside the raw
# temp_temp series (drop_original = false keeps existing panels working).
#
# Scoped to `temp` deliberately. Applying basicstats globally would triple all
# ~950 series for no benefit, and the power measurements do not need it:
# RAPL exposes an *integrating* energy counter, so a 1s energy delta is already
# the exact average power over that second -- no energy is aliased away the way
# an instantaneous temperature reading is. Widen namepass only if you need
# intra-second power peaks specifically.
[[aggregators.basicstats]]
  namepass = ["temp"]
  period = "1s"
  drop_original = false
  stats = ["min", "max", "mean"]

# User-provided custom metrics via executable scripts
# Place shell scripts (.sh) or Python scripts (.py) in /app/custom-metrics/
# Scripts should output InfluxDB Line Protocol format on stdout
# Example: my_sensor.py → outputs: "my_metric value=42"
[[inputs.exec]]
  commands = ["/bin/sh -c 'for f in /app/custom-metrics/*.sh /app/custom-metrics/*.py; do [ -f \"$f\" ] && [ -x \"$f\" ] && \"$f\"; done 2>/dev/null; true'"]
  timeout = "5s"
  data_format = "influx"
  interval = "10s"

# -----------------------------------------------------------------------------
# Output Plugins
# -----------------------------------------------------------------------------

# Prometheus metrics endpoint (for scraping)
[[outputs.prometheus_client]]
  listen = ":9273"
  metric_version = 1
  path = "/metrics"
  collectors_exclude = ["gocollector", "process"]
  string_as_label = true
  export_timestamp = true

# -----------------------------------------------------------------------------
# Additional Input Examples (commented out)
# -----------------------------------------------------------------------------

# Uncomment to enable disk metrics
# [[inputs.disk]]
#   ignore_fs = ["tmpfs", "devtmpfs", "devfs", "overlay", "aufs", "squashfs"]

# Uncomment to enable network metrics
# [[inputs.net]]
#   interfaces = ["eth*", "en*"]
#   ignore_protocol_stats = true

# Uncomment to enable Docker metrics
# [[inputs.docker]]
#   endpoint = "unix:///var/run/docker.sock"
#   gather_services = false
#   container_name_include = []
#   container_name_exclude = []
#   timeout = "5s"
#   perdevice = false
#   total = true

# Uncomment to scrape Prometheus endpoints
# [[inputs.prometheus]]
#   urls = ["http://localhost:8080/metrics"]
#   metric_version = 2

# -----------------------------------------------------------------------------
# HTTP Listener for pushing metrics (InfluxDB Line Protocol)
#
# Used by the Metrics Manager FastAPI app (app/store.py) to persist custom
# metrics ingested via /api/v1/metrics* so they show up on the Prometheus
# endpoint (and therefore the SSE stream). Can also be used directly by any
# client that already speaks InfluxDB Line Protocol.
# -----------------------------------------------------------------------------

# Accept InfluxDB Line Protocol via HTTP
[[inputs.http_listener_v2]]
  service_address = ":8186"
  paths = ["/write"]
  methods = ["POST"]
  data_format = "influx"
  read_timeout = "10s"
  write_timeout = "10s"
