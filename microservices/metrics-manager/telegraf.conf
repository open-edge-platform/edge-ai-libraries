# =============================================================================
# Telegraf Configuration for Metrics Manager
# =============================================================================
#
# This configuration collects system metrics and exposes them via:
# 1. Prometheus endpoint (scraped by the Metrics Manager for SSE streaming)
#
# To use a custom configuration, mount your own config file to:
#   /etc/telegraf/telegraf.conf
#
# Or mount additional configs to /etc/telegraf/telegraf.d/
#
# =============================================================================

# -----------------------------------------------------------------------------
# Global Agent Configuration
# -----------------------------------------------------------------------------
[agent]
  ## Default data collection interval for all inputs
  interval = "1s"

  ## Override the `host` tag on every metric. When METRICS_MANAGER_HOSTNAME is
  ## unset this expands to an empty string, which Telegraf treats as "use the
  ## kernel hostname" (its default behaviour). When set, every metric -
  ## including those emitted by the native GPU and NPU plugins, which honour
  ## the same env var - carries the override value, so Grafana dashboards keep
  ## a stable `host=` label across reboots.
  hostname = "${METRICS_MANAGER_HOSTNAME}"

  ## Rounds collection interval to 'interval'
  round_interval = true

  ## Telegraf will send metrics to outputs in batches
  metric_batch_size = 2000

  ## Maximum number of unwritten metrics per output
  metric_buffer_limit = 20000

  ## Collection jitter
  collection_jitter = "0s"

  ## Default flushing interval for all outputs
  flush_interval = "1s"

  ## Jitter the flush interval
  flush_jitter = "0s"

  ## Precision for timestamps
  precision = "1s"

  ## Log at debug level
  debug = false

  ## Log only error level messages
  quiet = true

# -----------------------------------------------------------------------------
# Input Plugins - System Metrics
# -----------------------------------------------------------------------------

# CPU usage metrics
[[inputs.cpu]]
  percpu = false
  totalcpu = true
  collect_cpu_time = false
  report_active = false
  core_tags = false
  fieldinclude = ["usage_user", "usage_system", "usage_idle"]

# Memory usage metrics
[[inputs.mem]]
  fieldinclude = ["used_percent", "available_percent", "total", "used"]

# CPU frequency, split by core class (P / E / low-power E)
# The plugin keeps emitting the cpu_frequency_avg measurement that the previous
# shell script produced, and adds a per-class breakdown alongside it.
[[inputs.execd]]
  command = ["/usr/libexec/metrics-manager/mm-plugin-cpu"]
  data_format = "influx"

# GPU metrics via qmassa (Intel GPUs)
[[inputs.execd]]
  command = ["/usr/libexec/metrics-manager/mm-plugin-gpu", "-clients", "-clients-limit", "10"]
  data_format = "influx"

# NPU metrics via PMT telemetry sysfs (Intel NPU / VPU)
[[inputs.execd]]
  command = ["/usr/libexec/metrics-manager/mm-plugin-npu"]
  data_format = "influx"

# Busiest processes by CPU and by resident memory.
#
# The limit applies to each ranking and the two are combined, so 10 publishes
# up to twenty rows. Each row is a time series tagged with a process id, so
# raising it raises how fast a Prometheus scrape accumulates series.
[[inputs.execd]]
  command = ["/usr/libexec/metrics-manager/mm-plugin-proc", "-limit", "10"]
  data_format = "influx"

# System memory bandwidth from the integrated memory controller.
#
# This is whole-package DRAM throughput, not per-device GPU bandwidth: neither
# i915 nor xe publishes a byte counter per device, so per-device bandwidth
# cannot be measured on an Intel GPU. On a machine whose GPU has no dedicated
# memory it is still the closest signal, because the GPU competes for exactly
# this bandwidth.
#
# Reading it goes through perf and needs CAP_PERFMON, which the container
# already has by running as root.
[[inputs.execd]]
  command = ["/usr/libexec/metrics-manager/mm-plugin-membw"]
  data_format = "influx"

# Platform power, thermal design power and idle-state residency.
#
# Reads model-specific registers and RAPL counters, both of which need
# privileges. In the container every process already runs as root, so this sits
# in the main agent; the bare-metal package runs it as a separate service
# because there Telegraf is unprivileged.
#
# Requires the msr kernel module on the host. Without it the package power and
# C-state fields are simply absent.
[[inputs.intel_powerstat]]
  ## "current_dram_power_consumption" is omitted on purpose: where the DRAM
  ## RAPL domain is missing, which is common on mobile parts, requesting it
  ## logs an error on every interval instead of being skipped the way an
  ## unsupported C-state is.
  package_metrics = [
    "current_power_consumption",
    "thermal_design_power",
    "cpu_base_frequency",
    "max_turbo_frequency",
    "uncore_frequency",
  ]
  ## Four idle states on every logical CPU. Unsupported ones are detected and
  ## skipped with a single warning.
  cpu_metrics = [
    "cpu_c0_state_residency",
    "cpu_c1_state_residency",
    "cpu_c6_state_residency",
    "cpu_c7_state_residency",
  ]
  msr_read_timeout = "100ms"

# Temperature sensors
[[inputs.temp]]
  ## Collects all temperature sensors

# Filter temperature to only include CPU package temperature
[[processors.starlark]]
  namepass = ["temp"]
  source = '''
def apply(metric):
    return metric if metric.tags.get("sensor", "").startswith("coretemp_package_id_") else None
'''

# User-provided custom metrics via executable scripts
# Place shell scripts (.sh) or Python scripts (.py) in /app/custom-metrics/
# Scripts should output InfluxDB Line Protocol format on stdout
# Example: my_sensor.py → outputs: "my_metric value=42"
[[inputs.exec]]
  commands = ["/bin/sh -c 'for f in /app/custom-metrics/*.sh /app/custom-metrics/*.py; do [ -f \"$f\" ] && [ -x \"$f\" ] && \"$f\"; done 2>/dev/null; true'"]
  timeout = "5s"
  data_format = "influx"
  interval = "10s"

# -----------------------------------------------------------------------------
# Output Plugins
# -----------------------------------------------------------------------------

# Prometheus metrics endpoint (for scraping)
[[outputs.prometheus_client]]
  listen = ":${TELEGRAF_PORT}"
  metric_version = 1
  path = "/metrics"
  collectors_exclude = ["gocollector", "process"]
  string_as_label = true
  export_timestamp = true

# -----------------------------------------------------------------------------
# Additional Input Examples (commented out)
# -----------------------------------------------------------------------------

# Uncomment to enable disk metrics
# [[inputs.disk]]
#   ignore_fs = ["tmpfs", "devtmpfs", "devfs", "overlay", "aufs", "squashfs"]

# Uncomment to enable network metrics
# [[inputs.net]]
#   interfaces = ["eth*", "en*"]
