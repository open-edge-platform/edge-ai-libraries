#
# Prometheus scrape job for the Metrics Manager microservice.
#
# The Metrics Manager exposes all collected telemetry in Prometheus text format
# on TCP :9273 (Telegraf's prometheus_client output). Append this block under
# `scrape_configs:` in your prometheus.yml, then hot-reload Prometheus:
#
#     curl -s -X POST http://<prometheus>:9090/-/reload   # needs --web.enable-lifecycle
#
# or restart the Prometheus container. Verify the target is UP at
# <prometheus>/targets — the job should turn green within one scrape_interval.
#
# Reachability: the default `metrics-manager` service stays on the `metric-network`
# bridge, so if Prometheus joins the same network, use the service name:
#     metrics-manager:9273
# If Prometheus runs elsewhere, use `host.docker.internal` (needs an
# extra_hosts: ["host.docker.internal:host-gateway"] entry in its compose file)
# together with whichever host port HOST_TELEGRAF_PORT maps to.
#
# If you opted into the `host-nic-telemetry` Compose profile
# (`metrics-manager-host-nic`, network_mode: host), there is no bridge
# attachment or service name to resolve — address the host directly via
# `host.docker.internal:${HOST_TELEGRAF_PORT:-9273}` (or `localhost:...` if
# Prometheus also runs with host networking).

- job_name: metrics-manager
  # MM's :9273 endpoint already serves /metrics in Prometheus format.
  metrics_path: /metrics
  # Keep this <= the Metrics Manager's Telegraf [agent] interval (1s by
  # default). Telegraf's prometheus_client output serves only the LAST
  # collected value, so a slower scrape silently discards every sample in
  # between -- at 2s against a 1s emit cadence, exactly half are lost and
  # sub-2s transients never reach Grafana. Over-scraping is safe: repeats are
  # rejected as duplicate timestamps, not stored as fabricated points.
  scrape_interval: 1s
  static_configs:
    - targets:
        - host.docker.internal:9273
      labels:
        # Distinguishes MM-sourced series from any legacy exporter during the
        # TCMI -> Metrics Manager migration.
        source: metrics-manager
