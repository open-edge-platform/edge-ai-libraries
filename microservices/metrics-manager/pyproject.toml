[project]
name = "metrics-manager"
version = "2026.2.0"
description = "Unified metrics collection, ingestion, and relay service with OpenTelemetry support"
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]==0.143.1",
    "uvicorn==0.54.0",
    "pydantic>=2.14.1",
    "pydantic-settings>=2.16.0",
    "aiohttp>=3.14.5",
    "httpx>=0.28.1",
    "prometheus-client>=0.26.0",
]

[project.optional-dependencies]
openvino = [
    "openvino>=2026.4.1",
]

[dependency-groups]
test = [
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "pytest-mock>=3.16.0",
    "pytest-asyncio>=1.4.0",
    "anyio[trio]>=4.15.1",
    "httpx>=0.28.1",
    "PyYAML>=6.0.3",
]

dev = [
    "black>=26.10.1",
    "ruff>=0.17.0",
    "mypy>=2.4.0",
]

[build-system]
requires = ["setuptools>=84.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
markers = [
    "integration: marks tests as integration tests requiring Docker (deselect with -m 'not integration')",
]

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_ignores = true
disallow_untyped_defs = true
