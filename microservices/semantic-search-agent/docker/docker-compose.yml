version: '3.8'

services:
  semantic-service:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      args:
        - HTTP_PROXY=${HTTP_PROXY}
        - HTTPS_PROXY=${HTTPS_PROXY}
        - NO_PROXY=${NO_PROXY}
        - http_proxy=${http_proxy}
        - https_proxy=${https_proxy}
        - no_proxy=${no_proxy}
    image: intel/semantic-search-agent:2026.3.0-rc1
    container_name: semantic-search-agent
    ports:
      - "${API_PORT:-8080}:8080"    # API endpoint
      - "${METRICS_PORT:-9090}:9090"    # Prometheus metrics
    volumes:
      - ../config:/app/config:ro  # Mount config as read-only
      - ./logs:/app/logs          # Logs directory
      - ${MODEL_DIR:-./models}:/models:ro  # For OpenVINO mode
    devices:
      - /dev/dri:/dev/dri  # GPU access for OpenVINO; remove with group_add if the host has no GPU
    group_add:
      - video
    # Settings come from the .env file in the service root (optional).
    env_file:
      - path: ../.env
        required: false
    environment:
      # Fixed in-container ports; host ports are set through API_PORT and METRICS_PORT
      - API_PORT=8080
      - METRICS_PORT=9090
    networks:
      - semantic-net
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/api/v1/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # Redis for caching (optional)
  redis:
    image: redis:7-alpine
    container_name: semantic-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - semantic-net
    restart: unless-stopped
    command: redis-server --appendonly yes

networks:
  semantic-net:
    driver: bridge

volumes:
  redis-data:
    driver: local
