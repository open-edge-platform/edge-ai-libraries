[pytest]
pythonpath = .
# Test discovery
testpaths = tests/functional/build
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Markers
markers =
    tier1: CI-safe unit tests — no model weights, no Docker, no GPU required
    tier2: Credential-dependent tests — requires HF_TOKEN for model download
    tier3: Real functional tests — requires Docker daemon, full ML stack, or live server

# No default -m filter: run all collected tests unless overridden
addopts =
    -v
    --tb=short
    --strict-markers

# Output
log_cli = true
log_cli_level = WARNING
