services:
  audio-analyzer:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        APP_UID: ${LOCAL_UID:-1000}
        APP_GID: ${LOCAL_GID:-1000}
    image: ${REGISTRY:-intel}/audio-analyzer:${RELEASE_TAG:-latest}
    container_name: audio-analyzer
    user: "${LOCAL_UID:-1000}:${LOCAL_GID:-1000}"
    ports:
      - "8010:8010"
    devices:
      - /dev/dri:/dev/dri
    group_add:
      - video
    environment:
      HF_HOME: /app/audio_analyzer/.cache/huggingface
    volumes:
      - ./config.yaml:/app/audio_analyzer/config.yaml:ro
      - ./models:/app/audio_analyzer/models
      - ./chunks:/app/audio_analyzer/chunks
      - ./storage:/app/audio_analyzer/storage
      - ./.cache:/app/audio_analyzer/.cache
    # Whisper warmup on GPU can take ~120s; override the image healthcheck
    # so connection-refused during boot doesn't trip `unhealthy`.
    healthcheck:
      test: ["CMD", "python3", "-c",
             "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8010/health', timeout=5).read()"]
      interval: 15s
      timeout: 10s
      start_period: 240s
      retries: 5
    restart: unless-stopped
    # Uncomment the next lines if you also need microphone capture from the host.
    # devices:
    #   - /dev/snd:/dev/snd