services:
  audio-analyzer:
    build:
      context: .
      dockerfile: docker/Dockerfile
      args:
        http_proxy: ${http_proxy:-}
        https_proxy: ${https_proxy:-}
        ftp_proxy: ${ftp_proxy:-}
        HTTP_PROXY: ${HTTP_PROXY:-}
        HTTPS_PROXY: ${HTTPS_PROXY:-}
        FTP_PROXY: ${FTP_PROXY:-}
        no_proxy: ${no_proxy:-}
        NO_PROXY: ${NO_PROXY:-}
    image: ${REGISTRY:-intel}/audio-analyzer:2026.2.0-rc2
    container_name: audio-analyzer
    # Hardcoded to match the image's baked-in app user and the
    # ownership of the named volumes. Do not change.
    user: "1000:1000"
    ports:
      - "8010:8010"
    group_add:
      - video
      - "${RENDER_GID:-992}"
    environment:
      HF_HOME: /app/audio_analyzer/.cache/huggingface
      # NPU runtime selection. ZE_ENABLE_ALT_DRIVERS is required for Intel NPU
      # enumeration; ACCEL_MOUNT_PATH should point to the host NPU device node
      # (for example /dev/accel/accel0 on Meteor Lake systems).
      ZE_ENABLE_ALT_DRIVERS: libze_intel_npu.so
      # HF_TOKEN: required when diarization is enabled to download gated pyannote models.
      # Set in your shell: export HF_TOKEN=hf_xxx  (or use a .env file).
      HF_TOKEN: ${HF_TOKEN:-}
      http_proxy: ${http_proxy:-}
      https_proxy: ${https_proxy:-}
      ftp_proxy: ${ftp_proxy:-}
      HTTP_PROXY: ${HTTP_PROXY:-}
      HTTPS_PROXY: ${HTTPS_PROXY:-}
      FTP_PROXY: ${FTP_PROXY:-}
      no_proxy: ${no_proxy:-}
      NO_PROXY: ${NO_PROXY:-}
    volumes:
      - ./config.yaml:/app/audio_analyzer/config.yaml:ro
      - audio_analyzer_models:/app/audio_analyzer/models
      - audio_analyzer_chunks:/app/audio_analyzer/chunks
      - audio_analyzer_storage:/app/audio_analyzer/storage
      - audio_analyzer_cache:/app/audio_analyzer/.cache
    devices:
      - /dev/dri:/dev/dri
      - ${ACCEL_MOUNT_PATH:-/dev/null}:/dev/accel/accel0
    # Whisper warmup on GPU can take ~120s; override the image healthcheck
    # so connection-refused during boot doesn't trip `unhealthy`.
    healthcheck:
      test: ["CMD", "python3", "-c",
             "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8010/health', timeout=5).read()"]
      interval: 15s
      timeout: 10s
      start_period: 240s
      retries: 5
    restart: unless-stopped
    # Uncomment the next lines if you also need microphone capture from the host.
    # devices:
    #   - /dev/snd:/dev/snd

volumes:
  audio_analyzer_models:
  audio_analyzer_chunks:
  audio_analyzer_storage:
  audio_analyzer_cache: