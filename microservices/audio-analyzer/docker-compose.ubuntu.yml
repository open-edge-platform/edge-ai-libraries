# ================================================================
# CANDIDATE — Ubuntu-based image validation only. NOT used by default
# `docker compose up` (that still reads docker-compose.yml, which builds
# the production intel/dlstreamer-based docker/Dockerfile). This file
# must be selected explicitly with `-f docker-compose.ubuntu.yml`.
#
# Services (select with --profile, see docs below each one):
#   audio-analyzer-ubuntu-slim  (no profile -- default/always started)
#       slim CPU image (docker/Dockerfile.ubuntu, IMAGE_VARIANT=slim).
#       Default OpenVINO GenAI Whisper transcription + VSS ingestion only.
#   audio-analyzer-ubuntu-full  (profile: full)
#       full CPU image (IMAGE_VARIANT=full): adds openai/whispercpp ASR
#       providers, pyannote diarization, speechbrain sentiment analysis.
#   audio-analyzer-ubuntu-gpu   (profile: gpu)
#       slim image + Intel GPU/NPU userspace runtime
#       (INSTALL_GPU_NPU_RUNTIME=true). Requires real Intel GPU/NPU
#       hardware and host device/group-id values below -- see the GPU/NPU
#       notes on that service for how to discover them on your machine.
#
# Usage:
#   docker compose -f docker-compose.ubuntu.yml up --build                       # slim CPU (default)
#   docker compose -f docker-compose.ubuntu.yml --profile full up --build        # full CPU
#   docker compose -f docker-compose.ubuntu.yml --profile gpu up --build         # slim + GPU/NPU runtime
#   docker compose -f docker-compose.ubuntu.yml config                          # validate/render config
#
# HF_TOKEN (review point #8): passed only as a runtime environment variable
# here, exactly like the production docker-compose.yml. It is never a build
# arg and is never baked into any image layer. Required only if
# models.asr.diarization=true (gated pyannote models) -- set it in your
# shell (`export HF_TOKEN=hf_xxx`) or a local `.env` file that you do not
# commit.
#
# TLS: no certificate verification is disabled anywhere in this file or in
# docker/Dockerfile.ubuntu. The optional corporate-CA BuildKit secret
# mechanism documented in docker/Dockerfile.ubuntu (--secret id=corporate_ca)
# is a build-time flag, not something this Compose file sets implicitly --
# pass it manually via `docker buildx build --secret ...` if your network
# needs it; it is a no-op otherwise.
# ================================================================

services:
  # ---------------------------------------------------------------- slim --
  audio-analyzer-ubuntu-slim:
    build:
      context: .
      dockerfile: docker/Dockerfile.ubuntu
      args:
        IMAGE_VARIANT: slim
        http_proxy: ${http_proxy:-}
        https_proxy: ${https_proxy:-}
        no_proxy: ${no_proxy:-}
        HTTP_PROXY: ${HTTP_PROXY:-}
        HTTPS_PROXY: ${HTTPS_PROXY:-}
        NO_PROXY: ${NO_PROXY:-}
    image: audio-analyzer:ubuntu-slim-candidate
    container_name: audio-analyzer-ubuntu-slim
    # Matches the image's baked-in non-root appuser (APP_UID/APP_GID default
    # to 1000 in docker/Dockerfile.ubuntu). Do not change without rebuilding
    # with matching --build-arg APP_UID/APP_GID.
    user: "1000:1000"
    ports:
      - "${UBUNTU_PORT:-8011}:8010"
    environment:
      AUDIO_ANALYZER_SERVER_PORT: "8010"
      HF_HOME: /app/audio_analyzer/.cache/huggingface
      # Only needed if models.asr.diarization=true in config.yaml (full
      # variant only -- slim does not ship pyannote). Runtime-only, never
      # baked into the image. See the header comment above.
      HF_TOKEN: ${HF_TOKEN:-}
      http_proxy: ${http_proxy:-}
      https_proxy: ${https_proxy:-}
      no_proxy: ${no_proxy:-}
      HTTP_PROXY: ${HTTP_PROXY:-}
      HTTPS_PROXY: ${HTTPS_PROXY:-}
      NO_PROXY: ${NO_PROXY:-}
    volumes:
      - ./config.yaml:/app/audio_analyzer/config.yaml:ro
      - audio_analyzer_ubuntu_models:/app/audio_analyzer/models
      - audio_analyzer_ubuntu_chunks:/app/audio_analyzer/chunks
      - audio_analyzer_ubuntu_storage:/app/audio_analyzer/storage
      - audio_analyzer_ubuntu_cache:/app/audio_analyzer/.cache
    healthcheck:
      test: ["CMD", "python3.12", "-c",
             "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8010/health', timeout=5).read()"]
      interval: 15s
      timeout: 10s
      start_period: 90s
      retries: 5
    restart: "no"

  # ---------------------------------------------------------------- full --
  # Provider/feature selection (openai | openvino | whispercpp | funasr ASR
  # provider, diarization, sentiment) is controlled by config.yaml, which
  # is bind-mounted below -- same mechanism as the production
  # docker-compose.yml. Edit config.yaml and recreate the container to
  # switch providers; this file intentionally does not auto-forward shell
  # AUDIO_ANALYZER__* env vars (Compose only passes variables explicitly
  # listed under `environment:`, and an unset passthrough here would
  # silently override a config.yaml value with an empty string). Validated
  # during development: `provider: openai` in a mounted config.yaml starts
  # and transcribes correctly through this service.
  audio-analyzer-ubuntu-full:
    profiles: ["full"]
    build:
      context: .
      dockerfile: docker/Dockerfile.ubuntu
      args:
        IMAGE_VARIANT: full
        http_proxy: ${http_proxy:-}
        https_proxy: ${https_proxy:-}
        no_proxy: ${no_proxy:-}
        HTTP_PROXY: ${HTTP_PROXY:-}
        HTTPS_PROXY: ${HTTPS_PROXY:-}
        NO_PROXY: ${NO_PROXY:-}
    image: audio-analyzer:ubuntu-full-candidate
    container_name: audio-analyzer-ubuntu-full
    user: "1000:1000"
    ports:
      - "${UBUNTU_FULL_PORT:-8012}:8010"
    environment:
      AUDIO_ANALYZER_SERVER_PORT: "8010"
      HF_HOME: /app/audio_analyzer/.cache/huggingface
      # Required at runtime only if models.asr.diarization=true (pyannote
      # gated models) or config.yaml selects the openai/whispercpp
      # providers that need outbound model downloads. Never a build arg.
      HF_TOKEN: ${HF_TOKEN:-}
      http_proxy: ${http_proxy:-}
      https_proxy: ${https_proxy:-}
      no_proxy: ${no_proxy:-}
      HTTP_PROXY: ${HTTP_PROXY:-}
      HTTPS_PROXY: ${HTTPS_PROXY:-}
      NO_PROXY: ${NO_PROXY:-}
    volumes:
      - ./config.yaml:/app/audio_analyzer/config.yaml:ro
      - audio_analyzer_ubuntu_full_models:/app/audio_analyzer/models
      - audio_analyzer_ubuntu_full_chunks:/app/audio_analyzer/chunks
      - audio_analyzer_ubuntu_full_storage:/app/audio_analyzer/storage
      - audio_analyzer_ubuntu_full_cache:/app/audio_analyzer/.cache
    healthcheck:
      test: ["CMD", "python3.12", "-c",
             "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8010/health', timeout=5).read()"]
      interval: 15s
      timeout: 10s
      start_period: 120s
      retries: 5
    restart: "no"

  # ----------------------------------------------------------- gpu/npu --
  # Requires real Intel GPU/NPU hardware. Before using this service on any
  # machine, discover the correct host values (they differ per machine --
  # do not assume the defaults below match your hardware):
  #   stat -c '%g' /dev/dri/renderD128     # -> RENDER_GID
  #   stat -c '%g' /dev/dri/card1          # -> VIDEO_GID
  #   ls /dev/accel/accel0 2>/dev/null     # confirm NPU device node exists
  # Then export them before `docker compose up`:
  #   export RENDER_GID=$(stat -c '%g' /dev/dri/renderD128)
  #   export VIDEO_GID=$(stat -c '%g' /dev/dri/card1)
  # If /dev/dri or /dev/accel do not exist on this machine, do not use this
  # service -- validate CPU-only (slim/full) here instead.
  audio-analyzer-ubuntu-gpu:
    profiles: ["gpu"]
    build:
      context: .
      dockerfile: docker/Dockerfile.ubuntu
      args:
        IMAGE_VARIANT: slim
        INSTALL_GPU_NPU_RUNTIME: "true"
        http_proxy: ${http_proxy:-}
        https_proxy: ${https_proxy:-}
        no_proxy: ${no_proxy:-}
        HTTP_PROXY: ${HTTP_PROXY:-}
        HTTPS_PROXY: ${HTTPS_PROXY:-}
        NO_PROXY: ${NO_PROXY:-}
    image: audio-analyzer:ubuntu-gpu-npu-candidate
    container_name: audio-analyzer-ubuntu-gpu
    user: "1000:1000"
    ports:
      - "${UBUNTU_GPU_PORT:-8013}:8010"
    # group_add values are host-specific (see comment above); there is no
    # universal default that is safe across machines, so these intentionally
    # default to an invalid sentinel rather than the production file's
    # RENDER_GID:-992 fallback -- `docker compose ... up` for this profile
    # then fails fast at container start with a clear "invalid group" error
    # if RENDER_GID/VIDEO_GID were not exported, instead of silently
    # attaching the container to the wrong host group. Compose interpolates
    # variables for every service regardless of active --profile, so a
    # required (":?") var here would break `config`/`up` even for the
    # slim/full profiles that never touch this service -- a plain default
    # avoids that while still refusing to guess a real group id.
    group_add:
      - "${RENDER_GID:-UNSET_RENDER_GID_see_docker-compose.ubuntu.yml}"
      - "${VIDEO_GID:-UNSET_VIDEO_GID_see_docker-compose.ubuntu.yml}"
    devices:
      - /dev/dri:/dev/dri
      - ${ACCEL_MOUNT_PATH:-/dev/null}:/dev/accel/accel0
    environment:
      AUDIO_ANALYZER_SERVER_PORT: "8010"
      HF_HOME: /app/audio_analyzer/.cache/huggingface
      AUDIO_ANALYZER__MODELS__ASR__DEVICE: ${UBUNTU_GPU_ASR_DEVICE:-GPU}
      ZE_ENABLE_ALT_DRIVERS: libze_intel_npu.so
      HF_TOKEN: ${HF_TOKEN:-}
      http_proxy: ${http_proxy:-}
      https_proxy: ${https_proxy:-}
      no_proxy: ${no_proxy:-}
      HTTP_PROXY: ${HTTP_PROXY:-}
      HTTPS_PROXY: ${HTTPS_PROXY:-}
      NO_PROXY: ${NO_PROXY:-}
    volumes:
      - ./config.yaml:/app/audio_analyzer/config.yaml:ro
      - audio_analyzer_ubuntu_gpu_models:/app/audio_analyzer/models
      - audio_analyzer_ubuntu_gpu_chunks:/app/audio_analyzer/chunks
      - audio_analyzer_ubuntu_gpu_storage:/app/audio_analyzer/storage
      - audio_analyzer_ubuntu_gpu_cache:/app/audio_analyzer/.cache
    healthcheck:
      test: ["CMD", "python3.12", "-c",
             "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8010/health', timeout=5).read()"]
      interval: 15s
      timeout: 10s
      start_period: 180s
      retries: 5
    restart: "no"

volumes:
  audio_analyzer_ubuntu_models:
  audio_analyzer_ubuntu_chunks:
  audio_analyzer_ubuntu_storage:
  audio_analyzer_ubuntu_cache:
  audio_analyzer_ubuntu_full_models:
  audio_analyzer_ubuntu_full_chunks:
  audio_analyzer_ubuntu_full_storage:
  audio_analyzer_ubuntu_full_cache:
  audio_analyzer_ubuntu_gpu_models:
  audio_analyzer_ubuntu_gpu_chunks:
  audio_analyzer_ubuntu_gpu_storage:
  audio_analyzer_ubuntu_gpu_cache:
