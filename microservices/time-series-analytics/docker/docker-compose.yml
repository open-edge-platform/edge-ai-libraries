version: '3.6'
services:
  ia-influxdb3-data-init:
    image: ${DOCKER_REGISTRY}${TIME_SERIES_ANALYTICS_IMAGE}:${IMAGE_SUFFIX:-latest}${WEEKLY_BUILD_DATE:+-${WEEKLY_BUILD_DATE}}${WEEKLY_BUILD_DATE:+-weekly}
    user: "0:0"
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        if [ ! -s /run/secrets/admin-token ]; then
          influxdb3 create token --admin --offline --output-file /run/secrets/admin-token
        fi
        chown -R ${TIMESERIES_UID}:${TIMESERIES_UID} /var/lib/influxdb3/data
        chown 0:1500 /run/secrets/admin-token
        chmod 440 /run/secrets/admin-token
    restart: "no"
    volumes:
      - vol_influxdb3_data:/var/lib/influxdb3/data
      - vol_influxdb3_secrets:/run/secrets

  ia-time-series-analytics-microservice:
    build:
      context: $PWD/../
      dockerfile: $PWD/../Dockerfile
      args:
        TIMESERIES_UID: ${TIMESERIES_UID}
        TIMESERIES_USER_NAME: ${TIMESERIES_USER_NAME}
    container_name: ia-time-series-analytics-microservice
    hostname: ia-time-series-analytics-microservice
    image: ${DOCKER_REGISTRY}${TIME_SERIES_ANALYTICS_IMAGE}:${IMAGE_SUFFIX:-latest}${WEEKLY_BUILD_DATE:+-${WEEKLY_BUILD_DATE}}${WEEKLY_BUILD_DATE:+-weekly}
    restart: unless-stopped
    depends_on:
      ia-influxdb3-data-init:
        condition: service_completed_successfully
    security_opt:
    - no-new-privileges
    read_only: true
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/openapi.json', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 20
    environment:
      no_proxy: "ia-time-series-analytics-microservice,localhost,127.0.0.1"
      NO_PROXY: "ia-time-series-analytics-microservice,localhost,127.0.0.1"
      PROFILING_MODE: "false"
      INFLUXDB3_URL: http://localhost:8181
      INFLUXDB3_ADMIN_TOKEN_FILE: /run/secrets/admin-token
      LOG_LEVEL: ${LOG_LEVEL}
      INFLUXDB_DBNAME: datain
      PROTOCOL_BUFFERS_PYTHON_IMPLEMENTATION: python
      UDF_MAX_FILE_SIZE_MB: 100
      SSL_CERT_FILE: /run/secrets/ca_certificate.pem
    networks:
    - timeseries_network
    ports:
    - 5000:5000
    - "127.0.0.1:8181:8181"
    volumes:
    - "vol_temp_time_series_analytics_microservice:/tmp/"
    - vol_influxdb3_data:/var/lib/influxdb3/data
    - vol_influxdb3_secrets:/run/secrets:ro
    - /dev/dri:/dev/dri:ro
    - "/run/udev:/run/udev:ro"
    devices:
      # Following devices under /dev filesystem will be needed based on usecase
      # dri - GPU
    - "/dev/dri:/dev/dri"
    group_add:
    # render group ID for ubuntu 20.04 host OS
    - "109"
    # render group ID for ubuntu 22.04 host OS
    - "110"
    # render group ID for ubuntu 24.04 host OS
    - "992"
    # group ID used for the read-only Core admin-token file
    - "1500"

networks:
  timeseries_network:
    driver: bridge

volumes:
  vol_influxdb3_data:
    name: tsam_standalone_influxdb3_data
    driver: local
  vol_influxdb3_secrets:
    name: tsam_standalone_influxdb3_secrets
    driver: local
  vol_temp_time_series_analytics_microservice:
    driver: local
    driver_opts:
      type: tmpfs
      device: tmpfs
