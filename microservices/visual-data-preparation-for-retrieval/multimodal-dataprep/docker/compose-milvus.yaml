#
# Example deployment of multimodal-dataprep using the **Milvus** vector database backend.
#
# This mirrors docker/compose.yaml but swaps the VDMS vector store for a Milvus
# standalone stack (etcd + object storage + milvus) and selects the backend via
# VECTORDB_BACKEND=milvus. The MinIO instance used by the dataprep service for
# media/artifact storage (STORAGE_BACKEND=minio) is kept separate from the MinIO
# instance that Milvus uses internally for its own segment storage.
#
# Notes:
#  * Proxy env vars are disabled (both lower- and upper-case) for the Milvus
#    etcd/standalone containers and for the dataprep -> Milvus gRPC path; an HTTP
#    proxy in front of localhost/in-cluster gRPC causes Milvus startup ("etcd
#    context deadline exceeded") and ConnectionNotExist errors.
#  * Milvus uses local segment storage (COMMON_STORAGETYPE=local), so it needs no
#    internal MinIO/S3 service. The only MinIO here (minio-server) is the
#    dataprep service's own media/artifact storage (STORAGE_BACKEND=minio).
#  * Pin to a Milvus 2.6.x image; langchain-milvus 0.3.x relies on the pymilvus
#    2.6 ORM API that this service depends on.
services:
    # ---- Storage backend used by the dataprep service (media + artifacts) ----
    minio-server:
        image: coollabsio/minio:RELEASE.2025-10-15T17-29-55Z
        environment:
            - MINIO_ROOT_USER=${MINIO_ROOT_USER}
            - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD}
        ports:
            - '${MINIO_API_HOST_PORT:-6010}:9000'
            - '${MINIO_CONSOLE_HOST_PORT:-6011}:9001'
        volumes:
            - '${MINIO_MOUNT_PATH:-/mnt/miniodata}:/data'
        command: |
            server /data 
            --address ":9000" 
            --console-address ":9001"

    # ---- Milvus standalone stack (etcd + milvus, local segment storage) ----
    milvus-etcd:
        image: quay.io/coreos/etcd:v3.5.18
        environment:
            - ETCD_AUTO_COMPACTION_MODE=revision
            - ETCD_AUTO_COMPACTION_RETENTION=1000
            - ETCD_QUOTA_BACKEND_BYTES=4294967296
            - ETCD_SNAPSHOT_COUNT=50000
            # Disable proxy (both cases) so etcd cluster bootstrap does not time out.
            - http_proxy=
            - https_proxy=
            - no_proxy=
            - HTTP_PROXY=
            - HTTPS_PROXY=
            - NO_PROXY=
        volumes:
            - milvus-etcd:/etcd
        command: >
            etcd -advertise-client-urls=http://127.0.0.1:2379
            -listen-client-urls http://0.0.0.0:2379
            --data-dir /etcd
        healthcheck:
            test: ["CMD", "etcdctl", "endpoint", "health"]
            interval: 30s
            timeout: 20s
            retries: 3

    milvus-standalone:
        image: milvusdb/milvus:v2.6.16
        command: ["milvus", "run", "standalone"]
        security_opt:
            - seccomp:unconfined
        environment:
            - ETCD_ENDPOINTS=milvus-etcd:2379
            # Use local disk for Milvus segment storage (no internal MinIO needed).
            - COMMON_STORAGETYPE=local
            # Disable proxy (both cases) for in-cluster gRPC/etcd communication.
            - http_proxy=
            - https_proxy=
            - no_proxy=
            - HTTP_PROXY=
            - HTTPS_PROXY=
            - NO_PROXY=
        volumes:
            - milvus-data:/var/lib/milvus
        ports:
            - '${MILVUS_HOST_PORT:-19530}:19530'
            - '${MILVUS_METRICS_HOST_PORT:-9091}:9091'
        depends_on:
            milvus-etcd:
                condition: service_healthy
        healthcheck:
            test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
            interval: 30s
            timeout: 20s
            retries: 5
            start_period: 90s

    # ---- DataPrep service configured for the Milvus backend ----
    multimodal-dataprep:
        hostname: multimodal-dataprep
        build:
            context: ../../..
            dockerfile: visual-data-preparation-for-retrieval/multimodal-dataprep/docker/Dockerfile
            target: prod
        image: ${REGISTRY}multimodal-dataprep:${TAG:-latest}
        environment:
            # Disable proxy for the dataprep -> Milvus gRPC path.
            no_proxy: ${no_proxy},milvus-standalone,${MINIO_HOST},localhost,127.0.0.1
            http_proxy: ${http_proxy}
            https_proxy: ${https_proxy}
            MM_DATAPREP_APP_HOST: multimodal-dataprep
            # ---- Backend selection ----
            MM_DATAPREP_VECTORDB_BACKEND: milvus
            MM_DATAPREP_STORAGE_BACKEND: minio
            # ---- Milvus connection ----
            MM_DATAPREP_MILVUS_URI: http://milvus-standalone:19530
            MM_DATAPREP_VDB_METRIC_TYPE: ${MM_DATAPREP_VDB_METRIC_TYPE:-IP}
            MM_DATAPREP_VDB_INDEX_TYPE: ${MM_DATAPREP_VDB_INDEX_TYPE:-FLAT}
            # ---- Storage (MinIO) ----
            MM_DATAPREP_MINIO_ENDPOINT: ${MINIO_HOST}:${MINIO_API_HOST_PORT:-4001}
            MM_DATAPREP_MINIO_ACCESS_KEY: ${MINIO_ROOT_USER}
            MM_DATAPREP_MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
            MM_DATAPREP_MINIO_SECURE: false
            MM_DATAPREP_DEFAULT_BUCKET_NAME: ${DEFAULT_BUCKET_NAME}
            MM_DATAPREP_DB_COLLECTION: ${VS_INDEX_NAME}
            # ---- Embedding ----
            MM_DATAPREP_EMBEDDING_MODEL_NAME: ${EMBEDDING_MODEL_NAME}
            MM_DATAPREP_USE_OPENVINO: ${MM_DATAPREP_MM_DATAPREP_USE_OPENVINO:-true}
            MM_DATAPREP_EMBEDDING_DEVICE: ${MM_DATAPREP_MM_DATAPREP_EMBEDDING_DEVICE:-CPU}
            MM_DATAPREP_OV_MODELS_DIR: ${OV_MODELS_DIR:-/app/ov_models}
            MM_DATAPREP_OV_PERFORMANCE_MODE: ${MM_DATAPREP_MM_DATAPREP_OV_PERFORMANCE_MODE:-THROUGHPUT}
            MM_DATAPREP_EMBEDDING_BATCH_SIZE: ${MM_DATAPREP_EMBEDDING_BATCH_SIZE:-32}
            MM_DATAPREP_MAX_PARALLEL_WORKERS: ${MM_DATAPREP_MAX_PARALLEL_WORKERS:-}
            MM_DATAPREP_VIDEO_SHM_MAX_BLOCKS: ${MM_DATAPREP_MM_DATAPREP_VIDEO_SHM_MAX_BLOCKS:-512}
            MM_DATAPREP_VIDEO_SHM_BLOCK_SIZE: ${MM_DATAPREP_MM_DATAPREP_VIDEO_SHM_BLOCK_SIZE:-6220800}
            MM_DATAPREP_VIDEO_EXTRACTION_BATCH_SIZE: ${MM_DATAPREP_MM_DATAPREP_VIDEO_EXTRACTION_BATCH_SIZE:-256}
            MM_DATAPREP_PIPELINE_QUEUE_MAXSIZE: ${MM_DATAPREP_MM_DATAPREP_PIPELINE_QUEUE_MAXSIZE:-16}
            MM_DATAPREP_PIPELINE_COMPLETION_QUEUE_MAXSIZE: ${MM_DATAPREP_MM_DATAPREP_PIPELINE_COMPLETION_QUEUE_MAXSIZE:-1}
            MM_DATAPREP_DETECTION_WORKER_THREADS: ${MM_DATAPREP_MM_DATAPREP_DETECTION_WORKER_THREADS:-2}
            MM_DATAPREP_EMBED_WORKER_THREADS: ${MM_DATAPREP_MM_DATAPREP_EMBED_WORKER_THREADS:-2}
            MM_DATAPREP_PIPELINE_QUEUE_GET_TIMEOUT_S: ${MM_DATAPREP_MM_DATAPREP_PIPELINE_QUEUE_GET_TIMEOUT_S:-1.0}
            MM_DATAPREP_SAVE_RUNTIME_PIPELINE_STATS: ${MM_DATAPREP_SAVE_RUNTIME_PIPELINE_STATS:-false}
            MM_DATAPREP_ENABLE_TRACING: ${MM_DATAPREP_MM_DATAPREP_ENABLE_TRACING:-false}
            MM_DATAPREP_VIDEO_FRAME_DECODER_WORKERS: ${MM_DATAPREP_VIDEO_FRAME_DECODER_WORKERS:-2}
            MM_DATAPREP_VIDEO_FRAME_LOG_LEVEL: ${MM_DATAPREP_VIDEO_FRAME_LOG_LEVEL:-INFO}
            # ---- Frame processing ----
            MM_DATAPREP_FRAME_INTERVAL: ${MM_DATAPREP_FRAME_INTERVAL:-15}
            MM_DATAPREP_ENABLE_OBJECT_DETECTION: ${MM_DATAPREP_ENABLE_OBJECT_DETECTION:-true}
            MM_DATAPREP_DETECTION_CONFIDENCE: ${MM_DATAPREP_DETECTION_CONFIDENCE:-0.85}
            MM_DATAPREP_DETECTION_DEVICE: ${MM_DATAPREP_MM_DATAPREP_DETECTION_DEVICE:-CPU}
            MM_DATAPREP_FRAMES_TEMP_DIR: ${MM_DATAPREP_FRAMES_TEMP_DIR:-/tmp/dataprep}
            MM_DATAPREP_DETECTION_MODEL_DIR: ${YOLOX_MODELS_MOUNT_PATH}
            # ---- ROI consolidation ----
            MM_DATAPREP_ROI_CONSOLIDATION_ENABLED: ${MM_DATAPREP_ROI_CONSOLIDATION_ENABLED:-false}
            MM_DATAPREP_ROI_CONSOLIDATION_IOU_THRESHOLD: ${MM_DATAPREP_ROI_CONSOLIDATION_IOU_THRESHOLD:-0.2}
            MM_DATAPREP_ROI_CONSOLIDATION_CLASS_AWARE: ${MM_DATAPREP_ROI_CONSOLIDATION_CLASS_AWARE:-false}
            MM_DATAPREP_ROI_CONSOLIDATION_CONTEXT_SCALE: ${MM_DATAPREP_ROI_CONSOLIDATION_CONTEXT_SCALE:-0.2}
            MM_DATAPREP_LOG_LEVEL: ${MM_DATAPREP_MM_DATAPREP_LOG_LEVEL:-INFO}
            MM_DATAPREP_ALLOW_ORIGINS: ${MM_DATAPREP_ALLOW_ORIGINS:-*}
            MM_DATAPREP_ALLOW_METHODS: ${MM_DATAPREP_ALLOW_METHODS:-*}
            MM_DATAPREP_ALLOW_HEADERS: ${MM_DATAPREP_ALLOW_HEADERS:-*}
        ports:
            - "${MM_DATAPREP_HOST_PORT}:8000"
        healthcheck:
            test:
                [
                "CMD-SHELL",
                "curl -f http://localhost:8000/v1/dataprep/health || exit 1",
                ]
            interval: 10s
            timeout: 10s
            retries: 40
            start_period: 5s
        volumes:
            - '${YOLOX_MODELS_VOLUME_NAME:-dataprep-yolox-models}:${YOLOX_MODELS_MOUNT_PATH:-/app/models/yolox}'
            - data-prep:/tmp/dataprep
            - ov-models:/home/appuser/.cache/huggingface
            - ov-models:${OV_MODELS_DIR:-/app/ov_models}
        devices:
            - /dev/dri:/dev/dri
        ulimits:
            nofile:
                soft: 32768
                hard: 65535
        ipc: host
        group_add:
            - ${USER_GROUP_ID:-1000}
            - ${VIDEO_GROUP_ID:-44}
            - ${RENDER_GROUP_ID:-1002}
        depends_on:
            - minio-server
            - milvus-standalone

networks:
    default:
        driver: bridge

volumes:
    dataprep-yolox-models:
        driver: local
    ov-models:
        driver: local
    data-prep:
        driver: local
    milvus-etcd:
        driver: local
    milvus-data:
        driver: local
