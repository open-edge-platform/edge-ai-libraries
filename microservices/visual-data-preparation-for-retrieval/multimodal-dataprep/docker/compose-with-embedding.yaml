services:
    minio-server:
        image: chainguard/minio@sha256:cb84dfa704c648c4b14858aa288576bb1cf756a9b326112a0934db00e87d0bb8
        environment:
            - MINIO_ROOT_USER=${MINIO_ROOT_USER}
            - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD}
        ports:
            - '${MINIO_API_HOST_PORT:-6010}:9000'
            - '${MINIO_CONSOLE_HOST_PORT:-6011}:9001'
        volumes:
            - 'minio_data:/data'
        command: |
            server /data 
            --address ":9000" 
            --console-address ":9001"

    vdms-vector-db:
        image: intellabs/vdms:v2.12.0
        environment:
            - OVERRIDE_db_root_path=/db
            - OVERRIDE_images_path=/db/images
            - OVERRIDE_descriptors_path=/db/descriptors
            - OVERRIDE_blobs_path=/db/blobs
            - OVERRIDE_pmgd_path=/db/graph
        ports:
            - '${VDMS_VDB_HOST_PORT:-6020}:55555'
        depends_on:
            - minio-server

    multimodal-dataprep:
        build:
            context: ../../..
            dockerfile: visual-data-preparation-for-retrieval/multimodal-dataprep/docker/Dockerfile
            target: prod
        image: ${REGISTRY}multimodal-dataprep:${TAG:-latest}
        environment:
            - http_proxy
            - https_proxy
            - no_proxy
            # Basic app settings
            - MM_DATAPREP_APP_HOST=multimodal-dataprep # Same as service name. Helps store a URL for video download in metadata.

            # VDMS Vector Database settings
            - MM_DATAPREP_VDMS_VDB_HOST=${VDMS_VDB_HOST}
            - MM_DATAPREP_VDMS_VDB_PORT=55555

            # MinIO settings
            - MM_DATAPREP_MINIO_ENDPOINT=${MINIO_HOST}:9000
            - MM_DATAPREP_MINIO_ACCESS_KEY=${MINIO_ROOT_USER}
            - MM_DATAPREP_MINIO_SECRET_KEY=${MINIO_ROOT_PASSWORD}
            - MM_DATAPREP_MINIO_SECURE=false
            - MM_DATAPREP_DEFAULT_BUCKET_NAME=${DEFAULT_BUCKET_NAME}

            # Database settings
            - MM_DATAPREP_DB_COLLECTION=${INDEX_NAME}

            # Embedding service settings
            - MM_DATAPREP_MULTIMODAL_EMBEDDING_ENDPOINT=${MULTIMODAL_EMBEDDING_ENDPOINT:-http://multimodal-embedding-serving:8000/embeddings}
            - MM_DATAPREP_MULTIMODAL_EMBEDDING_MODEL_NAME=${EMBEDDING_MODEL_NAME}
            - MM_OV_PERFORMANCE_MODE=${MM_OV_PERFORMANCE_MODE:-LATENCY}

            # Embedding pipeline settings
            - MM_DATAPREP_USE_OPENVINO=${MM_DATAPREP_USE_OPENVINO:-true}
            - MM_EMBEDDING_DEVICE=${MM_EMBEDDING_DEVICE:-CPU}
            - MM_DATAPREP_OV_MODELS_DIR=${OV_MODELS_DIR:-/app/ov_models}
            - MM_DATAPREP_EMBEDDING_BATCH_SIZE=${EMBEDDING_BATCH_SIZE:-32}
            - MM_DATAPREP_MAX_PARALLEL_WORKERS=${MAX_PARALLEL_WORKERS:-}
            - MM_DATAPREP_VIDEO_SHM_MAX_BLOCKS=${MM_DATAPREP_VIDEO_SHM_MAX_BLOCKS:-512}
            - MM_DATAPREP_VIDEO_SHM_BLOCK_SIZE=${MM_DATAPREP_VIDEO_SHM_BLOCK_SIZE:-6220800}
            - MM_DATAPREP_VIDEO_EXTRACTION_BATCH_SIZE=${MM_DATAPREP_VIDEO_EXTRACTION_BATCH_SIZE:-256}
            - MM_DATAPREP_PIPELINE_QUEUE_MAXSIZE=${MM_DATAPREP_PIPELINE_QUEUE_MAXSIZE:-16}
            - MM_DATAPREP_PIPELINE_COMPLETION_QUEUE_MAXSIZE=${MM_DATAPREP_PIPELINE_COMPLETION_QUEUE_MAXSIZE:-1}
            - MM_DATAPREP_DETECTION_WORKER_THREADS=${MM_DATAPREP_DETECTION_WORKER_THREADS:-2}
            - MM_DATAPREP_EMBED_WORKER_THREADS=${MM_DATAPREP_EMBED_WORKER_THREADS:-2}
            - MM_DATAPREP_PIPELINE_QUEUE_GET_TIMEOUT_S=${MM_DATAPREP_PIPELINE_QUEUE_GET_TIMEOUT_S:-1.0}
            - MM_DATAPREP_SAVE_RUNTIME_PIPELINE_STATS=${SAVE_RUNTIME_PIPELINE_STATS:-false}
            - MM_DATAPREP_ENABLE_TRACING=${MM_DATAPREP_ENABLE_TRACING:-false}
            - MM_DATAPREP_VIDEO_FRAME_DECODER_WORKERS=${VIDEO_FRAME_DECODER_WORKERS:-2}
            - MM_DATAPREP_VIDEO_FRAME_LOG_LEVEL=${VIDEO_FRAME_LOG_LEVEL:-INFO}

            # Frame processing settings
            - MM_DATAPREP_FRAME_INTERVAL=${FRAME_INTERVAL:-15}
            - MM_DATAPREP_ENABLE_OBJECT_DETECTION=${ENABLE_OBJECT_DETECTION:-true}
            - MM_DATAPREP_DETECTION_CONFIDENCE=${DETECTION_CONFIDENCE:-0.85}
            - MM_DATAPREP_FRAMES_TEMP_DIR=${FRAMES_TEMP_DIR:-/tmp/dataprep}

            # Object detection model directory
            - MM_DATAPREP_DETECTION_MODEL_DIR=${YOLOX_MODELS_MOUNT_PATH:-/app/models/yolox}
            - MM_DATAPREP_DETECTION_DEVICE=${MM_DATAPREP_DETECTION_DEVICE:-CPU}

            # ROI consolidation settings
            - MM_DATAPREP_ROI_CONSOLIDATION_ENABLED=${ROI_CONSOLIDATION_ENABLED:-false}
            - MM_DATAPREP_ROI_CONSOLIDATION_IOU_THRESHOLD=${ROI_CONSOLIDATION_IOU_THRESHOLD:-0.2}
            - MM_DATAPREP_ROI_CONSOLIDATION_CLASS_AWARE=${ROI_CONSOLIDATION_CLASS_AWARE:-false}
            - MM_DATAPREP_ROI_CONSOLIDATION_CONTEXT_SCALE=${ROI_CONSOLIDATION_CONTEXT_SCALE:-0.2}

            # Application configuration
            - MM_DATAPREP_LOG_LEVEL=${MM_DATAPREP_LOG_LEVEL:-INFO}

            # CORS settings
            - MM_DATAPREP_ALLOW_ORIGINS=${ALLOW_ORIGINS:-*}
            - MM_DATAPREP_ALLOW_METHODS=${ALLOW_METHODS:-*}
            - MM_DATAPREP_ALLOW_HEADERS=${ALLOW_HEADERS:-*}
        ports:
            - '${MM_DATAPREP_HOST_PORT:-6007}:8000'
        volumes:
            - '${YOLOX_MODELS_VOLUME_NAME:-dataprep-yolox-models}:${YOLOX_MODELS_MOUNT_PATH:-/app/models/yolox}'
            - data-prep:/tmp/dataprep
            - ov-models:/home/appuser/.cache/huggingface # Share embedding models cache
            - ov-models:${OV_MODELS_DIR:-/app/ov_models} # OpenVINO models directory
        devices:
            - ${DRI_MOUNT_PATH:-/dev/null}:/dev/dri # Intel GPU device access for OpenVINO GPU acceleration
            - ${ACCEL_MOUNT_PATH:-/dev/null}:/dev/accel/accel0
        ulimits:
            nofile:
                soft: 32768
                hard: 65535
        ipc: host
        group_add:
            - ${USER_GROUP_ID:-1000}
            - ${VIDEO_GROUP_ID:-44}
            - ${RENDER_GROUP_ID:-1002}
        depends_on:
            - minio-server
            # - multimodal-embedding-serving

    multimodal-embedding-serving:
        image: ${REGISTRY:-}multimodal-embedding-serving:${TAG:-latest}
        container_name: multimodal-embedding-serving
        ports:
            - '${EMBEDDING_SERVER_PORT:-9777}:8000'
        ipc: host
        environment:
            no_proxy: ${no_proxy_env},multimodal-dataprep,localhost
            no_proxy_env: ${no_proxy_env},multimodal-dataprep,localhost
            http_proxy: ${http_proxy}
            https_proxy: ${https_proxy}
            EMBEDDING_MODEL_NAME: ${EMBEDDING_MODEL_NAME}
            EMBEDDING_DEVICE: ${EMBEDDING_DEVICE:-CPU}
            EMBEDDING_USE_OV: ${EMBEDDING_USE_OV}
            EMBEDDING_OV_MODELS_DIR: ${EMBEDDING_OV_MODELS_DIR:-/app/ov_models}

            # Video processing configuration
            DEFAULT_START_OFFSET_SEC: ${DEFAULT_START_OFFSET_SEC}
            DEFAULT_CLIP_DURATION: ${DEFAULT_CLIP_DURATION:--1}
            DEFAULT_NUM_FRAMES: ${DEFAULT_NUM_FRAMES}
            OV_PERFORMANCE_MODE: ${OV_PERFORMANCE_MODE:-LATENCY}

            # Inference configuration
            INFER_BATCH_SIZE: ${INFER_BATCH_SIZE:-64}
            PREPROCESS_WORKERS: ${PREPROCESS_WORKERS:-8}

            # Video frame extraction configuration
            VIDEO_FRAME_BATCH_SIZE: ${VIDEO_FRAME_BATCH_SIZE:-64}
            VIDEO_FRAME_DECODER_WORKERS: ${VIDEO_FRAME_DECODER_WORKERS:-8}
            VIDEO_FRAME_QUEUE_SIZE: ${VIDEO_FRAME_QUEUE_SIZE:-32}
            VIDEO_FRAME_SHM_POOL_BLOCK_SIZE: ${VIDEO_FRAME_SHM_POOL_BLOCK_SIZE:-6220800}
            VIDEO_FRAME_SHM_POOL_BLOCKS_MULTIPLIER: ${VIDEO_FRAME_SHM_POOL_BLOCKS_MULTIPLIER:-2}
            VIDEO_FRAME_LOG_LEVEL: ${VIDEO_FRAME_LOG_LEVEL:-INFO}
        group_add:
            - ${USER_GROUP_ID:-1000}
            - ${VIDEO_GROUP_ID:-44}
            - ${RENDER_GROUP_ID:-1002}
        restart: unless-stopped
        healthcheck:
            test:
                [
                    'CMD',
                    'python',
                    '-c',
                    "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health').getcode()==200 else 1)",
                ]
            interval: 10s
            timeout: 10s
            retries: 40
            start_period: 5s
        devices:
            - ${DRI_MOUNT_PATH:-/dev/null}:/dev/dri
            - ${ACCEL_MOUNT_PATH:-/dev/null}:/dev/accel/accel0
        networks:
            - default
        volumes:
            - ov-models:/home/appuser/.cache/huggingface
            - data-prep:/tmp/dataprep
            - ov-models:${EMBEDDING_OV_MODELS_DIR:-/app/ov_models}

networks:
    default:
        driver: bridge

volumes:
    dataprep-yolox-models:
        driver: local
    ov-models:
        driver: local
    data-prep:
        driver: local
    minio_data:
        driver: local
