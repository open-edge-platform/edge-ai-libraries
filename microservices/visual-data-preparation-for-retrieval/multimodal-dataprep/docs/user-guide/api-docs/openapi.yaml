    VideoRequest:
      properties:
        bucket_name:
          anyOf:
          - type: string
          - type: 'null'
          title: Bucket Name
          description: The bucket name where the video is stored
        video_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Video Id
          description: The video ID (directory) containing the video
        frame_interval:
          anyOf:
          - type: integer
            maximum: 60.0
            minimum: 1.0
          - type: 'null'
