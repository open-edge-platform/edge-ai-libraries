          type: number
          minimum: 0.0
          title: Embedding Infer Seconds
        storage_seconds:
          type: number
          minimum: 0.0
          title: Storage Seconds
        total_seconds:
          type: number
          minimum: 0.0
          title: Total Seconds
        embeddings_stored:
          type: integer
          minimum: 0.0
          title: Embeddings Stored
      type: object
      required:
