openapi: 3.1.0
info:
  title: Intel GenAI Multimodal DataPrep Microservice
  description: A microservice for data preparation from text, video and image sources
  version: 0.1.0
paths:
  /health:
    get:
      tags:
      - Status APIs
      summary: Check service health
      description: Health API endpoint to check whether API Server is reachable and responding.
      operationId: getServiceHealth
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
  /summary:
    post:
      tags:
      - Document Processing APIs
      summary: Process summary text with video timestamp references for embedding generation.
      description: "### Process summary text for a video with video timestamp references for embedding\
        \ generation.\n\nThis endpoint takes a summary text and video timestamp references, validates\
        \ that the video exists,\nand stores the text embedding in the VDMS vector database with the associated\
        \ video metadata.\n\n#### Body Params:\n   - **bucket_name (str) :** The bucket name where the\
        \ referenced video is stored\n   - **video_id (str) :** The video ID (directory) containing the\
        \ referenced video\n   - **video_summary (str) :** The text summary for the video to be embedded\n\
        \   - **video_start_time (float) :** The start timestamp in seconds for the video or video chunk\n\
        \   - **video_end_time (float) :** The end timestamp in seconds for the video or video chunk\n\
        \   - **tags (list(str), optional) :** A list of tags to be associated with the video. Useful\
        \ for filtering the search.\n   \n#### Raises:\n- **400 Bad Request :** If required parameters\
        \ are missing or invalid.\n- **404 Not Found :** If the specified video cannot be found in Minio.\n\
        - **502 Bad Gateway :** When something unpleasant happens at Minio storage.\n- **500 Internal\
        \ Server Error :** When some internal error occurs at DataPrep API server.\n\nReturns:\n- **response\
        \ (json) :** A response JSON containing status and message."
      operationId: createVideoSummaryEmbedding
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VideoSummaryRequest'
              description: Document processing parameters
        required: true
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataPrepResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /media/process:
    post:
      tags:
      - Media Processing APIs
      summary: Process media (video or image) already stored in object storage for embedding generation.
      description: "### Processes videos stored in Minio using frame-based processing with optional object\
        \ detection.\n\nVideo is processed by extracting individual frames at regular intervals (every\
        \ Nth frame).\nEach frame generates its own embedding. When object detection is enabled, detected\
        \ objects\nare cropped and embedded as separate entities, providing enhanced semantic coverage.\n\
        \n***For example:** Given a video of 30s at 30fps (900 frames total), with frame_interval = 15,\n\
        60 frames will be extracted and embedded (every 15th frame). If object detection is enabled\n\
        and 3 objects are detected per frame on average, this results in approximately 240 embeddings\n\
        (60 frames + 180 object crops).**\n\n#### Body Params:\n- **video_request (VideoRequest) :** Contains\
        \ processing parameters:\n   - **bucket_name (str) :** The bucket name where the video is stored\
        \ (If not provided, a default bucket name will be used based on application config.)\n   - **video_id\
        \ (str) :** The video ID (directory) containing the video (required)\n   - **frame_interval (int)\
        \ :** Extract every Nth frame for processing (default: 15, range: 1-60)\n   - **enable_object_detection\
        \ (bool) :** Enable object detection and crop extraction (default: True)\n   - **detection_confidence\
        \ (float) :** Confidence threshold for object detection (default: 0.85, range: 0.1-1.0)\n   -\
        \ **tags (list(str), optional) :** A list of tags to be associated with the video. Useful for\
        \ filtering the search.\n\n#### Raises:\n- **400 Bad Request :** If required parameters are missing\
        \ or invalid.\n- **404 Not Found :** If the specified video cannot be found in Minio or no videos\
        \ exist in the specified directory.\n- **502 Bad Gateway :** When something unpleasant happens\
        \ at Minio storage.\n- **500 Internal Server Error :** When some internal error occurs at DataPrep\
        \ API server.\n\nReturns:\n- **response (json) :** A response JSON containing status and message."
      operationId: processStoredMedia
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VideoRequest'
              description: Video processing parameters
        required: true
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataPrepResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /media/upload:
    post:
      tags:
      - Media Processing APIs
      summary: Upload and process a video or image file for embedding generation.
      description: '### Upload and process a video or image file for embedding generation.


        This endpoint accepts a media file upload (MP4 video or a supported image

        format), stores it, and generates embeddings. Videos are processed with

        frame-based extraction; images are embedded directly (whole image plus, when

        object detection is enabled, one embedding per detected object crop). Both

        paths share the same storage, duplicate-detection and metadata contract; the

        embedding is discriminated by the ``content_type`` metadata field.


        Video is processed by extracting individual frames at regular intervals (every Nth frame).

        Each frame generates its own embedding. When object detection is enabled, detected objects

        are cropped and embedded as separate entities, providing enhanced semantic coverage.


        ***For example:** Given a video of 30s at 30fps (900 frames total), with frame_interval = 15,

        60 frames will be extracted and embedded (every 15th frame). If object detection is enabled

        and suppose 3 objects are detected per frame on average, this results in approximately 240 embeddings

        (60 frames + 180 object crops).**


        #### File Upload:

        - **file (UploadFile, required) :** Video file to upload (MP4 format only, max size 500MB)


        #### Query Params:

        - **bucket_name (str, optional) :** The bucket name to store the video in. If not provided, default
        bucket will be used.

        - **frame_interval (int, optional) :** Extract every Nth frame for processing (default: 15, range:
        1-60)

        - **enable_object_detection (bool, optional) :** Enable object detection and crop extraction (default:
        True)

        - **detection_confidence (float, optional) :** Confidence threshold for object detection (default:
        0.85, range: 0.1-1.0)

        - **tags (list(str), optional) :** A list of tags to be associated with the video. Useful for
        filtering the search.


        #### Raises:

        - **400 Bad Request :** If the video file is not an MP4 or fails validation.

        - **413 Request Entity Too Large :** If the uploaded file exceeds the 500MB limit.

        - **502 Bad Gateway :** When something unpleasant happens at Minio storage.

        - **500 Internal Server Error :** When some internal error occurs at DataPrep API server.


        Returns:

        - **response (json) :** A response JSON containing status and message.'
      operationId: uploadAndProcessMedia
      parameters:
      - name: bucket_name
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: The bucket name to store the video in. If not provided, default bucket will be
            used.
          title: Bucket Name
        description: The bucket name to store the video in. If not provided, default bucket will be used.
      - name: frame_interval
        in: query
        required: false
        schema:
          anyOf:
          - type: integer
            maximum: 60
            minimum: 1
          - type: 'null'
          description: 'Extract every Nth frame for processing (default: 15)'
          title: Frame Interval
        description: 'Extract every Nth frame for processing (default: 15)'
      - name: enable_object_detection
        in: query
        required: false
        schema:
          anyOf:
          - type: boolean
          - type: 'null'
          description: 'Enable object detection and crop extraction (default: True)'
          title: Enable Object Detection
        description: 'Enable object detection and crop extraction (default: True)'
      - name: detection_confidence
        in: query
        required: false
        schema:
          anyOf:
          - type: number
            maximum: 1.0
            minimum: 0.1
          - type: 'null'
          description: 'Confidence threshold for object detection (default: 0.85)'
          title: Detection Confidence
        description: 'Confidence threshold for object detection (default: 0.85)'
      - name: tags
        in: query
        required: false
        schema:
          anyOf:
          - type: array
            items:
              type: string
          - type: 'null'
          description: List of tags to be associated with the video. Useful for filtering the search.
          title: Tags
        description: List of tags to be associated with the video. Useful for filtering the search.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Body_uploadAndProcessMedia'
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataPrepResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /media/rtsp:
    post:
      tags:
      - Media Processing APIs
      summary: Provide list of RTSP Stream URLs to process and generate embeddings.
      description: '### Process RTSP stream URLs for frame-based embedding generation.


        This endpoint accepts a list of RTSP stream URLs, validates them, and generates embeddings

        using frame-based processing with optional object detection.


        Each RTSP stream is processed by extracting individual frames at regular intervals (every Nth
        frame).

        Each frame generates its own embedding. When object detection is enabled and suppose 3 objects
        are detected per frame on average, this results in approximately 240 embeddings

        (60 frames + 180 object crops) per video. The generated embeddings are stored in the vector database
        with associated metadata and tags.


        #### Query Params:

        - **rtsp_urls (list(str), required) :** List of RTSP stream URLs to process. Each URL will be
        validated and processed for embedding generation.

        - **frame_interval (int, optional) :** Extract every Nth frame for processing (default: 15, range:
        1-60)

        - **enable_object_detection (bool, optional) :** Enable object detection and crop extraction (default:
        True)

        - **detection_confidence (float, optional) :** Confidence threshold for object detection (default:
        0.85, range: 0.1-1.0)

        - **tags (list(str), optional) :** A list of tags to be associated with the videos. Useful for
        filtering the search.


        #### Raises:

        - **400 Bad Request :** If any of the RTSP URLs are invalid or fail validation.

        - **502 Bad Gateway :** When something unpleasant happens at Minio storage or during stream access.

        - **500 Internal Server Error :** When some internal error occurs at DataPrep API server.


        Returns:

        - **response (json) :** A response JSON containing status and message.'
      operationId: processRtspStreams
      parameters:
      - name: rtsp_urls
        in: query
        required: true
        schema:
          type: array
          items:
            type: string
          description: List of RTSP stream URLs to process. Each URL will be validated and processed for
            embedding generation.
          title: Rtsp Urls
        description: List of RTSP stream URLs to process. Each URL will be validated and processed for
          embedding generation.
      - name: frame_interval
        in: query
        required: false
        schema:
          anyOf:
          - type: integer
            maximum: 60
            minimum: 1
          - type: 'null'
          description: 'Extract every Nth frame for processing (default: 15)'
          title: Frame Interval
        description: 'Extract every Nth frame for processing (default: 15)'
      - name: enable_object_detection
        in: query
        required: false
        schema:
          anyOf:
          - type: boolean
          - type: 'null'
          description: 'Enable object detection and crop extraction (default: True)'
          title: Enable Object Detection
        description: 'Enable object detection and crop extraction (default: True)'
      - name: detection_confidence
        in: query
        required: false
        schema:
          anyOf:
          - type: number
            maximum: 1.0
            minimum: 0.1
          - type: 'null'
          description: 'Confidence threshold for object detection (default: 0.85)'
          title: Detection Confidence
        description: 'Confidence threshold for object detection (default: 0.85)'
      - name: tags
        in: query
        required: false
        schema:
          anyOf:
          - type: array
            items:
              type: string
          - type: 'null'
          description: List of tags to be associated with the videos. Useful for filtering the search.
          title: Tags
        description: List of tags to be associated with the videos. Useful for filtering the search.
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataPrepResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /media/upload/batch:
    post:
      tags:
      - Batch Ingestion APIs
      summary: Upload and process multiple media files (videos and/or images) as an async batch job.
      description: Accept multiple media uploads (videos and/or images), stash them to storage, and submit
        one async job.
      operationId: uploadAndProcessMediaBatch
      parameters:
      - name: bucket_name
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Target bucket (default if unset).
          title: Bucket Name
        description: Target bucket (default if unset).
      - name: frame_interval
        in: query
        required: false
        schema:
          anyOf:
          - type: integer
            maximum: 60
            minimum: 1
          - type: 'null'
          description: 'Extract every Nth frame (default: 15).'
          title: Frame Interval
        description: 'Extract every Nth frame (default: 15).'
      - name: enable_object_detection
        in: query
        required: false
        schema:
          anyOf:
          - type: boolean
          - type: 'null'
          description: Enable object detection and crop extraction.
          title: Enable Object Detection
        description: Enable object detection and crop extraction.
      - name: detection_confidence
        in: query
        required: false
        schema:
          anyOf:
          - type: number
            maximum: 1.0
            minimum: 0.1
          - type: 'null'
          description: Object detection confidence threshold.
          title: Detection Confidence
        description: Object detection confidence threshold.
      - name: tags
        in: query
        required: false
        schema:
          anyOf:
          - type: array
            items:
              type: string
          - type: 'null'
          description: Tags for all uploaded videos.
          title: Tags
        description: Tags for all uploaded videos.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Body_uploadAndProcessMediaBatch'
      responses:
        '202':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BatchSubmitResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /media/process/batch:
    post:
      tags:
      - Batch Ingestion APIs
      summary: Batch-process media (videos/images) already present in storage (async batch job).
      description: 'Submit an async job over videos that already exist in storage.


        Provide either an explicit ``items`` list or a ``bucket_name`` (optionally

        narrowed by ``prefix``) selector.'
      operationId: processMediaBatchExisting
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BatchProcessExistingRequest'
              description: Batch selection + params
        required: true
      responses:
        '202':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BatchSubmitResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /media/ingest-dir:
    post:
      tags:
      - Batch Ingestion APIs
      summary: Ingest all supported media (videos and images) from a mounted directory (async batch job).
      description: Walk a mounted directory, stash each supported media file into storage, and submit
        one async job.
      operationId: ingestDirectory
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DirectoryIngestRequest'
              description: Directory ingest parameters
        required: true
      responses:
        '202':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BatchSubmitResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /media/jobs/{job_id}:
    get:
      tags:
      - Batch Ingestion APIs
      summary: Get the status and per-item results of a batch job.
      description: Return the current state and per-item results of a batch job (404 if unknown).
      operationId: getBatchJobStatus
      parameters:
      - name: job_id
        in: path
        required: true
        schema:
          type: string
          title: Job Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BatchJobStatus'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    delete:
      tags:
      - Batch Ingestion APIs
      summary: Request cancellation of a pending/running batch job.
      description: Request cooperative cancellation of a batch job (404 if unknown).
      operationId: cancelBatchJob
      parameters:
      - name: job_id
        in: path
        required: true
        schema:
          type: string
          title: Job Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BatchJobStatus'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /media/ingest:
    post:
      tags:
      - Media Ingestion APIs
      summary: Ingest a single image from a JSON source (base64 or URL).
      description: 'Decode/download a single image, store it, and generate embeddings synchronously.


        The image bytes (from base64 or a downloaded URL) are the trust boundary: the

        real format is sniffed to derive the stored extension, then the image is

        embedded (whole image plus one embedding per detected object crop when object

        detection is enabled) into the shared vector collection with

        ``content_type="image"``.'
      operationId: ingestImage
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ImageIngestRequest'
              description: Typed image source + ingestion params
        required: true
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataPrepResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /media/ingest/batch:
    post:
      tags:
      - Media Ingestion APIs
      summary: Ingest multiple images from JSON sources (base64/URL) as an async batch job.
      description: 'Decode/download and stash each image, then submit one async job over them.


        Each image is validated + persisted before the 202 (the base64/URL bytes are

        only available on the request), after which processing is indistinguishable

        from other stored-media batches and runs off the request path.'
      operationId: ingestImageBatch
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ImageBatchIngestRequest'
              description: Typed image sources + params
        required: true
      responses:
        '202':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BatchSubmitResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /telemetry:
    get:
      tags:
      - Telemetry
      summary: Get recent telemetry records
      description: Return the most recent telemetry entries (newest first).
      operationId: listTelemetryRecords
      parameters:
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 100
          minimum: 1
          description: Maximum number of latest telemetry records to return.
          default: 100
          title: Limit
        description: Maximum number of latest telemetry records to return.
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TelemetryResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /media:
    get:
      tags:
      - Media Management APIs
      summary: List stored media (videos and images) in a bucket.
      description: '### Get list of videos from Minio storage.


        This endpoint retrieves a list of all videos stored in Minio and returns their information.


        #### Query Params:

        - **bucket_name (str, optional) :** The bucket name where videos are stored. If not provided,
        default bucket will be used.


        #### Raises:

        - **502 Bad Gateway :** When something unpleasant happens at Minio storage.

        - **500 Internal Server Error :** When some internal error occurs at DataPrep API server.


        Returns:

        - **response (json) :** A response JSON containing list of videos with their information.'
      operationId: listMedia
      parameters:
      - name: bucket_name
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: The bucket name where videos are stored. If not provided, default bucket will be
            used.
          title: Bucket Name
        description: The bucket name where videos are stored. If not provided, default bucket will be
          used.
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BucketVideoListResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /media/download:
    get:
      tags:
      - Media Management APIs
      summary: Download or stream stored media, video or image (supports HTTP Range/seek).
      description: '### Download or stream a video from storage.


        Streams a video from the active storage backend (MinIO or local filesystem).

        The endpoint advertises ``Accept-Ranges: bytes`` and honours the HTTP

        ``Range`` request header, so media players can **seek** without downloading

        the whole file:


        - No ``Range`` header -> ``200 OK`` with the full body.

        - Valid ``Range`` header -> ``206 Partial Content`` with ``Content-Range``.

        - Unsatisfiable ``Range`` -> ``416 Range Not Satisfiable``.


        #### Query Params:

        - **video_id (str, required) :** The video ID (directory) containing the video to download.

        - **bucket_name (str, optional) :** The bucket where the video is stored. Defaults to the configured
        bucket.

        - **download (bool, optional) :** Set to true to force a file download (``attachment``) instead
        of inline streaming.


        #### Raises:

        - **400 Bad Request :** If required parameters are missing or invalid.

        - **404 Not Found :** If the specified video cannot be found.

        - **416 Range Not Satisfiable :** If the requested byte range is invalid for the object.

        - **500 Internal Server Error :** On an internal error.


        Returns:

        - **response (stream) :** The (partial or full) video file as a stream.'
      operationId: downloadMedia
      parameters:
      - name: video_id
        in: query
        required: true
        schema:
          type: string
          description: The video ID (directory) containing the video to download
          title: Video Id
        description: The video ID (directory) containing the video to download
      - name: bucket_name
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: The bucket name where the video is stored. If not provided, default bucket will
            be used.
          title: Bucket Name
        description: The bucket name where the video is stored. If not provided, default bucket will be
          used.
      - name: download
        in: query
        required: false
        schema:
          type: boolean
          description: Set to true to download the file instead of streaming it
          default: false
          title: Download
        description: Set to true to download the file instead of streaming it
      responses:
        '200':
          description: Full video stream response
          content:
            video/mp4:
              schema:
                type: string
                format: binary
        '206':
          description: Partial video stream response (byte range).
          content:
            video/mp4:
              schema:
                type: string
                format: binary
        '416':
          description: The requested byte range cannot be satisfied.
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /media/{bucket_name}/{video_id}:
    delete:
      tags:
      - Media Management APIs
      summary: Delete a media item (video or image) from storage and its embeddings from the vector DB.
      description: '### Delete a video from storage and its embeddings from the vector DB.


        This endpoint deletes a video (the single file under a ``video_id`` directory)

        from the active storage backend AND removes the corresponding embeddings from

        the active vector DB, keeping both stores consistent. Embeddings are removed

        first so a failure never leaves orphaned vectors behind.


        #### Path Params:

        - **bucket_name (str, required) :** The bucket name where the video is stored

        - **video_id (str, required) :** The video ID (directory) containing the video to delete


        #### Raises:

        - **400 Bad Request :** If required parameters are missing or invalid.

        - **404 Not Found :** If no video exists in the specified directory.

        - **502 Bad Gateway :** When something unpleasant happens at the storage backend or vector DB.

        - **500 Internal Server Error :** When some internal error occurs at DataPrep API server.


        Returns:

        - **response (json) :** A response JSON containing status and message.'
      operationId: deleteMedia
      parameters:
      - name: bucket_name
        in: path
        required: true
        schema:
          type: string
          description: The bucket name where the video is stored
          title: Bucket Name
        description: The bucket name where the video is stored
      - name: video_id
        in: path
        required: true
        schema:
          type: string
          description: The video ID (directory) containing the video to delete
          title: Video Id
        description: The video ID (directory) containing the video to delete
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataPrepResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
components:
  schemas:
    BatchItemResult:
      properties:
        identifier:
          type: string
          title: Identifier
          description: Human-readable item identifier (e.g. filename).
        bucket_name:
          anyOf:
          - type: string
          - type: 'null'
          title: Bucket Name
        video_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Video Id
        status:
          $ref: '#/components/schemas/BatchItemStatusEnum'
          default: pending
        message:
          anyOf:
          - type: string
          - type: 'null'
          title: Message
        embeddings_count:
          anyOf:
          - type: integer
          - type: 'null'
          title: Embeddings Count
      type: object
      required:
      - identifier
      title: BatchItemResult
      description: Result of processing a single item within a batch job.
    BatchItemStatusEnum:
      type: string
      enum:
      - pending
      - running
      - success
      - error
      - skipped
      title: BatchItemStatusEnum
      description: Per-item processing status within a batch job.
    BatchJobStateEnum:
      type: string
      enum:
      - pending
      - running
      - completed
      - completed_with_errors
      - failed
      - cancelled
      title: BatchJobStateEnum
      description: Lifecycle states for an asynchronous batch ingestion job.
    BatchJobStatus:
      properties:
        status:
          $ref: '#/components/schemas/StatusEnum'
          default: success
        message:
          anyOf:
          - type: string
          - type: 'null'
          title: Message
        job_id:
          type: string
          title: Job Id
        state:
          $ref: '#/components/schemas/BatchJobStateEnum'
        source:
          anyOf:
          - type: string
          - type: 'null'
          title: Source
        total:
          type: integer
          title: Total
          default: 0
        completed:
          type: integer
          title: Completed
          default: 0
        failed:
          type: integer
          title: Failed
          default: 0
        items:
          items:
            $ref: '#/components/schemas/BatchItemResult'
          type: array
          title: Items
        created_ts:
          anyOf:
          - type: number
          - type: 'null'
          title: Created Ts
        updated_ts:
          anyOf:
          - type: number
          - type: 'null'
          title: Updated Ts
      type: object
      required:
      - job_id
      - state
      title: BatchJobStatus
      description: Status and per-item results for an asynchronous batch job.
    BatchProcessExistingRequest:
      properties:
        items:
          anyOf:
          - items:
              $ref: '#/components/schemas/VideoRequest'
            type: array
          - type: 'null'
          title: Items
          description: Explicit list of videos to process.
        bucket_name:
          anyOf:
          - type: string
          - type: 'null'
          title: Bucket Name
          description: 'Selector: process all videos in this bucket.'
        prefix:
          anyOf:
          - type: string
          - type: 'null'
          title: Prefix
          description: 'Selector: only video_ids starting with this prefix.'
        frame_interval:
          anyOf:
          - type: integer
            maximum: 60.0
            minimum: 1.0
          - type: 'null'
          title: Frame Interval
          description: 'Extract every Nth frame (default: 15).'
        enable_object_detection:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Enable Object Detection
          description: Enable object detection and crop extraction.
        detection_confidence:
          anyOf:
          - type: number
            maximum: 1.0
            minimum: 0.1
          - type: 'null'
          title: Detection Confidence
          description: Object detection confidence threshold.
        tags:
          anyOf:
          - items:
              type: string
            type: array
          - type: 'null'
          title: Tags
          description: Tags associated with every video in the batch.
      type: object
      title: BatchProcessExistingRequest
      description: 'Request model for batch-processing videos that already exist in storage.


        Either provide an explicit list of ``items`` (per-video overrides), or a

        ``bucket_name`` selector (optionally narrowed by ``prefix``) to process every

        video found in that bucket. Selector-level ``frame_interval`` /

        ``enable_object_detection`` / ``detection_confidence`` / ``tags`` apply to all

        videos matched by the selector.'
    BatchSubmitResponse:
      properties:
        status:
          $ref: '#/components/schemas/StatusEnum'
          default: success
        message:
          anyOf:
          - type: string
          - type: 'null'
          title: Message
        job_id:
          type: string
          title: Job Id
          description: Identifier used to poll job status.
        accepted:
          type: integer
          title: Accepted
          description: Number of items accepted into the job.
      type: object
      required:
      - job_id
      - accepted
      title: BatchSubmitResponse
      description: Response returned when a batch job is accepted (HTTP 202).
    Body_uploadAndProcessMedia:
      properties:
        file:
          type: string
          contentMediaType: application/octet-stream
          title: File
          description: Media file to upload (MP4 video or JPG/PNG/WEBP/BMP/GIF image)
      type: object
      required:
      - file
      title: Body_uploadAndProcessMedia
    Body_uploadAndProcessMediaBatch:
      properties:
        files:
          items:
            type: string
            contentMediaType: application/octet-stream
          type: array
          title: Files
          description: Media files to upload (MP4 videos or images)
      type: object
      required:
      - files
      title: Body_uploadAndProcessMediaBatch
    BucketVideoListResponse:
      properties:
        status:
          $ref: '#/components/schemas/StatusEnum'
          default: success
        message:
          anyOf:
          - type: string
          - type: 'null'
          title: Message
        bucket_name:
          type: string
          title: Bucket Name
        videos:
          items:
            $ref: '#/components/schemas/VideoInfo'
          type: array
          title: Videos
          description: List of video information objects containing video details
      type: object
      required:
      - bucket_name
      title: BucketVideoListResponse
      description: Response model for list of videos in a bucket
    DataPrepResponse:
      properties:
        status:
          $ref: '#/components/schemas/StatusEnum'
          default: success
        message:
          anyOf:
          - type: string
          - type: 'null'
          title: Message
      type: object
      title: DataPrepResponse
      description: Response model for API Responses from DataStore service
    DirectoryIngestRequest:
      properties:
        dir_path:
          type: string
          title: Dir Path
          description: Directory to ingest, relative to the configured ingest data root.
        bucket_name:
          anyOf:
          - type: string
          - type: 'null'
          title: Bucket Name
          description: Target bucket for stored videos (default bucket if unset).
        recursive:
          type: boolean
          title: Recursive
          description: Recurse into subdirectories (the 'meta' dir is skipped).
          default: false
        frame_interval:
          anyOf:
          - type: integer
            maximum: 60.0
            minimum: 1.0
          - type: 'null'
          title: Frame Interval
          description: 'Extract every Nth frame (default: 15).'
        enable_object_detection:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Enable Object Detection
          description: Enable object detection and crop extraction.
        detection_confidence:
          anyOf:
          - type: number
            maximum: 1.0
            minimum: 0.1
          - type: 'null'
          title: Detection Confidence
          description: Object detection confidence threshold.
        tags:
          anyOf:
          - items:
              type: string
            type: array
          - type: 'null'
          title: Tags
          description: Tags associated with every ingested file.
      type: object
      required:
      - dir_path
      title: DirectoryIngestRequest
      description: 'Request model for backward-compatible directory ingestion.


        Walks ``dir_path`` (resolved against the configured ingest data root) and

        submits every supported media file as a batch job. Mirrors the EOL

        milvus-dataprep host-directory ingest contract.'
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    HealthResponse:
      properties:
        status:
          type: string
          title: Status
        embedding_client_status:
          anyOf:
          - type: string
          - type: 'null'
          title: Embedding Client Status
        model_name:
          anyOf:
          - type: string
          - type: 'null'
          title: Model Name
        embedding_device:
          anyOf:
          - type: string
          - type: 'null'
          title: Embedding Device
        use_openvino:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Use Openvino
        embedding_client_error:
          anyOf:
          - type: string
          - type: 'null'
          title: Embedding Client Error
        detection_model:
          anyOf:
          - type: string
          - type: 'null'
          title: Detection Model
        detection_device:
          anyOf:
          - type: string
          - type: 'null'
          title: Detection Device
      type: object
      required:
      - status
      title: HealthResponse
      description: Response model for service health checks.
    ImageBatchIngestRequest:
      properties:
        images:
          items:
            $ref: '#/components/schemas/ImageIngestItem'
          type: array
          title: Images
          description: List of typed image sources (base64 or URL).
        bucket_name:
          anyOf:
          - type: string
          - type: 'null'
          title: Bucket Name
          description: Target bucket for all stored images (default bucket if unset).
        enable_object_detection:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Enable Object Detection
          description: Enable object detection and crop extraction for every image.
        detection_confidence:
          anyOf:
          - type: number
            maximum: 1.0
            minimum: 0.1
          - type: 'null'
          title: Detection Confidence
          description: Object detection confidence threshold.
        tags:
          anyOf:
          - items:
              type: string
            type: array
          - type: 'null'
          title: Tags
          description: Tags applied to every image in the batch.
      type: object
      required:
      - images
      title: ImageBatchIngestRequest
      description: 'Batch JSON ingestion request: many typed image sources -> one async job.'
    ImageIngestItem:
      properties:
        type:
          $ref: '#/components/schemas/ImageSourceTypeEnum'
          description: 'Source discriminator: ''image_base64'' or ''image_url''.'
        image_base64:
          anyOf:
          - type: string
          - type: 'null'
          title: Image Base64
          description: Base64-encoded image (bare or 'data:' URL) when type=image_base64.
        image_url:
          anyOf:
          - type: string
          - type: 'null'
          title: Image Url
          description: Absolute http(s) image URL when type=image_url.
        filename:
          anyOf:
          - type: string
          - type: 'null'
          title: Filename
          description: Optional filename hint; extension is derived from the real bytes.
        tags:
          anyOf:
          - items:
              type: string
            type: array
          - type: 'null'
          title: Tags
          description: Optional per-image tags (merged with request-level tags).
      type: object
      required:
      - type
      title: ImageIngestItem
      description: 'A single typed image source for JSON ingestion.


        Exactly one payload field must be set, matching ``type``:

        ``image_base64`` (inline base64 / data URL) or ``image_url`` (remote http(s)

        URL). The stored filename/extension is derived from the sniffed bytes, so

        ``filename`` is an optional hint only.'
    ImageIngestRequest:
      properties:
        type:
          $ref: '#/components/schemas/ImageSourceTypeEnum'
          description: 'Source discriminator: ''image_base64'' or ''image_url''.'
        image_base64:
          anyOf:
          - type: string
          - type: 'null'
          title: Image Base64
          description: Base64-encoded image (bare or 'data:' URL) when type=image_base64.
        image_url:
          anyOf:
          - type: string
          - type: 'null'
          title: Image Url
          description: Absolute http(s) image URL when type=image_url.
        filename:
          anyOf:
          - type: string
          - type: 'null'
          title: Filename
          description: Optional filename hint; extension is derived from the real bytes.
        tags:
          anyOf:
          - items:
              type: string
            type: array
          - type: 'null'
          title: Tags
          description: Optional per-image tags (merged with request-level tags).
        bucket_name:
          anyOf:
          - type: string
          - type: 'null'
          title: Bucket Name
          description: Target bucket for the stored image (default bucket if unset).
        enable_object_detection:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Enable Object Detection
          description: 'Enable object detection and crop extraction (default: True).'
        detection_confidence:
          anyOf:
          - type: number
            maximum: 1.0
            minimum: 0.1
          - type: 'null'
          title: Detection Confidence
          description: 'Object detection confidence threshold (default: 0.85).'
      type: object
      required:
      - type
      title: ImageIngestRequest
      description: Single-image JSON ingestion request (one typed source + storage params).
    ImageSourceTypeEnum:
      type: string
