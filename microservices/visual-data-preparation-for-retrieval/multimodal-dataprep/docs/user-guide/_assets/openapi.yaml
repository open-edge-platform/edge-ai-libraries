      summary: Register an RTSP stream and start ingesting it.
      description: "### Register a live RTSP stream and begin continuous ingestion.\n\nThe call returns\
        \ as soon as the stream is registered; frames are decoded,\nembedded, and stored by a background\
        \ worker that keeps running until the\nstream is paused or deleted. The worker also records N-second\
        \ video segments\nand sampled frames so retrieval hits are playable.\n\n#### Request Body:\n-\
        \ **stream_url (str, required) :** RTSP source URL. Credentials embedded in\n  the URL are used\
        \ to connect but are never returned or persisted to the\n  vector database.\n- **stream_name (str,\
        \ optional) :** Friendly label; defaults to the redacted URL.\n- **description (str, optional)\
        \ :** Free-text description.\n- **sensor_id (str, optional) :** Stable logical identity of the\
        \ physical\n  source, recorded on every embedding so externally stored media for the\n  same source\
        \ can be correlated back to it. Defaults to the stream_id.\n- **frame_interval (int, optional)\
        \ :** Sample every Nth frame (1-60).\n- **enable_object_detection (bool, optional) :** Enable\
        \ crop extraction.\n- **detection_confidence (float, optional) :** Detection threshold (0.1-1.0).\n\
        - **tags (list(str), optional) :** Tags applied to every embedding.\n- **start (bool, optional)\
        \ :** Register without starting when false.\n\n#### Raises:\n- **400 Bad Request :** The URL is\
        \ not a valid RTSP URL.\n- **503 Service Unavailable :** The concurrency limit is reached, or\
        \ live\n  ingestion is disabled.\n- **500 Internal Server Error :** Unexpected failure while registering.\n\
        \nReturns:\n- **response (json) :** The registered stream, with its credentials redacted."
      operationId: createLiveStream
      requestBody:
