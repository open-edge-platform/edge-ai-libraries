  /media/ingest:
    post:
      tags:
      - Media Ingestion APIs
      summary: Ingest a single image from a JSON source (base64 or URL).
      description: 'Decode/download a single image, store it, and generate embeddings synchronously.


        The image bytes (from base64 or a downloaded URL) are the trust boundary: the

        real format is sniffed to derive the stored extension, then the image is

        embedded (whole image plus one embedding per detected object crop when object

        detection is enabled) into the shared vector collection with

        ``content_type="image"``.'
      operationId: ingestImage
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ImageIngestRequest'
              description: Typed image source + ingestion params
        required: true
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataPrepResponse'
        '400':
          description: Required parameters are missing, malformed, or fail validation (for example an
            unsupported media type or an out-of-range value).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataPrepResponse'
        '404':
          description: The requested media, bucket, or job does not exist in the configured storage backend.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataPrepResponse'
        '409':
          description: The upload duplicates media that is already stored. Returned only when duplicate
            uploads are disabled (``ALLOW_DUPLICATE_UPLOADS=false``); the message carries the existing
            ``video_id``.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataPrepResponse'
        '502':
          description: The configured storage backend or vector database could not be reached or returned
            an error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataPrepResponse'
        '500':
          description: An unexpected error occurred inside the DataPrep service.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataPrepResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /media/ingest/batch:
    post:
      tags:
      - Media Ingestion APIs
      summary: Ingest multiple images from JSON sources (base64/URL) as an async batch job.
      description: 'Decode/download and stash each image, then submit one async job over them.


        Each image is validated + persisted before the 202 (the base64/URL bytes are

        only available on the request), after which processing is indistinguishable

        from other stored-media batches and runs off the request path.'
      operationId: ingestImageBatch
      requestBody:
