  /media/download:
    get:
      tags:
      - Media Management APIs
      summary: Download or stream stored media, video or image (supports HTTP Range/seek).
      description: '### Download or stream a video from storage.


        Streams stored media from the active storage backend (object storage or local filesystem).

        The endpoint advertises ``Accept-Ranges: bytes`` and honours the HTTP

        ``Range`` request header, so media players can **seek** without downloading

        the whole file:


        - No ``Range`` header -> ``200 OK`` with the full body.

        - Valid ``Range`` header -> ``206 Partial Content`` with ``Content-Range``.

        - Unsatisfiable ``Range`` -> ``416 Range Not Satisfiable``.


        Media ingested by reference (``store_copy=false``) is served too: it has no

        stored object, so it is read from its file on the ingest mount instead.


        #### Query Params:

        - **video_id (str, required) :** The video ID (directory) containing the video to download.

        - **bucket_name (str, optional) :** The bucket where the video is stored. Defaults to the configured
        bucket.

        - **download (bool, optional) :** Set to true to force a file download (``attachment``) instead
        of inline streaming.

        - **media_path (str, optional) :** Relative path to a specific object inside the ``video_id``
        directory (e.g. ``segments/1790655530.mp4``). Required for live-stream media, which is stored
        under ``<stream_id>/segments/``.


        #### Raises:

        - **400 Bad Request :** If required parameters are missing or invalid.

        - **404 Not Found :** If the specified video cannot be found.

        - **416 Range Not Satisfiable :** If the requested byte range is invalid for the object.

        - **500 Internal Server Error :** On an internal error.


        Returns:

        - **response (stream) :** The (partial or full) video file as a stream.'
      operationId: downloadMedia
      parameters:
      - name: video_id
        in: query
        required: true
        schema:
          type: string
          description: The video ID (directory) containing the video to download
          title: Video Id
        description: The video ID (directory) containing the video to download
      - name: bucket_name
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: The bucket (object storage) or top-level directory (local storage) holding the
            media. Defaults to the service's configured bucket when omitted.
          title: Bucket Name
        description: The bucket (object storage) or top-level directory (local storage) holding the media.
          Defaults to the service's configured bucket when omitted.
      - name: download
        in: query
        required: false
        schema:
          type: boolean
          description: Set to true to download the file instead of streaming it
          default: false
          title: Download
        description: Set to true to download the file instead of streaming it
      - name: media_path
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Relative path to a specific object inside the video_id directory, e.g. 'segments/1790655530.mp4'.
            Required for live-stream media, which is stored under <stream_id>/segments/. When omitted,
            the single media object in the video_id directory is served.
          title: Media Path
        description: Relative path to a specific object inside the video_id directory, e.g. 'segments/1790655530.mp4'.
          Required for live-stream media, which is stored under <stream_id>/segments/. When omitted, the
          single media object in the video_id directory is served.
      responses:
        '200':
          description: Full media stream. The Content-Type reflects the stored media (for example video/mp4
            or image/jpeg).
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        '206':
          description: Partial media stream (byte range).
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        '400':
          description: Required parameters are missing, malformed, or fail validation (for example an
            unsupported media type or an out-of-range value).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataPrepResponse'
        '404':
          description: The requested media, bucket, or job does not exist in the configured storage backend.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataPrepResponse'
        '416':
          description: The requested byte range lies outside the stored object.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataPrepResponse'
        '500':
          description: An unexpected error occurred inside the DataPrep service.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataPrepResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /media/frame:
    get:
      tags:
      - Media Management APIs
      summary: Extract one frame from stored media (full frame or detected-crop region).
      description: "### Extract a single frame from stored media.\n\nDecodes exactly one frame on demand\
        \ (no stored JPEGs). Typical flow for a\ndownstream agent:\n\n1. Run a search; each result carries\
        \ ``best_frame_info`` (the peak-scoring\n   frame) with ``timestamp``, ``bucket_name``, ``is_live``/``media_path``\
        \ and,\n   for detections, ``crop_bbox``.\n2. Call this endpoint with those values to fetch the\
        \ exact frame.\n\n#### Query Params:\n- **video_id (str, required):** Uploaded ``video_id`` or\
        \ live ``stream_id``.\n- **timestamp (float, required):** Seconds into the addressed media (see\
        \ note above).\n- **bucket_name (str, optional):** Defaults to the configured bucket.\n- **media_path\
        \ (str, optional):** Segment object for live media (required for live).\n- **variant (str, optional):**\
        \ ``full`` (default) or ``crop``.\n- **crop_bbox (str, optional):** ``x1,y1,x2,y2`` for ``variant=crop``.\n\
        - **format (str, optional):** ``image`` (raw JPEG, default) or ``json`` (base64 + metadata).\n\
        - **quality (int, optional):** JPEG quality 1-100 (default 90).\n\n#### Raises:\n- **400 Bad Request:**\
        \ Invalid params or undecodable media.\n- **404 Not Found:** Media/segment cannot be resolved.\n\
        - **500 Internal Server Error:** On an internal error."
      operationId: getMediaFrame
      parameters:
      - name: video_id
        in: query
        required: true
        schema:
          type: string
          description: 'Media identifier: an uploaded video_id or a live stream_id.'
          title: Video Id
        description: 'Media identifier: an uploaded video_id or a live stream_id.'
      - name: timestamp
        in: query
        required: true
        schema:
          type: number
          minimum: 0
          description: Seconds from the start of the addressed media. For an uploaded video this is the
            position within the file; for a live stream it is the offset within the segment named by media_path.
            Pass the search result's best_frame_info.timestamp here.
          title: Timestamp
        description: Seconds from the start of the addressed media. For an uploaded video this is the
          position within the file; for a live stream it is the offset within the segment named by media_path.
          Pass the search result's best_frame_info.timestamp here.
      - name: bucket_name
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Bucket/top-level directory holding the media. Defaults to the configured bucket.
          title: Bucket Name
        description: Bucket/top-level directory holding the media. Defaults to the configured bucket.
      - name: media_path
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Relative object path inside the video_id directory, e.g. 'segments/1790655530.mp4'.
            Required for live-stream frames (stored under <stream_id>/segments/).
          title: Media Path
        description: Relative object path inside the video_id directory, e.g. 'segments/1790655530.mp4'.
          Required for live-stream frames (stored under <stream_id>/segments/).
      - name: variant
        in: query
        required: false
        schema:
          type: string
          pattern: ^(full|crop)$
          description: '''full'' returns the whole frame; ''crop'' returns the crop_bbox region.'
          default: full
          title: Variant
        description: '''full'' returns the whole frame; ''crop'' returns the crop_bbox region.'
      - name: crop_bbox
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Pixel box 'x1,y1,x2,y2' for variant=crop. Supply the detection box captured at
            ingest (search result best_frame_info.crop_bbox). Ignored when variant=full.
          title: Crop Bbox
        description: Pixel box 'x1,y1,x2,y2' for variant=crop. Supply the detection box captured at ingest
          (search result best_frame_info.crop_bbox). Ignored when variant=full.
      - name: format
        in: query
        required: false
        schema:
          type: string
          pattern: ^(image|json)$
          description: '''image'' returns raw image/jpeg (default); ''json'' returns base64 + metadata.'
          default: image
          title: Format
        description: '''image'' returns raw image/jpeg (default); ''json'' returns base64 + metadata.'
      - name: quality
        in: query
        required: false
        schema:
          type: integer
          maximum: 100
          minimum: 1
          description: Output JPEG quality (1-100).
          default: 90
          title: Quality
        description: Output JPEG quality (1-100).
      responses:
        '200':
          description: The decoded frame. Returns raw image/jpeg bytes by default, or a JSON object with
            base64 image + metadata when format=json.
          content:
            application/json:
              schema:
                $defs:
                  FrameMetadata:
                    description: Describes the frame returned by ``GET /media/frame`` (JSON variant).
                    properties:
                      video_id:
                        title: Video Id
                        type: string
                      bucket_name:
                        title: Bucket Name
                        type: string
                      media_path:
                        anyOf:
                        - type: string
                        - type: 'null'
                        description: Segment object addressed for live media, if any.
                        title: Media Path
                      requested_timestamp:
                        description: Timestamp requested, in seconds from the start of the addressed media.
                        title: Requested Timestamp
                        type: number
                      actual_timestamp:
                        anyOf:
                        - type: number
                        - type: 'null'
                        description: Timestamp of the frame actually returned (nearest decodable at/after
                          the request).
                        title: Actual Timestamp
                      variant:
                        description: '''full'' for the whole frame or ''crop'' for a bounding-box region.'
                        title: Variant
                        type: string
                      width:
                        title: Width
                        type: integer
                      height:
                        title: Height
                        type: integer
                      cropped:
                        description: Whether a crop box was applied.
                        title: Cropped
                        type: boolean
                    required:
                    - video_id
                    - bucket_name
                    - requested_timestamp
                    - variant
                    - width
                    - height
                    - cropped
                    title: FrameMetadata
                    type: object
                description: JSON wrapper returning the frame as base64 plus its metadata.
                properties:
                  mime:
                    default: image/jpeg
                    description: Media type of the encoded image.
                    title: Mime
                    type: string
                  image_base64:
                    description: Base64-encoded JPEG bytes (no data-URL prefix).
                    title: Image Base64
                    type: string
                  frame:
                    $ref: '#/$defs/FrameMetadata'
                required:
                - image_base64
                - frame
                title: FrameJsonResponse
                type: object
            image/jpeg:
              schema:
                type: string
                format: binary
        '400':
          description: Required parameters are missing, malformed, or fail validation (for example an
            unsupported media type or an out-of-range value).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataPrepResponse'
        '404':
          description: The requested media, bucket, or job does not exist in the configured storage backend.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataPrepResponse'
        '500':
          description: An unexpected error occurred inside the DataPrep service.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataPrepResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /media/{bucket_name}:
    delete:
      tags:
      - Media Management APIs
      summary: Delete every media item in a bucket from storage and all its embeddings from the vector
        DB.
      description: '### Clear a bucket: delete all stored media and all of its embeddings.


        The bucket-wide counterpart of ``DELETE /media/{bucket_name}/{video_id}``, for

        resetting an ingested collection in one call. Embeddings are removed first, so

        a failure never leaves orphaned vectors behind. Vectors are deleted by

        ``bucket_name``, which also clears embeddings of media that was referenced in

        place (``store_copy=false``) and therefore has no stored objects.


        #### Path Params:

        - **bucket_name (str, required) :** The bucket to clear


        #### Raises:

        - **400 Bad Request :** If the bucket name is missing or invalid.

        - **502 Bad Gateway :** When something unpleasant happens at the storage backend or vector DB.

        - **500 Internal Server Error :** When some internal error occurs at DataPrep API server.


        Returns:

        - **response (json) :** A response JSON containing status and message.'
      operationId: deleteAllMedia
      parameters:
      - name: bucket_name
        in: path
        required: true
        schema:
          type: string
          description: The bucket (object storage) or top-level directory (local storage) whose media
            and embeddings are to be deleted.
          title: Bucket Name
        description: The bucket (object storage) or top-level directory (local storage) whose media and
          embeddings are to be deleted.
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataPrepResponse'
        '400':
          description: Required parameters are missing, malformed, or fail validation (for example an
            unsupported media type or an out-of-range value).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataPrepResponse'
        '502':
          description: The configured storage backend or vector database could not be reached or returned
            an error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataPrepResponse'
        '500':
          description: An unexpected error occurred inside the DataPrep service.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataPrepResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /media/{bucket_name}/{video_id}:
    delete:
      tags:
      - Media Management APIs
      summary: Delete a media item (video or image) from storage and its embeddings from the vector DB.
      description: '### Delete a video from storage and its embeddings from the vector DB.


        This endpoint deletes a video (the single file under a ``video_id`` directory)

        from the active storage backend AND removes the corresponding embeddings from

        the active vector DB, keeping both stores consistent. Embeddings are removed

        first so a failure never leaves orphaned vectors behind.


        #### Path Params:

        - **bucket_name (str, required) :** The bucket name where the video is stored

        - **video_id (str, required) :** The video ID (directory) containing the video to delete


        #### Raises:

        - **400 Bad Request :** If required parameters are missing or invalid.

        - **404 Not Found :** If no video exists in the specified directory.

        - **502 Bad Gateway :** When something unpleasant happens at the storage backend or vector DB.

        - **500 Internal Server Error :** When some internal error occurs at DataPrep API server.


        Returns:

        - **response (json) :** A response JSON containing status and message.'
      operationId: deleteMedia
      parameters:
      - name: bucket_name
        in: path
        required: true
        schema:
          type: string
          description: The bucket (object storage) or top-level directory (local storage) holding the
            media.
          title: Bucket Name
        description: The bucket (object storage) or top-level directory (local storage) holding the media.
      - name: video_id
        in: path
        required: true
        schema:
          type: string
          description: The video ID (directory) containing the video to delete
          title: Video Id
        description: The video ID (directory) containing the video to delete
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataPrepResponse'
        '400':
          description: Required parameters are missing, malformed, or fail validation (for example an
            unsupported media type or an out-of-range value).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataPrepResponse'
        '404':
          description: The requested media, bucket, or job does not exist in the configured storage backend.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataPrepResponse'
        '502':
          description: The configured storage backend or vector database could not be reached or returned
            an error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataPrepResponse'
        '500':
          description: An unexpected error occurred inside the DataPrep service.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataPrepResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
components:
  schemas:
    BatchItemResult:
      properties:
        identifier:
          type: string
          title: Identifier
          description: Human-readable item identifier (e.g. filename).
        bucket_name:
          anyOf:
          - type: string
          - type: 'null'
          title: Bucket Name
        video_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Video Id
        status:
          $ref: '#/components/schemas/BatchItemStatusEnum'
          default: pending
        message:
          anyOf:
          - type: string
          - type: 'null'
          title: Message
        embeddings_count:
          anyOf:
          - type: integer
          - type: 'null'
          title: Embeddings Count
      type: object
      required:
      - identifier
      title: BatchItemResult
      description: Result of processing a single item within a batch job.
    BatchItemStatusEnum:
      type: string
      enum:
      - pending
      - running
      - success
      - error
      - skipped
      title: BatchItemStatusEnum
      description: Per-item processing status within a batch job.
    BatchJobStateEnum:
      type: string
      enum:
      - pending
      - running
      - completed
      - completed_with_errors
      - failed
      - cancelled
      title: BatchJobStateEnum
      description: Lifecycle states for an asynchronous batch ingestion job.
    BatchJobStatus:
      properties:
        status:
          $ref: '#/components/schemas/StatusEnum'
          default: success
        message:
          anyOf:
          - type: string
          - type: 'null'
          title: Message
        job_id:
          type: string
          title: Job Id
        state:
          $ref: '#/components/schemas/BatchJobStateEnum'
        source:
          anyOf:
          - type: string
          - type: 'null'
          title: Source
        total:
          type: integer
          title: Total
          default: 0
        completed:
          type: integer
          title: Completed
          default: 0
        failed:
          type: integer
          title: Failed
          default: 0
        items:
          items:
            $ref: '#/components/schemas/BatchItemResult'
          type: array
          title: Items
        created_ts:
          anyOf:
          - type: number
          - type: 'null'
          title: Created Ts
        updated_ts:
          anyOf:
          - type: number
          - type: 'null'
          title: Updated Ts
      type: object
      required:
      - job_id
      - state
      title: BatchJobStatus
      description: Status and per-item results for an asynchronous batch job.
    BatchProcessExistingRequest:
      properties:
        items:
          anyOf:
          - items:
              $ref: '#/components/schemas/VideoRequest'
            type: array
          - type: 'null'
          title: Items
          description: Explicit list of videos to process.
        bucket_name:
          anyOf:
          - type: string
          - type: 'null'
          title: Bucket Name
          description: 'Selector: process all videos in this bucket.'
        prefix:
          anyOf:
          - type: string
          - type: 'null'
          title: Prefix
          description: 'Selector: only video_ids starting with this prefix.'
        frame_interval:
          anyOf:
          - type: integer
            maximum: 60.0
            minimum: 1.0
          - type: 'null'
          title: Frame Interval
          description: Extract every Nth frame (defaults to the service's configured frame_interval, 15
            unless overridden).
        enable_object_detection:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Enable Object Detection
          description: Enable object detection and crop extraction.
        detection_confidence:
          anyOf:
          - type: number
            maximum: 1.0
            minimum: 0.1
          - type: 'null'
          title: Detection Confidence
          description: Object detection confidence threshold.
        tags:
          anyOf:
          - items:
              type: string
            type: array
          - type: 'null'
          title: Tags
          description: Tags associated with every video in the batch.
      type: object
      title: BatchProcessExistingRequest
      description: 'Request model for batch-processing videos that already exist in storage.


        Either provide an explicit list of ``items`` (per-video overrides), or a

        ``bucket_name`` selector (optionally narrowed by ``prefix``) to process every

        video found in that bucket. Selector-level ``frame_interval`` /

        ``enable_object_detection`` / ``detection_confidence`` / ``tags`` apply to all

        videos matched by the selector.'
    BatchSubmitResponse:
      properties:
        status:
          $ref: '#/components/schemas/StatusEnum'
          default: success
        message:
          anyOf:
          - type: string
          - type: 'null'
          title: Message
        job_id:
          type: string
          title: Job Id
          description: Identifier used to poll job status.
        accepted:
          type: integer
          title: Accepted
          description: Number of items accepted into the job.
      type: object
      required:
      - job_id
      - accepted
      title: BatchSubmitResponse
      description: Response returned when a batch job is accepted (HTTP 202).
    Body_uploadAndProcessMedia:
      properties:
        file:
          type: string
          contentMediaType: application/octet-stream
          title: File
          description: Media file to upload (MP4 video or JPG/PNG/WEBP/BMP/GIF image)
      type: object
      required:
      - file
      title: Body_uploadAndProcessMedia
    Body_uploadAndProcessMediaBatch:
      properties:
        files:
          items:
            type: string
            contentMediaType: application/octet-stream
          type: array
          title: Files
          description: Media files to upload (MP4 videos or images)
      type: object
      required:
      - files
      title: Body_uploadAndProcessMediaBatch
    BucketVideoListResponse:
      properties:
        status:
          $ref: '#/components/schemas/StatusEnum'
          default: success
        message:
          anyOf:
          - type: string
          - type: 'null'
          title: Message
        bucket_name:
          type: string
          title: Bucket Name
        videos:
          items:
            $ref: '#/components/schemas/VideoInfo'
          type: array
          title: Videos
          description: List of video information objects containing video details
      type: object
      required:
      - bucket_name
      title: BucketVideoListResponse
      description: Response model for list of videos in a bucket
    DataPrepResponse:
      properties:
        status:
          $ref: '#/components/schemas/StatusEnum'
          default: success
        message:
          anyOf:
          - type: string
          - type: 'null'
          title: Message
      type: object
      title: DataPrepResponse
      description: Response model for API Responses from DataStore service
    DirectoryIngestRequest:
      properties:
        dir_path:
          type: string
          title: Dir Path
          description: Directory to ingest, relative to the configured ingest data root.
        bucket_name:
          anyOf:
          - type: string
          - type: 'null'
          title: Bucket Name
          description: Target bucket for stored videos (default bucket if unset).
        recursive:
          type: boolean
          title: Recursive
          description: Recurse into subdirectories (the 'meta' dir is skipped).
          default: false
        frame_interval:
          anyOf:
          - type: integer
            maximum: 60.0
            minimum: 1.0
          - type: 'null'
          title: Frame Interval
          description: Extract every Nth frame (defaults to the service's configured frame_interval, 15
            unless overridden).
        enable_object_detection:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Enable Object Detection
          description: Enable object detection and crop extraction.
        detection_confidence:
          anyOf:
          - type: number
            maximum: 1.0
            minimum: 0.1
          - type: 'null'
          title: Detection Confidence
          description: Object detection confidence threshold.
        tags:
          anyOf:
          - items:
              type: string
            type: array
          - type: 'null'
          title: Tags
          description: Tags associated with every ingested file.
        store_copy:
          type: boolean
          title: Store Copy
          description: Copy each file into the storage backend. Set to false to reference files in place
            on the mounted ingest root (no on-disk duplication); referenced media is still duplicate-checked,
            listed by GET /media and streamable via GET /media/download.
          default: true
        metadata:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          title: Metadata
          description: Caller-supplied metadata applied to every ingested file and persisted as filterable
            fields. A meta/<basename>.json sidecar may supply per-file metadata, which takes precedence
            on key collisions. Keys colliding with the canonical metadata contract are rejected with 400.
      type: object
      required:
      - dir_path
      title: DirectoryIngestRequest
      description: 'Request model for backward-compatible directory ingestion.


        Walks ``dir_path`` (resolved against the configured ingest data root) and

        submits every supported media file as a batch job. Mirrors the EOL

        host-directory ingest contract of the retired dataprep service.'
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    HealthResponse:
      properties:
        status:
          type: string
          title: Status
        embedding_client_status:
          anyOf:
          - type: string
          - type: 'null'
          title: Embedding Client Status
        model_name:
          anyOf:
          - type: string
          - type: 'null'
          title: Model Name
        embedding_device:
          anyOf:
          - type: string
          - type: 'null'
          title: Embedding Device
        use_openvino:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Use Openvino
        embedding_client_error:
          anyOf:
          - type: string
          - type: 'null'
          title: Embedding Client Error
        detection_model:
          anyOf:
          - type: string
          - type: 'null'
          title: Detection Model
        detection_device:
          anyOf:
          - type: string
          - type: 'null'
          title: Detection Device
        vectordb_backend:
          anyOf:
          - type: string
          - type: 'null'
          title: Vectordb Backend
        vectordb_status:
          anyOf:
          - type: string
          - type: 'null'
          title: Vectordb Status
        vectordb_error:
          anyOf:
          - type: string
          - type: 'null'
          title: Vectordb Error
        storage_backend:
          anyOf:
          - type: string
          - type: 'null'
          title: Storage Backend
        default_bucket_name:
          anyOf:
          - type: string
          - type: 'null'
          title: Default Bucket Name
        live_streams_enabled:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Live Streams Enabled
        live_streams:
          anyOf:
          - additionalProperties:
              type: integer
            type: object
          - type: 'null'
          title: Live Streams
          description: Histogram of registered live streams by state, plus a 'total'.
      type: object
      required:
      - status
      title: HealthResponse
      description: Response model for service health checks.
    ImageBatchIngestRequest:
      properties:
        images:
          items:
            $ref: '#/components/schemas/ImageIngestItem'
          type: array
          title: Images
          description: List of typed image sources (base64 or URL).
        bucket_name:
          anyOf:
          - type: string
          - type: 'null'
          title: Bucket Name
          description: Target bucket for all stored images (default bucket if unset).
        enable_object_detection:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Enable Object Detection
          description: Enable object detection and crop extraction for every image.
        detection_confidence:
          anyOf:
          - type: number
            maximum: 1.0
            minimum: 0.1
          - type: 'null'
          title: Detection Confidence
          description: Object detection confidence threshold.
        tags:
          anyOf:
          - items:
              type: string
            type: array
          - type: 'null'
          title: Tags
          description: Tags applied to every image in the batch.
      type: object
      required:
      - images
      title: ImageBatchIngestRequest
      description: 'Batch JSON ingestion request: many typed image sources -> one async job.'
    ImageIngestItem:
      properties:
        type:
          $ref: '#/components/schemas/ImageSourceTypeEnum'
          description: 'Source discriminator: ''image_base64'' or ''image_url''.'
        image_base64:
          anyOf:
          - type: string
          - type: 'null'
          title: Image Base64
          description: Base64-encoded image (bare or 'data:' URL) when type=image_base64.
        image_url:
          anyOf:
          - type: string
          - type: 'null'
          title: Image Url
          description: Absolute http(s) image URL when type=image_url.
        filename:
          anyOf:
          - type: string
          - type: 'null'
          title: Filename
          description: Optional filename hint; extension is derived from the real bytes.
        tags:
          anyOf:
          - items:
              type: string
            type: array
          - type: 'null'
          title: Tags
          description: Optional per-image tags (merged with request-level tags).
      type: object
      required:
      - type
      title: ImageIngestItem
      description: 'A single typed image source for JSON ingestion.


        Exactly one payload field must be set, matching ``type``:

        ``image_base64`` (inline base64 / data URL) or ``image_url`` (remote http(s)

        URL). The stored filename/extension is derived from the sniffed bytes, so

        ``filename`` is an optional hint only.'
    ImageIngestRequest:
      properties:
        type:
          $ref: '#/components/schemas/ImageSourceTypeEnum'
          description: 'Source discriminator: ''image_base64'' or ''image_url''.'
        image_base64:
          anyOf:
          - type: string
          - type: 'null'
          title: Image Base64
          description: Base64-encoded image (bare or 'data:' URL) when type=image_base64.
        image_url:
          anyOf:
          - type: string
          - type: 'null'
          title: Image Url
          description: Absolute http(s) image URL when type=image_url.
        filename:
          anyOf:
          - type: string
          - type: 'null'
          title: Filename
          description: Optional filename hint; extension is derived from the real bytes.
        tags:
          anyOf:
          - items:
              type: string
            type: array
          - type: 'null'
          title: Tags
          description: Optional per-image tags (merged with request-level tags).
        bucket_name:
          anyOf:
          - type: string
          - type: 'null'
          title: Bucket Name
          description: Target bucket for the stored image (default bucket if unset).
        enable_object_detection:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Enable Object Detection
          description: Enable object detection and crop extraction (defaults to the service's configured
            setting, enabled unless overridden).
        detection_confidence:
          anyOf:
          - type: number
            maximum: 1.0
            minimum: 0.1
          - type: 'null'
          title: Detection Confidence
          description: Object detection confidence threshold (defaults to the service's configured threshold,
            0.85 unless overridden).
      type: object
      required:
      - type
      title: ImageIngestRequest
      description: Single-image JSON ingestion request (one typed source + storage params).
    ImageSourceTypeEnum:
      type: string
      enum:
      - image_base64
      - image_url
      title: ImageSourceTypeEnum
      description: Discriminator for a JSON image source (mirrors MME's typed input).
    LiveStreamBatchCreateRequest:
      properties:
        items:
          items:
            $ref: '#/components/schemas/LiveStreamCreateRequest'
          type: array
          minItems: 1
          title: Items
          description: Live streams to register.
      type: object
      required:
      - items
      title: LiveStreamBatchCreateRequest
      description: Request model for registering several live streams in one call.
    LiveStreamBatchItemResult:
      properties:
        identifier:
          type: string
          title: Identifier
          description: Redacted stream URL or stream_id.
        stream_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Stream Id
        status:
          $ref: '#/components/schemas/BatchItemStatusEnum'
          default: pending
        message:
          anyOf:
          - type: string
          - type: 'null'
          title: Message
      type: object
      required:
      - identifier
      title: LiveStreamBatchItemResult
      description: Per-item outcome of a bulk live-stream create or delete.
    LiveStreamBatchResponse:
      properties:
        status:
          $ref: '#/components/schemas/StatusEnum'
          default: success
        message:
          anyOf:
          - type: string
          - type: 'null'
          title: Message
        accepted:
          type: integer
          title: Accepted
          default: 0
        rejected:
          type: integer
          title: Rejected
          default: 0
        items:
          items:
            $ref: '#/components/schemas/LiveStreamBatchItemResult'
          type: array
          title: Items
      type: object
      title: LiveStreamBatchResponse
      description: Response for bulk live-stream create/delete operations.
    LiveStreamCreateRequest:
      properties:
        stream_url:
          type: string
          title: Stream Url
          description: RTSP source URL (rtsp:// or rtsps://). Embedded credentials are accepted for connection
            but are never returned by the API nor written to the vector database.
        stream_name:
          anyOf:
          - type: string
            maxLength: 256
          - type: 'null'
          title: Stream Name
          description: Friendly label; defaults to the redacted URL.
        description:
          anyOf:
          - type: string
            maxLength: 1024
          - type: 'null'
          title: Description
          description: Free-text description of the stream.
        sensor_id:
          anyOf:
          - type: string
            maxLength: 128
            pattern: ^[A-Za-z0-9][A-Za-z0-9._:-]*$
          - type: 'null'
          title: Sensor Id
          description: Stable logical identity of the physical source (camera/sensor). Recorded on every
            embedding so externally stored media for the same source can be correlated back to it. Defaults
            to the generated stream_id.
        frame_interval:
          anyOf:
          - type: integer
            maximum: 60.0
            minimum: 1.0
          - type: 'null'
          title: Frame Interval
          description: Sample every Nth frame (defaults to the service's configured frame_interval).
        enable_object_detection:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Enable Object Detection
          description: Enable object detection and crop extraction.
        detection_confidence:
          anyOf:
          - type: number
            maximum: 1.0
            minimum: 0.1
          - type: 'null'
          title: Detection Confidence
          description: Object detection confidence threshold.
        tags:
          anyOf:
          - items:
              type: string
            type: array
          - type: 'null'
          title: Tags
          description: Tags associated with every embedding from this stream.
        start:
          type: boolean
          title: Start
          description: Start ingesting immediately. False registers the stream in the paused state.
          default: true
      type: object
      required:
      - stream_url
      title: LiveStreamCreateRequest
      description: Request model for registering and starting a live RTSP stream.
    LiveStreamDeleteRequest:
      properties:
        stream_ids:
          items:
            type: string
          type: array
          minItems: 1
          title: Stream Ids
          description: Streams to stop and deregister.
      type: object
      required:
      - stream_ids
      title: LiveStreamDeleteRequest
      description: Request model for deleting several live streams in one call.
    LiveStreamDeleteResponse:
      properties:
        status:
          $ref: '#/components/schemas/StatusEnum'
          default: success
        message:
          anyOf:
          - type: string
          - type: 'null'
          title: Message
        stream_id:
          type: string
          title: Stream Id
        embeddings_purged:
          anyOf:
          - type: integer
          - type: 'null'
          title: Embeddings Purged
          description: Embeddings deleted; -1 when the backend does not report a count.
        media_purged:
          anyOf:
          - type: integer
          - type: 'null'
          title: Media Purged
          description: Stored media objects deleted.
      type: object
      required:
      - stream_id
      title: LiveStreamDeleteResponse
      description: Response returned after stopping and deregistering a live stream.
    LiveStreamInfo:
      properties:
        stream_id:
          type: string
          title: Stream Id
        stream_url:
          type: string
          title: Stream Url
          description: Source URL with credentials redacted.
        stream_name:
          type: string
          title: Stream Name
        description:
          anyOf:
          - type: string
          - type: 'null'
          title: Description
        state:
          $ref: '#/components/schemas/LiveStreamStateEnum'
          default: pending
        bucket_name:
          anyOf:
          - type: string
          - type: 'null'
          title: Bucket Name
        video_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Video Id
          description: Identity this stream's embeddings and media are stored under. Always equal to stream_id,
            so GET /media, GET /media/download and DELETE /media/{bucket_name}/{video_id} work on live
            data.
        sensor_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Sensor Id
          description: Stable logical identity of the physical source, recorded on every embedding from
            this stream. Equal to stream_id unless the caller supplied one at registration.
        frame_interval:
          type: integer
          title: Frame Interval
        enable_object_detection:
          type: boolean
          title: Enable Object Detection
        detection_confidence:
          type: number
          title: Detection Confidence
        tags:
          items:
            type: string
          type: array
          title: Tags
        stats:
          $ref: '#/components/schemas/LiveStreamStats'
        last_error:
          anyOf:
          - type: string
          - type: 'null'
          title: Last Error
        created_ts:
          anyOf:
          - type: number
          - type: 'null'
          title: Created Ts
        updated_ts:
          anyOf:
          - type: number
          - type: 'null'
          title: Updated Ts
      type: object
      required:
      - stream_id
      - stream_url
      - stream_name
      - frame_interval
      - enable_object_detection
      - detection_confidence
      title: LiveStreamInfo
      description: 'A registered live stream as exposed by the API.


        ``stream_url`` is always the redacted form of the source URL: any embedded

        credentials are stripped before the value leaves the registry.'
    LiveStreamListResponse:
      properties:
        status:
          $ref: '#/components/schemas/StatusEnum'
          default: success
        message:
          anyOf:
          - type: string
          - type: 'null'
          title: Message
        count:
          type: integer
          title: Count
          default: 0
        streams:
          items:
            $ref: '#/components/schemas/LiveStreamInfo'
          type: array
          title: Streams
      type: object
      title: LiveStreamListResponse
      description: Response carrying all registered live streams.
    LiveStreamResponse:
      properties:
        status:
          $ref: '#/components/schemas/StatusEnum'
          default: success
        message:
          anyOf:
          - type: string
          - type: 'null'
          title: Message
        stream:
          $ref: '#/components/schemas/LiveStreamInfo'
      type: object
      required:
      - stream
      title: LiveStreamResponse
      description: Response carrying a single live stream record.
    LiveStreamStateEnum:
      type: string
      enum:
      - pending
      - starting
      - running
      - paused
      - reconnecting
      - error
      - stopped
      title: LiveStreamStateEnum
      description: Lifecycle states of a registered live (RTSP) stream.
    LiveStreamStats:
      properties:
        frames_processed:
          type: integer
          title: Frames Processed
          default: 0
        embeddings_created:
          type: integer
          title: Embeddings Created
          default: 0
        segments_stored:
          type: integer
          title: Segments Stored
          default: 0
        reconnect_count:
          type: integer
          title: Reconnect Count
          default: 0
        last_frame_ts:
          anyOf:
          - type: number
          - type: 'null'
          title: Last Frame Ts
        started_ts:
          anyOf:
          - type: number
          - type: 'null'
          title: Started Ts
        uptime_seconds:
          anyOf:
          - type: number
          - type: 'null'
          title: Uptime Seconds
      type: object
      title: LiveStreamStats
      description: Runtime counters for a live stream.
    LiveStreamUpdateRequest:
      properties:
        stream_name:
          anyOf:
          - type: string
            maxLength: 256
          - type: 'null'
          title: Stream Name
        description:
          anyOf:
          - type: string
            maxLength: 1024
          - type: 'null'
          title: Description
        frame_interval:
          anyOf:
          - type: integer
            maximum: 60.0
            minimum: 1.0
          - type: 'null'
          title: Frame Interval
        enable_object_detection:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Enable Object Detection
        detection_confidence:
          anyOf:
          - type: number
            maximum: 1.0
            minimum: 0.1
          - type: 'null'
          title: Detection Confidence
        tags:
          anyOf:
          - items:
              type: string
            type: array
          - type: 'null'
          title: Tags
          description: Replaces the existing tag list when supplied.
        state:
          anyOf:
          - $ref: '#/components/schemas/LiveStreamStateEnum'
          - type: 'null'
          description: Only 'running' (resume) and 'paused' (pause) are accepted. Use DELETE to stop and
            deregister a stream.
      type: object
      title: LiveStreamUpdateRequest
      description: 'Request model for updating a registered live stream.


        Every field is optional; only supplied fields are changed. Setting ``state``

        to ``paused`` or ``running`` pauses or resumes ingestion without

        deregistering the stream.'
    StatusEnum:
      type: string
      enum:
      - success
      - error
      title: StatusEnum
      description: Generic success/error status returned in API responses.
    TelemetryBatchDetail:
      properties:
        stream_id:
          type: integer
          minimum: 0.0
          title: Stream Id
        batch_index:
          type: integer
          minimum: 0.0
          title: Batch Index
        input_frames:
          type: integer
          minimum: 0.0
          title: Input Frames
        items_after_detection:
          type: integer
          minimum: 0.0
          title: Items After Detection
        detection_seconds:
          type: number
          minimum: 0.0
          title: Detection Seconds
        embedding_seconds:
          type: number
          minimum: 0.0
          title: Embedding Seconds
        embedding_infer_seconds:
          type: number
          minimum: 0.0
          title: Embedding Infer Seconds
        storage_seconds:
          type: number
          minimum: 0.0
          title: Storage Seconds
        total_seconds:
          type: number
          minimum: 0.0
          title: Total Seconds
        embeddings_stored:
          type: integer
          minimum: 0.0
          title: Embeddings Stored
      type: object
      required:
      - stream_id
      - batch_index
      - input_frames
      - items_after_detection
      - detection_seconds
      - embedding_seconds
      - embedding_infer_seconds
      - storage_seconds
      - total_seconds
      - embeddings_stored
      title: TelemetryBatchDetail
      description: Timing details for a single batch.
    TelemetryCounts:
      properties:
        stream_id:
          type: integer
          minimum: 0.0
          title: Stream Id
        frames_extracted:
          type: integer
          minimum: 0.0
          title: Frames Extracted
        items_after_detection:
          type: integer
          minimum: 0.0
          title: Items After Detection
        embeddings_stored:
          type: integer
          minimum: 0.0
          title: Embeddings Stored
      type: object
      required:
      - stream_id
      - frames_extracted
      - items_after_detection
      - embeddings_stored
      title: TelemetryCounts
      description: Aggregate frame and embedding counts.
    TelemetryProcessingConfig:
      properties:
        object_detection_enabled:
          type: boolean
          title: Object Detection Enabled
        detection_confidence:
          anyOf:
          - type: number
          - type: 'null'
          title: Detection Confidence
        parallel_workers:
          anyOf:
          - type: integer
          - type: 'null'
          title: Parallel Workers
        batch_size:
          anyOf:
          - type: integer
          - type: 'null'
          title: Batch Size
      type: object
      required:
      - object_detection_enabled
      title: TelemetryProcessingConfig
      description: Processing configuration persisted with telemetry.
    TelemetryRecord:
      properties:
        request_id:
          type: string
          title: Request Id
        source:
          type: string
          title: Source
        timestamps:
          $ref: '#/components/schemas/TelemetryTimestamps'
        video:
          $ref: '#/components/schemas/TelemetryVideoMetadata'
        config:
          $ref: '#/components/schemas/TelemetryProcessingConfig'
        counts:
          $ref: '#/components/schemas/TelemetryCounts'
        pipeline_stats:
          additionalProperties: true
          type: object
          title: Pipeline Stats
        stage_duration:
          additionalProperties: true
          type: object
          title: Stage Duration
        stage_throughput:
          additionalProperties: true
          type: object
          title: Stage Throughput
        batches:
          items:
            $ref: '#/components/schemas/TelemetryBatchDetail'
          type: array
          title: Batches
      type: object
      required:
      - request_id
      - source
      - timestamps
      - video
      - config
      - counts
      title: TelemetryRecord
      description: Stored telemetry entry served via /telemetry endpoint.
    TelemetryResponse:
      properties:
        count:
          type: integer
          title: Count
        items:
          items:
            $ref: '#/components/schemas/TelemetryRecord'
          type: array
          title: Items
      type: object
      required:
      - count
      - items
      title: TelemetryResponse
      description: Response payload for /telemetry endpoint.
    TelemetryTimestamps:
      properties:
        requested_at:
          type: string
          title: Requested At
          description: UTC timestamp when processing started
        completed_at:
          type: string
          title: Completed At
          description: UTC timestamp when processing finished
        wall_time_seconds:
          type: number
          minimum: 0.0
          title: Wall Time Seconds
      type: object
      required:
      - requested_at
      - completed_at
      - wall_time_seconds
      title: TelemetryTimestamps
      description: Request lifecycle timestamps.
    TelemetryVideoMetadata:
      properties:
        bucket_name:
          type: string
          title: Bucket Name
        video_id:
          type: string
          title: Video Id
        filename:
          type: string
          title: Filename
        frame_interval:
          type: integer
          title: Frame Interval
        fps:
          anyOf:
          - type: number
          - type: 'null'
          title: Fps
        total_frames:
          anyOf:
          - type: integer
          - type: 'null'
          title: Total Frames
        video_duration_seconds:
          anyOf:
          - type: number
          - type: 'null'
          title: Video Duration Seconds
        tags:
          items:
            type: string
          type: array
          title: Tags
        video_url:
          anyOf:
          - type: string
          - type: 'null'
          title: Video Url
        video_rel_url:
          anyOf:
          - type: string
          - type: 'null'
          title: Video Rel Url
      type: object
      required:
      - bucket_name
      - video_id
      - filename
      - frame_interval
      title: TelemetryVideoMetadata
      description: Snapshot of the processed video's metadata.
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
        input:
          title: Input
        ctx:
          type: object
          title: Context
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
    VideoInfo:
      properties:
        video_id:
          type: string
          title: Video Id
        video_name:
          type: string
          title: Video Name
        video_path:
          type: string
          title: Video Path
        creation_ts:
          type: string
          title: Creation Ts
        stored:
          type: boolean
          title: Stored
          description: False when the media was ingested by reference (store_copy=false) and is read from
            the ingest mount instead of the storage backend.
          default: true
        source_path:
          anyOf:
          - type: string
          - type: 'null'
          title: Source Path
          description: Host-visible path of referenced media; null for stored media.
      type: object
      required:
      - video_id
      - video_name
      - video_path
      - creation_ts
      title: VideoInfo
      description: Information about a media file known to the service
    VideoRequest:
      properties:
        bucket_name:
          anyOf:
          - type: string
          - type: 'null'
          title: Bucket Name
          description: The bucket (object storage) or top-level directory (local storage) holding the
            media. Defaults to the configured bucket when omitted.
        video_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Video Id
          description: The video ID (directory) containing the video
        video_name:
          anyOf:
          - type: string
          - type: 'null'
          title: Video Name
          description: Original media name to persist as searchable metadata. Falls back to the stored
            filename when omitted.
        frame_interval:
          anyOf:
          - type: integer
            maximum: 60.0
            minimum: 1.0
          - type: 'null'
          title: Frame Interval
          description: Extract every Nth frame for processing (defaults to the service's configured frame_interval,
            15 unless overridden)
          example: 15
        enable_object_detection:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Enable Object Detection
          description: Enable object detection and crop extraction (defaults to the service's configured
            setting, enabled unless overridden)
          example: true
        detection_confidence:
          anyOf:
          - type: number
            maximum: 1.0
            minimum: 0.1
          - type: 'null'
          title: Detection Confidence
          description: Confidence threshold for object detection (defaults to the service's configured
            threshold, 0.85 unless overridden)
          example: 0.85
        tags:
          anyOf:
          - items:
              type: string
            type: array
          - type: 'null'
          title: Tags
          description: List of tags to be associated with the video. Useful for filtering the search.
      type: object
      title: VideoRequest
      description: Request model for processing media already held in the configured storage backend.
    VideoSummaryRequest:
      properties:
        bucket_name:
          type: string
          title: Bucket Name
          description: The bucket (object storage) or top-level directory (local storage) holding the
            referenced video.
        video_id:
          type: string
          title: Video Id
          description: The video ID (directory) containing the referenced video
        video_summary:
          type: string
          title: Video Summary
          description: The text summary for the video to be embedded
        video_start_time:
          type: number
          title: Video Start Time
          description: Start timestamp in seconds for the video or video chunk
        video_end_time:
          type: number
          title: Video End Time
          description: End timestamp in seconds for the video or video chunk
        tags:
          anyOf:
          - items:
              type: string
            type: array
          - type: 'null'
          title: Tags
          description: List of tags to be associated with the video. Useful for filtering the search.
      type: object
      required:
      - bucket_name
      - video_id
      - video_summary
      - video_start_time
      - video_end_time
      title: VideoSummaryRequest
      description: Request model for text summary processing with video timestamp references
tags:
- name: Media Ingestion APIs
  description: Upload media and ingest it in a single call. These operations store the media in the configured
    storage backend and write the resulting embeddings to the configured vector database.
- name: Media Processing APIs
  description: Process media that is already present in the configured storage backend, or attach to a
    live stream, and write the resulting embeddings to the configured vector database.
- name: Batch Ingestion APIs
  description: Submit multiple media items in one request and track the resulting asynchronous job.
- name: Document Processing APIs
  description: Embed free-form text (for example, a summary) and associate it with previously ingested
    media.
- name: Media Management APIs
  description: List, download, and delete stored media together with their embeddings.
- name: Live Stream APIs
  description: Register, inspect, update, pause/resume, and delete live RTSP streams. Ingestion runs on
    background workers; source URLs are always returned with their credentials redacted.
- name: Status APIs
  description: Service health and readiness.
- name: Telemetry APIs
  description: Runtime metrics and telemetry exposed by the service.
