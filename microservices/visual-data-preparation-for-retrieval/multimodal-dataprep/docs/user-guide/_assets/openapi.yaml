openapi: 3.1.0
info:
  title: Intel GenAI Multimodal DataPrep Microservice
  description: "A microservice for data preparation from text, video and image sources\n\nThe service\
    \ is **storage agnostic** and **vector-database agnostic**. The same request\nand response contracts\
    \ apply regardless of how the deployment is configured:\n\n- **Storage backend** - object storage\
    \ or the local filesystem. The `bucket_name`\n  parameter identifies an object-storage bucket or,\
    \ for local storage, a top-level\n  directory under the configured storage path. When omitted, the\
    \ service's configured\n  default bucket is used.\n- **Vector database** - the deployment's configured\
    \ vector store. Embeddings, search\n  metadata, and delete semantics are identical across backends.\n\
    \nOptional processing parameters (`frame_interval`, `enable_object_detection`,\n`detection_confidence`)\
    \ have no fixed schema default. When omitted, the service applies\nits own configured value, so the\
    \ effective default is deployment specific.\n\nAll failures - including validation, not-found, duplicate,\
    \ upstream, and internal\nerrors - are returned using the same response envelope.\n"
  version: 2.0.0
servers:
- url: /v1/dataprep
  description: Default service base path
paths:
  /health:
    get:
      tags:
      - Status APIs
      summary: Check service health
      description: Health API endpoint to check whether API Server is reachable and responding.
      operationId: getServiceHealth
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
  /summary:
    post:
      tags:
      - Document Processing APIs
      summary: Process summary text with video timestamp references for embedding generation.
      description: "### Process summary text for a video with video timestamp references for embedding\
        \ generation.\n\nThis endpoint takes a summary text and video timestamp references, validates\
        \ that the video exists,\nand stores the text embedding in the configured vector database with\
        \ the associated video metadata.\n\n#### Body Params:\n   - **bucket_name (str) :** The bucket\
        \ name where the referenced video is stored\n   - **video_id (str) :** The video ID (directory)\
        \ containing the referenced video\n   - **video_summary (str) :** The text summary for the video\
        \ to be embedded\n   - **video_start_time (float) :** The start timestamp in seconds for the video\
        \ or video chunk\n   - **video_end_time (float) :** The end timestamp in seconds for the video\
        \ or video chunk\n   - **tags (list(str)) :** A list of tags to be associated with the video.\
        \ Useful for filtering the search.\n   \n#### Raises:\n- **400 Bad Request :** If required parameters\
        \ are missing or invalid.\n- **404 Not Found :** If the specified video cannot be found in the\
        \ configured storage backend.\n- **502 Bad Gateway :** When the configured storage backend or\
        \ vector database cannot be reached.\n- **500 Internal Server Error :** When some internal error\
        \ occurs at DataPrep API server.\n\nReturns:\n- **response (json) :** A response JSON containing\
        \ status and message."
      operationId: createVideoSummaryEmbedding
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VideoSummaryRequest'
              description: Document processing parameters
        required: true
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataPrepResponse'
        '400':
          description: Required parameters are missing, malformed, or fail validation (for example an
            unsupported media type or an out-of-range value).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataPrepResponse'
        '404':
          description: The requested media, bucket, or job does not exist in the configured storage backend.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataPrepResponse'
        '502':
          description: The configured storage backend or vector database could not be reached or returned
            an error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataPrepResponse'
        '500':
          description: An unexpected error occurred inside the DataPrep service.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataPrepResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /media/process:
    post:
      tags:
      - Media Processing APIs
      summary: Process media (video or image) already stored in object storage for embedding generation.
      description: "### Processes stored media using frame-based processing with optional object detection.\n\
        \nVideo is processed by extracting individual frames at regular intervals (every Nth frame).\n\
        Each frame generates its own embedding. When object detection is enabled, detected objects\nare\
        \ cropped and embedded as separate entities, providing enhanced semantic coverage.\n\n***For example:**\
        \ Given a video of 30s at 30fps (900 frames total), with frame_interval = 15,\n60 frames will\
        \ be extracted and embedded (every 15th frame). If object detection is enabled\nand 3 objects\
        \ are detected per frame on average, this results in approximately 240 embeddings\n(60 frames\
        \ + 180 object crops).**\n\n#### Body Params:\n- **video_request (VideoRequest) :** Contains processing\
        \ parameters:\n   - **bucket_name (str) :** The bucket name where the video is stored (If not\
        \ provided, a default bucket name will be used based on application config.)\n   - **video_id\
        \ (str) :** The video ID (directory) containing the video (required)\n   - **frame_interval (int)\
        \ :** Extract every Nth frame for processing (range: 1-60; defaults to the service's configured\
        \ frame_interval, 15 unless overridden)\n   - **enable_object_detection (bool) :** Enable object\
        \ detection and crop extraction (defaults to the service's configured setting, enabled unless\
        \ overridden)\n   - **detection_confidence (float) :** Confidence threshold for object detection\
        \ (range: 0.1-1.0; defaults to the service's configured threshold, 0.85 unless overridden)\n \
        \  - **tags (list(str), optional) :** A list of tags to be associated with the video. Useful for\
        \ filtering the search.\n\n#### Raises:\n- **400 Bad Request :** If required parameters are missing\
        \ or invalid.\n- **404 Not Found :** If the specified media cannot be found, or no media exists\
        \ in the specified directory.\n- **409 Conflict :** If the media duplicates an existing item and\
        \ duplicate uploads are disabled.\n- **502 Bad Gateway :** When the configured storage backend\
        \ or vector database cannot be reached.\n- **500 Internal Server Error :** When some internal\
        \ error occurs at DataPrep API server.\n\nReturns:\n- **response (json) :** A response JSON containing\
        \ status and message."
      operationId: processStoredMedia
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VideoRequest'
              description: Video processing parameters
        required: true
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataPrepResponse'
        '400':
          description: Required parameters are missing, malformed, or fail validation (for example an
            unsupported media type or an out-of-range value).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataPrepResponse'
        '404':
          description: The requested media, bucket, or job does not exist in the configured storage backend.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataPrepResponse'
        '409':
          description: The upload duplicates media that is already stored. Returned only when duplicate
            uploads are disabled (``ALLOW_DUPLICATE_UPLOADS=false``); the message carries the existing
            ``video_id``.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataPrepResponse'
        '502':
          description: The configured storage backend or vector database could not be reached or returned
            an error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataPrepResponse'
        '500':
          description: An unexpected error occurred inside the DataPrep service.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataPrepResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /media/upload:
    post:
      tags:
      - Media Processing APIs
      summary: Upload and process a video or image file for embedding generation.
      description: '### Upload and process a video or image file for embedding generation.


        This endpoint accepts a media file upload (MP4 video or a supported image

        format), stores it, and generates embeddings. Videos are processed with

        frame-based extraction; images are embedded directly (whole image plus, when

        object detection is enabled, one embedding per detected object crop). Both

        paths share the same storage, duplicate-detection and metadata contract; the

        embedding is discriminated by the ``content_type`` metadata field.


        Video is processed by extracting individual frames at regular intervals (every Nth frame).

        Each frame generates its own embedding. When object detection is enabled, detected objects

        are cropped and embedded as separate entities, providing enhanced semantic coverage.


        ***For example:** Given a video of 30s at 30fps (900 frames total), with frame_interval = 15,

        60 frames will be extracted and embedded (every 15th frame). If object detection is enabled

        and suppose 3 objects are detected per frame on average, this results in approximately 240 embeddings

        (60 frames + 180 object crops).**


        #### File Upload:

        - **file (UploadFile, required) :** Video file to upload (MP4 format only, max size 500MB)


        #### Query Params:

        - **bucket_name (str, optional) :** The bucket name to store the video in. If not provided, default
        bucket will be used.

        - **frame_interval (int, optional) :** Extract every Nth frame for processing (range: 1-60; defaults
        to the service''s configured frame_interval, 15 unless overridden)

        - **enable_object_detection (bool, optional) :** Enable object detection and crop extraction (defaults
        to the service''s configured setting, enabled unless overridden)

        - **detection_confidence (float, optional) :** Confidence threshold for object detection (range:
        0.1-1.0; defaults to the service''s configured threshold, 0.85 unless overridden)

        - **tags (list(str), optional) :** A list of tags to be associated with the video. Useful for
        filtering the search.


        #### Raises:

        - **400 Bad Request :** If the video file is not an MP4 or fails validation.

        - **413 Request Entity Too Large :** If the uploaded file exceeds the 500MB limit.

        - **502 Bad Gateway :** When the configured storage backend or vector database cannot be reached.

        - **500 Internal Server Error :** When some internal error occurs at DataPrep API server.


        Returns:

        - **response (json) :** A response JSON containing status and message.'
      operationId: uploadAndProcessMedia
      parameters:
      - name: bucket_name
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: The bucket (object storage) or top-level directory (local storage) to store the
            media in. Defaults to the service's configured bucket when omitted.
          title: Bucket Name
        description: The bucket (object storage) or top-level directory (local storage) to store the media
          in. Defaults to the service's configured bucket when omitted.
      - name: frame_interval
        in: query
        required: false
        schema:
          anyOf:
          - type: integer
            maximum: 60
            minimum: 1
          - type: 'null'
          description: Extract every Nth frame for processing (defaults to the service's configured frame_interval,
            15 unless overridden)
          title: Frame Interval
        description: Extract every Nth frame for processing (defaults to the service's configured frame_interval,
          15 unless overridden)
      - name: enable_object_detection
        in: query
        required: false
        schema:
          anyOf:
          - type: boolean
          - type: 'null'
          description: Enable object detection and crop extraction (defaults to the service's configured
            setting, enabled unless overridden)
          title: Enable Object Detection
        description: Enable object detection and crop extraction (defaults to the service's configured
          setting, enabled unless overridden)
      - name: detection_confidence
        in: query
        required: false
        schema:
          anyOf:
          - type: number
            maximum: 1.0
            minimum: 0.1
          - type: 'null'
          description: Confidence threshold for object detection (defaults to the service's configured
            threshold, 0.85 unless overridden)
          title: Detection Confidence
        description: Confidence threshold for object detection (defaults to the service's configured threshold,
          0.85 unless overridden)
      - name: tags
        in: query
        required: false
        schema:
          anyOf:
          - type: array
            items:
              type: string
          - type: 'null'
          description: List of tags to be associated with the video. Useful for filtering the search.
          title: Tags
        description: List of tags to be associated with the video. Useful for filtering the search.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Body_uploadAndProcessMedia'
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataPrepResponse'
        '400':
          description: Required parameters are missing, malformed, or fail validation (for example an
            unsupported media type or an out-of-range value).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataPrepResponse'
        '404':
          description: The requested media, bucket, or job does not exist in the configured storage backend.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataPrepResponse'
        '409':
          description: The upload duplicates media that is already stored. Returned only when duplicate
            uploads are disabled (``ALLOW_DUPLICATE_UPLOADS=false``); the message carries the existing
            ``video_id``.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataPrepResponse'
        '502':
          description: The configured storage backend or vector database could not be reached or returned
            an error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataPrepResponse'
        '500':
          description: An unexpected error occurred inside the DataPrep service.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataPrepResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /media/rtsp:
    post:
      tags:
      - Media Processing APIs
      summary: Provide list of RTSP Stream URLs to process and generate embeddings.
      description: '### Process RTSP stream URLs for frame-based embedding generation.


        This endpoint accepts a list of RTSP stream URLs, validates them, and generates embeddings

        using frame-based processing with optional object detection.


        Each RTSP stream is processed by extracting individual frames at regular intervals (every Nth
        frame).

        Each frame generates its own embedding. When object detection is enabled and suppose 3 objects
        are detected per frame on average, this results in approximately 240 embeddings

        (60 frames + 180 object crops) per video. The generated embeddings are stored in the vector database
        with associated metadata and tags.


        #### Query Params:

        - **rtsp_urls (list(str), required) :** List of RTSP stream URLs to process. Each URL will be
        validated and processed for embedding generation.

        - **frame_interval (int, optional) :** Extract every Nth frame for processing (range: 1-60; defaults
        to the service''s configured frame_interval, 15 unless overridden)

        - **enable_object_detection (bool, optional) :** Enable object detection and crop extraction (defaults
        to the service''s configured setting, enabled unless overridden)

        - **detection_confidence (float, optional) :** Confidence threshold for object detection (range:
        0.1-1.0; defaults to the service''s configured threshold, 0.85 unless overridden)

        - **tags (list(str), optional) :** A list of tags to be associated with the videos. Useful for
        filtering the search.


        #### Raises:

        - **400 Bad Request :** If any of the RTSP URLs are invalid or fail validation.

        - **502 Bad Gateway :** When the configured storage backend cannot be reached, or during stream
        access.

        - **500 Internal Server Error :** When some internal error occurs at DataPrep API server.


        Returns:

        - **response (json) :** A response JSON containing status and message.'
      operationId: processRtspStreams
      parameters:
      - name: rtsp_urls
        in: query
        required: true
        schema:
          type: array
          items:
            type: string
          description: List of RTSP stream URLs to process. Each URL will be validated and processed for
            embedding generation.
          title: Rtsp Urls
        description: List of RTSP stream URLs to process. Each URL will be validated and processed for
          embedding generation.
      - name: frame_interval
        in: query
        required: false
        schema:
          anyOf:
          - type: integer
            maximum: 60
            minimum: 1
          - type: 'null'
          description: Extract every Nth frame for processing (defaults to the service's configured frame_interval,
            15 unless overridden)
          title: Frame Interval
        description: Extract every Nth frame for processing (defaults to the service's configured frame_interval,
          15 unless overridden)
      - name: enable_object_detection
        in: query
        required: false
        schema:
          anyOf:
          - type: boolean
          - type: 'null'
          description: Enable object detection and crop extraction (defaults to the service's configured
            setting, enabled unless overridden)
          title: Enable Object Detection
        description: Enable object detection and crop extraction (defaults to the service's configured
          setting, enabled unless overridden)
      - name: detection_confidence
        in: query
        required: false
        schema:
          anyOf:
          - type: number
            maximum: 1.0
            minimum: 0.1
          - type: 'null'
          description: Confidence threshold for object detection (defaults to the service's configured
            threshold, 0.85 unless overridden)
          title: Detection Confidence
        description: Confidence threshold for object detection (defaults to the service's configured threshold,
          0.85 unless overridden)
      - name: tags
        in: query
        required: false
        schema:
          anyOf:
          - type: array
            items:
              type: string
          - type: 'null'
          description: List of tags to be associated with the videos. Useful for filtering the search.
          title: Tags
        description: List of tags to be associated with the videos. Useful for filtering the search.
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataPrepResponse'
        '400':
          description: Required parameters are missing, malformed, or fail validation (for example an
            unsupported media type or an out-of-range value).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataPrepResponse'
        '502':
          description: The configured storage backend or vector database could not be reached or returned
            an error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataPrepResponse'
        '500':
          description: An unexpected error occurred inside the DataPrep service.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataPrepResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /media/upload/batch:
    post:
      tags:
      - Batch Ingestion APIs
