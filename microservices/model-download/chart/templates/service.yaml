apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-model-download
  labels:
    app: {{ .Chart.Name }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - nodePort: {{ .Values.service.nodePort }}
      port: {{ .Values.service.port }}
      targetPort: 8000
  selector:
    app: {{ .Chart.Name }}