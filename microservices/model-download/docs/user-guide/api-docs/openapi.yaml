openapi: 3.0.0
info:
  title: Model Download Service API
  description: |
    API for downloading from HuggingFace or Ollama and converting models OV_IR format.
    This service provides endpoints to download models and optionally convert them to 
    OpenVINO Model Server (OVMS) format (conversion of Ollama models to OV_IR is not yet supported).
  version: 1.0.0
  contact:
    name: Intel GenAI Team
servers:
  - url: http://Host:8200/api/v1
    description: Base API path

components:
  schemas:
    ModelPrecision:
      type: string
      enum:
        - int8
        - fp16
        - fp32
      description: The precision format for model weights

    DeviceType:
      type: string
      enum:
        - CPU
        - GPU
      description: The target device type for model deployment

    Config:
      type: object
      properties:
        precision:
          $ref: '#/components/schemas/ModelPrecision'
          default: int8
        device:
          $ref: '#/components/schemas/DeviceType'
          default: CPU
        cache_size:
          type: integer
          minimum: 1
          description: Cache size for model optimization
      description: Configuration for OVMS model conversion

    ModelRequest:
      type: object
      required:
        - name
        - hub
      properties:
        name:
          type: string
          description: The name/ID of the Hugging Face/Ollama model
        hub:
          type: string
          enum: [huggingface, ollama]
          description: The model hub to download from (Options - huggingface or ollama)
        type:
          type: string
          description: The type of the model (e.g., llm, embeddings, rerank)
        is_ovms:
          type: boolean
          default: false
          description: Whether to convert the model to OVMS format
        revision:
          type: string
          description: Specific model revision to download
        config:
          $ref: '#/components/schemas/Config'
          description: OVMS-specific configuration

    ModelDownloadRequest:
      type: object
      required:
        - models
      properties:
        models:
          type: array
          items:
            $ref: '#/components/schemas/ModelRequest'
          description: List of models to download
        parallel_downloads:
          type: boolean
          default: false
          description: Whether to download models in parallel

    ModelResult:
      type: object
      required:
        - status
        - model_name
      properties:
        status:
          type: string
          enum: [success, error]
          description: The status of the model download/conversion
        model_name:
          type: string
          description: The name of the model
        model_path:
          type: string
          nullable: true
          description: Path where the model was downloaded/converted
        error:
          type: string
          nullable: true
          description: Error message if status is error
        is_ovms:
          type: boolean
          nullable: true
          description: Whether the model was converted to OVMS format

    DownloadResponse:
      type: object
      properties:
        message:
          type: string
          description: Status message
        results:
          type: array
          items:
            $ref: '#/components/schemas/ModelResult'
          description: Results for each model download/conversion
        model_path:
          type: string
          description: Path to the downloaded model (for single model requests)

    HealthResponse:
      type: object
      properties:
        status:
          type: string
          enum: [ok]
          description: Health status of the service

  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: Authorization
      description: Hugging Face API token for authentication (Not applicable for Ollama models)

paths:
  /health:
    get:
      summary: Health check endpoint
      description: Verify the service is running
      operationId: healthCheck
      tags:
        - Health
      responses:
        '200':
          description: Service is healthy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'

  /models/download:
    post:
      summary: Download and optionally convert models
      description: |
        Downloads one or more models from HuggingFace or Ollama and optionally converts them
        to OVMS format (conversion of Ollama models to OVMS is not yet supported). Supports 
        parallel downloads and custom configurations.
      operationId: downloadModels
      security:
        - ApiKeyAuth: []
      parameters:
        - in: query
          name: download_path
          schema:
            type: string
            default: null
          description: Base path for model downloads
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ModelDownloadRequest'
            example:
              models:
                - name: microsoft/Phi-3.5-mini-instruct
                  hub: huggingface
                  type: llm
                  is_ovms: true
                  config:
                    precision: int8
                    device: CPU
                    cache_size: 10
              parallel_downloads: false
      responses:
        '200':
          description: Successful model download/conversion
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DownloadResponse'
        '400':
          description: Bad request or model processing error
          content:
            application/json:
              schema:
                type: object
                properties:
                  detail:
                    type: string
        '401':
          description: Authentication token missing or invalid
          content:
            application/json:
              schema:
                type: object
                properties:
                  detail:
                    type: string
        '422':
          description: Validation error in request
          content:
            application/json:
              schema:
                type: object
                properties:
                  detail:
                    type: array
                    items:
                      type: object
                      properties:
                        loc:
                          type: array
                          items:
                            type: string
                        msg:
                          type: string
                        type:
                          type: string
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                type: object
                properties:
                  detail:
                    type: string