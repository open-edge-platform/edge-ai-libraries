openapi: 3.0.0
info:
  title: Model Download Service API
  description: |
    API for downloading models from HuggingFace, Ollama, Ultralytics, Pipeline Zoo Models, Geti™ hubs and HLS, converting models to OpenVINO IR format.
    This service provides endpoints to download models and optionally convert them to 
    OpenVINO Intermediate Representation (IR) format for optimized inference on Intel hardware.

    **Features:**
    - Download models from multiple hubs (HuggingFace, Ollama, Ultralytics, Pipeline Zoo Models, Geti™, HLS)
    - Convert models to OpenVINO IR format with configurable precision and device targets for huggingface hub models
    - Asynchronous job processing with status tracking
    - Plugin-based architecture for extensibility

    **Note:** HUGGINGFACEHUB_API_TOKEN environment variable is optional and only required for downloading 
    gated models from HuggingFace or for model conversion. Public models can be downloaded without authentication.
  version: 1.1.0
  contact:
    name: Intel GenAI Team
servers:
  - url: http://localhost:8200/api/v1
    description: Local development server
  - url: http://{host}:{port}/api/v1
    description: Custom host deployment
    variables:
      host:
        default: localhost
        description: Server hostname or IP address
      port:
        default: 8200
        description: Server port

components:
  schemas:
    ModelHub:
      type: string
      enum:
        - huggingface
        - ollama
        - ultralytics
        - pipeline-zoo-models
        - omz
        - openvino
        - geti
        - hls
        - remote-url
      description: |
        The model hub source to download from. Each hub maps to a
        download mechanism (HuggingFace API, OpenVINO export, tarball
        fetch, etc.) configured via YAML profiles shipped with the image.

    ModelType:
      type: string
      enum:
        - llm
        - embeddings
        - reranker
        - vlm
        - vision
      description: The type of model (determines conversion behavior)

    ModelPrecision:
      type: string
      enum:
        - int8
        - fp16
        - fp32
      description: The precision format for model weights

    DeviceType:
      type: string
      enum:
        - CPU
        - GPU
        - NPU
      description: The target device type for model deployment

    Config:
      type: object
      properties:
        precision:
          $ref: "#/components/schemas/ModelPrecision"
          default: int8
        device:
          $ref: "#/components/schemas/DeviceType"
          default: CPU
        cache_size:
          type: integer
          minimum: 1
          description: Cache size for model optimization
        quantize:
          type: string
          nullable: true
          description: Ultralytics quantization dataset used to enable INT8 export
          example: coco128
        post_processing:
          type: object
          additionalProperties: true
          nullable: true
          description: Optional post-processing overrides for omz model-specific workflows
      description: Configuration for OVMS model conversion

    ModelRequest:
      type: object
      required:
        - name
        - hub
      properties:
        name:
          type: string
          description: Model name/ID. Valid formats are hub-specific; see `POST /models/download` description for details.
          example: microsoft/Phi-3.5-mini-instruct
        hub:
          $ref: "#/components/schemas/ModelHub"
        type:
          $ref: "#/components/schemas/ModelType"
        is_ovms:
          type: boolean
          default: false
          description: Whether to convert the model to OpenVINO IR format (requires OpenVINO plugin)
        revision:
          type: string
          description: Specific model revision/version to download
          example: main
        config:
          $ref: "#/components/schemas/Config"
          description: Configuration for OpenVINO conversion (required if is_ovms is true)

    ModelDownloadRequest:
      type: object
      required:
        - models
      properties:
        models:
          type: array
          items:
            $ref: "#/components/schemas/ModelRequest"
          description: List of models to download and/or convert
          minItems: 1
        parallel_downloads:
          type: boolean
          default: false
          description: Whether to download models in parallel (currently not implemented)

    JobStatus:
      type: string
      enum:
        - pending
        - processing
        - completed
        - failed
      description: Status of a job

    Job:
      type: object
      properties:
        job_id:
          type: string
          description: Unique identifier for the job
        operation_type:
          type: string
          enum: [download, convert]
          description: Type of operation
        model_name:
          type: string
          description: Name of the model
        hub:
          type: string
          description: Model hub source
        status:
          $ref: "#/components/schemas/JobStatus"
        output_dir:
          type: string
          description: Output directory for the operation
        creation_time:
          type: string
          format: date-time
          description: When the job was created
        completion_time:
          type: string
          format: date-time
          nullable: true
          description: When the job was completed
        error:
          type: string
          nullable: true
          description: Error message if job failed

    ModelResult:
      type: object
      required:
        - status
        - model_name
      properties:
        status:
          type: string
          enum: [success, error]
          description: The status of the model download/conversion
        model_name:
          type: string
          description: The name of the model
        model_path:
          type: string
          nullable: true
          description: Path where the model was downloaded/converted
        error:
          type: string
          nullable: true
          description: Error message if status is error
        is_ovms:
          type: boolean
          nullable: true
          description: Whether the model was converted to OVMS format

    DownloadResponse:
      type: object
      properties:
        message:
          type: string
          description: Status message
          example: "Started processing 1 model(s)"
        job_ids:
          type: array
          items:
            type: string
          description: List of job IDs created for the request
        status:
          type: string
          enum: [processing]
          description: Overall status of the request

    UploadResponse:
      type: object
      properties:
        status:
          type: string
          example: success
        message:
          type: string
          example: Model 'my_custom_model' uploaded successfully.
        job_id:
          type: string
          description: Job ID for the completed upload operation
        model_name:
          type: string
          description: Sanitized model name used for storage
        model_path:
          type: string
          description: Final extracted model path

    JobListResponse:
      type: object
      properties:
        jobs:
          type: array
          items:
            $ref: "#/components/schemas/Job"
          description: List of jobs

    ModelResultsResponse:
      type: object
      properties:
        results:
          type: array
          items:
            type: object
            properties:
              job_id:
                type: string
              model_name:
                type: string
              hub:
                type: string
              operation_type:
                type: string
              status:
                type: string
              model_path:
                type: string
              is_ovms:
                type: boolean
              completion_time:
                type: string
                format: date-time

    PluginInfo:
      type: object
      properties:
        name:
          type: string
          description: Plugin name
        type:
          type: string
          description: Plugin type (hub or conversion)
        description:
          type: string
          description: Plugin description
        capabilities:
          type: object
          properties:
            supports_parallel_downloads:
              type: boolean
            supports_listing:
              type: boolean
              description: Whether the plugin can list models available on one or more hubs
            listing_filter_fields:
              type: array
              items:
                type: string
              description: Hub-specific filter fields accepted by the listing endpoint
        available:
          type: boolean
          description: Whether the plugin is available
        unavailable_reason:
          type: string
          nullable: true
          description: Reason if plugin is not available

    PluginsResponse:
      type: object
      properties:
        available_plugins:
          type: object
          additionalProperties:
            type: array
            items:
              $ref: "#/components/schemas/PluginInfo"
        total_count:
          type: integer
          description: Total number of plugins
        available_count:
          type: integer
          description: Number of available plugins
        activation_instructions:
          type: string
          description: Instructions for enabling/disabling plugins

    HealthResponse:
      type: object
      properties:
        status:
          type: string
          enum: [ok]
          description: Health status of the service

    ModelListItem:
      type: object
      description: A single model entry returned by the hub listing endpoint.
      additionalProperties: true
      required:
        - name
      properties:
        name:
          type: string
          description: Model name to pass as `name` in POST /api/v1/models/download
          example: microsoft/Phi-3.5-mini-instruct
        owner:
          type: string
          nullable: true
          description: Owner, organization, or project that publishes the model
        precisions:
          type: array
          items:
            type: string
          description: Weight precisions reported by the hub, when available
        tags:
          type: array
          items:
            type: string
          description: Hub tags associated with the model
        model_type:
          type: string
          nullable: true
          description: >-
            Model task/type as reported by the hub. For Geti, this is the task
            type (for example, DETECTION or CLASSIFICATION).
        license:
          type: string
          nullable: true
          description: License identifier reported by the hub (HuggingFace), when available
        gated:
          nullable: true
          description: >-
            HuggingFace gating status: false (open), or "auto"/"manual" for gated
            models. Absent for hubs that do not report gating.
          oneOf:
            - type: boolean
            - type: string
              enum: [auto, manual]
        requires_token:
          type: boolean
          nullable: true
          description: True when the model is gated and requires an HF token to download
        last_modified:
          type: string
          nullable: true
          description: ISO 8601 timestamp of the model's last modification, when available
        metadata:
          type: object
          additionalProperties: true
          description: Hub-specific extra metadata

    ModelListRequest:
      type: object
      description: Request body for listing models from a hub using hub-specific filters.
      additionalProperties: true
      required:
        - hub
      properties:
        hub:
          type: string
          description: The hub to list models from
          example: huggingface
        filters:
          type: object
          additionalProperties: true
          description: Hub-specific listing filters such as author, search, and tags
          example:
            author: microsoft
            search: phi
        limit:
          type: integer
          default: 50
          minimum: 1
          maximum: 200
          description: Maximum number of items to return
        offset:
          type: integer
          default: 0
          minimum: 0
          description: Number of items to skip for pagination

    ModelListResponse:
      type: object
      properties:
        hub:
          type: string
          description: The hub the models were listed from
          example: huggingface
        items:
          type: array
          items:
            $ref: "#/components/schemas/ModelListItem"
        total:
          type: integer
          nullable: true
          description: Total number of models available, when the hub reports it
        limit:
          type: integer
          description: Maximum number of items requested
        offset:
          type: integer
          description: Number of items skipped for pagination

paths:
  /health:
    get:
      summary: Health check endpoint
      description: Verify the service is running
      operationId: healthCheck
      tags:
        - Health
      responses:
        "200":
          description: Service is healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"

  /models/list:
    post:
      summary: List models available on a hub using filters
      description: |
        Lists models available on a hub using a JSON request body containing the
        target `hub`, hub-specific filters, and pagination. Listing is currently
        supported for `huggingface`, `ultralytics`, `pipeline-zoo-models`, and
        `geti`.

        Supported filters:
        - `huggingface`: `author`, `search`, `tags`
        - `ultralytics`: `search`
        - `pipeline-zoo-models`: `search`
        - `geti`: `project_id`, `project_name`, `model_group_id`, `model_group_name`, `model_name`, `export_type`, `precision`, `model_format`

        For `huggingface`, `author` is the repository namespace and accepts a
        user, owner, or organization name (for example, `microsoft` or
        `meta-llama`).

        For `geti`, listing requires `GETI_HOST`, `GETI_TOKEN`, and
        `GETI_WORKSPACE_ID` to be configured.

        Extra top-level request body fields are accepted and merged into `filters`.
        Use `GET /api/v1/plugins` to discover each plugin's `listing_filter_fields`.
        This endpoint should move to HTTP QUERY once FastAPI, OpenAPI tooling,
        and deployment proxies support QUERY consistently for safe requests with bodies.
      operationId: listHubModels
      tags:
        - Models
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ModelListRequest"
            examples:
              huggingface_models:
                summary: List Hugging Face models
                value:
                  hub: huggingface
                  filters:
                    author: microsoft
                    search: phi
                  limit: 10
                  offset: 0
              ultralytics_models:
                summary: List Ultralytics models
                value:
                  hub: ultralytics
                  filters:
                    search: yolov8
                  limit: 10
                  offset: 0
              pipeline_zoo_models:
                summary: List Pipeline Zoo Models
                value:
                  hub: pipeline-zoo-models
                  filters:
                    search: yolo
                  limit: 10
                  offset: 0
              geti_models:
                summary: List Geti™ models
                value:
                  hub: geti
                  filters:
                    project_name: detection
                    precision: FP16
                  limit: 10
                  offset: 0
      responses:
        "200":
          description: Models listed successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ModelListResponse"
        "400":
          description: Invalid pagination parameters, unknown hub, or hub not activated
        "401":
          description: Authentication failed for the hub
        "422":
          description: Validation error (for example, missing required `hub` field)
        "501":
          description: Hub does not support listing models
        "502":
          description: Upstream hub request failed

  /models/download:
    post:
      summary: Download and optionally convert models
      description: |
        Downloads one or more models from HuggingFace, Ollama, Ultralytics, Pipeline Zoo Models, hls or Geti™ and optionally converts them
        to OpenVINO IR format for huggingface hub models. This endpoint processes requests asynchronously and returns job IDs immediately.

        **Conversion Behavior:**
        Models will be converted to OpenVINO format if:
        1. `is_ovms` is set to `true` in the request
        2. `type` can be set to 'llm,embeddings,reranker, vlm or vision' in the request

        **Authentication:**
        - HUGGINGFACEHUB_API_TOKEN is optional for public HuggingFace models
        - HUGGINGFACEHUB_API_TOKEN is required for gated/private HuggingFace models and for conversion
        - No authentication needed for Ollama, Ultralytics, Pipeline Zoo Models, Geti™, or HLS models

        **URL Source (`remote-url` hub):**
        - Downloads a per-model archive from a runtime-provided `config.url`, validated against an allowlist of trusted host/path prefixes.
        - The URL must point to a tar archive (ex: `.tar`, `.tar.gz`) containing a single model's files — not a shared archive bundling multiple models.
        - Use the optional `{name}` placeholder in `config.url`; it is replaced with the model's `name` field before download.
        - Set `EXTERNAL_SOURCES_URL_ALLOWLIST` (comma-separated) to override the default allowed prefixes.

        **`models[].name` format by hub:**
        - `huggingface`, `ollama`, `openvino`, `geti`, `hls`, `remote-url`: single model name.
        - `ultralytics`: single name, comma-separated names, or `all`.
        - `pipeline-zoo-models`: single name, comma-separated names, or `all`.
        - `omz`: single name or comma-separated names (`all` is not supported).
        - For `hls`, valid names also depend on the selected `type`.

        **Job Processing:**
        - Each model download creates a separate job
        - If conversion is requested, an additional conversion job is created
        - Use the returned job IDs to track progress via `/jobs/{job_id}` endpoint
      operationId: downloadModels
      parameters:
        - in: query
          name: download_path
          required: true
          schema:
            type: string
          description: Base path/subdirectory for model downloads (relative to MODELS_DIR)
          example: my-models
      tags:
        - Models
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ModelDownloadRequest"
            examples:
              huggingface_download:
                summary: Download HuggingFace model
                value:
                  models:
                    - name: microsoft/Phi-3.5-mini-instruct
                      hub: huggingface
                      type: llm
                      is_ovms: false
              huggingface_with_conversion:
                summary: Download and convert to OpenVINO
                value:
                  models:
                    - name: microsoft/Phi-3.5-mini-instruct
                      hub: openvino
                      type: llm
                      is_ovms: true
                      config:
                        precision: int8
                        device: CPU
                        cache_size: 10
              ollama_download:
                summary: Download Ollama model
                value:
                  models:
                    - name: deepseek-r1
                      hub: ollama
              ultralytics_download:
                summary: Download Ultralytics model
                value:
                  models:
                    - name: yolov8s
                      hub: ultralytics
              pipeline_zoo_models_download:
                summary: Download Pipeline Zoo model
                value:
                  models:
                    - name: dbnet
                      hub: pipeline-zoo-models
              remote_url_download:
                summary: Download Remote-URL model
                value:
                  models:
                    - name: wind-turbine-anomaly-detection
                      hub: remote-url
                      config:
                        url: "https://github.com/open-edge-platform/edge-ai-resources/raw/main/timeseries-udf-deployment-packages/{name}.tar"
              omz_download:
                summary: Download OMZ model
                value:
                  models:
                    - name: mobilenet-v2-pytorch
                      hub: omz
              geti_download:
                summary: Download Geti™ model
                value:
                  models:
                    - name: yolox-tiny
                      hub: geti
              hls_download:
                summary: Download HLS model
                value:
                  models:
                    - name: ecg_8960_ir10_fp16
                      hub: hls
                      type: ai-ecg
              multiple_models:
                summary: Download multiple models
                value:
                  models:
                    - name: microsoft/Phi-3.5-mini-instruct
                      hub: huggingface
                      type: llm
                    - name: deepseek-r1
                      hub: ollama
                  parallel_downloads: true
      responses:
        "200":
          description: Request accepted and processing started
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DownloadResponse"
              example:
                message: "Started processing 1 model(s)"
                job_ids: ["download_abc123", "convert_def456"]
                status: processing
        "400":
          description: Bad request - invalid hub, missing dependencies, or plugin not available
          content:
            application/json:
              schema:
                type: object
                properties:
                  detail:
                    type: string
              examples:
                unsupported_hub:
                  summary: Unsupported model hub
                  value:
                    detail: "Unsupported model download/conversion detected. Supported methods are {'huggingface', 'ollama', 'ultralytics', 'pipeline-zoo-models', 'omz', 'openvino', 'geti', 'hls', 'remote-url'}."
                plugin_unavailable:
                  summary: Plugin dependencies not installed
                  value:
                    detail: "Plugin 'huggingface' is not available: Missing required dependencies: huggingface_hub"
        "422":
          description: Validation error in request
          content:
            application/json:
              schema:
                type: object
                properties:
                  detail:
                    type: array
                    items:
                      type: object
                      properties:
                        loc:
                          type: array
                          items:
                            type: string
                        msg:
                          type: string
                        type:
                          type: string
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                type: object
                properties:
                  detail:
                    type: string

  /jobs/{job_id}:
    get:
      summary: Get job status
      description: Retrieve the status and details of a specific job by its ID
      operationId: getJobStatus
      tags:
        - Jobs
      parameters:
        - in: path
          name: job_id
          required: true
          schema:
            type: string
          description: The unique job identifier
          example: download_abc123
      responses:
        "200":
          description: Job details retrieved successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Job"
        "404":
          description: Job not found
          content:
            application/json:
              schema:
                type: object
                properties:
                  detail:
                    type: string
                    example: "Job download_abc123 not found"

  /jobs:
    get:
      summary: List all jobs
      description: Retrieve a list of all jobs (downloads and conversions)
      operationId: listJobs
      tags:
        - Jobs
      responses:
        "200":
          description: List of all jobs
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobListResponse"

  /models/jobs:
    get:
      summary: Get jobs for a specific model
      description: Retrieve all jobs (downloads and conversions) related to a specific model
      operationId: getModelJobs
      tags:
        - Jobs
      parameters:
        - in: query
          name: model_name
          required: true
          schema:
            type: string
          description: The model name
          example: microsoft/Phi-3.5-mini-instruct
      responses:
        "200":
          description: Jobs for the model retrieved successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobListResponse"
        "404":
          description: No jobs found for the model
          content:
            application/json:
              schema:
                type: object
                properties:
                  detail:
                    type: string
                    example: "No jobs found for model microsoft/Phi-3.5-mini-instruct"

  /models/results:
    get:
      summary: Get completed model operations
      description: Retrieve all completed model downloads and conversions
      operationId: getModelResults
      tags:
        - Models
      responses:
        "200":
          description: List of completed operations
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ModelResultsResponse"

  /models/upload:
    post:
      summary: Upload Custom model ZIP File
      description: |
        Upload a ZIP file that contains `model.xml` and `model.bin` at the ZIP root.
        The model is extracted under:
        `/opt/models/custom_uploaded_models/{provider}/{framework}/{model_name}/[{precision}/]`

        **Validation and behavior:**
        - `model_name` is required and sanitized to lowercase with safe characters
        - File size limit is enforced (default 500MB via `MAX_UPLOAD_SIZE_MB`)
        - Files are read in chunks (default 8KB via `UPLOAD_CHUNK_SIZE_KB`) to prevent memory exhaustion with large uploads
        - If target model path already exists, the API returns `409`
        - Successful upload is registered as a completed job and appears in `/models/results`
      operationId: uploadModel
      tags:
        - Models
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - file
                - model_name
              properties:
                file:
                  type: string
                  format: binary
                  description: ZIP file containing `model.xml` and `model.bin`
                model_name:
                  type: string
                  description: Model name provided by user
                  example: my_custom_model
                provider:
                  type: string
                  example: geti
                  description: Provider segment in target path
                framework:
                  type: string
                  example: openvino
                  description: Framework segment in target path
                precision:
                  type: string
                  example: FP16
                  nullable: true
                  description: Optional precision folder (for example FP16, FP32, or INT8)
      responses:
        "200":
          description: Model uploaded successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadResponse"
        "400":
          description: Invalid ZIP or invalid model contents
          content:
            application/json:
              schema:
                type: object
                properties:
                  detail:
                    type: string
        "409":
          description: Model already exists
          content:
            application/json:
              schema:
                type: object
                properties:
                  detail:
                    type: string
        "413":
          description: Uploaded file exceeds configured size limit
          content:
            application/json:
              schema:
                type: object
                properties:
                  detail:
                    type: string
        "422":
          description: Validation error in multipart form fields
          content:
            application/json:
              schema:
                type: object
                properties:
                  detail:
                    type: array
                    items:
                      type: object
        "500":
          description: Internal server error during extraction
          content:
            application/json:
              schema:
                type: object
                properties:
                  detail:
                    type: string

  /plugins:
    get:
      summary: List available plugins
      description: |
        Retrieve information about all available plugins, their capabilities, and status.
        This includes both hub plugins (HuggingFace, Ollama, Ultralytics, Geti™, hls) and conversion plugins (OpenVINO).
      operationId: listPlugins
      tags:
        - Plugins
      responses:
        "200":
          description: Plugins information retrieved successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PluginsResponse"
