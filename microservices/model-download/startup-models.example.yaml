download_path: loadup/
parallel_downloads: false
models:
  - name: <Model-name>
    hub: huggingface
    type: embeddings
  - name: <Model-name>
    hub: ultralytics
    type: vision
    download_path: vision
  - name: <Model-name>
    hub: openvino
    type: llm
    is_ovms: true
    config:
      precision: int8
      device: CPU
      cache_size: 10