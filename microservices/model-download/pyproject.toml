[project]
name = "model-download"
version = "1.0.1"
description = "A FastAPI application for downloading and converting HuggingFace/Ollama/ultralytics/geti models."
authors = [
]
readme = "README.md"
requires-python = "==3.12.*"

dependencies = [
    "fastapi==0.121.3",
    "pydantic==2.12.4",
    "python-multipart>=0.0.9",
    "structlog==25.1.0",
    "uvicorn==0.38.0",
    "PyYAML==6.0.2",
    "huggingface-hub[cli,hf-transfer,hf-xet]==0.36.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0,<8.0.0",
    "pytest-cov>=4.1.0,<5.0.0",
    "pytest-asyncio>=0.21.1,<1.0.0",
    "httpx>=0.24.1,<1.0.0",
    "pytest-mock>=3.11.1,<4.0.0",
    "pytest-env>=1.1.0,<2.0.0",
    "responses>=0.25.0,<1.0.0",
    "freezegun>=1.5.0,<2.0.0",
]

cpu = [
    "torch==2.9.1+cpu",
    "torchvision==0.24.1+cpu",
]

huggingface = [
    "transformers<4.58",
    "torch==2.9.1+cpu",
    "torchvision==0.24.1+cpu",
]

ultralytics = [
    "ultralytics==8.2.3",
    "torch==2.9.1+cpu",
    "torchvision==0.24.1+cpu",
]

openvino = [
    
]

ollama = [
    # Ollama is installed as a binary, no Python dependencies required
]

geti = [
    "geti-sdk==2.13.1",
]

hls = [
    "torch==2.9.1+cpu",
    "torchvision==0.24.1+cpu",
    "tensorflow",
    "tqdm>=4.67",
]

pipeline-zoo-models = [
    # Intentionally empty: plugin uses Python stdlib only.
    # Keep this extra so uv sync --extra pipeline-zoo-models works
    # when ENABLED_PLUGINS is set to pipeline-zoo-models.
]

remote-url = [
    # Intentionally empty: plugin uses Python stdlib only.
]

omz = [
    # OpenVINO Model Zoo requires legacy openvino-dev==2024.6.0, isolated in /opt/.venv-omz
    # from main runtime which uses openvino==2026.x. Conflicts with geti (needs openvino>=2025.2)
    # are resolved by uv.conflicts below into separate venv buckets.
    "openvino-dev[onnx,pytorch,tensorflow2]==2024.6.0",
    "openvino==2024.6.0",
    # Pin torch < 2.9: torch 2.9 changed torch.onnx.export to default dynamo=True, which pulls in
    # onnxscript -> onnx_ir -> ml_dtypes.float8_e8m0fnu (needs ml_dtypes>=0.5, but TensorFlow caps
    # it at <0.5 in this bucket). The legacy omz_tools converter relies on the TorchScript exporter
    # (dynamo=False), which is the default for torch < 2.9 and needs none of that chain.
    "torch<2.9",
]

[tool.uv]
# Each plugin/hub kind installs into its own venv (/opt/.venv-{plugin}), so
# conflicting extras never co-exist at runtime. Declaring conflicts tells uv to
# resolve them in separate buckets during `uv lock` instead of failing to
# satisfy both at once. OMZ and geti can still be enabled together because they
# are isolated into separate venvs at runtime.
conflicts = [
    [{ extra = "omz" }, { extra = "geti" }],  # omz pins openvino==2024.6.0; geti requires openvino>=2025.2
    # omz needs torch<2.9 (legacy TorchScript ONNX exporter); these extras pin torch==2.9.1+cpu.
    # They never share a venv at runtime, so resolve them in separate buckets.
    [{ extra = "omz" }, { extra = "cpu" }],
    [{ extra = "omz" }, { extra = "huggingface" }],
    [{ extra = "omz" }, { extra = "ultralytics" }],
    [{ extra = "omz" }, { extra = "hls" }],
]
index-url = "https://pypi.org/simple"
required-environments = [
    "sys_platform == 'linux' and platform_machine == 'x86_64'",
    "sys_platform == 'win32'"
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchvision = { index = "pytorch-cpu" }

[tool.uv.pip]
index-strategy = "unsafe-best-match"

# Pytest configuration - updated for new structure
[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --cov=src --cov-report=term-missing --cov-report=html"
asyncio_mode = "auto"
env = [
    "HF_TOKEN=hf_test_token_for_testing",
    "MODELS_DIR=/tmp/test_models",
    "LOGS_DIR=/tmp/test_logs",
]

# Coverage configuration - updated for new structure
[tool.coverage.run]
source = ["src"]
omit = [
    "*/tests/*", 
    "*/__pycache__/*",
    "*/conftest.py",
    "*/test_*.py"
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "pass",
    "\\.\\.\\.",
]
show_missing = true
skip_covered = false

[tool.coverage.html]
directory = "htmlcov"