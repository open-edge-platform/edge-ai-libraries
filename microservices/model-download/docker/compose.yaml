services:
  model_download_service:
    image: ${REGISTRY}model-download:${TAG}
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: model_download
    environment:
      - HF_HUB_ENABLE_HF_TRANSFER=1
      - LOG_LEVEL=INFO
    ports:
      - "8200:8000"  # Map container port 8000 to host port 8200
    volumes:
      - ~/models:/app/models
    group_add:
      - ${USER_GROUP_ID:-1000}