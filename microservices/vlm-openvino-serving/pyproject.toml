[tool.poetry]
name = "vlm-openvino-serving"
version = "0.1.0"
description = "FastAPI server wrapping OpenVINO runtime to serve `/chat/completion` endpoint to consume multimodal image input/video input and serve inference with VLM models."
authors = []
readme = "README.md"
package-mode = false

[tool.poetry.dependencies]
python = ">=3.11,<3.14"
torch = { version = "^2.12.0", source = "pytorch-cpu" }
torchvision = { version = ">=0.27.0,<1.0.0", source = "pytorch-cpu" }
fastapi-utils = ">=0.8.0,<1.0.0"
uvicorn = ">=0.47.0,<1.0.0"
gunicorn = "^26.0.0"
pydantic-settings = "^2.14.1"
aiohttp = "^3.13.5"
nncf = "^3.1.0"
openvino = "^2026.1.0"
openvino-genai = "^2026.1.0.0"
optimum-intel = "^1.27.0"
qwen_vl_utils = ">=0.0.14,<0.1.0"
num2words = ">=0.5.14,<1.0.0"
einops = ">=0.8.2,<1.0.0"
timm = "^1.0.27"
typing-inspect = ">=0.9.0,<1.0.0"

[[tool.poetry.source]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
priority = "explicit"

[tool.poetry.group.test.dependencies]
pytest = "^9.0.3"
pytest-mock = "^3.15.1"
coverage = "^7.14.0"
pytest-asyncio = "^1.3.0"
httpx = "^0.28.1"

[tool.pytest.ini_options]
asyncio_default_fixture_loop_scope = "module"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

