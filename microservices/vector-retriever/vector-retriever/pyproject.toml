[tool.poetry]
name = "vector-retriever"
version = "0.1.0"
description = "Semantic retrieval service over pluggable vector backends with batch query support"
authors = []
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.11,<3.13"
fastapi = "^0.135.3"
uvicorn = "^0.44.0"
gunicorn = "^25.3.0"
pydantic = "^2.12.5"
pydantic-settings = "^2.13.1"
python-dotenv = "^1.2.2"
requests = "^2.33.1"
langchain-core = "^1.2.26"

[tool.poetry.group.backend-vdms.dependencies]
langchain-vdms = "^0.2.0"
numpy = "^2.4.4"

[tool.poetry.group.backend-faiss.dependencies]
faiss-cpu = "^1.13.2"
langchain-community = "^0.4.1"

[tool.poetry.group.backend-pgvector.dependencies]
langchain-postgres = "^0.0.17"
psycopg = {version = ">=3.3.3", extras = ["binary"]}
sqlalchemy = "^2.0.49"

[tool.poetry.group.backend-milvus.dependencies]
langchain-milvus = "^0.3.3"
pymilvus = "^2.6.11"

[tool.poetry.group.dev.dependencies]
pytest = "^9.0.2"
httpx = "^0.28.1"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"
