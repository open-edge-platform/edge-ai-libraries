global:
  scrape_interval: 15s

scrape_configs:
  - job_name: 'aqh-metrics-manager'
    static_configs:
      - targets: ['aqh-metrics:8080']

  - job_name: 'aqh-agent'
    static_configs:
      - targets: ['aqh-agent:5002']
    metrics_path: /metrics

  - job_name: 'aqh-storage'
    static_configs:
      - targets: ['aqh-storage:5001']
    metrics_path: /metrics
