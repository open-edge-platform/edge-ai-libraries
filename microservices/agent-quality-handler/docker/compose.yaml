services:
  aqh-agent:
    image: ${REGISTRY:-intel/}aqh-agent-service:${TAG:-1.0.0}
    container_name: aqh-agent
    hostname: aqh-agent
    build:
      context: ..
      dockerfile: docker/Dockerfile
    environment:
      http_proxy: ${http_proxy:-}
      https_proxy: ${https_proxy:-}
      no_proxy: ${no_proxy:-},aqh-ovms,mqtt-broker,mock-storage,localhost
      STORAGE_SERVICE_URL: ${STORAGE_SERVICE_URL:-http://host.docker.internal:5001}
      STORAGE_CONNECT_TIMEOUT_SECONDS: ${STORAGE_CONNECT_TIMEOUT_SECONDS:-3}
      STORAGE_READ_TIMEOUT_SECONDS: ${STORAGE_READ_TIMEOUT_SECONDS:-10}
      STORAGE_READ_MAX_ATTEMPTS: ${STORAGE_READ_MAX_ATTEMPTS:-3}
      STORAGE_RETRY_BACKOFF_SECONDS: ${STORAGE_RETRY_BACKOFF_SECONDS:-0.25}
      LLM_MODE: ${LLM_MODE:-llm}
      LLM_BASE_URL: ${LLM_BASE_URL:-http://aqh-ovms:8010/v3}
      LLM_MODEL_NAME: ${LLM_MODEL_NAME:-Phi-4-mini-instruct}
      LLM_API_KEY: ${LLM_API_KEY:-UNUSED}
      MQTT_DISABLED: ${MQTT_DISABLED:-false}
      MQTT_HOST: ${MQTT_HOST:-mqtt-broker}
      MQTT_PORT: ${MQTT_PORT:-1883}
      MQTT_BATCH_TOPIC: ${MQTT_BATCH_TOPIC:-apm/batch-complete}
      MQTT_QOS: ${MQTT_QOS:-1}
      MQTT_KEEPALIVE: ${MQTT_KEEPALIVE:-60}
      MQTT_MAX_PAYLOAD_BYTES: ${MQTT_MAX_PAYLOAD_BYTES:-1048576}
      MQTT_BATCH_CLIENT_ID: ${MQTT_BATCH_CLIENT_ID:-agent-quality-handler-batch}
      MQTT_USERNAME: ${MQTT_USERNAME:-}
      MQTT_PASSWORD: ${MQTT_PASSWORD:-}
      RUN_RETENTION_SECONDS: ${RUN_RETENTION_SECONDS:-86400}
      MAX_RETAINED_RUNS: ${MAX_RETAINED_RUNS:-1000}
      AGENTS_CONFIG_PATH: /app/config/agents.yaml
      USE_CASE_PROMPTS_DIR: /app/prompts
      FALLBACK_POLICY_PATH: /app/config/policy_fallback.json
      OUTPUT_DIR: /app/output
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    volumes:
      - ${USE_CASE_CONFIGS_DIR:-../defaults/config}:/app/config:ro
      - ${USE_CASE_PROMPTS_DIR:-../defaults/prompts}:/app/prompts:ro
      - aqh_agent_output:/app/output
    ports:
      - "${AGENT_PORT:-5002}:5002"
    depends_on:
      mqtt-broker:
        condition: service_healthy
    networks:
      - aqh_network
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        - CMD
        - python3
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:5002/health')"
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s

  mqtt-broker:
    image: eclipse-mosquitto:2.0.18
    container_name: aqh-mqtt-broker
    hostname: mqtt-broker
    volumes:
      - ../config/mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
    networks:
      - aqh_network
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "mosquitto_pub", "-h", "localhost", "-t", "health", "-m", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  aqh-ovms:
    image: openvino/model_server:${OVMS_TAG:-2026.2.1-gpu}
    container_name: aqh-ovms
    hostname: aqh-ovms
    # command: >
    #   --model_path /model
    #   --model_name ${LLM_MODEL_NAME:-Phi-4-mini-instruct}
    #   --rest_port 8000
    command: [ "--rest_port","8010","--log_level", "DEBUG", "--config_path", "model/openvino_folder/openvino_models/cpu/int8/config_all.json"]
    environment:
      http_proxy: ${http_proxy:-}
      https_proxy: ${https_proxy:-}
      no_proxy: ${no_proxy:-},localhost
      HUGGINGFACE_TOKEN: ${HUGGINGFACEHUB_API_TOKEN:-}
    restart: unless-stopped
    ulimits:
      nofile:
        soft: 16384
        hard: 65536
    volumes:
      - ${USE_CASE_MODELS_DIR:-/tmp/models}:/model:ro
    ports:
      - "${LLM_PORT:-8010}:8000"
    networks:
      - aqh_network
    depends_on:
      model-download:
        condition: service_healthy
    security_opt:
      - no-new-privileges
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/v3/config || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 40
      start_period: 30s

  model-download:
    image: ${REGISTRY}model-download:${MODEL_DOWNLOAD_TAG:-latest}
    command: --plugins ${MODEL_DOWNLOAD_PLUGINS:-huggingface,openvino}
    container_name: aqh-model-download
    hostname: model-download
    environment:
      http_proxy: ${http_proxy:-}
      https_proxy: ${https_proxy:-}
      no_proxy: ${no_proxy:-}
      HF_TOKEN: ${HUGGINGFACEHUB_API_TOKEN:-}
      HF_HUB_ENABLE_HF_TRANSFER: 1
      MODEL_PATH: /opt/models
      ENABLED_PLUGINS: ${MODEL_DOWNLOAD_PLUGINS:-huggingface,openvino}
    volumes:
      - ${USE_CASE_MODELS_DIR:-/tmp/models}:/opt/models
    ports:
      - "${MODEL_DOWNLOAD_PORT:-8200}:8000"
    group_add:
      - ${USER_GROUP_ID:-1001}
    networks:
      - aqh_network
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 60s
      timeout: 10s
      retries: 5
      start_period: 180s

  model-download-init:
    image: curlimages/curl:latest
    container_name: aqh-model-download-init
    hostname: model-download-init
    environment:
      MODEL_DOWNLOAD_URL: ${MODEL_DOWNLOAD_URL:-http://model-download:8000}
      no_proxy: ${no_proxy:-},model-download
    depends_on:
      model-download:
        condition: service_healthy
    networks:
      - aqh_network
    security_opt:
      - no-new-privileges:true
    restart: on-failure
    volumes:
      - ${USE_CASE_MODELS_DIR:-/tmp/models}:/opt/models
    entrypoint: >
      /bin/sh -c "
      echo 'Calling model-download API...' &&
      curl -X POST $${MODEL_DOWNLOAD_URL}/api/v1/models/download?download_path=openvino_folder --header 'Content-Type: application/json' \
      --data '{
          \"models\": [
            {
              \"name\": \"${LLM_MODEL_NAME}\",
              \"hub\": \"openvino\",
              \"type\": \"llm\",
              \"is_ovms\": true,
              \"config\": {
                \"precision\": \"int8\",
                \"device\": \"CPU\",
                \"cache_size\": 10
              }
            }
          ]
        }'
      "

  mock-storage:
    profiles: ["dev"]
    image: python:3.12-slim
    container_name: aqh-mock-storage
    hostname: mock-storage
    working_dir: /app
    volumes:
      - ../tests/mock_storage_server.py:/app/mock_storage_server.py:ro
    command: ["python3", "mock_storage_server.py"]
    ports:
      - "${MOCK_STORAGE_PORT:-5001}:5001"
    networks:
      - aqh_network
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        - CMD-SHELL
        - "python3 -c \"import urllib.request; urllib.request.urlopen('http://localhost:5001/detections')\""
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  aqh_network:
    driver: bridge

volumes:
  aqh_agent_output:
    driver: local
  aqh_model_cache:
    driver: local
