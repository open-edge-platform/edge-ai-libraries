[project]
name = "agent-quality-handler"
version = "1.0.0"
description = "LangGraph multi-agent orchestration for agentic predictive maintenance"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi==0.136.3",
    "langgraph==1.2.4",
    "openai==2.41.1",
    "paho-mqtt==2.1.0",
    "pydantic==2.13.4",
    "pyyaml==6.0.3",
    "requests==2.34.2",
    "uvicorn[standard]==0.49.0",
]

[dependency-groups]
test = [
    "httpx>=0.28.0,<1.0.0",
    "pytest>=9.0.3",
    "pytest-asyncio>=0.23.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
