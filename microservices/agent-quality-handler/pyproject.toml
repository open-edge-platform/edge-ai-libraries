[project]
name = "agent-quality-handler"
version = "1.0.0"
description = "LangGraph multi-agent orchestration for agentic predictive maintenance"
requires-python = ">=3.12,<3.13"
dependencies = [
    "deepagents>=0.7.18",
    "fastapi==0.141.1",
    "langchain-mcp-adapters>=0.3.2",
    "langchain-openai>=1.6.4",
    "langgraph>=1.2.12",
    "openai>=3.19.0",
    "paho-mqtt==2.1.0",
    "pydantic==2.13.5",
    "pyyaml==6.0.3",
    "requests==2.34.2",
    "uvicorn[standard]==0.53.0",
]

[dependency-groups]
test = [
    "httpx>=0.28.0,<1.0.0",
    "pytest>=9.0.3",
    "pytest-asyncio>=0.23.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
