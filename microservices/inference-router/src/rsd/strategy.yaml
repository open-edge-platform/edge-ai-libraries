strategies:
  - name: Planning
    description: "Routes based on message content indicating planning intent."
    rules:
      - type: MessageContentRule
        param:
          pattern: plan
          roles:
            - user
    provider_selector:
      label: planning
      capability:
        complexity: 0.7

  - name: DataAnalysis
    description: "Routes based on message content indicating tabular-data analysis intent."
    rules:
      - type: MessageContentRule
        param:
          pattern: '\b(csv|spreadsheet|dataframe|dataset|excel|pivot)\b'
          use_regex: true
          roles:
            - user
    provider_selector:
      label: data-analysis
      capability:
        complexity: 0.6

  - name: ContextLengthQuality
    description: "Routes requests based on context length zones."
    rules:
      - type: ContextLengthRule
        param:
          zones:
            - - 0
              - 4000
            - - 4001
              - 16000
            - - 16001
              - 128000
    provider_selector:
      capability:
        complexity:
          0: 0.3
          1: 0.5
          2: 0.7

  - name: ZeroCost
    description: "Routes requests based on no cost provider."
    provider_selector:
      cost: 0

  - name: ModelBasedRouting
    description: "Routes with the intelligent model-based classifier (0 -> local, 1 -> cloud)."
    rules:
      - type: ModelBasedRule
    provider_selector:
      label:
        0: local
        1: cloud

  - name: PerformanceBased
    description: "Prefer the least-loaded backend by live in-flight request count."
    provider_selector:
      # Live load signals read from provider metadata under performance.<metric>,
      # kept fresh by each provider's performance probe (see
      # docs/user-guide/probe.md).
      performance:
        requests: 10      # skip a backend already running 10+ concurrent requests
    sort:
      # Among the eligible providers, route to the one with the fewest in-flight
      # requests (ascending). A provider with no value sorts last.
      - provider_attribute: performance.requests
        descending: false
