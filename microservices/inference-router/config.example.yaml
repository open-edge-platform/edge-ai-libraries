# Inference Router Configuration
# Copy this file to config.yaml and customize for your deployment

log_level: "INFO"

# Providers Configuration
# Each provider must have a name, type, and type-specific settings
providers:
  - name: "local"
    type: "hosted_vllm"
    model: "Qwen/Qwen3.5-9B"
    enabled: true
    # Optional. Mark one provider as the routing fallback: it is selected
    # whenever the routing policy fails to match any provider. If no provider
    # sets this, a request that matches no provider is rejected with an error.
    fallback: true
    metadata:
      labels:
        - "planning"
        - "local"
        - "data-analysis"
      cost: 0
      performance: 0.85
      capability:
        complexity: 0.75
    settings:
      endpoint: "http://localhost:5000/v1"    # The URL of the provider's /v1 endpoint
      timeout: 300.0              # per-request timeout (connect + first byte); default 600
      auth:
        scheme: "none"
        api_key: null
        custom_headers: {}

      # Probes (optional). Each probe is a background task that, every
      # `interval` seconds, GETs `endpoint`, extracts numeric fields from the
      # response, aggregates each over a sliding window, and publishes them.
      # One generic runner — behaviour is entirely config. See
      # docs/probes/probe-design.md. Read live values via GET /health/detailed;
      # enable/disable by editing `enabled` and re-submitting the provider.
      # probes:
      #   - name: "load"                          # unique within the provider
      #     enabled: true
      #     endpoint: "http://localhost:5000/metrics"  # omit to reuse the provider endpoint
      #     interval: 10                          # seconds between ticks
      #     timeout: 5                            # per-request timeout
      #     extract:                              # regex → (name, value) per match
      #       - regex: 'vllm:(num_requests_\w+)\S*\s+([0-9.]+)'
      #         #        └──── group 1: NAME ───┘      └ group 2: VALUE ┘
      #     aggregate: { window: 20, method: mean }   # latest|mean|median|p50|p90|p95|p99|ewma|min|max|stdev
      #     publish:
      #       - { to: metadata, prefix: attributes.probe }   # → routing metadata (live)
      #       - { to: file, path: probes/local.load.jsonl }  # JSONL history (workspace-relative)
      #   # A JSON endpoint instead of Prometheus text:
      #   - name: "queue"
      #     enabled: false
      #     endpoint: "http://localhost:5000/health"
      #     interval: 15
      #     extract:
      #       - json: "stats.pending_requests"   # name = last segment (pending_requests)
      #     aggregate: { window: 10, method: p95 }
      #     publish:
      #       - { to: metadata, prefix: performance }   # feeds performance.* routing filters

  # Pass-through service providers. Their `type` names the service (one of:
  # transcription, tts, embeddings, rerank, ocr) which exposes the matching
  # OpenAI/Cohere-compatible /v1 endpoint and forwards the request body verbatim
  # to `settings.endpoint`. Requests count against max_concurrency (shared with
  # /v1/chat/completions). Manage them at runtime via the /v1/providers API.
  # Uncomment and point `endpoint` at a running backend to enable.
  #
  # - name: "ocr-backend"          # -> POST /v1/ocr
  #   type: "ocr"
  #   model: "ocr"
  #   settings:
  #     endpoint: "http://localhost:8002"
  #     timeout: 600               # OCR cold-start + multi-page docs can be slow

# Request Plugins Configuration
# Plugins can run before routing, after routing, or after provider response.
# `name` is a unique instance label (and the metrics source key).
# Examples for the compressor plugin:
#   prerouting:
