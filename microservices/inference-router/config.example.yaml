plugins:
  prerouting: []

  postrouting: []

  postresponse: []


# Routing Configuration
routing:
  policy: "Balanced"  # Must exist in /workspace/policy.yaml
  # Set to "ModelBased" to enable the model-based routing policy

# Telemetry Configuration
telemetry:
  backend: "memory"  # Options: 'memory', 'file'
  enabled: true
  file_path: null  # Required if backend is 'file', e.g., "/var/log/inference_router.jsonl"
