#        predictor_backend: "reranker"
#        top_k: 10
#        placement: "schema"
#        accumulate: true
#  postrouting:
#    - name: "compressor_harness"
#      node: "compressor"
#      enabled: true
#      settings:
#        type: "harness"
#        profile: "openclaw"
#        compress_server_url: "http://localhost:8001/compress"
#        compress_rate: 0.5
#        compress_min_chars: 200
#        timeout: 60.0
#        enable_quantum_lock: false
#    # The context compressor is experimental and is disabled by default.
#    - name: "compressor_context"
#      node: "compressor"
#      enabled: false
#      settings:
#        type: "context"
#        protect_recent_tool_turns: 1
#        large_result_stub: true
