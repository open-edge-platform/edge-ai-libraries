[build-system]
requires = ["setuptools>=78.1.1", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "inference-router"
version = "2026.3.0"
description = "A pluggable inference router for chat completion requests with local vLLM support"
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = { text = "Apache-2.0" }
authors = []
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Web Environment",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "fastapi>=0.104.0",
    "litellm==1.100.4",  # >=1.100.4 for GHSA-g5ff-637f-6q2m, CVE-2026-84377, CVE-2026-114612
    "uvicorn[standard]>=0.24.0",
    "pydantic>=2.0.0",
    "pyyaml>=6.0.0",
    "requests>=2.31.0",
    "tiktoken>=0.8.0",
    "gunicorn>=21.2.0",
    # Security pins (Trivy HIGH):
    #   setuptools<78.1.1 -> CVE-2025-47273 (PackageIndex path traversal)
    #   msgpack<1.2.1     -> GHSA-6v7p-g79w-8964 (OOB read on Unpacker reuse)
    # Security pins (SDL scan 2026-11-20, Trivy/pip-audit CRITICAL/HIGH):
    #   anyio<4.14.2         -> CVE-2026-63349, CVE-2026-63374
    #   certifi<2026.10.18   -> GHSA-6q48-6c7w-9gw2
    #   aiohttp<3.14.4       -> CVE-2026-111064 and 10 more
    #   urllib3<2.8.0        -> CVE-2026-97687, CVE-2026-97689
    #   filelock<4.2.1       -> CVE-2026-112940 (fixed releases need Python >=3.11,
    #                           which is why requires-python starts at 3.11)
    #   msgpack<1.2.3        -> CVE-2026-114613
    # All are transitive deps; they are pinned here so pip upgrades them in the
    # runtime image (which installs from this file, not poetry.lock).
    "setuptools>=78.1.1",
    "msgpack>=1.2.3",
    "anyio>=4.14.2",
    "certifi>=2026.10.18",
    "aiohttp>=3.14.4",
    "urllib3>=2.8.0",
    "filelock>=4.2.1",
]

[project.optional-dependencies]
ov = [
    "openvino==2026.2",
    "openvino-tokenizers==2026.2",
    "numpy>=1.26",
]

dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.1.0",
    "black>=26.10.1",  # CVE-2026-114134
    "ruff>=0.1.0",
    "mypy>=1.5.0",
    "isort>=5.12.0",
    "openai>=1.0.0",
]

[tool.setuptools.packages.find]
include = ["src*"]
namespaces = false

[tool.setuptools.package-data]
"src.rsd" = ["*.yaml"]
"src.rsd.model_based" = ["prompts/*.txt", "prompts/*/*.rcv"]

[tool.black]
line-length = 100
target-version = ["py39", "py310", "py311"]

[tool.ruff]
line-length = 100
target-version = "py39"
select = ["E", "F", "W", "I"]

[tool.isort]
profile = "black"
line_length = 100

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "--strict-markers -v"
markers = [
    "unit: unit tests",
    "integration: integration tests",
    "slow: slow tests",
]
