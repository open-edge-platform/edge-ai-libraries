services:
  model-serving-llm-scaler:
    container_name: model-serving-llm-scaler
    image: intel/llm-scaler-vllm:0.14.0-b8.3.2
    restart: "${VLLM_RESTART_POLICY:-on-failure:2}"
    ports:
      - "${VLLM_BIND_HOST:-0.0.0.0}:${VLLM_SERVICE_PORT:-41091}:8000"
    group_add:
      - "${VIDEO_GROUP_ID:-1000}"
      - "${RENDER_GROUP_ID:-1000}"
    devices:
      - /dev/dri:/dev/dri
    cap_drop:
      - NET_RAW
    security_opt:
      - no-new-privileges:true
    volumes:
      - ${HF_HOME:-${HOME}/models/huggingface}:/llm/.cache/huggingface
      - .:/llm/test_resources:ro
      # oneCCL resolves GPU devices through their PCI symlinks.
      - type: bind
        source: /dev/dri/by-path
        target: /dev/dri/by-path
        read_only: true
        bind:
          create_host_path: false
    environment:
      no_proxy: ${no_proxy:-localhost,127.0.0.1,model-serving,multilevel-video-understanding}
      http_proxy: ${http_proxy:-}
      https_proxy: ${https_proxy:-}
      HF_ENDPOINT: ${HF_ENDPOINT:-https://huggingface.co}
      HF_HOME: /llm/.cache/huggingface
      HF_HUB_OFFLINE: ${HF_HUB_OFFLINE:-0}
      MODEL_PATH: ${LLM_MODEL:-Qwen/Qwen3.6-35B-A3B}
      MAX_MODEL_LEN: ${MAX_MODEL_LEN:-61440}
      LOAD_QUANTIZATION: ${LOAD_QUANTIZATION:-fp8}
      TENSOR_PARALLEL_SIZE: ${TENSOR_PARALLEL_SIZE:-1}
      GPU_MEM_UTIL: ${GPU_MEM_UTIL:-0.7}
      VLLM_OFFLOAD_WEIGHTS_BEFORE_QUANT: ${VLLM_OFFLOAD_WEIGHTS_BEFORE_QUANT:-0}
      DYNAMIC_LORA: ${DYNAMIC_LORA:-0}
    shm_size: '16g'
    entrypoint:
      - /bin/bash
      - -c
      - source /opt/intel/oneapi/setvars.sh --force && exec bash /llm/test_resources/entrypoint.sh
    networks:
      app-network:
        aliases:
          - model-serving
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8000/v1/models >/dev/null || exit 1"]
      start_period: 7200s
      start_interval: 10s
      interval: 5m
      timeout: 5s
      retries: 3

networks:
  app-network:
    driver: bridge
