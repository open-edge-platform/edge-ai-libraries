services:
  # Backend-specific image, mounts, and entrypoint are owned by model_serving/.
  model-serving:
    container_name: model-serving-${MODEL_SERVING_BACKEND:-llm-scaler}
    extends:
      file: model_serving/${MODEL_SERVING_BACKEND:-llm-scaler}/docker-compose.yaml
      service: model-serving-${MODEL_SERVING_BACKEND:-llm-scaler}

  multilevel-video-understanding:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      target: prod
      args:
        http_proxy: ${http_proxy:-}
        https_proxy: ${https_proxy:-}
        no_proxy: ${no_proxy:-localhost,127.0.0.1,model-serving,multilevel-video-understanding}
    image: ${REGISTRY:-}multilevel-video-understanding:${TAG:-latest}
    container_name: multilevel-video-understanding
    ports:
      - ${SERVICE_PORT:-8192}:8000
    networks:
      - app-network
    depends_on:
      model-serving:
        condition: service_healthy
    group_add:
      - ${USER_GROUP_ID:-1000}
    cap_drop:
      - NET_RAW
    read_only: true  # Mount root filesystem as read-only
    volumes:
      - tmp_volume:/tmp:rw  # Mount container /tmp as read-write
      # Runtime prompt registry cache on the host. Export VIDEO_SUMMARY_CACHE_HOST
      # to a user-owned directory before `docker compose up`; e.g.
      #   export VIDEO_SUMMARY_CACHE_HOST=~/.cache/.multilevel-video-understanding
      #   mkdir -p "$VIDEO_SUMMARY_CACHE_HOST/tasks"
      - ${VIDEO_SUMMARY_CACHE_HOST}:/home/appuser/.cache/.multilevel-video-understanding:rw
    environment:
      - http_proxy=${http_proxy:-}
      - https_proxy=${https_proxy:-}
      - no_proxy=${no_proxy:-localhost,127.0.0.1,model-serving,multilevel-video-understanding}
      - DEBUG=${DEBUG:-false}
      # Both roles use the stable model-serving DNS name on app-network.
      - MODEL_SERVING_BACKEND=${MODEL_SERVING_BACKEND:-llm-scaler}
      - VLM_MODEL_NAME=${VLM_MODEL_NAME:-${LLM_MODEL:-Qwen/Qwen3.6-35B-A3B}}
      - VLM_BASE_URL=${VLM_BASE_URL:-http://model-serving:8000/v1}
      - VLM_API_KEY=${VLM_API_KEY:-EMPTY}
      - LLM_MODEL_NAME=${LLM_MODEL_NAME:-${LLM_MODEL:-Qwen/Qwen3.6-35B-A3B}}
      - LLM_BASE_URL=${LLM_BASE_URL:-http://model-serving:8000/v1}
      - LLM_API_KEY=${LLM_API_KEY:-EMPTY}
      - MAX_CONCURRENT_REQUESTS=${MAX_CONCURRENT_REQUESTS:-6}
      - DEFAULT_MAX_TOKENS=${DEFAULT_MAX_TOKENS:-512}
      - ENABLE_THINKING=${ENABLE_THINKING:-false}
      - VIDEO_FRAME_HEIGHT=${VIDEO_FRAME_HEIGHT:-270}
      - VIDEO_FRAME_WIDTH=${VIDEO_FRAME_WIDTH:-480}
      - DEFAULT_TEMPERATURE=${DEFAULT_TEMPERATURE:-0.2}
      - VIDEO_ALLOWED_PATHS=${VIDEO_ALLOWED_PATHS:-["/app","/tmp"]}
      - PROMPT_URL_ALLOWLIST=${PROMPT_URL_ALLOWLIST:-[]}
    restart: unless-stopped
    security_opt:
      - apparmor=docker-default
      - no-new-privileges:true  # Restrict additional privileges
    deploy:
      resources:
        limits:
          pids: 1024
        reservations:
          cpus: '0.5'
          memory: 1G
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/v1/health"]
      start_period: 7200s
      start_interval: 10s
      interval: 5m
      timeout: 5s
      retries: 3

networks:
  app-network:
    driver: bridge

volumes:
  tmp_volume:
