openapi: 3.0.0
info:
  title: Multilevel Video Understanding API
  description: API for video summarization using hierarchical LLM and VLM models.
  version: 1.0.0
servers:
  - url: http://{service-ip}:8192
    description: Default Server
    variables:
      service-ip:
        default: localhost
        description: The IP address of the service

paths:
  /v1/health:
    get:
      summary: Health Check
      description: Health check endpoint to verify service status.
      operationId: getHealth
      responses:
        '200':
          description: Service is healthy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'

  /v1/models:
    get:
      summary: Get Models
      description: Get a list of available Whisper model variants (LLMs & VLMs) that can be used for summarization.
      operationId: getModels
      responses:
        '200':
          description: List of available models
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelsResponse'

  /v1/summary:
    post:
      summary: Generate Summary
      description: Generate a summary text from a video file to describe its content.
      operationId: createSummary
      requestBody:
        description: Parameters for video summarization
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SummaryRequest'
      responses:
        '200':
          description: Summarization completed successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SummaryResponse'
        '400':
          description: Bad Request (e.g., Invalid file format)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /v1/tasks:
    get:
      summary: List Tasks
      description: List all prompt tasks (built-in + dynamic).
      operationId: listTasks
      responses:
        '200':
          description: List of tasks
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskListResponse'
    post:
      summary: Register Task
      description: Register a new dynamic prompt task (autogen or full mode).
      operationId: registerTask
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterTaskRequest'
      responses:
        '201':
          description: Task registered
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskDetailResponse'
        '400':
          description: Malformed content
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Name conflict (builtin_conflict / already_registered)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /v1/tasks/{name}:
    parameters:
      - name: name
        in: path
        required: true
        schema:
          type: string
    get:
      summary: Get Task
      description: Get the four prompt sections for a task (built-in or dynamic).
      operationId: getTask
      responses:
        '200':
          description: Task detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskDetailResponse'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    patch:
      summary: Update Task
      description: Rename, change description, or regenerate a dynamic task. Built-ins are immutable.
      operationId: updateTask
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchTaskRequest'
      responses:
        '200':
          description: Updated task detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskDetailResponse'
        '403':
          description: Built-in task is immutable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    delete:
      summary: Delete Task
      description: Delete a dynamic task. Built-ins cannot be deleted.
      operationId: deleteTask
      responses:
        '204':
          description: Deleted
        '403':
          description: Built-in task is immutable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

components:
  schemas:
    # --- Health API Schemas ---
    HealthResponse:
      type: object
      properties:
        message:
          type: string
          example: "Service is running smoothly."
        status:
          type: string
          example: "healthy"
        version:
          type: string
          example: "1.0.0"

    # --- Models API Schemas ---
    ModelItem:
      type: object
      properties:
        base_url:
          type: string
          example: "http://localhost:41090/v1"
        description:
          type: string
          example: "Large Language Models for summarization"
        display_name:
          type: string
          example: "Qwen/Qwen3-32B-AWQ"
        model_id:
          type: string
          example: "Qwen/Qwen3-32B-AWQ"

    ModelsResponse:
      type: object
      properties:
        llms:
          type: array
          items:
            $ref: '#/components/schemas/ModelItem'
        vlms:
          type: array
          items:
            $ref: '#/components/schemas/ModelItem'

    # --- Summarization API Schemas ---
    ProcessorKwargs:
      type: object
      properties:
        process_fps:
          type: number
          description: Extract frames at process_fps for input video.
          default: 1
        levels:
          type: integer
          description: Specify total levels for hierarchical summarization.
          default: 3
        level_sizes:
          type: array
          description: Specify chunk group size for each level. -1 means using single group at the level.
          items:
            type: integer
          default: [1, 6, -1]
        chunking_method:
          type: string
          description: Video chunking algorithm.
          enum:
            - pelt
            - uniform
          default: pelt

    SummaryRequest:
      type: object
      required:
        - video
      properties:
        video:
          type: string
          description: Path to the video file ('file://', 'http://', 'https://' or local path). Use the string "none" for caption-only mode (requires video_subtitles).
        video_subtitles:
          type: object
          description: >-
            Subtitles in SubRip (.srt) format. Provide exactly one of the keys below.
            Required when video is "none"; optional otherwise (injected as per-chunk context).
          additionalProperties:
            type: string
          properties:
            url:
              type: string
              description: HTTPS URL to an .srt file (streamed with a size cap).
            text:
              type: string
              description: Inline SRT text.
            b64gzip:
              type: string
              description: Base64 of gzip-compressed SRT (recommended for long videos).
        task:
          type: string
          description: >-
            Prompt task flavor. Built-in: "summary" (English, default) and "summary_zh" (Chinese).
            Any other value must be a dynamic task registered via /v1/tasks.
          default: summary
        prompt:
          type: string
          description: User prompt to guide summarization details.
        method:
          type: string
          description: Summarization method strategy.
          enum:
            - SIMPLE
            - USE_VLM_T-1
            - USE_LLM_T-1
            - USE_ALL_T-1
          default: USE_ALL_T-1
        processor_kwargs:
          $ref: '#/components/schemas/ProcessorKwargs'

    SummaryResponse:
      type: object
      properties:
        status:
          type: string
          example: "completed"
        summary:
          type: string
          description: The generated summary text.
        message:
          type: string
        job_id:
          type: string
        video_name:
          type: string
        video_duration:
          type: number
          description: Duration of the video in seconds.
        usage:
          type: object
          description: Token usage statistics (unified VLM+LLM).
          additionalProperties:
            type: integer

    # --- Prompt Tasks API Schemas ---
    PromptContent:
      type: object
      description: Exactly one of text or url.
      properties:
        text:
          type: string
          description: Inline prompt text containing all four anchors.
        url:
          type: string
          description: HTTPS URL fetched by the service (Content-Length <= 256 KB).

    RegisterTaskRequest:
      type: object
      required:
        - task_name
        - mode
      properties:
        task_name:
          type: string
          pattern: '^[a-z][a-z0-9_]{1,63}$'
          description: Lowercase ascii, 2-64 chars. Must not collide with a built-in task.
        mode:
          type: string
          enum:
            - autogen
            - full
        description:
          type: string
          description: Required when mode=autogen.
        content:
          $ref: '#/components/schemas/PromptContent'

    PatchTaskRequest:
      type: object
      description: At least one field required.
      properties:
        new_task_name:
          type: string
          pattern: '^[a-z][a-z0-9_]{1,63}$'
        mode:
          type: string
          enum:
            - autogen
            - full
        description:
          type: string
        content:
          $ref: '#/components/schemas/PromptContent'

    TaskInfo:
      type: object
      properties:
        name:
          type: string
        source:
          type: string
          enum:
            - builtin
            - dynamic
        description:
          type: string

    TaskListResponse:
      type: object
      properties:
        tasks:
          type: array
          items:
            $ref: '#/components/schemas/TaskInfo'

    TaskDetailResponse:
      type: object
      properties:
        name:
          type: string
        source:
          type: string
          enum:
            - builtin
            - dynamic
        description:
          type: string
        content:
          type: string
          description: The four anchor sections as one round-trip-safe text block.

    ErrorResponse:
      type: object
      properties:
        details:
          type: string
          example: "Invalid file format"
        error_message:
          type: string
          example: "Summarization failed!"